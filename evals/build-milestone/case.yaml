schema_version: "1.1"
name: build-milestone
description: /build builds a milestone's three todo tickets, each building on the one before, and acts on each builder's report. Its fixture is the one compare.sh uses to weigh how builders are dispatched; compare.sh, not this case, checks what was built.
tags: [build, builder]
runs: 1
expected_outcome: A builder fills ticket 002's test plan, and the main session acts on every report and says where the track stands.
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 200
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, Agent, SendMessage]

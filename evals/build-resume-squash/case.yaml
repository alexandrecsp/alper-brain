schema_version: "1.1"
name: build-resume-squash
description: /build resumes a milestone whose squash is committed but unrecorded, records it without rebuilding or re-reviewing, and lands it.
tags: [build, resume]
runs: 2
expected_outcome: Squash and Landed lines hold the spec branch's commit, the spec has its Landed line, and no builder, fixer, reviewer or arbiter runs.
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, Agent]

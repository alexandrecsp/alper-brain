schema_version: "1.1"
name: build-ticket
description: /build builds a milestone's one todo ticket, which builds on a committed one, through a builder sub-agent, which plans its tests and changes the code. The kept transcripts show the builder's reading, for scripts/agent-tokens.mjs.
tags: [build, builder]
runs: 1
expected_outcome: A builder runs ticket 002, fills its test plan, and greet.sh greets by name.
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 80
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, Agent]

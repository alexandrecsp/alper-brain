schema_version: "1.1"
name: write-tickets-amend
description: /write-tickets --amend adds a story to a spec mid-build, records the amendment and writes new tickets, leaving the built ticket alone.
tags: [write-tickets, amend]
runs: 2
expected_outcome: spec.md gains an Amended bullet, a new ticket numbered after 001 is written, and ticket 001 is never edited.
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write, Agent]

    .np-row.click { cursor:pointer; } .np-row.click:hover { background:var(--hover); } .np-row.on { background:var(--accent-soft); }
    .np-hint { position:absolute; right:18px; bottom:14px; width:260px; text-align:right; color:var(--faint); font-size:11px; line-height:1.5; pointer-events:none; }
    .np-lbl { pointer-events:none; paint-order:stroke; stroke:#141414; stroke-linejoin:round; fill:#e8e8e8; font-family:Inter, sans-serif; }
  `;

  function mkRoot() {
    root = document.createElement('div'); root.className = 'np-root';
    root.innerHTML = `<style>${CSS}</style>
      <div class="np-bar">
        <div class="panel np-tgls">${[['hulls', 'Clusters'], ['cross', 'Cross links'], ['ghosts', 'Ghosts'], ['labels', 'Labels']].map(([k, l]) => `<button class="np-tgl" data-tg="${k}"><span class="np-sw"><i></i></span>${l}</button>`).join('')}</div>
        <div class="seg text-[12px]"><button data-cb="repo">Repo</button><button data-cb="type">Type</button></div>
        <button class="btn text-[12px]" data-fit>Fit</button>
        <span class="mono faint text-[11px]" data-stats></span>
      </div>
      <div class="panel np-legend"></div>
      <div class="np-hint">Click a node to focus it and see details. Drag to move, scroll to zoom, click empty space to reset.</div>`;
    svg = d3.select(root).insert('svg', ':first-child');
    zg = svg.append('g');
    zoom = d3.zoom().scaleExtent([0.08, 6]).on('zoom', (e) => { zg.attr('transform', e.transform); zk = e.transform.k; styleLabels(); });
    svg.call(zoom).on('dblclick.zoom', null).on('click', () => cur.select(null));
    root.addEventListener('click', (e) => {
      const t = e.target.closest('[data-tg],[data-cb],[data-fit]'); if (!t) return;
      if (t.dataset.tg) F[t.dataset.tg] = !F[t.dataset.tg];
      else if (t.dataset.cb) F.by = t.dataset.cb;
      else fit(true);
      draw(); style(); legend();
    });
  }

  function build(D) {
    if (sim) sim.stop();
    zg.selectAll('*').remove();
    const clusterOf = (n) => (n.shared ? 'shared' : n.repos[0] || 'shared');
    const byId = new Map();
    const prev = new Map(nodes.map((d) => [d.id, [d.x, d.y]]));
    nodes = []; links = []; nbr = new Map();
    D.notes.forEach((n) => { const d = { id: n.id, kind: 'note', cluster: clusterOf(n), n, deg: 0 }; byId.set(d.id, d); nodes.push(d); });
    D.ghosts.forEach((g) => { const d = { id: g, kind: 'ghost', votes: {}, deg: 0 }; byId.set(g, d); nodes.push(d); });
    const seen = new Set(), pairs = [];
    D.notes.forEach((n) => n.links.forEach((l) => {
      const a = byId.get(n.id), b = byId.get(l); if (!b || a === b) return;
      const k = [a.id, b.id].sort().join('|'); if (seen.has(k)) return; seen.add(k); pairs.push([a, b]);
      if (b.kind === 'ghost') b.votes[a.cluster] = (b.votes[a.cluster] || 0) + 1;
    }));
    nodes.filter((d) => d.kind === 'ghost').forEach((d) => { d.cluster = Object.entries(d.votes).sort((x, y) => y[1] - x[1])[0]?.[0] || 'shared'; });
    crossCount = 0;
    pairs.forEach(([a, b]) => { a.deg++; b.deg++; const kind = a.cluster === b.cluster ? 'intra' : 'cross'; if (kind === 'cross') crossCount++; links.push({ source: a.id, target: b.id, kind }); });
    nodes.forEach((d) => { d.r = d.kind === 'ghost' ? Math.min(8, 4 + Math.sqrt(d.deg) * 0.8) : Math.min(11, 3.5 + Math.sqrt(d.deg) * 1.7); });

    const groups = d3.group(nodes, (d) => d.cluster);
    clusters = [...groups].map(([slug, members]) => ({ slug, count: members.filter((d) => d.kind === 'note').length, ghosts: members.filter((d) => d.kind === 'ghost').length, members }))
      .sort((a, b) => b.members.length - a.members.length);
    const rad = (c) => 46 + 15 * Math.sqrt(c.members.length), maxRad = d3.max(clusters, rad) || 60, S = 1.45 * maxRad;
    clusters.forEach((c, i) => {
      c.cx = S * Math.sqrt(i) * Math.cos(i * 2.39996); c.cy = S * Math.sqrt(i) * Math.sin(i * 2.39996); c.rad = rad(c);
      const hub = { id: 'hub:' + c.slug, kind: 'hub', cluster: c.slug, r: Math.min(46, 15 + 3.2 * Math.sqrt(c.count)), deg: 0, x: c.cx, y: c.cy };
      c.hub = hub;
      c.members.forEach((d, j) => { const a = j * 2.4, r = 14 + 9 * Math.sqrt(j); d.x = c.cx + Math.cos(a) * r; d.y = c.cy + Math.sin(a) * r; links.push({ source: hub.id, target: d.id, kind: 'spoke' }); });
      c.members.unshift(hub); nodes.push(hub);
    });
    nodes.forEach((d) => { const p = prev.get(d.id); if (p) [d.x, d.y] = p; });
    const cOf = new Map(clusters.map((c) => [c.slug, c]));
    links.forEach((l) => { for (const [a, b] of [[l.source, l.target], [l.target, l.source]]) { if (!nbr.has(a)) nbr.set(a, new Set()); nbr.get(a).add(b); } });
    typeCol = d3.scaleOrdinal(d3.schemeTableau10).domain([...new Set(D.notes.map((n) => n.type))].sort());
    typeCount = d3.rollup(D.notes, (v) => v.length, (n) => n.type);

    sim = d3.forceSimulation(nodes)
      .force('link', d3.forceLink(links).id((d) => d.id).distance((l) => (l.kind === 'spoke' ? l.source.r + l.target.r + 22 : l.kind === 'intra' ? 38 : 320)).strength((l) => (l.kind === 'spoke' ? 0.3 : l.kind === 'intra' ? 0.2 : 0.004)))
      .force('x', d3.forceX((d) => cOf.get(d.cluster).cx).strength((d) => (d.kind === 'hub' ? 0.5 : 0.07)))
      .force('y', d3.forceY((d) => cOf.get(d.cluster).cy).strength((d) => (d.kind === 'hub' ? 0.5 : 0.07)))
      .force('charge', d3.forceManyBody().strength((d) => (d.kind === 'hub' ? -140 : -20)).distanceMax(240))
      .force('collide', d3.forceCollide((d) => d.r + (d.kind === 'hub' ? 10 : 3)).iterations(2))
      .stop();
    for (let i = 0; i < (prev.size ? 60 : 240); i++) sim.tick();
    sim.alpha(0).on('tick', draw);

    // dom
    hullSel = zg.append('g').style('pointer-events', 'none').selectAll('path').data(clusters).join('path')
      .attr('fill', (c) => cc(c.slug)).attr('fill-opacity', 0.04).attr('stroke', (c) => cc(c.slug)).attr('stroke-opacity', 0.19).attr('stroke-width', 1);
    linkSel = zg.append('g').style('pointer-events', 'none').selectAll('line').data(links).join('line')
      .attr('stroke-dasharray', (l) => (l.kind === 'cross' ? '2 4' : null)).attr('stroke-width', (l) => (l.kind === 'spoke' ? 0.8 : 1));
    nodeSel = zg.append('g').selectAll('g').data(nodes).join('g').style('cursor', 'pointer')
      .on('mouseenter', (e, d) => { hover = d.id; style(); }).on('mouseleave', () => { hover = null; style(); })
      .on('click', (e, d) => { e.stopPropagation(); cur.select(d.kind === 'ghost' ? 'ghost' : d.kind === 'hub' ? 'repo' : 'note', d.kind === 'hub' ? d.cluster : d.id); })
      .call(d3.drag()
        .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }));
    nodeSel.each(function (d) {
      const g = d3.select(this);
      // a square has more area than the circle of the same radius: shrink it so sizes read as before
      const h = d.r * 0.89;
      sq(g, h + 4).attr('class', 'ring').attr('fill', 'none').attr('stroke-width', 2).style('display', 'none');
      if (d.kind === 'ghost') sq(g, h + 3.5).attr('fill', 'none').attr('stroke', '#cfcfcf').attr('stroke-width', 1).attr('stroke-dasharray', '2 2.5');
      if (d.n && (d.n.draft || d.n.pending)) sq(g, h + 2).attr('fill', 'none').attr('stroke', '#e8e8e8').attr('stroke-width', 1).attr('stroke-dasharray', '3 2');
      sq(g, h).attr('class', 'dot').attr('fill-opacity', d.kind === 'hub' ? 0.95 : d.kind === 'ghost' ? 0.55 : 0.9);
      g.append('title').text(d.kind === 'hub' ? `${d.cluster}: ${cOf.get(d.cluster).count} notes` : d.kind === 'ghost' ? `${d.id} (not written yet)` : `${d.id} (${d.n.type})${d.n.description ? ': ' + d.n.description : ''}`);
    });
    labSel = zg.append('g').style('pointer-events', 'none').selectAll('text').data(nodes).join('text').attr('class', 'np-lbl').attr('text-anchor', 'middle')
      .attr('font-style', (d) => (d.kind === 'ghost' ? 'italic' : null)).attr('font-weight', (d) => (d.kind === 'hub' ? 600 : 400))
      .text((d) => (d.kind === 'hub' ? d.cluster : d.id.length > 28 ? d.id.slice(0, 27) + '…' : d.id));

    draw(); if (!prev.size) fit(false);
  }

  function fit(animate) {
    const vis = nodes.filter((d) => d.kind !== 'ghost' || F.ghosts); if (!vis.length) return;
    const x0 = d3.min(vis, (d) => d.x - d.r - 30), x1 = d3.max(vis, (d) => d.x + d.r + 30), y0 = d3.min(vis, (d) => d.y - d.r - 30), y1 = d3.max(vis, (d) => d.y + d.r + 30);
    const w = root.clientWidth || 1000, h = root.clientHeight || 700, k = Math.min(w / (x1 - x0), h / (y1 - y0), 2) * 0.92;
    const t = d3.zoomIdentity.translate(w / 2 - ((x0 + x1) / 2) * k, h / 2 - ((y0 + y1) / 2) * k).scale(k);
    (animate ? svg.transition().duration(500) : svg).call(zoom.transform, t);
  }

  function draw() {
    hullSel.attr('d', (c) => {
      if (!F.hulls) return null;
      const pts = [];
      for (const d of c.members) {
        if (d.kind === 'ghost' && !F.ghosts) continue;
        const p = d.r + (d.kind === 'hub' ? 24 : 15);
        pts.push([d.x - p, d.y - p], [d.x + p, d.y - p], [d.x + p, d.y + p], [d.x - p, d.y + p]);
      }
      // a cluster is the rectangle around its members' padded squares
      if (!pts.length) return null;
      const [x0, x1] = d3.extent(pts, (p) => p[0]), [y0, y1] = d3.extent(pts, (p) => p[1]);
      return `M${x0},${y0}H${x1}V${y1}H${x0}Z`;
    });
    linkSel.attr('x1', (l) => l.source.x).attr('y1', (l) => l.source.y).attr('x2', (l) => l.target.x).attr('y2', (l) => l.target.y);
    nodeSel.attr('transform', (d) => `translate(${d.x},${d.y})`);
    labSel.attr('x', (d) => d.x).attr('y', (d) => d.y + d.r + (d.kind === 'hub' ? hubFont() * 0.95 : 11 / zk));
  }
  const hubFont = () => Math.min(34, Math.max(14, 13 / zk));

  function selId() { const s = cur.sel; return s && (s.kind === 'note' || s.kind === 'ghost') ? s.id : s && s.kind === 'repo' ? 'hub:' + s.id : null; }

  function style() {
    const q = cur.q, sel = selId(), focus = hover || sel, fset = focus && nbr.get(focus) ? new Set([focus, ...nbr.get(focus)]) : null;
    const match = q ? (d) => (d.kind === 'hub' ? d.cluster : d.id + ' ' + (d.n ? d.n.description + ' ' + d.n.type : '')).toLowerCase().includes(q) : null;
    nodeSel.style('display', (d) => (d.kind === 'ghost' && !F.ghosts ? 'none' : null)).attr('opacity', (d) => {
      let o = 1;
      if (cur.repo && d.cluster !== cur.repo) o = 0.16;
      if (match && !match(d)) o = Math.min(o, 0.18);
      if (fset && !fset.has(d.id)) o = Math.min(o, 0.12);
      return d.n && d.n.superseded ? o * 0.5 : o;
    });
    nodeSel.select('.dot').attr('fill', fillOf);
    nodeSel.select('.ring').style('display', (d) => (d.id === sel || d.id === hover || (match && match(d)) ? null : 'none'))
      .attr('stroke', (d) => (d.id === sel ? ACCENT : d.id === hover ? '#fff' : '#fbbf24'));
    linkSel.style('display', (l) => ((l.kind === 'cross' && !F.cross) || (!F.ghosts && (l.source.kind === 'ghost' || l.target.kind === 'ghost')) ? 'none' : null))
      .style('stroke', (l) => (focus && (l.source.id === focus || l.target.id === focus) ? '#c8c8c8' : 'var(--muted)'))
      .attr('stroke-opacity', (l) => {
        let o = l.kind === 'spoke' ? 0.14 : l.kind === 'intra' ? 0.3 : 0.2;
        if (cur.repo && l.source.cluster !== cur.repo && l.target.cluster !== cur.repo) o *= 0.15;
        if (focus) o = l.source.id === focus || l.target.id === focus ? 0.9 : 0.03;
        return o;
      });
    hullSel.style('display', F.hulls ? null : 'none').attr('opacity', (c) => (cur.repo && c.slug !== cur.repo ? 0.3 : 1));
    root.querySelectorAll('[data-tg]').forEach((b) => b.classList.toggle('on', F[b.dataset.tg]));
    root.querySelectorAll('[data-cb]').forEach((b) => b.classList.toggle('on', F.by === b.dataset.cb));
    root.querySelector('[data-stats]').textContent = `${cur.D.notes.length} notes · ${cur.D.ghosts.length} ghosts · ${clusters.length} clusters`;
    styleLabels(focus, fset, match, sel);
  }

  let last = [null, null, null, null];
  function styleLabels(focus, fset, match, sel) {
    if (focus === undefined) [focus, fset, match, sel] = last; else last = [focus, fset, match, sel];
    labSel.style('display', (d) => {
      if (d.kind === 'ghost' && !F.ghosts) return 'none';
      if (d.id === hover || d.id === sel) return null;
      if (!F.labels) return 'none';
      if (d.kind === 'hub') return null;
      if (match && match(d)) return null;
      if (fset && fset.has(d.id) && hover) return null;
      return zk >= 1.6 ? null : 'none';
    }).attr('font-size', (d) => (d.kind === 'hub' ? hubFont() : 10.5 / zk)).attr('stroke-width', (d) => (d.kind === 'hub' ? 4 : 3) / Math.min(zk, 1.2));
    labSel.attr('y', (d) => d.y + d.r + (d.kind === 'hub' ? hubFont() * 0.95 : 11 / zk));
  }

  function legend() {
    const D = cur.D, el = root.querySelector('.np-legend');
    const rows = F.by === 'repo'
      ? clusters.map((c) => `<div class="np-row click ${cur.repo === c.slug ? 'on' : ''}" ${c.slug === 'shared' ? '' : `data-repo="${esc(c.slug)}"`}><span class="inline-block h-2.5 w-2.5 shrink-0 rounded-full" style="background:${cc(c.slug)}"></span><span class="truncate">${esc(c.slug)}</span><span class="mono faint ml-auto text-[11px]">${c.count}</span></div>`)
      : [...typeCount].sort((a, b) => b[1] - a[1]).map(([t, n]) => `<div class="np-row"><span class="inline-block h-2.5 w-2.5 shrink-0 rounded-full" style="background:${typeCol(t)}"></span><span class="truncate">${esc(t)}</span><span class="mono faint ml-auto text-[11px]">${n}</span></div>`);
    el.innerHTML = `<div class="flex items-center pr-2"><span class="eyebrow">${F.by === 'repo' ? 'Repositories' : 'Note types'}</span><span class="mono faint ml-auto text-[11px]">${D.notes.length}</span></div>
      <div class="rows">${rows.join('')}</div>
      <div class="mt-2 space-y-1 border-t pr-2 pt-2 text-[11.5px] hairline">
        <div class="flex items-center gap-2 muted"><svg width="14" height="14" style="width:14px;height:14px;flex:none"><rect x="2" y="2" width="10" height="10" fill="none" stroke="#cfcfcf" stroke-dasharray="2 2.5"/></svg>Ghost, not written yet<span class="mono faint ml-auto">${D.ghosts.length}</span></div>
        <div class="flex items-center gap-2 muted"><svg width="14" height="14" style="width:14px;height:14px;flex:none"><path d="M1 12L13 2" stroke="var(--muted)" stroke-dasharray="2 3"/></svg>Cross-cluster link<span class="mono faint ml-auto">${crossCount}</span></div>
        <div class="flex items-center gap-2 muted"><svg width="14" height="14" style="width:14px;height:14px;flex:none"><rect x="1.5" y="1.5" width="11" height="11" fill="none" stroke="#e8e8e8" stroke-dasharray="3 2"/></svg>Draft, not shared yet<span class="mono faint ml-auto">${D.notes.filter((n) => n.draft || n.pending).length}</span></div>
      </div>`;
  }

  App.register('notes', {
    render(el, ctx) {
      cur = ctx;
      el.style.overflow = 'hidden'; el.style.position = 'relative'; el.style.padding = '0';
      if (!root) mkRoot();
      if (root.parentNode !== el) el.replaceChildren(root);
      if (built !== ctx.D) { built = ctx.D; hover = null; build(ctx.D); }
      legend(); style();
    },
  });
})();

// Activity screen of the brain redesign: a commit heat calendar (weeks x weekdays) over the brain's
// timeline, an author filter, and the commits grouped by day with the notes each one changed.
(function () {
  let author = null, day = null;
  const ACTION = { recorded: '--s-done', updated: '--s-ready', superseded: '--s-active', deleted: '--s-blocked', moved: '--s-waiting' };
  App.register('activity', {
    render(el, ctx) {
      const { ui } = ctx, esc = ui.esc;
      const all = ctx.D.timeline.commits.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
      if (!all.length) { el.innerHTML = '<div class="mx-auto max-w-[1500px] p-5"><div class="text-[22px]">Activity</div><div class="muted mt-2">This brain has no timeline yet: timeline.json comes with /brain sync.</div></div>'; return; }
      const authors = [...new Set(all.map((c) => c.author))], drafts = ctx.D.notes.filter((n) => n.draft || n.pending);
      const commits = all.filter((c) => (!author || c.author === author) && (!ctx.repo || c.changes.some((ch) => (ch.repos || []).includes(ctx.repo))) && (!ctx.q || (c.title + ' ' + c.changes.map((x) => x.note).join(' ')).toLowerCase().includes(ctx.q)));
      const dayOf = (c) => c.date.slice(0, 10);
      const byDay = d3.rollup(commits, (v) => v.length, dayOf);
      // the calendar: from the Monday on or before the first commit to today's week
      const first = new Date(all.at(-1).date.slice(0, 10) + 'T00:00:00Z'); first.setUTCDate(first.getUTCDate() - ((first.getUTCDay() + 6) % 7));
      const last = new Date(all[0].date.slice(0, 10) + 'T00:00:00Z');
      const weeks = []; for (let d = new Date(first); d <= last; d.setUTCDate(d.getUTCDate() + 7)) weeks.push(new Date(d));
      const max = Math.max(1, ...byDay.values());
      const tone = (n) => (n ? `color-mix(in srgb, var(--accent) ${25 + (n / max) * 75}%, var(--panel-2))` : 'var(--panel-2)');
      const cal = `<div class="flex gap-[3px]">${weeks.map((w) => `<div class="flex flex-col gap-[3px]">${[0, 1, 2, 3, 4, 5, 6].map((i) => { const d = new Date(w); d.setUTCDate(d.getUTCDate() + i); const k = d.toISOString().slice(0, 10), n = byDay.get(k) || 0; return `<span data-day="${k}" title="${k} · ${n} commits" class="cell cursor-pointer" style="width:13px;height:13px;background:${tone(n)};${day === k ? 'outline:1.5px solid var(--text);outline-offset:1px' : ''}"></span>`; }).join('')}</div>`).join('')}</div>`;
      const shown = day ? commits.filter((c) => dayOf(c) === day) : commits.slice(0, 60);
      const groups = d3.groups(shown, dayOf);
      const changes = commits.flatMap((c) => c.changes), count = (a) => changes.filter((x) => x.action === a).length;
      el.innerHTML = `<div class="mx-auto max-w-[1500px] space-y-4 p-5">
        <div class="flex items-end gap-3"><div><div class="text-[20px] font-semibold tracking-tight">Activity</div><div class="muted mt-0.5">${commits.length} commits to the brain's notes${ctx.repo ? ' touching ' + esc(ctx.repo) : ''}</div></div>
          <div class="seg ml-auto text-[12px]"><button data-author="" class="${!author ? 'on' : ''}">Everyone</button>${authors.map((a) => `<button data-author="${esc(a)}" class="${author === a ? 'on' : ''}">${esc(a)}</button>`).join('')}</div></div>
        <div class="grid grid-cols-4 gap-3">${ui.kpi('Commits', commits.length, `${authors.length} authors`)}${ui.kpi('Recorded', count('recorded'), 'new notes', 'done')}${ui.kpi('Updated', count('updated'), 'notes changed', 'ready')}${ui.kpi('Superseded', count('superseded') + count('deleted'), 'retired', 'active')}</div>
        <div class="panel">${ui.panelHead('Commit calendar', 'one square per day', day ? `<button data-day="" class="btn py-0.5 text-[12px]">Clear ${esc(day)} ✕</button>` : '')}
          <div class="flex items-start gap-3 overflow-x-auto px-4 pb-4 pt-3"><div class="faint mono flex flex-col gap-[3px] pt-px text-[9.5px] leading-[13px]">${['Mon', '', 'Wed', '', 'Fri', '', 'Sun'].map((d) => `<span>${d}&nbsp;</span>`).join('')}</div>${cal}</div></div>
        ${drafts.length ? `<div class="panel">${ui.panelHead('Not shared yet', `${drafts.length} draft${drafts.length === 1 ? '' : 's'} on this machine · /brain sync shares them`)}
          <div class="flex flex-wrap gap-1.5 px-4 pb-4 pt-3">${drafts.map((n) => `<span class="chip clickable" data-sel="note|${esc(n.id)}" style="background:var(--panel-2)">${(n.repos || []).slice(0, 1).map(ui.repoDot).join('')}${esc(n.id)}<span class="faint">${esc(n.draft ? 'new' : 'changes ' + n.pending)}</span></span>`).join('')}</div></div>` : ''}
        <div class="panel">${ui.panelHead(day ? 'Commits on ' + day : 'Latest commits', day ? '' : `the last ${shown.length}`)}
          <div class="px-4 pb-3 pt-2">${groups.map(([d, cs]) => `<div class="eyebrow mt-3 mb-1.5">${new Date(d + 'T00:00:00Z').toLocaleDateString('en', { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC' })}</div>
            ${cs.map((c) => `<div class="flex items-start gap-3 border-b py-2.5 hairline last:border-0">
              <span class="mt-0.5 grid h-7 w-7 shrink-0 place-items-center rounded-full text-[11px] font-semibold text-white" style="background:hsl(${[...c.author].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 360, 0)} 45% 42%)">${esc(c.author[0])}</span>
              <div class="min-w-0 flex-1"><div class="flex items-baseline gap-2"><span class="truncate font-medium">${esc(c.title)}</span><span class="mono faint ml-auto text-[11px]">${esc(c.sha)}</span></div>
                <div class="mt-1 flex flex-wrap gap-1">${c.changes.map((ch) => `<span class="chip clickable" data-sel="note|${esc(ch.note)}" style="background:var(--panel-2)"><span class="h-1.5 w-1.5 rounded-full" style="background:var(${ACTION[ch.action] || '--s-draft'})"></span>${(ch.repos || []).slice(0, 1).map(ui.repoDot).join('')}${esc(ch.note)}</span>`).join('')}</div></div></div>`).join('')}`).join('')}</div></div>
      </div>`;
      el.querySelectorAll('[data-author]').forEach((b) => (b.onclick = () => { author = b.dataset.author || null; App.render(); }));
      el.querySelectorAll('[data-day]').forEach((b) => (b.onclick = () => { day = b.dataset.day && b.dataset.day !== day ? b.dataset.day : null; App.render(); }));
    },
  });
})();

</script>

<script>
// ============================================================ THE PAGE
// Lists the brains added on this machine, reads one through the browser's folder access, turns its files into
// App's data with toData, and re-reads it every few seconds while it is open.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// The route lives in the hash: #/ is the brain list, #/b/<brain>[/<screen>...] one brain.
const route = () => (/^#\/b\/([^/]+)/.exec(location.hash) || [])[1] || null;
const goBrain = (id) => { location.hash = id ? '#/b/' + id : '#/'; };

// Each entry of brains is a brain the user added: { id, name, handle, status, files, data }.
const state = { brains: [], brain: null, notice: '' };

// ---------- folder access ----------

// A browser that blocks storage may never answer: after two seconds the call gives up, and the page works on, only
// without remembering its brain list.
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    setTimeout(() => reject(new Error('IndexedDB did not answer')), 2000);
    const open = indexedDB.open('alper-brain-page', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      // a store call that throws (a value the store cannot clone) rejects, rather than leaving the promise hanging
      try {
        const tx = open.result.transaction('kv', mode);
        const req = fn(tx.objectStore('kv'));
        tx.oncomplete = () => resolve(req.result);
        tx.onerror = () => reject(tx.error);
      } catch (e) { reject(e); }
    };
  });
}

// Every file:// page shares one origin, so a fixed key gives each copy of this page, at any plugin version, the same brain list.
const saveBrains = async () => {
  try { await idb('readwrite', (s) => s.put(state.brains.map(({ id, name, handle }) => ({ id, name, handle })), 'brains')); } catch {}
};

async function walk(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'directory') await walk(h, prefix + name + '/', out);
    else if (name.endsWith('.md')) out.set(prefix + name, await (await h.getFile()).text());
  }
}
const sub = async (dir, ...names) => { for (const n of names) dir = await dir.getDirectoryHandle(n); return dir; };
const text = async (dir, name) => (await (await dir.getFileHandle(name)).getFile()).text();

// Re-reads one brain and sets its status: 'ok', 'denied' (read permission not granted) or 'missing' (no BRAIN.md at its
// root). Its files are the specs under .sdd/specs, the notes and cards under repos/ and shared/, this machine's drafts
// under .sdd/drafts, and timeline.json and .sdd/links.json. Returns whether its status or files changed.
async function readBrain(b) {
  const before = b.status;
  const files = new Map();
  try {
    if ((await b.handle.queryPermission({ mode: 'read' })) !== 'granted') b.status = 'denied';
    else {
      await b.handle.getFileHandle('BRAIN.md');
      try { await walk(await sub(b.handle, '.sdd', 'specs'), '.sdd/specs/', files); } catch {}
      for (const top of ['repos', 'shared']) { try { await walk(await sub(b.handle, top), top + '/', files); } catch {} }
      try { await walk(await sub(b.handle, '.sdd', 'drafts'), '.sdd/drafts/', files); } catch {}
      try { files.set('timeline.json', await text(b.handle, 'timeline.json')); } catch {}
      try { files.set('.sdd/links.json', await text(await sub(b.handle, '.sdd'), 'links.json')); } catch {}
      b.status = 'ok';
    }
  } catch { b.status = 'missing'; }
  if (b.status !== 'ok') return b.status !== before;
  if (b.files && b.files.size === files.size && [...files].every(([k, v]) => b.files.get(k) === v)) return b.status !== before;
  b.files = files;
  b.data = toData(b.name, files);
  return true;
}

// ---------- parsing: a brain's files into App's data ----------

const heading = (t) => (/^#\s+(.+)$/m.exec(t) || [])[1]?.trim() ?? null;
const field = (t, name) => (new RegExp(`^\\*\\*${name}:\\*\\*\\s*(.+)$`, 'mi').exec(t) || [])[1]?.trim() ?? null;
const section = (t, name) => (new RegExp(`^##\\s+${name}\\s*$([\\s\\S]*?)(?=^##\\s|(?![\\s\\S]))`, 'm').exec(t) || [])[1]?.trim() ?? '';
const numOf = (s) => (/^(\d{3})/.exec(s) || [])[1] ?? null;
const shaOf = (s) => { const v = (s || '').replace(/`/g, ''); return /^[0-9a-f]{7,40}/i.test(v) ? v.slice(0, 7) : null; };
function front(t) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(t), fm = {};
  if (m) for (const l of m[1].split(/\r?\n/)) { const kv = /^([\w-]+):\s*(.*)$/.exec(l); if (kv) fm[kv[1]] = kv[2].trim().replace(/^["']|["']$/g, ''); }
  return { fm, body: m ? t.slice(m[0].length) : t };
}

// /build's closing steps after a milestone's last ticket, from milestone.md's Phase line; a Squash commit ends them.
// step 7 writes decide when the arbiter decides the escalations, and ask when the user does, stopping the track.
// scripts/check-phases.mjs checks every phase of build's Phase table is a key here.
const PHASE_LABEL = { check: 'Checking', failed: 'Check failed', waits: 'Waiting on its expand', review: 'In review', decide: 'Deciding escalations', ask: 'Waiting on your answers', fix: 'Fixing review', squash: 'Squashing' };
// How many of a review.md's findings are flagged escalate with no Answer line yet; a finding runs from its ID
// (ST1, SP2, CN3) to the next. The same rule as hooks/sdd.ts's awaitingOf.
const awaitingOf = (md) => md.split(/^(?=\s*(?:[-*]\s+|#{1,4}\s+)?(?:\*\*)?(?:ST|SP|CN)\d+\b)/m).slice(1)
  .filter((f) => /\bescalate\b/i.test(f) && !/\*\*Answer:\*\*/.test(f)).length;
const ticketsStatus = (ts) => (!ts.length ? 'draft' : ts.every((t) => t.status === 'done') ? 'done' : ts.some((t) => t.status === 'blocked') ? 'blocked'
  : ts.some((t) => t.status === 'doing' || t.status === 'done') ? 'active' : 'ready');
const WIKI = /\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g;

function toData(name, files) {
  const read = (p) => files.get(p);
  const paths = [...files.keys()];
  // repositories: one per card
  let links = {};
  try { links = JSON.parse(read('.sdd/links.json') || '{}'); } catch {}
  const repos = paths.filter((p) => /^repos\/[^/]+\/REPO\.md$/.test(p)).sort().map((p) => {
    const slug = p.split('/')[1], { fm, body } = front(read(p));
    return { slug, remote: fm.remote, explored: fm.explored || null, summary: body.trim(), linked: !!links[slug] };
  });
  // notes: a draft is read as the note it would land as, at its target; one that changes a committed note marks it
  const noteOf = (file, draft) => {
    const { fm, body } = front(read(file));
    const path = draft ? fm.target : file;
    if (!path || /\/REPO\.md$/.test(path)) return null;
    const parts = path.split('/');
    if (parts[0] === 'repos' && parts.length < 3) return null;
    const id = parts.at(-1).replace(/\.md$/, '');
    return {
      id, path, type: fm.type || 'other', layer: fm.layer || null, description: fm.description || '', body: body.trim(),
      repos: parts[0] === 'repos' ? [parts[1]] : (fm.repos || '').replace(/^\[|\]$/g, '').split(',').map((s) => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean),
      shared: parts[0] === 'shared', kind: parts.includes('explored') ? 'explored' : 'authored', explored: fm.explored || null,
      links: [...new Set([...body.matchAll(WIKI)].map((x) => x[1].trim()))].filter((l) => l !== id),
      superseded: fm.status === 'superseded', supersededBy: fm.supersededBy || null,
      draft: draft ? fm.action || 'record' : null, supersedes: fm.supersedes || null,
    };
  };
  const notes = new Map();
  for (const p of paths.filter((p) => /^(repos|shared)\/.*\.md$/.test(p))) { const n = noteOf(p, false); if (n && !notes.has(n.id)) notes.set(n.id, n); }
  for (const p of paths.filter((p) => p.startsWith('.sdd/drafts/'))) {
    const d = noteOf(p, true); if (!d) continue;
    const own = notes.get(d.id);
    if (own) { own.pending = d.draft; own.pendingBody = d.body; own.pendingDescription = d.description; }
    else if (d.draft !== 'delete') notes.set(d.id, d);
    if (d.draft === 'supersede' && notes.get(d.supersedes)) notes.get(d.supersedes).pending = 'supersede';
  }
  const ghosts = [...new Set([...notes.values()].flatMap((n) => n.links).filter((l) => !notes.has(l)))];
  let timeline = { commits: [] };
  try { const t = JSON.parse(read('timeline.json') || '{}'); if (Array.isArray(t.commits)) timeline = { commits: t.commits.map((c) => ({ ...c, changes: Array.isArray(c.changes) ? c.changes : [] })) }; } catch {}

  // specs: .sdd/specs/<spec>/spec.md, and its milestones in one track per repository (milestones/<slug>/NNN-*/), or,
  // ticketed before tracks, straight under milestones/ with a Repo line each (the flat layout)
  const byDir = new Map();
  for (const p of paths.filter((p) => p.startsWith('.sdd/specs/'))) {
    const parts = p.slice('.sdd/specs/'.length).split('/');
    if (!numOf(parts[0])) continue;
    if (!byDir.has(parts[0])) byDir.set(parts[0], []);
    byDir.get(parts[0]).push(parts);
  }
  const list = (v) => (v || '').split(/[,;]/).map((s) => s.replace(/[`\s]/g, '')).filter(Boolean);
  const specs = [...byDir.keys()].sort().map((dir) => {
    const t = read(`.sdd/specs/${dir}/spec.md`) || '';
    const landed = (field(t, 'Landed') || '').replace(/`/g, '');
    const s = {
      id: dir, num: numOf(dir), title: (heading(t) || dir).replace(/^Spec:\s*/i, ''), path: `.sdd/specs/${dir}/spec.md`, body: t,
      repos: list(field(t, 'Repos')), key: field(t, 'Key'), base: field(t, 'Base'),
      deps: list(field(t, 'Depends on')).filter(numOf), landed: /[0-9a-f]{7,40}/i.test(landed) ? landed : null, abandoned: field(t, 'Abandoned'),
      landings: field(t, 'Landings'), summary: section(t, 'Problem Statement').split(/\n\s*\n/)[0], milestones: [],
    };
    const ms = new Map();
    for (const parts of byDir.get(dir)) {
      if (parts[1] !== 'milestones') continue;
      const flat = parts.length === 4 && numOf(parts[2]), tracked = parts.length === 5 && !numOf(parts[2]) && numOf(parts[3]);
      if (!flat && !tracked) continue;
      const mdir = flat ? parts[2] : parts[3], file = parts.at(-1), key = flat ? mdir : `${parts[2]}/${mdir}`;
      if (!ms.has(key)) ms.set(key, { track: flat ? null : parts[2], mdir, base: `.sdd/specs/${dir}/milestones/${key}`, tickets: [] });
      if (numOf(file)) ms.get(key).tickets.push(file);
    }
    for (const mm of [...ms.values()].sort((a, b) => (a.track || '').localeCompare(b.track || '') || a.mdir.localeCompare(b.mdir))) {
      const mt = read(`${mm.base}/milestone.md`) || '', review = read(`${mm.base}/review.md`) ?? null;
      const track = mm.track || (field(mt, 'Repo') || '').replace(/`/g, '').trim() || 'unassigned';
      const after = field(mt, 'Lands after') || '', builds = field(mt, 'Builds after') || '';
      const msIds = (v) => (/^none/i.test(v) ? [] : (v.match(/[\w.-]+\/\d+/g) || []).map((d) => d.replace(/\/(\d+)$/, (_, n) => '/' + n.padStart(3, '0'))));
      const m = {
        id: `${track}/${numOf(mm.mdir)}`, track, num: numOf(mm.mdir), title: (heading(mt) || mm.mdir).replace(/^Milestone\s+\d+:\s*/i, ''),
        path: `${mm.base}/milestone.md`, body: mt, review, reviewPath: review != null ? `${mm.base}/review.md` : null, awaiting: review ? awaitingOf(review) : 0,
        delivers: field(mt, 'Delivers'), phase: (field(mt, 'Phase') || '').replace(/`/g, '').toLowerCase() || null,
        squash: shaOf(field(mt, 'Squash')), landed: shaOf(field(mt, 'Landed')),
        buildsAfter: msIds(builds), landsAfter: msIds(after), tickets: [],
      };
      for (const tf of mm.tickets.sort()) {
        const tt = read(`${mm.base}/${tf}`), deps = field(tt, 'Depends on') || '';
        m.tickets.push({
          id: `${track}/${numOf(tf)}`, num: numOf(tf), title: (heading(tt) || tf).replace(/^Ticket\s+\d+:\s*/i, ''), path: `${mm.base}/${tf}`, body: tt,
          status: (field(tt, 'Status') || 'todo').toLowerCase().replace(/`/g, ''), commit: shaOf(field(tt, 'Commit')),
          deps: /^none/i.test(deps) ? [] : (deps.match(/(?:[\w.-]+\/)?\d+/g) || []).map((d) => (d.includes('/') ? d.replace(/\/(\d+)$/, (_, n) => '/' + n.padStart(3, '0')) : `${track}/${d.padStart(3, '0')}`)),
        });
      }
      s.milestones.push(m);
    }
    // tracks wait on each other only at milestones: a ticket's Depends on another track's ticket, from before Builds
    // after, is read as its milestone's Builds after that ticket's milestone, as build moves it
    const ownerOf = new Map(s.milestones.flatMap((m) => m.tickets.map((t) => [t.id, m])));
    for (const m of s.milestones) for (const t of m.tickets) t.deps = t.deps.filter((d) => {
      const o = ownerOf.get(d);
      if (!o || o.track === m.track) return true;
      if (!m.buildsAfter.includes(o.id)) m.buildsAfter.push(o.id);
      return false;
    });
    if (!s.repos.length) s.repos = [...new Set(s.milestones.map((m) => m.track).filter((x) => x !== 'unassigned'))];
    return s;
  });
  // statuses: a closing milestone (all tickets done, a Phase, no Squash yet) is active, or waits on the user when its
  // check failed or it is at ask with escalations unanswered (decide is the arbiter's: it needs no one); its stage is
  // its Phase, and build while its tickets run. A squashed one not yet on its base is landing. A spec takes the most
  // urgent of its milestones.
  for (const s of specs) {
    for (const m of s.milestones) {
      const closing = !m.squash && PHASE_LABEL[m.phase] && m.tickets.length && m.tickets.every((t) => t.status === 'done');
      const waits = m.phase === 'failed' || (m.phase === 'ask' && m.awaiting > 0);
      m.status = m.landed ? 'landed' : closing ? (waits ? 'attention' : 'active') : ticketsStatus(m.tickets);
      if (m.status === 'done' && m.squash && !m.landed) m.status = 'landing';
      m.phaseLabel = closing ? (m.phase === 'ask' && !m.awaiting ? 'Answered' : PHASE_LABEL[m.phase]) : null;
      m.stage = closing ? m.phase : m.status === 'active' ? 'build' : null;
    }
    s.status = ticketsStatus(s.milestones.flatMap((m) => m.tickets));
    if (s.milestones.some((m) => m.status === 'attention')) s.status = 'attention';
    else if (s.status === 'done' && s.milestones.some((m) => m.phaseLabel)) s.status = 'active';
    else if (s.status === 'done' && !s.landed && s.milestones.some((m) => m.squash && !m.landed)) s.status = 'landing';
    if (s.status === 'done' && s.landed) s.status = 'landed';
  }
  // a dependency that is missing or has not landed holds a spec back; an Abandoned line retires it whatever its tickets say
  for (const s of specs) {
    s.waiting = s.deps.filter((d) => !specs.find((x) => x.id === d)?.landed);
    if (s.waiting.length && (s.status === 'draft' || s.status === 'ready')) s.status = 'waiting';
    if (s.abandoned) s.status = 'abandoned';
  }
  // the frontier, what the next /build starts (build's Tracks): each track's first open milestone with no ticket
  // started, once every milestone its Builds after names is squashed, in a spec not held by its own dependencies.
  // A spec with nothing started yet is in the frontier when any of its milestones is.
  for (const s of specs) {
    if (s.waiting.length || ['draft', 'abandoned', 'landed'].includes(s.status)) continue;
    for (const track of new Set(s.milestones.map((m) => m.track))) {
      const m = s.milestones.find((x) => x.track === track && !x.squash);
      if (!m || m.status !== 'ready') continue;
      if (m.buildsAfter.every((id) => { const o = s.milestones.find((x) => x.id === id); return !o || o.squash; })) m.status = 'frontier';
    }
    if (s.status === 'ready' && s.milestones.some((m) => m.status === 'frontier')) s.status = 'frontier';
  }
  return { name, repos, notes: [...notes.values()], ghosts, timeline, specs };
}

// ---------- the brain list ----------

// a brain card's label and the colour of its top edge, by the brain's state
const TONE = { attention: ['Needs you', 'var(--s-attention)'], active: ['In progress', 'var(--s-active)'], ready: ['Ready to build', 'var(--s-ready)'], quiet: ['', 'var(--line-2)'] };
const STATUS_VAR = { done: '--s-done', doing: '--s-active', blocked: '--s-blocked', todo: '--s-todo' };
const GONE = {
  denied: { label: 'Needs permission', text: 'The browser needs your permission to read this folder again.' },
  missing: { label: 'Missing', text: 'Its <code>BRAIN.md</code> is gone: the folder was moved, renamed or deleted.' },
};
const plural = (n, w, ws = w + 's') => `${n} ${n === 1 ? w : ws}`;
const inFlight = (s) => !s.landed && !s.abandoned;
// A brain takes its most urgent spec's state: the user's turn (a spec waiting on answers or blocked), then work running,
// then a spec ready to build. Brains sort in that order, then by name.
const brainState = (b) => {
  if (b.status !== 'ok') return null;
  const has = (...ks) => b.data.specs.some((s) => ks.includes(s.status));
  return has('attention', 'blocked') ? 'attention' : has('active', 'landing') ? 'active' : has('ready', 'frontier') ? 'ready' : 'quiet';
};
const ORDER = ['attention', 'active', 'ready', 'quiet'];

function brainCard(b) {
  const remove = `<button data-remove="${b.id}" title="Remove from this page" class="faint -mr-1 shrink-0 px-1.5 hover:text-white">✕</button>`;
  if (b.status !== 'ok') {
    const g = GONE[b.status];
    return `<article class="flex flex-col border border-dashed p-5" style="border-color:var(--line-2)">
      <div class="flex items-center gap-2"><h2 class="muted min-w-0 flex-1 truncate text-[18px]">${esc(b.name)}</h2><span class="chip" style="background:var(--panel-2)">${g.label}</span>${remove}</div>
      <p class="muted mt-2 text-[12.5px]">${g.text}</p>
      ${b.status === 'denied' ? `<button data-reconnect="${b.id}" class="btn mt-4 self-start text-[12px]">Reconnect</button>` : ''}
    </article>`;
  }
  const d = b.data, st = brainState(b), [label, tone] = TONE[st];
  const flying = d.specs.filter(inFlight), ts = flying.flatMap((s) => s.milestones.flatMap((m) => m.tickets)), done = ts.filter((t) => t.status === 'done').length;
  const needs = d.specs.filter((s) => s.status === 'attention' || s.status === 'blocked');
  const drafts = d.notes.filter((n) => n.draft || n.pending).length;
  const cells = ts.slice(0, 120).map((t) => `<span class="cell" style="width:8px;height:8px;background:var(${STATUS_VAR[t.status] || '--s-todo'})"></span>`).join('');
  return `<article data-brain="${b.id}" tabindex="0" class="panel clickable flex cursor-pointer flex-col p-5 outline-none focus-visible:ring-1 focus-visible:ring-white/40" style="box-shadow:inset 0 2px 0 ${tone}">
      <div class="flex items-center gap-2"><h2 class="min-w-0 flex-1 truncate text-[18px]">${esc(b.name)}</h2>
        ${label ? `<span class="chip" style="background:color-mix(in srgb, ${tone} 16%, transparent);color:color-mix(in srgb, ${tone} 80%, white)">${label}</span>` : ''}${remove}</div>
      <div class="muted mt-2 text-[12px]">${plural(flying.length, 'spec')} in flight · ${plural(d.notes.length, 'note')} · ${plural(d.repos.length, 'repository', 'repositories')}${drafts ? ` · ${drafts} not shared` : ''}</div>
      ${ts.length ? `<div class="mt-3 flex flex-wrap gap-[2px]">${cells}${ts.length > 120 ? `<span class="mono faint ml-1 text-[10px]">+${ts.length - 120}</span>` : ''}</div>` : ''}
      <div class="muted mt-3 flex items-center gap-2 text-[11.5px]"><div class="h-1 flex-1 overflow-hidden" style="background:var(--s-todo)"><div class="h-full" style="width:${ts.length ? (done / ts.length) * 100 : 0}%;background:var(--s-done)"></div></div><span class="mono">${done}/${plural(ts.length, 'ticket')}</span></div>
      ${needs.length ? `<ul class="mt-3 space-y-1 border-t pt-3 text-[12.5px] hairline">${needs.map((s) => `<li class="flex items-center gap-2"><span class="mono faint text-[11px]">${esc(s.num)}</span><span class="min-w-0 flex-1 truncate">${esc(s.title)}</span><span class="text-[11.5px]" style="color:#fca5a5">${s.status === 'blocked' ? 'Blocked' : 'Needs you'}</span></li>`).join('')}</ul>` : ''}
    </article>`;
}

function showHome(msg) {
  $('view').classList.add('hidden');
  $('home').classList.remove('hidden');
  $('reload').classList.toggle('hidden', !state.brains.length);
  const brains = [...state.brains].sort((a, b) => ORDER.indexOf(brainState(a)) - ORDER.indexOf(brainState(b)) || a.name.localeCompare(b.name));
  $('homeMain').innerHTML = `<div class="mx-auto max-w-[1500px]">
      <div class="eyebrow">Second brain</div>
      <h1 class="mb-6 mt-1 text-[28px]">Brains</h1>
      ${msg ? `<div class="panel mb-6 px-4 py-3 text-[12.5px]">${msg}</div>` : ''}
      ${state.notice ? `<div class="mb-6 flex items-start gap-3 border px-4 py-3 text-[12.5px]" style="border-color:color-mix(in srgb, var(--s-active) 40%, transparent);background:color-mix(in srgb, var(--s-active) 8%, transparent)"><p class="flex-1">${state.notice}</p><button data-dismiss title="Dismiss" class="shrink-0 hover:opacity-70">✕</button></div>` : ''}
      ${brains.length ? `<div class="grid gap-4" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${brains.map(brainCard).join('')}</div>`
        : `<div class="muted border border-dashed py-16 text-center text-[13px]" style="border-color:var(--line-2)">No brains yet. Click <b>Add brain</b> and pick a brain's folder, the one holding <code class="mono">BRAIN.md</code>. Nothing leaves your machine.</div>`}
    </div>`;
  const m = $('homeMain');
  const dismiss = m.querySelector('[data-dismiss]');
  if (dismiss) dismiss.onclick = () => { state.notice = ''; showHome(); };
  m.querySelectorAll('[data-brain]').forEach((el) => {
    el.onclick = () => goBrain(el.dataset.brain);
    el.onkeydown = (e) => e.key === 'Enter' && e.target === el && goBrain(el.dataset.brain);
  });
  m.querySelectorAll('[data-remove]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); removeBrain(el.dataset.remove); }));
  m.querySelectorAll('[data-reconnect]').forEach((el) => (el.onclick = () => reconnect(state.brains.find((b) => b.id === el.dataset.reconnect))));
}

// ---------- one brain ----------

// Draws the open brain; App keeps the screen, selection and filters when the same brain loads again.
function showBrain() {
  const b = state.brain;
  $('home').classList.add('hidden');
  if (b.status !== 'ok') {
    $('view').classList.add('hidden');
    $('home').classList.remove('hidden');
    $('homeMain').innerHTML = `<div class="mx-auto max-w-md space-y-4 py-24 text-center"><h1 class="text-[22px]">${esc(b.name)}</h1>
      <p class="muted text-[13px]">${GONE[b.status].text}</p>
      <div class="flex justify-center gap-2">${b.status === 'denied' ? '<button id="reconnect" class="btn text-[12px]">Reconnect</button>' : ''}<button id="back" class="btn text-[12px]">All brains</button></div></div>`;
    if ($('reconnect')) $('reconnect').onclick = () => reconnect(b);
    $('back').onclick = () => goBrain(null);
    return;
  }
  $('view').classList.remove('hidden');
  App.load(b.id, b.data);
}

// ---------- reading, adding, removing ----------

// Re-reads what is on screen, the open brain or every listed one, and redraws only when a file changed.
async function refresh() {
  if (state.brain) { if (await readBrain(state.brain)) showBrain(); return; }
  if ((await Promise.all(state.brains.map(readBrain))).some(Boolean)) showHome();
}
let polling = false;
setInterval(async () => {
  if (!state.brain || polling || document.hidden) return;
  polling = true;
  try { await refresh(); } finally { polling = false; }
}, 2000);

// A brain shows as its folder's name; a clashing name takes the first free number suffix.
function uniqueName(name) {
  const taken = new Set(state.brains.map((b) => b.name));
  let n = 1, out = name;
  while (taken.has(out)) out = `${name} ${++n}`;
  return out;
}

async function addBrain() {
  let handle;
  try { handle = await window.showDirectoryPicker({ id: 'brain', mode: 'read' }); } catch { return; }
  for (const b of state.brains) if (await b.handle.isSameEntry(handle).catch(() => false)) return goBrain(b.id);
  try { await handle.getFileHandle('BRAIN.md'); } catch {
    state.notice = `No <code>BRAIN.md</code> in <b>${esc(handle.name)}</b>. Pick the brain's folder, the one holding <code>BRAIN.md</code>; <code>/brain setup</code> creates one.`;
    return state.brain ? goBrain(null) : showHome();
  }
  state.notice = '';
  const b = { id: Math.random().toString(36).slice(2, 8), name: uniqueName(handle.name), handle };
  state.brains.push(b);
  await saveBrains();
  await readBrain(b);
  goBrain(b.id);
}

async function removeBrain(id) {
  state.brains = state.brains.filter((b) => b.id !== id);
  await saveBrains();
  showHome();
}

async function reconnect(b) {
  try { await b.handle.requestPermission({ mode: 'read' }); } catch {}
  await readBrain(b);
  if (state.brain) showBrain(); else showHome();
}

async function applyRoute() {
  const b = state.brains.find((x) => x.id === route()) || null;
  if (b && b === state.brain && b.status === 'ok' && !$('view').classList.contains('hidden')) return App.render();
  state.brain = b;
  if (!b) return showHome();
  await readBrain(b);
  showBrain();
}

async function restore() {
  if (!window.showDirectoryPicker) {
    $('open').classList.add('hidden');
    return showHome('This page needs Chrome or Edge: it reads your brains through their folder access.');
  }
  try { state.brains = (await idb('readonly', (s) => s.get('brains'))) || []; } catch {}
  await Promise.all(state.brains.map(readBrain));
  applyRoute();
}

$('open').onclick = addBrain;
$('reload').onclick = refresh;
window.addEventListener('hashchange', applyRoute);
window.addEventListener('focus', refresh);
restore();

</script>
</body>
</html>

// ---------- map ----------

// The Map section shows what each repository is being built into. Each repository is a hub on a ring, ringed by one
// segment per milestone it builds; the specs sit at the centre; each milestone hangs between the spec it serves and
// the repository it builds in, and its line into the repository moves while work runs there. Violet arrows are
// order: a milestone that lands after another, a spec built after another.
// With tickets on, each milestone carries its tickets as small dots, and grey arrows run from a ticket to those that depend on it.
const mv = { scope: store.get('mapScope') === 'all' ? 'all' : 'flight', tickets: store.get('mapTickets') !== '0', sel: null, query: '' };
// Positions survive a redraw, as in the notes graph.
const mPos = new Map();
// The map fits the window until the user pans or zooms it; Fit hands it back.
let mSvg, mRoot, mZoom, mSim, mNodes, mLinks, mFit = false, mFitSlow = false, mUserZoom = false;
let mRelated = () => null;

// A milestone on the map: landed on its base, squashed and waiting to land, or its status everywhere else on the page.
const mStatus = (m) => (m.landed ? 'landed' : m.squash ? 'landing' : milestoneStatus(m));
const mLabel = (m) => ({ landed: 'Landed', landing: 'Ready to land' }[mStatus(m)] || milestoneLabel(m));
// Work runs on a milestone while one of its tickets is doing, or while /build closes it without waiting on the user.
const isLive = (m) => !m.landed && !m.squash && (m.tickets.some((t) => isDoing(t.status)) || (isClosing(m) && !waitsOnUser(m)));
const tone = (s) => `var(--s-${s})`;
// A repository's ring takes settled work first, so it fills clockwise as milestones land.
const RING_ORDER = ['landed', 'landing', 'done', 'active', 'attention', 'blocked', 'ready', 'waiting', 'draft', 'abandoned'];
const byRing = (work) => [...work].sort((a, b) => RING_ORDER.indexOf(mStatus(a.m)) - RING_ORDER.indexOf(mStatus(b.m)));
const clip = (t, n) => (t.length > n ? t.slice(0, n - 1) + '…' : t);
const REPO_R = 30;
const specR = (s) => 17 + Math.sqrt(s.tickets.length) * 2.2;
const radiusOf = (d) => (d.kind === 'repo' ? REPO_R + 12 : d.kind === 'spec' ? specR(d.spec) + 6 : d.kind === 'ticket' ? 5 : 9);
const isArrow = (e) => e.kind === 'order' || e.kind === 'dep' || e.kind === 'tdep';
const mapSpecs = () => state.specs.filter((s) => mv.scope === 'all' || (!s.abandoned && !s.landed));
// The first paragraph of a repository's card, below its front matter.
const repoBlurb = (slug) => {
  const t = state.repo?.noteFiles?.get(`repos/${slug}/REPO.md`);
  return t ? excerpt(t.replace(/^---\r?\n[\s\S]*?\r?\n---[ \t]*\r?\n?/, '').replace(WIKI, (_, n, alias) => (alias || n).trim())) : '';
};

// The repositories the shown specs name or build in, with the milestones each builds and what they are doing; with
// every spec shown, every repository the brain registers too.
function mapWork() {
  const specs = mapSpecs();
  const slugs = new Set(mv.scope === 'all' ? state.notes?.repos || [] : []);
  specs.forEach((s) => { s.repos.forEach((r) => slugs.add(r)); s.milestones.forEach((m) => m.repo && slugs.add(m.repo)); });
  const repos = [...slugs].sort().map((slug) => {
    const work = specs.flatMap((s) => s.milestones.filter((m) => m.repo === slug).map((m) => ({ s, m })));
    return {
      slug, work,
      open: work.filter(({ m }) => !m.landed),
      live: work.filter(({ m }) => isLive(m)),
      stuck: work.filter(({ m }) => ['attention', 'blocked'].includes(mStatus(m))),
      doing: work.flatMap(({ m }) => m.tickets.filter((t) => isDoing(t.status))),
      planned: specs.filter((s) => s.repos.includes(slug) && !s.milestones.some((m) => m.repo === slug)),
    };
  });
  return { specs, repos };
}

function mapData() {
  const { specs, repos } = mapWork();
  const nodes = repos.map((r, i) => ({ id: 'r:' + r.slug, kind: 'repo', repo: r, i, n: repos.length }));
  const edges = [];
  const mid = (s, m) => `m:${s.id}|${m.id}`;
  const tid = (s, n) => `t:${s.id}|${n}`;
  for (const s of specs) nodes.push({ id: 's:' + s.id, kind: 'spec', spec: s });
  for (const s of specs) {
    for (const d of s.deps) if (d.spec && specs.includes(d.spec)) edges.push({ source: 's:' + d.spec.id, target: 's:' + s.id, kind: 'dep' });
    for (const m of s.milestones) {
      const st = mStatus(m);
      nodes.push({ id: mid(s, m), kind: 'milestone', spec: s, m, status: st, live: isLive(m) });
      edges.push({ source: 's:' + s.id, target: mid(s, m), kind: 'part' });
      if (m.repo) edges.push({ source: mid(s, m), target: 'r:' + m.repo, kind: 'build', status: st, live: isLive(m) });
      m.after.forEach((a) => edges.push({ source: mid(s, a), target: mid(s, m), kind: 'order' }));
      if (mv.tickets) for (const t of m.tickets) {
        nodes.push({ id: tid(s, t.num), kind: 'ticket', spec: s, m, t });
        edges.push({ source: mid(s, m), target: tid(s, t.num), kind: 'holds' });
      }
    }
    // The same dependencies the spec's graph draws, a dependency another one implies dropped, across milestones too.
    if (mv.tickets) for (const [n, { inner, outer }] of depsOf(s)) for (const d of [...inner, ...outer]) {
      const from = s.tickets.find((t) => t.num === d);
      edges.push({ source: tid(s, d), target: tid(s, n), kind: 'tdep', settled: from?.status === 'done' });
    }
    for (const r of repos) if (r.planned.includes(s)) edges.push({ source: 's:' + s.id, target: 'r:' + r.slug, kind: 'planned' });
  }
  return { nodes, edges, specs, repos };
}

// label is 'named' to show the lit tickets' labels, 'near' to show them only when zoomed in.
function mLight(set, label = 'near') {
  if (!mRoot) return;
  mRoot.classed('dim', !!set);
  mNodes.classed('hot', (n) => !!set && set.has(n.id));
  const lit = (n) => !!set && n.kind === 'ticket' && set.has(n.id);
  mNodes.classed('named', (n) => label === 'named' && lit(n)).classed('near', (n) => label === 'near' && lit(n));
  mLinks.classed('hot', (e) => !!set && set.has(e.source.id) && set.has(e.target.id));
}

// Fits the map to the canvas, from the nodes' own positions so labels and the entrance animation never skew it.
function fitMap(ms = 0) {
  // The canvas goes with the Map section; its resize observer can still fire once after another section replaces it.
  const host = $('mapCanvas');
  if (!mSim || !host) return;
  const { width, height } = host.getBoundingClientRect();
  const ns = mSim.nodes();
  if (!width || !ns.length) return;
  const pad = (d) => radiusOf(d) + (d.kind === 'milestone' || d.kind === 'ticket' ? 10 : d.kind === 'repo' ? 84 : 46);
  const x0 = d3.min(ns, (d) => d.x - pad(d)), x1 = d3.max(ns, (d) => d.x + pad(d));
  const y0 = d3.min(ns, (d) => d.y - pad(d)), y1 = d3.max(ns, (d) => d.y + pad(d));
  const k = Math.min(1.4, 0.92 * Math.min(width / (x1 - x0), height / (y1 - y0)));
  const t = d3.zoomIdentity.translate(width / 2 - (k * (x0 + x1)) / 2, height / 2 - (k * (y0 + y1)) / 2).scale(k);
  (ms ? mSvg.transition().duration(ms).ease(d3.easeCubicOut) : mSvg).call(mZoom.transform, t);
}

function drawMap() {
  const host = $('mapCanvas');
  if (!mSvg) {
    mSvg = d3.select(host).append('svg').attr('class', 'h-full w-full');
    const defs = mSvg.append('defs');
    defs.append('marker').attr('id', 'mArrow').attr('viewBox', '0 -5 10 10').attr('refX', 8).attr('markerWidth', 7).attr('markerHeight', 7).attr('orient', 'auto')
      .append('path').attr('class', 'arrow').attr('d', 'M0,-4L10,0L0,4Z');
    defs.append('marker').attr('id', 'mTArrow').attr('viewBox', '0 -5 10 10').attr('refX', 8).attr('markerWidth', 5).attr('markerHeight', 5).attr('orient', 'auto')
      .append('path').attr('class', 'tarrow').attr('d', 'M0,-4L10,0L0,4Z');
    mRoot = mSvg.append('g');
    mZoom = d3.zoom().scaleExtent([0.2, 3]).on('zoom', (e) => {
      mRoot.attr('transform', e.transform);
      host.classList.toggle('zoomed', e.transform.k > 1.35);
      if (e.sourceEvent) mUserZoom = true;
    });
    mSvg.call(mZoom).on('dblclick.zoom', null);
    mSvg.on('click', (e) => { if (e.target === mSvg.node()) pickMap(null); });
    mFit = false;
    mUserZoom = false;
    // The canvas settles its size after the page's styles load, and again with the window: refit each time.
    new ResizeObserver(() => { if (!mUserZoom) fitMap(); }).observe(host);
  }
  if (mSim) {
    mSim.stop();
    mSim.nodes().forEach((d) => mPos.set(d.id, { x: d.x, y: d.y }));
  }

  const { nodes, edges, specs, repos } = mapData();
  $('mapEmpty').classList.toggle('hidden', nodes.length > 0);
  $('mapEmpty').innerHTML = mv.scope === 'all'
    ? 'No repositories or specs yet. <code class="ml-1">/brain setup</code>&nbsp;registers the first repository.'
    : 'No spec in flight. All specs shows every repository.';
  const R = Math.max(240, 130 + repos.length * 40);
  const byId = new Map(nodes.map((d) => [d.id, d]));
  let fresh = 0;
  for (const d of nodes) {
    const p = mPos.get(d.id);
    if (!p) fresh++;
    if (d.kind === 'repo') {
      // Repositories hold their places on the ring, the first at the top, so the picture keeps its shape across reloads.
      const a = -Math.PI / 2 + (d.i * 2 * Math.PI) / d.n;
      const at = d.n === 1 ? { x: 0, y: R * 0.6 } : { x: R * Math.cos(a), y: R * Math.sin(a) };
      d.x = d.fx = at.x;
      d.y = d.fy = at.y;
    } else if (p) {
      d.x = p.x;
      d.y = p.y;
    } else {
      // A new milestone starts most of the way out to its repository, a new ticket beside its milestone, a new spec near the centre.
      const m = d.kind === 'ticket' && byId.get(`m:${d.spec.id}|${d.m.id}`);
      const r = d.kind === 'milestone' && byId.get('r:' + d.m.repo);
      const spread = m ? 24 : 50;
      d.x = (m ? m.x : r ? r.x * 0.62 : 0) + (Math.random() - 0.5) * spread;
      d.y = (m ? m.y : r ? r.y * 0.62 : 0) + (Math.random() - 0.5) * spread;
    }
  }
  const adj = new Map(nodes.map((d) => [d.id, new Set([d.id])]));
  for (const e of edges) { adj.get(e.source)?.add(e.target); adj.get(e.target)?.add(e.source); }
  // A repository or spec lights up with everything one milestone away from it on either side, and those milestones'
  // tickets; a ticket, with its milestone and the tickets it depends on or that depend on it.
  mRelated = (d) => {
    const set = new Set(adj.get(d.id));
    if (d.kind === 'repo' || d.kind === 'spec') for (const id of [...set]) {
      if (byId.get(id)?.kind === 'milestone') adj.get(id).forEach((x) => set.add(x));
    }
    return set;
  };

  mRoot.selectAll('*').remove();
  mLinks = mRoot.append('g').selectAll('path').data(edges).join('path')
    .attr('class', (e) => `mlink ${e.kind}${e.live ? ' flow' : ''}${e.settled ? ' settled' : ''}`)
    .style('--c', (e) => (e.status ? tone(e.status) : null))
    .attr('marker-end', (e) => (e.kind === 'tdep' ? 'url(#mTArrow)' : isArrow(e) ? 'url(#mArrow)' : null));
  mNodes = mRoot.append('g').selectAll('g').data(nodes).join('g').attr('class', (d) => `mnode ${d.kind}`);
  mNodes.append('circle').attr('r', radiusOf).attr('fill', 'transparent');
  const body = mNodes.append('g').attr('class', fresh ? 'pop' : null).style('animation-delay', (d, i) => (fresh ? `${Math.min(i * 16, 1100)}ms` : null));

  const repoG = body.filter((d) => d.kind === 'repo');
  repoG.filter((d) => d.repo.live.length).append('circle').attr('class', 'halo wide').attr('r', REPO_R + 11).style('--c', tone('active'));
  const pie = d3.pie().value((w) => Math.max(1, w.m.tickets.length)).sort(null).padAngle(0.05);
  const seg = d3.arc().innerRadius(REPO_R + 4).outerRadius(REPO_R + 11).cornerRadius(2);
  repoG.each(function (d) {
    const g = d3.select(this);
    if (!d.repo.work.length) g.append('circle').attr('class', 'idle-ring').attr('r', REPO_R + 7);
    g.selectAll('path.seg').data(pie(byRing(d.repo.work))).join('path').attr('class', 'seg').attr('d', seg).style('fill', (p) => tone(mStatus(p.data.m)));
  });
  repoG.append('circle').attr('class', 'core').attr('r', REPO_R);
  repoG.append('text').attr('class', 'count').attr('text-anchor', 'middle').attr('dy', 3).text((d) => d.repo.open.length);
  repoG.append('text').attr('class', 'sub').attr('text-anchor', 'middle').attr('dy', 14).text('IN FLIGHT');
  repoG.append('text').attr('class', 'label name').text((d) => d.repo.slug);
  repoG.filter((d) => d.repo.doing.length).append('text').attr('class', 'label now').text((d) => `◐ ${plural(d.repo.doing.length, 'ticket')} building`);

  const specG = body.filter((d) => d.kind === 'spec').style('--c', (d) => tone(d.spec.status));
  specG.append('circle').attr('class', 'core').attr('r', (d) => specR(d.spec));
  specG.append('circle').attr('class', 'track').attr('r', (d) => specR(d.spec) - 6);
  specG.each(function (d) {
    const ts = d.spec.tickets, n = ts.length || 1, r = specR(d.spec) - 6;
    const done = (doneOf(ts) / n) * 2 * Math.PI, busy = (ts.filter((t) => isDoing(t.status)).length / n) * 2 * Math.PI;
    const arc = d3.arc().innerRadius(r - 2).outerRadius(r + 2).cornerRadius(2);
    const g = d3.select(this);
    if (done) g.append('path').attr('d', arc({ startAngle: 0, endAngle: done })).style('fill', tone('landed'));
    if (busy) g.append('path').attr('d', arc({ startAngle: done, endAngle: done + busy })).style('fill', tone('active'));
  });
  specG.append('text').attr('class', 'num').attr('text-anchor', 'middle').attr('dy', 4).text((d) => d.spec.num);
  specG.append('text').attr('class', 'label').attr('text-anchor', 'middle').attr('dy', (d) => specR(d.spec) + 16).text((d) => clip(d.spec.title, 30));

  const msG = body.filter((d) => d.kind === 'milestone').style('--c', (d) => tone(d.status));
  msG.filter((d) => d.live).append('circle').attr('class', 'halo').attr('r', 7);
  msG.append('circle').attr('class', 'dot').attr('r', 7);
  msG.append('text').attr('class', 'label').attr('text-anchor', 'middle').attr('dy', -13).text((d) => `${mName(d.m)} · ${clip(d.m.title, 26)}`);

  // A ticket's dot takes its status colour; one not started yet is hollow, one in progress pulses.
  const tkG = body.filter((d) => d.kind === 'ticket').style('--c', (d) => tone(TICKET_STATUS[d.t.status] || 'draft'));
  tkG.filter((d) => isDoing(d.t.status)).append('circle').attr('class', 'halo').attr('r', 4);
  tkG.append('circle').attr('class', (d) => `dot${d.t.status === 'todo' ? ' todo' : ''}`).attr('r', 4);
  tkG.append('text').attr('class', 'label').attr('text-anchor', 'middle').attr('dy', -9).text((d) => `#${String(d.t.num).split('/').pop()} · ${clip(d.t.title, 28)}`);

  mNodes
    .on('mouseenter', (ev, d) => { mLight(mRelated(d), d.kind === 'ticket' || d.kind === 'milestone' ? 'named' : 'near'); d3.select(ev.currentTarget).classed('hover', true); mapTip(ev, d); })
    .on('mousemove', moveTip)
    .on('mouseleave', (ev) => {
      d3.select(ev.currentTarget).classed('hover', false);
      const p = byId.get(mv.sel);
      mLight(p ? mRelated(p) : null);
      $('noteTip').classList.add('hidden');
    })
    .on('click', (ev, d) => {
      ev.stopPropagation();
      if (d.kind === 'milestone') openMilestone(d.spec, d.m);
      else if (d.kind === 'ticket') openTicket(d.spec, d.t.num);
      else pickMap(mv.sel === d.id ? null : d.id);
    })
    .on('dblclick', (ev, d) => { if (d.kind === 'spec') go(d.spec.id); });
  // Nodes cannot be dragged: a drag reheats the whole simulation on every move, and a large map stutters under it.

  // Lines run edge to edge, not centre to centre; arrows bend, so two of them between neighbours stay apart.
  const ticked = () => {
    mLinks.attr('d', (e) => {
      const s = e.source, t = e.target, dx = t.x - s.x, dy = t.y - s.y, len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len, arrow = isArrow(e);
      const x1 = s.x + ux * (radiusOf(s) - 6), y1 = s.y + uy * (radiusOf(s) - 6);
      const x2 = t.x - ux * (radiusOf(t) - (arrow ? 1 : 6)), y2 = t.y - uy * (radiusOf(t) - (arrow ? 1 : 6));
      if (!arrow) return `M${x1},${y1}L${x2},${y2}`;
      const bend = 0.2 * len;
      return `M${x1},${y1}Q${(x1 + x2) / 2 - uy * bend},${(y1 + y2) / 2 + ux * bend} ${x2},${y2}`;
    });
    mNodes.attr('transform', (d) => `translate(${d.x},${d.y})`);
    // A repository's name sits on the ring's outer side, away from the milestones that gather on its inner side.
    repoG.each(function (d) {
      const len = Math.hypot(d.x, d.y), ux = len ? d.x / len : 0, uy = len ? d.y / len : 1;
      const anchor = Math.abs(ux) < 0.4 ? 'middle' : ux > 0 ? 'start' : 'end';
      const x = ux * (REPO_R + 18), y = uy * (REPO_R + 18) + (uy > 0.4 ? 12 : uy < -0.4 ? -4 : 4);
      const g = d3.select(this);
      g.select('.name').attr('x', x).attr('y', y).attr('text-anchor', anchor);
      g.select('.now').attr('x', x).attr('y', y + (uy < -0.4 ? -15 : 15)).attr('text-anchor', anchor);
    });
  };
  const ring = specs.length > 1 ? Math.min(R * 0.32, 30 + specs.length * 16) : 0;
  mSim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id((d) => d.id)
      .distance((e) => ({ part: R * 0.4, build: 64, planned: R * 0.8, order: 40, dep: 110, holds: 40, tdep: 36 }[e.kind]))
      .strength((e) => ({ part: 0.1, build: 0.6, planned: 0.01, order: 0.04, dep: 0.04, holds: 0.7, tdep: 0.08 }[e.kind])))
    .force('charge', d3.forceManyBody().strength((d) => (d.kind === 'spec' ? -480 : d.kind === 'repo' ? -260 : d.kind === 'ticket' ? -45 : -70)))
    .force('collide', d3.forceCollide((d) => radiusOf(d) + (d.kind === 'spec' ? 26 : d.kind === 'ticket' ? 8 : 5)))
    .force('radial', d3.forceRadial((d) => (d.kind === 'spec' ? ring : R * 0.66), 0, 0).strength((d) => (d.kind === 'spec' ? 0.3 : d.kind === 'milestone' ? 0.03 : 0)))
    .on('tick', ticked);
  // A first layout settles before it is shown, so the map arrives in place rather than shaking into it.
  mSim.stop();
  if (fresh) for (let i = 0; i < 320; i++) mSim.tick();
  mSim.alpha(fresh ? 0.04 : 0.08).restart();
  ticked();
  if (!mFit || mFitSlow) { fitMap(mFitSlow ? 650 : 0); mFit = true; mFitSlow = false; }
  mapMarks();
}

// Rings the search matches and the picked hub, and lights what the pick touches.
function mapMarks() {
  if (!mNodes || !$('map')) return;
  const q = mv.query.trim().toLowerCase();
  const text = (d) => (d.kind === 'repo' ? d.repo.slug : d.kind === 'spec' ? `${d.spec.num} ${d.spec.title}` : d.kind === 'ticket' ? `#${d.t.num} ${d.t.title}` : `${d.spec.num} ${mName(d.m)} ${d.m.title} ${d.m.tickets.map((t) => t.title).join(' ')}`);
  mNodes.classed('picked', (d) => d.id === mv.sel).classed('match', (d) => !!q && text(d).toLowerCase().includes(q));
  const p = mSim?.nodes().find((n) => n.id === mv.sel);
  mLight(p ? mRelated(p) : null);
}

function pickMap(id) {
  mv.sel = id || null;
  mapMarks();
  mapPanel();
}

function mapTip(ev, d) {
  const tip = $('noteTip');
  const sub = (t) => `<div class="mt-0.5 text-zinc-500">${t}</div>`;
  if (d.kind === 'repo') {
    const r = d.repo, blurb = repoBlurb(r.slug);
    tip.innerHTML = `<div class="font-mono font-semibold">${esc(r.slug)}</div>`
      + sub(`${r.open.length} in flight · ${r.work.length - r.open.length} landed${r.doing.length ? ` · ${plural(r.doing.length, 'ticket')} building` : ''}`)
      + (blurb ? `<div class="mt-1 text-zinc-600 dark:text-zinc-300">${esc(clip(blurb, 170))}</div>` : '');
  } else if (d.kind === 'spec') {
    const s = d.spec;
    tip.innerHTML = `<div class="font-semibold"><span class="font-mono text-zinc-400">${esc(s.num)}</span> ${esc(s.title)}</div>`
      + sub(`${STATUS[s.status].label} · ${doneOf(s.tickets)}/${plural(s.tickets.length, 'ticket')} done`)
      + sub(s.repos.length ? s.repos.map(esc).join(', ') : 'No repositories yet')
      + '<div class="mt-1 text-zinc-400">Click to focus · double-click to open</div>';
  } else if (d.kind === 'ticket') {
    const t = d.t, others = (ns) => ns.map((n) => '#' + esc(String(n).split('/').pop())).join(', ');
    const after = d.spec.tickets.filter((x) => x.deps.includes(t.num)).map((x) => x.num);
    tip.innerHTML = `<div class="font-semibold"><span class="font-mono text-zinc-400">#${esc(String(t.num).split('/').pop())}</span> ${esc(t.title)}</div>`
      + sub(`${esc(STATUS[TICKET_STATUS[t.status] || 'draft'].label)} · ${esc(d.spec.num)} · ${esc(mName(d.m))} ${esc(d.m.title)}`)
      + (t.deps.length ? sub(`Depends on ${others(t.deps)}`) : '')
      + (after.length ? sub(`Needed by ${others(after)}`) : '')
      + '<div class="mt-1 text-zinc-400">Click to open</div>';
  } else {
    const m = d.m, doing = m.tickets.filter((t) => isDoing(t.status));
    tip.innerHTML = `<div class="font-semibold"><span class="font-mono text-zinc-400">${esc(d.spec.num)} · ${esc(mName(m))}</span> ${esc(m.title)}</div>`
      + sub(`${esc(mLabel(m))} · ${doneOf(m.tickets)}/${plural(m.tickets.length, 'ticket')} done`)
      + doing.map((t) => `<div class="mt-1 text-amber-600 dark:text-amber-400">◐ ${esc(t.title)}</div>`).join('')
      + (m.after.length ? sub(`Lands after ${m.after.map((a) => esc(mName(a))).join(', ')}`) : '');
  }
  tip.classList.remove('hidden');
  moveTip(ev);
}

// ----- the map's panel: every repository at a glance, or the one repository or spec picked -----

const mCaps = (t) => `<p class="mb-2 text-[11px] font-medium uppercase tracking-widest text-zinc-400">${t}</p>`;
const mTile = (label, value, tone = '') => `<div class="rounded-lg border border-zinc-200 dark:border-zinc-800 px-3 py-2"><dt class="text-[11px] text-zinc-500">${label}</dt><dd class="text-lg font-semibold tabular-nums tracking-tight ${tone}">${value}</dd></div>`;
const AMBER = 'text-amber-600 dark:text-amber-400', RED = 'text-red-600 dark:text-red-400', GREEN = 'text-emerald-600 dark:text-emerald-400';
const segBar = (work) => `<div class="flex gap-0.5">${work.length ? byRing(work).map(({ s, m }) =>
  `<div class="h-1.5 rounded-full ${isLive(m) ? 'animate-pulse' : ''}" title="${esc(s.num)} · ${esc(mName(m))} ${esc(m.title)} — ${esc(mLabel(m))}" style="flex:${Math.max(1, m.tickets.length)} 1 0;background:${tone(mStatus(m))}"></div>`).join('')
  : '<div class="h-1.5 flex-1 rounded-full bg-zinc-100 dark:bg-zinc-800"></div>'}</div>`;
const mBack = '<button data-map-pick="" class="text-xs text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100">← Every repository</button>';
const LEGEND = [['landed', 'Landed'], ['landing', 'Ready to land'], ['active', 'Building'], ['attention', 'Needs you'], ['ready', 'Ready to build'], ['waiting', 'Waiting'], ['draft', 'Needs tickets']];
const mLegend = () => `<div>${mCaps('Key')}
  <div class="grid grid-cols-2 gap-x-3 gap-y-1.5 text-xs text-zinc-600 dark:text-zinc-300">
    ${LEGEND.map(([k, l]) => `<span class="flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-full" style="background:${tone(k)}"></span>${l}</span>`).join('')}
    <span class="col-span-2 mt-1 flex items-center gap-2"><svg width="28" height="8" class="shrink-0"><line x1="0" y1="4" x2="28" y2="4" stroke="var(--s-active)" stroke-width="2" stroke-dasharray="7 5"/></svg>work running in that repository</span>
    <span class="col-span-2 flex items-center gap-2"><svg width="28" height="8" class="shrink-0"><line x1="0" y1="4" x2="21" y2="4" stroke="var(--s-waiting)" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M20,0L28,4L20,8Z" fill="var(--s-waiting)"/></svg>lands, or builds, after</span>
    <span class="col-span-2 flex items-center gap-2"><svg width="28" height="8" class="shrink-0"><line x1="2" y1="4" x2="26" y2="4" stroke="var(--nedge)" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round"/></svg>named by a spec, not ticketed yet</span>
    <span class="col-span-2 flex items-center gap-2"><svg width="28" height="8" class="shrink-0"><circle cx="4" cy="4" r="3.5" fill="var(--s-done)"/><line x1="8" y1="4" x2="21" y2="4" stroke="var(--nedge)" stroke-width="1.25"/><path d="M20,1L25,4L20,7Z" fill="var(--nedge)"/></svg>a ticket, and one that depends on it</span>
  </div></div>`;

function msRow(s, m, withTrack) {
  const live = m.tickets.filter((t) => isDoing(t.status) || t.status === 'blocked');
  return `<div class="px-3 py-2">
    <button data-map-milestone="${esc(s.id)}|${esc(m.id)}" class="flex w-full min-w-0 items-center gap-2 text-left text-sm">
      <span class="h-2.5 w-2.5 shrink-0 rounded-full ${isLive(m) ? 'animate-pulse' : ''}" style="background:${tone(mStatus(m))}"></span>
      <span class="shrink-0 font-mono text-xs text-zinc-400">${esc(withTrack ? mName(m) : 'M' + m.num)}</span><span class="min-w-0 flex-1 truncate hover:underline">${esc(m.title)}</span>
      <span class="shrink-0 text-xs text-zinc-500">${esc(mLabel(m))}</span>
    </button>
    <div class="mt-1.5 pl-[18px]">${fill(m, 'h-1')}</div>
    ${m.after.length ? `<p class="mt-1 pl-[18px] text-[11px] text-violet-600 dark:text-violet-400">Lands after ${m.after.map((a) => esc(mName(a))).join(', ')}</p>` : ''}
    ${live.length ? `<div class="mt-1">${live.map((t) => ticketChip(t)).join('')}</div>` : ''}
  </div>`;
}

const specHead = (s) => `<button data-map-spec="${esc(s.id)}" class="flex w-full min-w-0 items-center gap-2 border-b border-zinc-200 dark:border-zinc-800 px-3 py-2 text-left hover:bg-zinc-50 dark:hover:bg-zinc-900/60">
  <span class="font-mono text-xs text-zinc-400">${esc(s.num)}</span><span class="min-w-0 flex-1 truncate text-sm font-medium">${esc(s.title)}</span>
  <span class="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-medium ${STATUS[s.status].tone}">${STATUS[s.status].label}</span></button>`;
const box = (inner) => `<section class="overflow-hidden rounded-xl border border-zinc-200 dark:border-zinc-800">${inner}</section>`;

function repoRow(r) {
  const now = r.stuck[0] || r.live[0] || r.open[0];
  const line = now
    ? `<span class="shrink-0 font-mono text-zinc-400">${esc(now.s.num)} · M${esc(now.m.num)}</span><span class="min-w-0 truncate">${esc(now.m.title)}</span><span class="ml-auto shrink-0 text-zinc-500">${esc(mLabel(now.m))}</span>`
    : r.planned.length ? `<span class="text-zinc-500">Named by ${r.planned.map((s) => esc(s.num)).join(', ')}, not ticketed yet</span>`
    : '<span class="text-zinc-400">Nothing in flight</span>';
  return `<button data-map-pick="r:${esc(r.slug)}" class="block w-full rounded-lg px-2 py-2 text-left hover:bg-zinc-100 dark:hover:bg-zinc-900">
    <div class="flex items-center gap-2"><span class="font-mono text-sm font-medium">${esc(r.slug)}</span>${r.live.length ? '<span class="h-1.5 w-1.5 rounded-full bg-amber-500 animate-pulse"></span>' : ''}${r.stuck.length ? '<span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>' : ''}<span class="ml-auto text-xs tabular-nums text-zinc-500">${r.open.length} in flight</span></div>
    <div class="mt-1.5">${segBar(r.work)}</div>
    <div class="mt-1.5 flex min-w-0 items-center gap-1.5 text-xs">${line}</div>
  </button>`;
}

function mapOverview(specs, repos) {
  const doing = repos.reduce((n, r) => n + r.doing.length, 0), stuck = repos.reduce((n, r) => n + r.stuck.length, 0);
  // What waits on the user comes first, then work running, then the rest.
  const order = [...repos].sort((a, b) => b.stuck.length - a.stuck.length || b.live.length - a.live.length || b.open.length - a.open.length || a.slug.localeCompare(b.slug));
  return `<div class="space-y-6 p-5">
    <div><h2 class="text-base font-semibold tracking-tight">What each repository is being built into</h2>
      <p class="mt-1 text-xs text-zinc-500">${mv.scope === 'all' ? 'Every spec' : 'The specs in flight'}, by the repositories their milestones build in. Click a hub or a row to focus it, a milestone to open it.</p></div>
    <dl class="grid grid-cols-3 gap-2">${mTile('Specs', specs.length)}${mTile('Building', doing, doing ? AMBER : '')}${mTile('Needs you', stuck, stuck ? RED : '')}</dl>
    <div>${mCaps('Repositories')}<div class="-mx-2 space-y-0.5">${order.map(repoRow).join('') || `<p class="px-2 text-sm text-zinc-500">${mv.scope === 'all' ? 'No repositories registered yet.' : 'No spec in flight.'}</p>`}</div></div>
    ${mLegend()}
  </div>`;
}

function repoPanel(r) {
  const blurb = repoBlurb(r.slug);
  const notes = state.notes ? [...state.notes.notes.values()].filter((n) => n.repos.includes(r.slug)).length : 0;
  const bySpec = new Map();
  r.work.forEach(({ s, m }) => bySpec.set(s, [...(bySpec.get(s) || []), m]));
  const landed = r.work.filter(({ m }) => m.landed).length;
  return `<div class="space-y-5 p-5">
    ${mBack}
    <div>
      <div class="flex items-center gap-3"><span class="grid h-10 w-10 shrink-0 place-items-center rounded-full text-sm font-bold" style="background:var(--core);color:var(--core-text)">${r.open.length}</span>
        <h2 class="min-w-0 truncate font-mono text-lg font-semibold tracking-tight">${esc(r.slug)}</h2></div>
      ${blurb ? `<p class="mt-3 text-sm text-zinc-600 dark:text-zinc-300">${esc(blurb)}</p>` : ''}
    </div>
    <dl class="grid grid-cols-3 gap-2">${mTile('In flight', r.open.length)}${mTile('Building', r.doing.length, r.doing.length ? AMBER : '')}${mTile('Landed', landed, landed ? GREEN : '')}</dl>
    ${segBar(r.work)}
    ${[...bySpec].map(([s, ms]) => box(specHead(s) + `<div class="divide-y divide-zinc-100 dark:divide-zinc-800/70">${ms.map((m) => msRow(s, m, false)).join('')}</div>`)).join('')}
    ${!r.work.length && !r.planned.length ? '<p class="text-sm text-zinc-500">No spec builds here yet.</p>' : ''}
    ${r.planned.length ? `<div>${mCaps('Named, not ticketed yet')}${box(r.planned.map(specHead).join(''))}</div>` : ''}
    <button data-map-notes="${esc(r.slug)}" class="w-full rounded-md border border-zinc-200 dark:border-zinc-800 px-3 py-1.5 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-900">${plural(notes, 'note')} on ${esc(r.slug)} →</button>
  </div>`;
}

function mapSpecPanel(s) {
  const tracks = new Map();
  s.milestones.forEach((m) => tracks.set(m.repo || 'no repository', [...(tracks.get(m.repo || 'no repository') || []), m]));
  const pct = pctOf(s.tickets);
  return `<div class="space-y-5 p-5">
    ${mBack}
    <div>
      <p class="font-mono text-xs text-zinc-400">${esc(s.num)}</p>
      <h2 class="text-lg font-semibold leading-snug tracking-tight">${esc(s.title)}</h2>
      <div class="mt-3 flex items-center gap-3">${ring(pct, 44, 4, `<span class="text-[10px] font-semibold tabular-nums">${pct}%</span>`)}
        <div class="text-xs text-zinc-500"><span class="rounded-full px-2 py-0.5 font-medium ${STATUS[s.status].tone}">${STATUS[s.status].label}</span>
          <p class="mt-1.5">${doneOf(s.tickets)}/${plural(s.tickets.length, 'ticket')} done, across ${plural(s.repos.length, 'repository', 'repositories')}</p></div></div>
      ${s.summary ? `<p class="mt-3 text-sm text-zinc-600 dark:text-zinc-300">${esc(s.summary)}</p>` : ''}
    </div>
    ${s.waiting.length ? `<p class="rounded-lg bg-violet-50 px-3 py-2 text-xs text-violet-800 dark:bg-violet-950/50 dark:text-violet-300">Builds after ${s.waiting.map((d) => esc(d.id)).join(', ')}, not landed yet.</p>` : ''}
    ${[...tracks].map(([repo, ms]) => `<div>${mCaps(`<button data-map-pick="r:${esc(repo)}" class="font-mono normal-case tracking-normal hover:text-zinc-900 dark:hover:text-zinc-100">${esc(repo)} →</button>`)}${box(`<div class="divide-y divide-zinc-100 dark:divide-zinc-800/70">${ms.map((m) => msRow(s, m, false)).join('')}</div>`)}</div>`).join('')}
    ${!s.milestones.length ? `<p class="text-sm text-zinc-500">No tickets yet: <code class="font-mono">/write-tickets ${esc(s.num)}</code> cuts its tracks.</p>` : ''}
    <button data-map-spec="${esc(s.id)}" class="w-full rounded-md bg-zinc-900 px-3 py-1.5 text-sm text-white hover:opacity-90 dark:bg-zinc-100 dark:text-zinc-900">Open the spec →</button>
  </div>`;
}

function mapPanel() {
  const { specs, repos } = mapWork();
  const r = mv.sel?.startsWith('r:') && repos.find((x) => 'r:' + x.slug === mv.sel);
  const s = mv.sel?.startsWith('s:') && specs.find((x) => 's:' + x.id === mv.sel);
  if (mv.sel && !r && !s) mv.sel = null;
  const root = $('inspect');
  root.innerHTML = r ? repoPanel(r) : s ? mapSpecPanel(s) : mapOverview(specs, repos);
  root.querySelectorAll('[data-map-pick]').forEach((el) => (el.onclick = () => pickMap(el.dataset.mapPick)));
  root.querySelectorAll('[data-map-spec]').forEach((el) => (el.onclick = () => go(el.dataset.mapSpec)));
  root.querySelectorAll('[data-map-milestone]').forEach((el) => (el.onclick = () => {
    const [sid, mid] = el.dataset.mapMilestone.split('|');
    const spec = state.specs.find((x) => x.id === sid);
    const m = spec?.milestones.find((x) => x.id === mid);
    if (m) openMilestone(spec, m);
  }));
  root.querySelectorAll('[data-map-notes]').forEach((el) => (el.onclick = () => {
    nv.repo = el.dataset.mapNotes;
    store.set('noteRepo', nv.repo);
    goNotes();
  }));
  wireTicketRefs(root);
}

function renderMap() {
  const { specs, repos } = mapWork();
  document.querySelectorAll('#mapScope [data-scope]').forEach((b) => (b.className = 'px-3 py-1 rounded ' + (b.dataset.scope === mv.scope ? 'bg-zinc-100 dark:bg-zinc-800 font-medium' : 'text-zinc-500')));
  $('mapTickets').className = 'rounded-md border border-zinc-200 dark:border-zinc-800 px-2.5 py-1 ' + (mv.tickets ? 'bg-zinc-100 dark:bg-zinc-800 font-medium' : 'text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-900');
  $('mapTickets').setAttribute('aria-pressed', mv.tickets);
  const ms = specs.reduce((n, s) => n + s.milestones.length, 0), doing = repos.reduce((n, r) => n + r.doing.length, 0);
  $('mapStats').textContent = `${plural(specs.length, 'spec')} · ${plural(repos.length, 'repo')} · ${plural(ms, 'milestone')} · ${doing} building now`;
  drawMap();
  mapPanel();
}

// The Map section: built once per visit, then redrawn in place, so the map keeps its zoom across live reloads.
function mapView() {
  crumbs(null);
  sections();
  $('views').classList.add('hidden');
  $('side').className = 'hidden';
  $('inspect').className = `${PANEL} w-[360px] border-l bg-white dark:bg-zinc-950`;
  if (!$('map')) {
    $('main').innerHTML = `<div id="map" class="-mx-6 -my-6 flex h-[calc(100vh-3.5rem)] flex-col">
      <div class="flex flex-wrap items-center gap-2 border-b border-zinc-200 dark:border-zinc-800 px-4 py-2 text-sm">
        <span id="mapScope" class="inline-flex rounded-md border border-zinc-200 dark:border-zinc-800 p-0.5">
          <button data-scope="flight" class="px-3 py-1 rounded">In flight</button>
          <button data-scope="all" class="px-3 py-1 rounded">All specs</button>
        </span>
        <input id="mapSearch" type="search" placeholder="Find a spec, milestone or ticket" class="w-64 rounded-md border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 px-2.5 py-1 outline-none focus:border-emerald-500">
        <button id="mapTickets" class="rounded-md border border-zinc-200 dark:border-zinc-800 px-2.5 py-1" title="Show each milestone's tickets and their dependencies">Tickets</button>
        <button id="mapFit" class="rounded-md border border-zinc-200 dark:border-zinc-800 px-2.5 py-1 text-zinc-600 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-zinc-900" title="Fit the map to the window">Fit</button>
        <div id="mapStats" class="ml-auto font-mono text-xs text-zinc-500"></div>
      </div>
      <div class="relative min-h-0 flex-1">
        <div id="mapCanvas" class="dots absolute inset-0"></div>
        <div id="mapEmpty" class="hidden pointer-events-none absolute inset-0 grid place-items-center text-sm text-zinc-500">No repositories or specs yet. <code class="ml-1">/brain setup</code>&nbsp;registers the first repository.</div>
      </div>
    </div>`;
    mSvg = null;
    mSim?.stop();
    mSim = null;
    $('mapSearch').value = mv.query;
    $('mapSearch').oninput = (e) => { mv.query = e.target.value; mapMarks(); };
    $('mapSearch').onkeydown = (e) => {
      if (e.key !== 'Enter') return;
      const d = mNodes?.filter('.match').node()?.__data__;
      if (d) mSvg.transition().duration(500).call(mZoom.translateTo, d.x, d.y);
    };
    $('mapFit').onclick = () => { mUserZoom = false; fitMap(500); };
    $('mapTickets').onclick = () => {
      mv.tickets = !mv.tickets;
      store.set('mapTickets', mv.tickets ? '1' : '0');
      renderMap();
    };
    document.querySelectorAll('#mapScope [data-scope]').forEach((b) => (b.onclick = () => {
      mv.scope = b.dataset.scope;
      store.set('mapScope', mv.scope);
      mFitSlow = true;
      renderMap();
    }));
  }
  renderMap();
}

// ---------- wiring ----------

$('open').onclick = addRepo;
$('reload').onclick = refresh;
$('brand').onclick = () => goRepo(null);
document.querySelectorAll('#sections [data-section]').forEach((b) => (b.onclick = () => ({ notes: goNotes, map: goMap, timeline: goTimeline }[b.dataset.section] || (() => go(null)))()));
// A [[link]] in an open note, a linked note's chip, or a row of the notes list opens that note.
document.addEventListener('click', (e) => {
  const a = e.target.closest('#doc [data-note], #noteList [data-note], #timeline [data-note]');
  if (!a) return;
  e.preventDefault();
  focusNote(a.dataset.note);
});
window.addEventListener('hashchange', () => applyRoute());
document.addEventListener('keydown', (e) => {
  const box = $('search') || $('noteSearch') || $('mapSearch');
  if (e.key === '/' && box && document.activeElement !== box && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) {
    e.preventDefault();
    box.focus();
  }
  if (e.key === '[' && !$('side').classList.contains('hidden') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) toggleSide();
});
document.querySelectorAll('#views button').forEach((b) => (b.onclick = () => { state.view = b.dataset.view; store.set('view', state.view); render(); }));
$('close').onclick = closeDoc;
$('backdrop').onclick = closeDoc;
$('prev').onclick = () => stepTicket(-1);
$('next').onclick = () => stepTicket(1);
$('copyPath').onclick = async () => {
  try { await navigator.clipboard.writeText($('docPath').textContent); } catch { return; }
  $('copyPath').textContent = 'Copied';
  setTimeout(() => ($('copyPath').textContent = 'Copy path'), 1200);
};
$('zoom').onclick = closeZoom;
document.addEventListener('keydown', (e) => {
  if (zoomed()) { if (e.key === 'Escape') closeZoom(); return; }
  if (e.key === 'Escape') closeDoc();
  if (state.doc && !e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) stepTicket(e.key === 'ArrowLeft' ? -1 : 1);
});
// Coming back to the window also brings the graph back to the milestone work is on.
window.addEventListener('focus', async () => { await refresh(); scrollToCurrent(); });

restore();
</script>
</body>
</html>

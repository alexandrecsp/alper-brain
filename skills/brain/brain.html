    const top = `<div class="flex flex-wrap items-center gap-2 px-4 pb-2 pt-3">${ui.repoDot(slug)}<span class="mono text-[12.5px] font-medium">${esc(slug)}</span>
      ${repo.path ? `<span class="mono faint truncate text-[11px]">${esc(repo.path)}</span>` : ''}
      ${v.state === 'ok' ? `<span class="muted ml-auto text-[11.5px]">${v.head.branch ? `on <span class="mono">${esc(v.head.branch)}</span>` : 'detached HEAD'} · base <span class="mono">${esc(v.base || '—')}</span> · ${v.branches.length} branches</span>` : ''}</div>`;
    const note = v.note ? `<div class="mt-1 text-[11.5px]" style="color:color-mix(in srgb, var(--s-attention) 75%, white)">${esc(v.note)}</div>` : '';
    const ask = (text, sub, btn) => `${top}<div class="flex items-center gap-3 px-4 pb-3.5 text-[12.5px]"><div class="min-w-0 flex-1"><div class="muted">${text}</div>${sub}${note}</div>${btn}</div>`;
    if (v.state === 'ungranted') return ask(`Grant read access to this clone once: every spec that touches <b>${esc(slug)}</b> then reads it live.`,
      repo.path ? `<div class="faint mt-0.5 text-[11px]">Pick <span class="mono">${esc(repo.path)}</span>.</div>` : '<div class="faint mt-0.5 text-[11px]">Not linked on this machine: <span class="mono">/brain link</span> records where its clone is.</div>',
      `<button class="btn shrink-0 text-[12px]" data-clone-grant="${esc(slug)}">Grant access</button>`);
    if (v.state === 'unlinked') return ask(`No clone of <b>${esc(slug)}</b> is linked on this machine.`, '<div class="faint mt-0.5 text-[11px]"><span class="mono">/brain link</span> records where its clone is.</div>', '');
    if (v.state === 'denied') return ask('The browser needs your permission to read this clone again.', '', `<button class="btn shrink-0 text-[12px]" data-clone-reconnect="${esc(slug)}">Reconnect</button>`);
    if (v.state === 'error') return ask(`Could not read this clone: ${esc(v.err)}`, '', viaServer ? '' : `<button class="btn shrink-0 text-[12px]" data-clone-grant="${esc(slug)}">Pick another folder</button>`);
    if (v.state !== 'ok') return `${top}<div class="faint px-4 pb-3.5 text-[12px]">Reading its branches…</div>`;
    const list = v.listed.map((b) => `<div class="px-3 py-1" style="border-left:2px solid ${b.spec ? 'var(--accent)' : 'transparent'};${b.spec ? 'background:color-mix(in srgb, var(--accent) 6%, transparent)' : ''}">
        <div class="flex items-center gap-1.5 text-[12px]"><span class="mono min-w-0 truncate ${b.spec || b.head ? '' : 'muted'}" title="${esc(b.name)}">${esc(b.name)}</span><span class="flex shrink-0 items-center gap-1">${branchTags(b, s, slug, ui)}</span><span class="mono faint ml-auto shrink-0 text-[10.5px]">${agoMs(b.time)}</span></div>
        <div class="faint truncate text-[11px]">${esc(b.subject)}</div></div>`).join('');
    const what = v.fork ? `Forked from <span class="mono">${esc(v.base)}</span> at <span class="mono">${v.fork.sha.slice(0, 7)}</span>, ${agoMs(v.fork.time)} ago · ${v.running ? `<b style="color:color-mix(in srgb, var(--s-active) 80%, white)">${v.running} running beside it</b>` : 'nothing else running beside it'}`
      : bmode === 'explore' ? `${v.listed.length} branch${v.listed.length === 1 ? '' : 'es'} moved in the last ${bdays} days`
      : v.listed.some((b) => b.spec) ? `No base branch <span class="mono">${esc(v.base || '')}</span> here: the spec's branches alone` : 'No branch of this spec yet: the base, latest first';
    return `${top}<div class="faint px-4 pb-1.5 text-[11px]">${what}</div><div class="grid border-t hairline" style="grid-template-columns:minmax(230px,320px) minmax(0,1fr)">
      <div class="overflow-y-auto border-r py-1 hairline" style="max-height:${BOX}px">${list}</div>
      <div class="overflow-auto py-1" style="max-height:${BOX}px" data-gscroll="${esc(slug)}">${v.rows.length ? graph(v, ui) : `<div class="faint p-4 text-[12px]">No commits${bmode === 'explore' ? ` in the last ${bdays} days` : ''}.</div>`}</div></div>`;
  }

  // two repositories a page; Simple or Explore, and Explore's window, kept across visits
  const PER = 2, BOX = 250, PREF = 'brain-page:branches';
  let bpage = 0, bspec = null, { mode: bmode = 'simple', days: bdays = 7 } = (() => { try { return JSON.parse(localStorage.getItem(PREF)) || {}; } catch { return {}; } })();
  const seg = (attr, opts, cur) => `<div class="seg text-[11.5px]">${opts.map(([k, l]) => `<button ${attr}="${k}" class="${String(cur) === String(k) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const branchesBody = (s, ctx) => {
    const repos = reposOf(s, ctx.D), pages = Math.max(1, Math.ceil(repos.length / PER));
    if (bspec !== s.id) { bspec = s.id; bpage = 0; }
    bpage = Math.min(bpage, pages - 1);
    const visible = repos.slice(bpage * PER, bpage * PER + PER);
    Clones.watch(visible.map((repo) => ({ repo, spec: s.id, base: baseOf(s, repo.slug), mode: bmode, days: bdays })));
    const pager = pages > 1 ? `<div class="flex items-center gap-1.5 text-[11.5px]"><button class="btn px-2 py-0.5" data-bpage="-1" ${bpage ? '' : 'disabled style="opacity:.35"'}>‹</button><span class="mono muted">${bpage + 1}/${pages}</span><button class="btn px-2 py-0.5" data-bpage="1" ${bpage < pages - 1 ? '' : 'disabled style="opacity:.35"'}>›</button></div>` : '';
    const right = `<div class="flex flex-wrap items-center justify-end gap-2">${seg('data-bmode', [['simple', 'Simple'], ['explore', 'Explore']], bmode)}${bmode === 'explore' ? seg('data-bdays', [[7, '7d'], [15, '15d'], [30, '30d'], [60, '60d']], bdays) : ''}${pager}</div>`;
    const sub = `${repos.length} repositor${repos.length === 1 ? 'y' : 'ies'} · live · <span class="inline-flex items-center gap-1"><span class="inline-block h-2 w-2 rounded-full" style="background:var(--accent);box-shadow:0 0 4px var(--accent)"></span>this spec's commits</span>`;
    return `${ctx.ui.panelHead('Branches', sub, right)}
      <div class="mt-2">${visible.map((r, i) => `<div class="${i ? 'border-t hairline' : ''}">${repoBlock(r, s, ctx.ui)}</div>`).join('') || '<div class="faint px-4 pb-4 text-[12px]">This spec names no registered repository.</div>'}</div>`;
  };

  // redraws the panel alone, keeping each graph's scroll
  const redraw = () => {
    const el = document.getElementById('branches');
    if (!el || !shown) return;
    const scroll = new Map([...el.querySelectorAll('[data-gscroll]')].map((g) => [g.dataset.gscroll, [g.scrollTop, g.scrollLeft]]));
    el.innerHTML = branchesBody(shown.s, shown.ctx);
    el.querySelectorAll('[data-gscroll]').forEach((g) => { const p = scroll.get(g.dataset.gscroll); if (p) [g.scrollTop, g.scrollLeft] = p; });
  };
  window.addEventListener('clones-change', redraw);
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-clone-grant],[data-clone-reconnect],[data-bpage],[data-bmode],[data-bdays]');
    if (!t || !shown || t.disabled) return;
    if (t.dataset.bpage || t.dataset.bmode || t.dataset.bdays) {
      if (t.dataset.bpage) bpage += Number(t.dataset.bpage);
      if (t.dataset.bmode) bmode = t.dataset.bmode;
      if (t.dataset.bdays) bdays = Number(t.dataset.bdays);

  const screen = {
    render(el, ctx) {

      const unlocksOf = (s) => D.specs.filter((x) => x.deps.includes(s.id));

      // ====================================================== a spec's page

        shown = { s, ctx };
        const ms = s.milestones, all = tks(s), c = cnt(all), tracks = tracksOf(s), unlocks = unlocksOf(s);
        const byM = new Map(ms.map((m) => [m.id, m]));
        const needs = ms.filter((m) => m.status === 'attention' || m.status === 'blocked').length + c.blocked;

        // depth: one more than the deepest milestone it builds after, or than the one before it in its own track
        const prevOf = (m) => ms.filter((x) => x.track === m.track && x.num < m.num).pop();
        const depth = new Map();
        const dOf = (m, seen = new Set()) => {
          if (depth.has(m.id)) return depth.get(m.id);
          if (seen.has(m.id)) return 0;
          seen.add(m.id);
          const pre = [...m.buildsAfter.map((id) => byM.get(id)), prevOf(m)].filter(Boolean);
          const d = pre.length ? Math.max(...pre.map((p) => dOf(p, seen))) + 1 : 0;
          depth.set(m.id, d); return d;
        };
        ms.forEach((m) => dOf(m));
        const ncols = Math.max(0, ...depth.values()) + 1;
        const edges = ms.flatMap((m) => {
          const ex = m.buildsAfter.map((id) => byM.get(id)).filter(Boolean).map((p) => ({ from: p.id, to: m.id, c: color(p.status), w: 1.6, o: 0.7 }));
          const pv = prevOf(m);
          return pv && !m.buildsAfter.includes(pv.id) ? [...ex, { from: pv.id, to: m.id, c: color(pv.status), w: 1.2, o: 0.35 }] : ex;
        });

        const node = (m) => {
          const n = m.tickets.length, d = m.tickets.filter((t) => t.status === 'done').length;

            : `<span class="faint text-[10px]">no tickets yet</span>`;
          return `<div style="grid-column:${depth.get(m.id) + 2};grid-row:${tracks.indexOf(m.track) + 2};z-index:1;padding:8px 0 6px;align-self:center">
            <div class="flex flex-wrap items-center gap-[4px] px-3 pb-1.5" style="min-height:14px">${ports}</div>
            <div data-pill="${esc(m.id)}" data-sel="milestone|${esc(s.id + '|' + m.id)}" title="${esc(m.title)} · ${esc(m.phaseLabel || STATUS[m.status].label)}" class="clickable flex items-center gap-2 px-3.5"
              style="height:38px;border-radius:999px;border:1px solid ${picked ? 'var(--accent)' : mix(m.status, 45)};box-shadow:${picked ? '0 0 0 2px var(--accent-soft)' : 'none'};background:linear-gradient(90deg, ${mix(m.status, 24)}, var(--panel-2) 85%)">
              <span class="text-[13px]">${m.stage ? STAGE_ICON[m.stage] || '' : `<span class="inline-block h-2 w-2 rounded-full" style="background:${color(m.status)}"></span>`}</span>

            ${ms.length ? `<div class="overflow-x-auto px-4 pb-4 pt-3"><div id="pipe" style="position:relative;display:grid;grid-template-columns:150px repeat(${ncols},minmax(210px,1fr)) 14px;column-gap:44px;row-gap:10px;min-width:${150 + ncols * 254 + 58}px">
              ${heads}${lanes}<svg style="position:absolute;left:0;top:0;z-index:0;pointer-events:none;overflow:visible"></svg>${ms.map(node).join('')}</div></div>`
              : '<div class="faint px-4 py-8 text-center">No milestones yet.</div>'}
          </section>

            const x1 = a.r, y1 = a.y, x2 = b.l, y2 = b.y, xm = x2 - 22, dy = y2 - y1, dir = Math.sign(dy), r = Math.min(10, Math.abs(dy) / 2, Math.max(0, xm - x1) / 2);
            const d = Math.abs(dy) < 1 ? `M${x1} ${y1}H${x2}` : `M${x1} ${y1}H${xm - r}Q${xm} ${y1} ${xm} ${y1 + dir * r}V${y2 - dir * r}Q${xm} ${y2} ${xm + r} ${y2}H${x2}`;
            return `<path d="${d}" fill="none" stroke="${e.c}" stroke-width="${e.w}" stroke-opacity="${e.o}" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="2.5" fill="${e.c}" fill-opacity="${e.o}"/><circle cx="${x2}" cy="${y2}" r="3" fill="${e.c}" fill-opacity="${e.o}"/>`;

    },

      // a milestone is ready, not frontier, while something it follows is open: that is waiting
      const its = items.filter((it) => (mode === 'milestone' && k === 'waiting' ? statusOf(it) === 'ready' : mode === 'milestone' && k === 'frontier' ? statusOf(it) === 'frontier' : sts.includes(statusOf(it))));

      if (!its.length) body = `<div class="faint px-1 py-6 text-center text-[12px]">Nothing here</div>`;

      </section>`;
    };

    el.innerHTML = `${CSS}<div class="flex h-full flex-col px-6 pt-5">
      <div class="flex flex-wrap items-center gap-3 pb-3">
        <div><div class="eyebrow">Board</div><div class="mt-0.5 text-[18px] font-semibold tracking-tight">Delivery flow <span class="muted text-[13px] font-normal">${items.length} ${mode === 'spec' ? 'specs' : 'milestones'}</span></div></div>

      </div>

    </div>`;

    el.querySelectorAll('[data-bmode]').forEach((b) => { b.onclick = () => { mode = b.dataset.bmode; App.render(); }; });
    el.querySelector('[data-bgroup]').onclick = () => { group = !group; App.render(); };
  } });
})();

// Notes graph screen (#/notes), after Obsidian's graph view: a free force-directed layout of notes and links under four
// tunable forces (center, repel, link strength, link distance), so linked notes cluster by themselves and orphans drift
// to the rim. Notes are circles sized by link degree, coloured from the theme by repository ('shared' for shared notes) or by
// type; ghosts are dashed circles, cross-repository links dashed lines.
(function () {
  const ACCENT = 'var(--accent)', GREY = 'var(--muted)', GHOST = 'var(--muted)';
  const F = { cross: true, ghosts: true, labels: true, by: 'repo', center: 0.5, repel: 10, link: 0.5, dist: 60 };
  const FORCES = [['center', 'Center force', 0, 1, 0.01], ['repel', 'Repel force', 0, 20, 0.1], ['link', 'Link force', 0, 1, 0.01], ['dist', 'Link distance', 20, 400, 1]];
  // the toggles and forces are this viewer's preference, kept across visits
  const KEY = 'brain.notes-graph';
  try { const s = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k in F) if (k in s) F[k] = s[k]; } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(F)); } catch {} };

  let linkSel, nodeSel, labSel, coSel, byDeg = [], nodeById = new Map(), hover = null;
  // every node is a circle centred on its point, of radius h
  const circ = (g, h) => g.append('circle').attr('r', h);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cc = (slug) => (slug === 'shared' ? GREY : cur.repoColor(slug));
  const fillOf = (d) => (d.kind === 'ghost' ? GHOST : F.by === 'repo' ? cc(d.cluster) : typeCol(d.n.type));

  const CSS = `
    .np-root { position:absolute; inset:0; overflow:hidden; background-color:transparent; background-image:radial-gradient(color-mix(in srgb, var(--cool) 10%, transparent) 1px, transparent 1px); background-size:26px 26px; }
    .np-root svg { display:block; width:100%; height:100%; cursor:grab; } .np-root svg:active { cursor:grabbing; }
    .np-bar { position:absolute; top:14px; left:14px; right:14px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; pointer-events:none; }
    .np-bar > * { pointer-events:auto; }
    .np-tgls { display:flex; align-items:center; gap:14px; padding:7px 14px; }
    .np-tgl { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
    .np-tgl.on { color:var(--text); }
    .np-sw { width:24px; height:14px; border-radius:99px; background:var(--line-2); position:relative; transition:background .12s; }
    .np-sw i { position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:var(--muted); transition:transform .12s; }
    .np-tgl.on .np-sw { background:var(--accent); } .np-tgl.on .np-sw i { transform:translateX(10px); background:var(--bg); }
    .np-legend { position:absolute; left:14px; bottom:14px; width:230px; max-height:46%; display:flex; flex-direction:column; padding:10px 6px 8px 12px; }
    .np-legend .rows { overflow-y:auto; padding-right:6px; margin-top:6px; }
    .np-row { display:flex; align-items:center; gap:8px; padding:3px 6px; border-radius:7px; font-size:12px; }
    .np-row.click { cursor:pointer; } .np-row.click:hover { background:var(--hover); } .np-row.on { background:var(--accent-soft); }
    .np-forces { position:absolute; right:14px; bottom:64px; width:220px; padding:10px 12px 12px; }
    .np-forces label { display:block; margin-top:9px; color:var(--muted); font-size:12px; }
    .np-forces label b { float:right; font-weight:400; color:var(--faint); font-family:ui-monospace, monospace; font-size:11px; }
    .np-forces input { display:block; width:100%; margin-top:4px; accent-color:var(--accent-2); }
    .np-hint { position:absolute; right:18px; bottom:14px; width:260px; text-align:right; color:var(--faint); font-size:11px; line-height:1.5; pointer-events:none; }
    .np-lbl { pointer-events:none; paint-order:stroke; stroke:var(--bg); stroke-linejoin:round; font-family:var(--body); }
  `;

  function mkRoot() {
    root = document.createElement('div'); root.className = 'np-root';
    root.innerHTML = `<style>${CSS}</style>
      <div class="np-bar">
        <div class="panel np-tgls">${[['cross', 'Cross links'], ['ghosts', 'Ghosts'], ['labels', 'Labels']].map(([k, l]) => `<button class="np-tgl" data-tg="${k}"><span class="np-sw"><i></i></span>${l}</button>`).join('')}</div>
        <div class="seg text-[12px]"><button data-cb="repo">Repo</button><button data-cb="type">Type</button></div>
        <button class="btn text-[12px]" data-fit>Fit</button>
        <span class="mono faint text-[11px]" data-stats></span>
      </div>
      <div class="panel np-legend"></div>
      <div class="panel np-forces"><div class="eyebrow">Forces</div>${FORCES.map(([k, l, min, max, step]) => `<label>${l}<b data-fv="${k}"></b><input type="range" data-force="${k}" min="${min}" max="${max}" step="${step}" value="${F[k]}"></label>`).join('')}</div>
      <div class="np-hint">Click a node to focus it and see details. Drag to move, scroll to zoom, click empty space to reset.</div>`;
    svg = d3.select(root).insert('svg', ':first-child');
    zg = svg.append('g');
    // the focus callouts, in screen space over the zoomed graph
    coSel = svg.append('g').style('pointer-events', 'none');
    zoom = d3.zoom().scaleExtent([0.08, 6]).on('zoom', (e) => { zg.attr('transform', e.transform); placeLater(); });
    svg.call(zoom).on('dblclick.zoom', null).on('click', () => cur.select(null));
    root.addEventListener('click', (e) => {
      const t = e.target.closest('[data-tg],[data-cb],[data-fit]'); if (!t) return;
      if (t.dataset.tg) F[t.dataset.tg] = !F[t.dataset.tg];
      else if (t.dataset.cb) F.by = t.dataset.cb;
      else fit(true);
      save(); style(); legend();
    });

    root.addEventListener('input', (e) => {
      const k = e.target.dataset && e.target.dataset.force; if (!k) return;
      F[k] = +e.target.value; save(); tune(); sim.alpha(0.5).restart(); style();
    });
  }

  // the four forces, from the sliders. Link strength is divided by the lesser degree, as d3 does by default, so a note
  // with many springs does not shake.
  function tune() {
    sim.force('link').distance(F.dist).strength((l) => Math.min(1, (2 * F.link) / Math.max(1, Math.min(l.source.deg, l.target.deg))));
    sim.force('charge').strength(-F.repel * 12);

  }

  function build(D) {
    if (sim) sim.stop();
    zg.selectAll('*').remove();
    const clusterOf = (n) => (n.shared ? 'shared' : n.repos[0] || 'shared');
    const byId = new Map();
    const prev = new Map(nodes.map((d) => [d.id, [d.x, d.y]]));
    nodes = []; links = []; nbr = new Map();
    D.notes.forEach((n) => { const d = { id: n.id, kind: 'note', cluster: clusterOf(n), n, deg: 0 }; byId.set(d.id, d); nodes.push(d); });
    D.ghosts.forEach((g) => { const d = { id: g, kind: 'ghost', votes: {}, deg: 0 }; byId.set(g, d); nodes.push(d); });
    const seen = new Set(), pairs = [];
    D.notes.forEach((n) => n.links.forEach((l) => {
      const a = byId.get(n.id), b = byId.get(l); if (!b || a === b) return;
      const k = [a.id, b.id].sort().join('|'); if (seen.has(k)) return; seen.add(k); pairs.push([a, b]);
      if (b.kind === 'ghost') b.votes[a.cluster] = (b.votes[a.cluster] || 0) + 1;
    }));
    nodes.filter((d) => d.kind === 'ghost').forEach((d) => { d.cluster = Object.entries(d.votes).sort((x, y) => y[1] - x[1])[0]?.[0] || 'shared'; });
    crossCount = 0;
    pairs.forEach(([a, b]) => { a.deg++; b.deg++; const kind = a.cluster === b.cluster ? 'intra' : 'cross'; if (kind === 'cross') crossCount++; links.push({ source: a.id, target: b.id, kind }); });
    nodes.forEach((d) => { d.r = d.kind === 'ghost' ? Math.min(8, 4 + Math.sqrt(d.deg) * 0.8) : Math.min(11, 3.5 + Math.sqrt(d.deg) * 1.7); });

    // the legend's repositories, largest first
    repos = [...d3.rollup(nodes, (v) => v.filter((d) => d.kind === 'note').length, (d) => d.cluster)].map(([slug, count]) => ({ slug, count })).sort((a, b) => b.count - a.count);
    // a reload keeps each note where it was; new notes start on d3's phyllotaxis spiral
    nodes.forEach((d) => {
      const p = prev.get(d.id); if (p) [d.x, d.y] = p;
      // a note named after its repository ('shop-checkout' in shop) is labelled without the prefix colour already gives;
      // the full name stays in the tooltip and the panel
      const pre = d.cluster + '-', s = d.id.startsWith(pre) && d.id.length > pre.length ? d.id.slice(pre.length) : d.id;
      d.label = s.length > 28 ? s.slice(0, 27) + '…' : s;

    byDeg = nodes.slice().sort((a, b) => b.deg - a.deg);
    nodeById = byId;
    links.forEach((l) => { for (const [a, b] of [[l.source, l.target], [l.target, l.source]]) { if (!nbr.has(a)) nbr.set(a, new Set()); nbr.get(a).add(b); } });
    const types = [...new Set(D.notes.map((n) => n.type))].sort();
    typeCol = (t) => Theme.color(Math.max(0, types.indexOf(t)));
    typeCount = d3.rollup(D.notes, (v) => v.length, (n) => n.type);

      .force('charge', d3.forceManyBody().distanceMax(900))

      .attr('stroke-dasharray', (l) => (l.kind === 'cross' ? '2 4' : null)).attr('stroke-width', 1);
    nodeSel = zg.append('g').selectAll('g').data(nodes).join('g').style('cursor', 'pointer')
      .on('mouseenter', (e, d) => { hover = d.id; style(); }).on('mouseleave', () => { hover = null; style(); })
      .on('click', (e, d) => { e.stopPropagation(); cur.select(d.kind === 'ghost' ? 'ghost' : 'note', d.id); })
      .call(d3.drag()
        .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
        .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
        .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; }));

      if (d.kind === 'ghost') circ(g, h + 3.5).attr('fill', 'none').style('stroke', 'var(--muted)').attr('stroke-width', 1).attr('stroke-dasharray', '2 2.5');
      if (d.n && (d.n.draft || d.n.pending)) circ(g, h + 2).attr('fill', 'none').style('stroke', 'var(--text)').attr('stroke-width', 1).attr('stroke-dasharray', '3 2');
      circ(g, h).attr('class', 'dot').attr('fill-opacity', d.kind === 'ghost' ? 0.55 : 0.9);
      g.append('title').text(d.kind === 'ghost' ? `${d.id} (not written yet)` : `${d.id} (${d.n.type})${d.n.description ? ': ' + d.n.description : ''}`);
    });
    labSel = zg.append('g').style('pointer-events', 'none').selectAll('text').data(nodes).join('text').attr('class', 'np-lbl').attr('text-anchor', 'middle')
      .attr('font-style', (d) => (d.kind === 'ghost' ? 'italic' : null))
      .text((d) => d.label);

  }

  function fit(animate) {
    const vis = nodes.filter((d) => d.kind !== 'ghost' || F.ghosts); if (!vis.length) return;
    const x0 = d3.min(vis, (d) => d.x - d.r - 30), x1 = d3.max(vis, (d) => d.x + d.r + 30), y0 = d3.min(vis, (d) => d.y - d.r - 30), y1 = d3.max(vis, (d) => d.y + d.r + 30);
    const w = root.clientWidth || 1000, h = root.clientHeight || 700, k = Math.min(w / (x1 - x0), h / (y1 - y0), 2) * 0.92;
    const t = d3.zoomIdentity.translate(w / 2 - ((x0 + x1) / 2) * k, h / 2 - ((y0 + y1) / 2) * k).scale(k);
    (animate ? svg.transition().duration(500) : svg).call(zoom.transform, t);
  }

  function draw() {
    linkSel.attr('x1', (l) => l.source.x).attr('y1', (l) => l.source.y).attr('x2', (l) => l.target.x).attr('y2', (l) => l.target.y);
    nodeSel.attr('transform', (d) => `translate(${d.x},${d.y})`);

  }

  function selId() { const s = cur.sel; return s && (s.kind === 'note' || s.kind === 'ghost') ? s.id : null; }

  function style() {
    const q = cur.q, sel = selId(), focus = hover || sel, fset = focus && nbr.get(focus) ? new Set([focus, ...nbr.get(focus)]) : null;
    const match = q ? (d) => (d.id + ' ' + (d.n ? d.n.description + ' ' + d.n.type : '')).toLowerCase().includes(q) : null;
    nodeSel.style('display', (d) => (d.kind === 'ghost' && !F.ghosts ? 'none' : null)).attr('opacity', (d) => {

    nodeSel.select('.dot').style('fill', fillOf);
    nodeSel.select('.ring').style('display', (d) => (d.id === sel || d.id === hover || (match && match(d)) ? null : 'none'))
      .style('stroke', (d) => (d.id === sel ? ACCENT : d.id === hover ? 'var(--text)' : 'var(--accent-2)'));
    linkSel.style('display', (l) => ((l.kind === 'cross' && !F.cross) || (!F.ghosts && (l.source.kind === 'ghost' || l.target.kind === 'ghost')) ? 'none' : null))
      .style('stroke', (l) => (focus && (l.source.id === focus || l.target.id === focus) ? 'var(--accent-2)' : 'var(--muted)'))
      .attr('stroke-opacity', (l) => {
        let o = l.kind === 'intra' ? 0.3 : 0.2;
        if (cur.repo && l.source.cluster !== cur.repo && l.target.cluster !== cur.repo) o *= 0.15;
        if (focus) o = l.source.id === focus || l.target.id === focus ? 0.9 : 0.03;
        return o;
      });
    root.querySelectorAll('[data-tg]').forEach((b) => b.classList.toggle('on', F[b.dataset.tg]));
    root.querySelectorAll('[data-fv]').forEach((b) => { b.textContent = F[b.dataset.fv]; });
    root.querySelectorAll('[data-cb]').forEach((b) => b.classList.toggle('on', F.by === b.dataset.cb));
    root.querySelector('[data-stats]').textContent = `${cur.D.notes.length} notes · ${cur.D.ghosts.length} ghosts · ${repos.length} repositories`;
    styleLabels(fset, match, sel);
  }

  // Labels are placed in screen space, once per frame at most, and never overlap. With a note in focus (hovered or
  // selected) only its own label sits on the graph; its neighbours' names go to callouts at the side (see callouts).
  // Otherwise search matches are offered first, then every note most-linked first, each shown only where it overlaps no
  // label already placed, so zooming in reveals more names. Plain labels are smaller and dimmer than pinned ones, and
  // fade in with the zoom.
  let last = [null, null, null], raf = 0;
  function styleLabels(fset, match, sel) { last = [fset, match, sel]; placeLater(); }
  function placeLater() { if (!raf) raf = requestAnimationFrame(place); }
  function place() {
    raf = 0;
    const [fset, match, sel] = last, t = d3.zoomTransform(svg.node()), k = t.k, W = root.clientWidth, H = root.clientHeight;
    const vis = (d) => d.kind !== 'ghost' || F.ghosts;
    const fd = nodeById.get(hover || sel), fdOn = fd && vis(fd) ? fd : null;
    // names start to appear at 60% zoom and are fully faded in by 120%
    const fade = Math.max(0, Math.min(1, (k - 0.6) / 0.6));
    // a grid of 80px cells, each holding the boxes that touch it
    const C = 80, grid = new Map(), cells = (b, f) => { for (let i = Math.floor(b[0] / C); i <= Math.floor(b[2] / C); i++) for (let j = Math.floor(b[1] / C); j <= Math.floor(b[3] / C); j++) f(i + ',' + j); };
    const hits = (b) => { let hit = false; cells(b, (c) => { if (!hit) hit = (grid.get(c) || []).some((o) => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]); }); return hit; };
    const add = (b) => cells(b, (c) => { if (!grid.has(c)) grid.set(c, []); grid.get(c).push(b); });
    const shown = new Map();
    const put = (d, pin, force) => {
      const fs = pin ? 11.5 : 10, w = d.label.length * fs * 0.56 + 6, sx = t.applyX(d.x), base = t.applyY(d.y) + d.r * k + 3 + fs * 0.8;
      const b = [sx - w / 2, base - fs * 0.8 - 2, sx + w / 2, base + fs * 0.25 + 2];
      if (b[2] < 0 || b[0] > W || b[3] < 0 || b[1] > H) return;
      if (!force && hits(b)) return;
      add(b); shown.set(d, { pin, fs, base });
    };
    if (fdOn) put(fdOn, true, true);
    const inCallout = (d) => fdOn && fset && fset.has(d.id);
    if (match) byDeg.forEach((d) => { if (!shown.has(d) && vis(d) && match(d) && !inCallout(d)) put(d, true, false); });
    if (F.labels && fade && !fdOn) byDeg.forEach((d) => { if (!shown.has(d) && vis(d) && !(cur.repo && d.cluster !== cur.repo) && !(match && !match(d))) put(d, false, false); });
    callouts(fdOn && fset ? [...fset].map((id) => nodeById.get(id)).filter((d) => d !== fdOn && vis(d)) : [], fdOn, t, W, H);
    labSel.style('display', (d) => (shown.has(d) ? null : 'none'));
    labSel.filter((d) => shown.has(d)).each(function (d) {
      const { pin, fs, base } = shown.get(d);
      d3.select(this).attr('x', d.x).attr('y', t.invertY(base)).attr('font-size', fs / k).attr('stroke-width', 2.5 / k)
        .attr('font-weight', pin ? 500 : 400).style('fill', pin ? 'var(--text)' : 'var(--muted)').attr('opacity', pin ? 1 : 0.9 * fade);
    });
  }

  // The focused note's neighbours, named in a column on each side of it: neighbours right of the note go to the right
  // column, the rest to the left. Each name is joined to its note by a leader that leaves the note at 45° and runs
  // horizontally into the column. Rows keep the notes' top-to-bottom order, as near each note's height as 21px spacing
  // allows; a column too tall for the screen keeps its most-linked notes and ends on "+N more". Drawn in screen space.
  function callouts(ns, fd, t, W, H) {
    const ROW = 21, GAP = 34, PAD = 8, items = [];
    if (fd) {
      const fx = t.applyX(fd.x), fr = fd.r * t.k;
      for (const side of [1, -1]) {
        let list = ns.map((d) => ({ d, x: t.applyX(d.x), y: t.applyY(d.y), r: d.r * t.k }))
          .filter((o) => (side === 1 ? o.x >= fx : o.x < fx) && o.x > -60 && o.x < W + 60 && o.y > -60 && o.y < H + 60);
        if (!list.length) continue;
        const cap = Math.max(2, Math.floor((H - 24) / ROW));
        let more = 0;
        if (list.length > cap) { list.sort((a, b) => b.d.deg - a.d.deg); more = list.length - (cap - 1); list = list.slice(0, cap - 1); }
        list.sort((a, b) => a.y - b.y);
        // stack downward, re-centre the block on the notes, stack again, then keep the block on screen
        let prev = -Infinity;
        list.forEach((o) => { o.ly = Math.max(o.y, prev + ROW); prev = o.ly; });
        const shift = d3.mean(list, (o) => o.ly - o.y);
        prev = -Infinity;
        list.forEach((o) => { o.ly = Math.max(12, o.ly - shift, prev + ROW); prev = o.ly; });
        let next = H - 12 - (more ? ROW : 0);
        for (let i = list.length - 1; i >= 0; i--) { list[i].ly = Math.min(list[i].ly, next); next = list[i].ly - ROW; }
        // the column sits past every elbow and past the focused note, so each leader reaches it with a 45° run then a flat one
        const elbow = (o) => o.x + side * (o.r + Math.abs(o.ly - o.y));
        const col = side === 1 ? Math.max(fx + fr, d3.max(list, elbow)) + GAP : Math.min(fx - fr, d3.min(list, elbow)) - GAP;
        list.forEach((o) => items.push({ key: o.d.id, side, path: `M${o.x + side * o.r},${o.y}L${elbow(o)},${o.ly}H${col}`, x: col + side * PAD, y: o.ly, text: o.d.label, ghost: o.d.kind === 'ghost' }));
        if (more) items.push({ key: 'more' + side, side, path: null, x: col + side * PAD, y: list.at(-1).ly + ROW, text: `+${more} more`, more: true });
      }
    }
    const g = coSel.selectAll('g').data(items, (i) => i.key).join((en) => { const g = en.append('g'); g.append('path'); g.append('text').attr('class', 'np-lbl'); return g; });
    g.select('path').attr('d', (i) => i.path).attr('fill', 'none').style('stroke', 'var(--muted)').attr('stroke-width', 1).attr('stroke-opacity', 0.75);
    g.select('text').attr('x', (i) => i.x).attr('y', (i) => i.y).attr('dy', '0.35em').attr('text-anchor', (i) => (i.side === 1 ? 'start' : 'end'))
      .attr('font-size', 11).attr('stroke-width', 2.5).attr('font-style', (i) => (i.ghost ? 'italic' : null))
      .style('fill', (i) => (i.more ? 'var(--muted)' : 'var(--text)')).text((i) => i.text);
  }

  function legend() {
    const D = cur.D, el = root.querySelector('.np-legend');
    const rows = F.by === 'repo'
      ? repos.map((c) => `<div class="np-row click ${cur.repo === c.slug ? 'on' : ''}" ${c.slug === 'shared' ? '' : `data-repo="${esc(c.slug)}"`}><span class="inline-block h-2.5 w-2.5 shrink-0 rounded-full" style="background:${cc(c.slug)}"></span><span class="truncate">${esc(c.slug)}</span><span class="mono faint ml-auto text-[11px]">${c.count}</span></div>`)
      : [...typeCount].sort((a, b) => b[1] - a[1]).map(([t, n]) => `<div class="np-row"><span class="inline-block h-2.5 w-2.5 shrink-0 rounded-full" style="background:${typeCol(t)}"></span><span class="truncate">${esc(t)}</span><span class="mono faint ml-auto text-[11px]">${n}</span></div>`);
    el.innerHTML = `<div class="flex items-center pr-2"><span class="eyebrow">${F.by === 'repo' ? 'Repositories' : 'Note types'}</span><span class="mono faint ml-auto text-[11px]">${D.notes.length}</span></div>
      <div class="rows">${rows.join('')}</div>
      <div class="mt-2 space-y-1 border-t pr-2 pt-2 text-[11.5px] hairline">
        <div class="flex items-center gap-2 muted"><svg width="14" height="14" style="width:14px;height:14px;flex:none"><circle cx="7" cy="7" r="5" fill="none" style="stroke:var(--muted)" stroke-dasharray="2 2.5"/></svg>Ghost, not written yet<span class="mono faint ml-auto">${D.ghosts.length}</span></div>
        <div class="flex items-center gap-2 muted"><svg width="14" height="14" style="width:14px;height:14px;flex:none"><path d="M1 12L13 2" stroke="var(--muted)" stroke-dasharray="2 3"/></svg>Cross-repository link<span class="mono faint ml-auto">${crossCount}</span></div>
        <div class="flex items-center gap-2 muted"><svg width="14" height="14" style="width:14px;height:14px;flex:none"><circle cx="7" cy="7" r="5.5" fill="none" style="stroke:var(--text)" stroke-dasharray="3 2"/></svg>Draft, not shared yet<span class="mono faint ml-auto">${D.notes.filter((n) => n.draft || n.pending).length}</span></div>
      </div>`;
  }

  App.register('notes', {
    render(el, ctx) {
      cur = ctx;
      el.style.overflow = 'hidden'; el.style.position = 'relative'; el.style.padding = '0';
      if (!root) mkRoot();
      if (root.parentNode !== el) el.replaceChildren(root);
      if (built !== ctx.D) { built = ctx.D; hover = null; build(ctx.D); }
      legend(); style();
    },
  });
})();

// Activity screen of the brain redesign: a commit heat calendar (weeks x weekdays) over the brain's
// timeline, an author filter, and the commits grouped by day with the notes each one changed.
(function () {
  let author = null, day = null;
  const ACTION = { recorded: '--s-done', updated: '--s-ready', superseded: '--s-active', deleted: '--s-blocked', moved: '--s-waiting' };
  App.register('activity', {
    render(el, ctx) {
      const { ui } = ctx, esc = ui.esc;
      const all = ctx.D.timeline.commits.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
      if (!all.length) { el.innerHTML = '<div class="mx-auto max-w-[1500px] p-5"><div class="text-[22px]">Activity</div><div class="muted mt-2">' + (viaServer ? 'No note of this brain has been committed yet: its history shows here once one is.' : 'The folder access has no history to show. Start the server with <span class="mono">/brain view</span> to see the activity.') + '</div></div>'; return; }
      const authors = [...new Set(all.map((c) => c.author))], drafts = ctx.D.notes.filter((n) => n.draft || n.pending);
      const commits = all.filter((c) => (!author || c.author === author) && (!ctx.repo || c.changes.some((ch) => (ch.repos || []).includes(ctx.repo))) && (!ctx.q || (c.title + ' ' + c.changes.map((x) => x.note).join(' ')).toLowerCase().includes(ctx.q)));
      const dayOf = (c) => c.date.slice(0, 10);
      const byDay = d3.rollup(commits, (v) => v.length, dayOf);
      // the calendar: from the Monday on or before the first commit to today's week
      const first = new Date(all.at(-1).date.slice(0, 10) + 'T00:00:00Z'); first.setUTCDate(first.getUTCDate() - ((first.getUTCDay() + 6) % 7));
      const last = new Date(all[0].date.slice(0, 10) + 'T00:00:00Z');
      const weeks = []; for (let d = new Date(first); d <= last; d.setUTCDate(d.getUTCDate() + 7)) weeks.push(new Date(d));
      const max = Math.max(1, ...byDay.values());
      const tone = (n) => (n ? `color-mix(in srgb, var(--accent) ${25 + (n / max) * 75}%, var(--panel-2))` : 'var(--panel-2)');
      const cal = `<div class="flex gap-[3px]">${weeks.map((w) => `<div class="flex flex-col gap-[3px]">${[0, 1, 2, 3, 4, 5, 6].map((i) => { const d = new Date(w); d.setUTCDate(d.getUTCDate() + i); const k = d.toISOString().slice(0, 10), n = byDay.get(k) || 0; return `<span data-day="${k}" title="${k} · ${n} commits" class="cell cursor-pointer" style="width:13px;height:13px;background:${tone(n)};${day === k ? 'outline:1.5px solid var(--text);outline-offset:1px' : ''}"></span>`; }).join('')}</div>`).join('')}</div>`;
      const shown = day ? commits.filter((c) => dayOf(c) === day) : commits.slice(0, 60);
      const groups = d3.groups(shown, dayOf);
      const changes = commits.flatMap((c) => c.changes), count = (a) => changes.filter((x) => x.action === a).length;
      el.innerHTML = `<div class="mx-auto max-w-[1500px] space-y-4 p-5">
        <div class="flex items-end gap-3"><div><div class="text-[20px] font-semibold tracking-tight">Activity</div><div class="muted mt-0.5">${commits.length} commits to the brain's notes${ctx.repo ? ' touching ' + esc(ctx.repo) : ''}</div></div>
          <div class="seg ml-auto text-[12px]"><button data-author="" class="${!author ? 'on' : ''}">Everyone</button>${authors.map((a) => `<button data-author="${esc(a)}" class="${author === a ? 'on' : ''}">${esc(a)}</button>`).join('')}</div></div>
        <div class="grid grid-cols-4 gap-3">${ui.kpi('Commits', commits.length, `${authors.length} authors`)}${ui.kpi('Recorded', count('recorded'), 'new notes', 'done')}${ui.kpi('Updated', count('updated'), 'notes changed', 'ready')}${ui.kpi('Superseded', count('superseded') + count('deleted'), 'retired', 'active')}</div>
        <div class="panel">${ui.panelHead('Commit calendar', 'one square per day', day ? `<button data-day="" class="btn py-0.5 text-[12px]">Clear ${esc(day)} ✕</button>` : '')}
          <div class="flex items-start gap-3 overflow-x-auto px-4 pb-4 pt-3"><div class="faint mono flex flex-col gap-[3px] pt-px text-[9.5px] leading-[13px]">${['Mon', '', 'Wed', '', 'Fri', '', 'Sun'].map((d) => `<span>${d}&nbsp;</span>`).join('')}</div>${cal}</div></div>
        ${drafts.length ? `<div class="panel">${ui.panelHead('Not shared yet', `${drafts.length} draft${drafts.length === 1 ? '' : 's'} on this machine`, ui.copyBtn('/brain sync', 'Share them'))}
          <div class="flex flex-wrap gap-1.5 px-4 pb-4 pt-3">${drafts.map((n) => `<span class="chip clickable" data-sel="note|${esc(n.id)}" style="background:var(--panel-2)">${(n.repos || []).slice(0, 1).map(ui.repoDot).join('')}${esc(n.id)}<span class="faint">${esc(n.draft ? 'new' : 'changes ' + n.pending)}</span></span>`).join('')}</div></div>` : ''}
        <div class="panel">${ui.panelHead(day ? 'Commits on ' + day : 'Latest commits', day ? '' : `the last ${shown.length}`)}
          <div class="px-4 pb-3 pt-2">${groups.map(([d, cs]) => `<div class="eyebrow mt-3 mb-1.5">${new Date(d + 'T00:00:00Z').toLocaleDateString('en', { weekday: 'long', month: 'short', day: 'numeric', timeZone: 'UTC' })}</div>
            ${cs.map((c) => `<div class="flex items-start gap-3 border-b py-2.5 hairline last:border-0">
              <span class="mt-0.5 grid h-7 w-7 shrink-0 place-items-center rounded-full text-[11px] font-semibold text-white" style="background:hsl(${[...c.author].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) % 360, 0)} 45% 42%)">${esc(c.author[0])}</span>
              <div class="min-w-0 flex-1"><div class="flex items-baseline gap-2"><span class="truncate font-medium">${esc(c.title)}</span><span class="mono faint ml-auto text-[11px]">${esc(c.sha)}</span></div>
                <div class="mt-1 flex flex-wrap gap-1">${c.changes.map((ch) => `<span class="chip clickable" data-sel="note|${esc(ch.note)}" style="background:var(--panel-2)"><span class="h-1.5 w-1.5 rounded-full" style="background:var(${ACTION[ch.action] || '--s-draft'})"></span>${(ch.repos || []).slice(0, 1).map(ui.repoDot).join('')}${esc(ch.note)}</span>`).join('')}</div></div></div>`).join('')}`).join('')}</div></div>
      </div>`;
      el.querySelectorAll('[data-author]').forEach((b) => (b.onclick = () => { author = b.dataset.author || null; App.render(); }));
      el.querySelectorAll('[data-day]').forEach((b) => (b.onclick = () => { day = b.dataset.day && b.dataset.day !== day ? b.dataset.day : null; App.render(); }));
    },
  });
})();

</script>

<script>
// ============================================================ GIT READER
// Reads a clone's .git through a directory handle, with no git binary: HEAD, the branches (loose and packed refs, local
// and remote-tracking), and commits from loose objects or packs (idx v2, offset and ref deltas). GitRead.open(root)
// gives a repo; GitRead.layout(commits) places commits in lanes, as git log --graph does. Commits never change, so a
// repo keeps every one it parsed. skills/brain/scripts/git-read.test.mjs runs this block in Node against real clones.
const GitRead = (function () {
  const dec = new TextDecoder();
  const hex = (b, o = 0) => { let s = ''; for (let i = 0; i < 20; i++) s += b[o + i].toString(16).padStart(2, '0'); return s; };
  const inflate = async (u8) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
  const sub = async (d, names) => { for (const n of names) d = await d.getDirectoryHandle(n); return d; };
  const file = async (d, path) => { const p = path.split('/'); return (await (await sub(d, p.slice(0, -1))).getFileHandle(p.at(-1))).getFile(); };
  const textOf = async (d, path) => { try { return await (await file(d, path)).text(); } catch { return null; } };
  async function walk(d, prefix, out) {
    for await (const [name, h] of d.entries()) {
      if (h.kind === 'directory') await walk(h, prefix + name + '/', out);
      else out.push([prefix + name, (await (await h.getFile()).text()).trim()]);
    }
  }

  // A pack's idx v2: find(sha) gives the object's offset in the pack, end(offset) where its entry stops (the next
  // entry's start), so each zlib stream is sliced exactly.
  async function readIdx(idx, pack) {
    const b = new Uint8Array(await idx.arrayBuffer()), v = new DataView(b.buffer);
    if (v.getUint32(0) !== 0xff744f63 || v.getUint32(4) !== 2) return null;
    const n = v.getUint32(8 + 255 * 4), shaAt = 8 + 1024, offAt = shaAt + n * 24, bigAt = offAt + n * 4;
    const fan = (i) => (i < 0 ? 0 : v.getUint32(8 + i * 4));
    const off = (i) => { const o = v.getUint32(offAt + i * 4); return o & 0x80000000 ? Number(v.getBigUint64(bigAt + (o & 0x7fffffff) * 8)) : o; };
    const offs = Float64Array.from({ length: n }, (_, i) => off(i)).sort();
    return {
      pack, cache: new Map(),
      find(sha) {
        const first = parseInt(sha.slice(0, 2), 16); let lo = fan(first - 1), hi = fan(first) - 1;
        while (lo <= hi) { const mid = (lo + hi) >> 1, h = hex(b, shaAt + mid * 20); if (h === sha) return off(mid); if (h < sha) lo = mid + 1; else hi = mid - 1; }
        return -1;
      },
      end(o) { let lo = 0, hi = n - 1; while (lo < hi) { const mid = (lo + hi) >> 1; if (offs[mid] <= o) lo = mid + 1; else hi = mid; } return offs[lo] > o ? offs[lo] : pack.size - 20; },
    };
  }

  // a git delta: copy runs of the base and inserted bytes, after the base's and the result's sizes
  function patch(base, d) {
    let i = 0;
    const size = () => { let r = 0, s = 0, c; do { c = d[i++]; r += (c & 0x7f) * 2 ** s; s += 7; } while (c & 0x80); return r; };
    size();
    const out = new Uint8Array(size()); let o = 0;
    while (i < d.length) {
      const c = d[i++];
      if (c & 0x80) {
        let at = 0, len = 0;
        for (let k = 0; k < 4; k++) if (c & (1 << k)) at += d[i++] * 2 ** (8 * k);
        for (let k = 0; k < 3; k++) if (c & (0x10 << k)) len += d[i++] * 2 ** (8 * k);
        len = len || 0x10000; out.set(base.subarray(at, at + len), o); o += len;
      } else { out.set(d.subarray(i, i + c), o); i += c; o += c; }
    }
    return out;
  }

  const TYPES = [null, 'commit', 'tree', 'blob', 'tag'];
  async function open(root) {
    let git;
    try { git = await root.getDirectoryHandle('.git'); } catch {
      // a .git file is a worktree's or a submodule's pointer to a git folder elsewhere, which this handle cannot reach
      try { await root.getFileHandle('.git'); } catch { throw new Error('no-git'); }
      throw new Error('worktree');
    }
    let reftable = false;
    try { await git.getDirectoryHandle('reftable'); reftable = true; } catch {}
    if (reftable) throw new Error('reftable');

    const commits = new Map(), idxs = new Map();
    let packs = null;
    const listPacks = async () => {
      if (packs) return packs;
      const out = [];
      try {
        const d = await sub(git, ['objects', 'pack']);
        for await (const [name, h] of d.entries()) {
          if (!name.endsWith('.idx')) continue;
          const pack = await (await d.getFileHandle(name.slice(0, -4) + '.pack')).getFile(), key = `${name}:${pack.size}:${pack.lastModified}`;
          if (!idxs.has(key)) idxs.set(key, await readIdx(await h.getFile(), pack));
          if (idxs.get(key)) out.push(idxs.get(key));
        }
      } catch {}
      return (packs = out);
    };
    async function packed(p, o) {
      if (p.cache.has(o)) return p.cache.get(o);
      const u = new Uint8Array(await p.pack.slice(o, p.end(o)).arrayBuffer());
      let i = 0, c = u[i++];
      const type = (c >> 4) & 7;
      while (c & 0x80) c = u[i++];
      let obj;
      if (type === 6) {
        c = u[i++]; let rel = c & 0x7f;
        while (c & 0x80) { c = u[i++]; rel = (rel + 1) * 128 + (c & 0x7f); }
        const base = await packed(p, o - rel);
        obj = base && { type: base.type, body: patch(base.body, await inflate(u.subarray(i))) };
      } else if (type === 7) {
        const base = await object(hex(u, i));
        obj = base && { type: base.type, body: patch(base.body, await inflate(u.subarray(i + 20))) };
      } else obj = { type: TYPES[type], body: await inflate(u.subarray(i)) };
      if (p.cache.size > 4000) p.cache.clear();
      p.cache.set(o, obj);
      return obj;
    }
    async function object(sha) {
      try {
        const u = await inflate(new Uint8Array(await (await file(git, `objects/${sha.slice(0, 2)}/${sha.slice(2)}`)).arrayBuffer()));
        const z = u.indexOf(0);
        return { type: dec.decode(u.subarray(0, z)).split(' ')[0], body: u.subarray(z + 1) };
      } catch {}
      for (const p of await listPacks()) { const o = p.find(sha); if (o >= 0) return packed(p, o); }
      return null;
    }

    const repo = {
      // HEAD and every branch; sig changes whenever any of them moves, so a caller re-reads only then
      async refs() {
        const head = ((await textOf(git, 'HEAD')) || '').trim(), packedRefs = (await textOf(git, 'packed-refs')) || '', loose = [];
        for (const top of ['heads', 'remotes']) { try { await walk(await sub(git, ['refs', top]), `refs/${top}/`, loose); } catch {} }
        const all = new Map();
        for (const l of packedRefs.split('\n')) { const m = /^([0-9a-f]{40}) (refs\/(?:heads|remotes)\/\S+)$/.exec(l.trim()); if (m) all.set(m[2], m[1]); }
        for (const [ref, v] of loose) if (/^[0-9a-f]{40}$/.test(v)) all.set(ref, v);
        const ref = head.startsWith('ref: ') ? head.slice(5).trim() : null;
        return {
          head: { ref, branch: ref && ref.startsWith('refs/heads/') ? ref.slice(11) : null, sha: ref ? all.get(ref) || null : /^[0-9a-f]{40}$/.test(head) ? head : null },
          branches: [...all].filter(([r]) => !r.endsWith('/HEAD')).map(([r, sha]) => ({ ref: r, sha, remote: r.startsWith('refs/remotes/'), name: r.replace(/^refs\/(heads|remotes)\//, '') })),
          sig: [head, packedRefs, ...loose.map((x) => x.join(' ')).sort()].join('\n'),
        };
      },
      // forget the pack list, after a gc or a fetch may have written new packs
      reload() { packs = null; },
      async remoteUrl(name = 'origin') {
        const cfg = (await textOf(git, 'config')) || '';
        const at = cfg.split(/^\s*\[/m).find((s) => new RegExp(`^remote\\s+"${name}"\\s*\\]`).test(s));
        return at ? (/^\s*url\s*=\s*(.+)$/m.exec(at) || [])[1]?.trim() || null : null;
      },
      // { sha, parents, author, time (ms, the committer's), subject }, or null when the object is missing (a shallow clone)
      async commit(sha) {
        if (commits.has(sha)) return commits.get(sha);
        let o = await object(sha).catch(() => null);
        if (!o && packs) { packs = null; o = await object(sha).catch(() => null); }
        if (!o || o.type !== 'commit') return null;
        const t = dec.decode(o.body), cut = t.indexOf('\n\n');
        const c = { sha, parents: [], author: '', time: 0, subject: cut < 0 ? '' : t.slice(cut + 2).split('\n')[0].trim() };
        for (const l of t.slice(0, cut < 0 ? t.length : cut).split('\n')) {
          if (l.startsWith('parent ')) c.parents.push(l.slice(7, 47));
          else if (l.startsWith('author ')) c.author = (/^author (.*?) </.exec(l) || [])[1] || '';
          else if (l.startsWith('committer ')) c.time = Number((/> (\d+) [+-]\d{4}$/.exec(l) || [])[1] || 0) * 1000;
        }
        commits.set(sha, c);
        return c;
      },
      // the newest max commits reachable from tips, each after every child of it among them (commits made in the same
      // second, or a rebase's clock, would otherwise put a parent first), newest first among those free to go. since
      // (ms) leaves out commits older than it, except those in keep. more: older commits were left out.
      async walk(tips, opts = {}) {
        const { max = 80, since = 0, keep = null } = typeof opts === 'number' ? { max: opts } : opts;
        const seen = new Set(), queue = [], picked = [];
        let older = false;
        const add = async (sha) => {
          if (!sha || seen.has(sha)) return;
          seen.add(sha);
          const c = await repo.commit(sha);
          if (!c) return;
          if (c.time < since && !(keep && keep.has(sha))) { older = true; return; }
          queue.push(c);
        };
        for (const t of tips) await add(t);
        while (queue.length && picked.length < max) {
          queue.sort((a, b) => b.time - a.time);
          const c = queue.shift(); picked.push(c);
          for (const p of c.parents) await add(p);
        }
        const left = new Map(picked.map((c) => [c.sha, 0])), out = [];
        for (const c of picked) for (const p of c.parents) if (left.has(p)) left.set(p, left.get(p) + 1);
        const ready = picked.filter((c) => !left.get(c.sha));
        while (ready.length) {
          ready.sort((a, b) => b.time - a.time || picked.indexOf(a) - picked.indexOf(b));
          const c = ready.shift(); out.push(c);
          for (const p of c.parents) if (left.has(p) && left.set(p, left.get(p) - 1).get(p) === 0) ready.push(picked.find((x) => x.sha === p));
        }
        return { commits: out, more: queue.length > 0 || older };
      },
      // the newest commit both a and b reach, where a branch forked from the other (null past limit commits): walks
      // both histories newest first, marking which side reached each commit, as git merge-base does
      async mergeBase(a, b, limit = 3000) {
        if (!a || !b) return null;
        if (a === b) return a;
        const side = new Map([[a, 1], [b, 2]]), queue = [];
        for (const s of [a, b]) { const c = await repo.commit(s); if (c) queue.push(c); }
        for (let n = 0; queue.length && n < limit; n++) {
          queue.sort((x, y) => y.time - x.time);
          const c = queue.shift(), f = side.get(c.sha);
          if (f === 3) return c.sha;
          for (const p of c.parents) {
            const pf = side.get(p) || 0;
            if ((pf | f) === pf) continue;
            side.set(p, pf | f);
            if (!pf) { const pc = await repo.commit(p); if (pc) queue.push(pc); }
          }
        }
        return null;
      },
    };
    return repo;
  }

  // Lanes, as git log --graph draws them: each row is a commit at a column, with the lanes leaving it (out: the sha
  // each column waits for), the columns its parents continue in, and cut when a parent is not among the commits.
  // From row i to row i+1, a column j of out runs from j (or from the commit, when j is one of its parentCols) to the
  // next commit's column when it is that commit, else straight down.
  function layout(commits) {
    const shown = new Set(commits.map((c) => c.sha)), free = (l) => { const k = l.findIndex((s) => s == null); return k < 0 ? l.length : k; };
    let lanes = [];
    return commits.map((c) => {
      const inL = lanes.slice();
      let col = lanes.indexOf(c.sha);
      if (col < 0) col = free(lanes);
      lanes = lanes.map((s) => (s === c.sha ? null : s));
      const parentCols = []; let cut = false;
      c.parents.forEach((p, n) => {
        if (!shown.has(p)) { cut = true; return; }
        let k = lanes.indexOf(p);
        if (k < 0) { k = n === 0 && lanes[col] == null ? col : free(lanes); lanes[k] = p; }
        parentCols.push(k);
      });
      for (let j = 0; j < lanes.length; j++) if (lanes[j] === undefined) lanes[j] = null;
      while (lanes.length && lanes.at(-1) == null) lanes.pop();
      return { c, col, inL, out: lanes.slice(), parentCols, cut };
    });
  }

  return { open, layout };
})();
</script>

<script>
// ============================================================ BRAIN SOURCE
// Where the page reads and writes its brains. A source lists the brains, reads a brain's files and times, reads and
// writes one file, calls back on a change, and opens a clone's repo object (the calls GitRead.open gives). The folder
// source is the browser's folder access: its directory handles, GitRead and the page's poll. The server source is the brain
// server the page was loaded from: fetch for the files and the clones' git reads, server-sent events for changes. forPage picks one when the page loads.
// skills/brain/scripts/brain-source.test.mjs runs the folder source in Node over a directory-handle shim, and
// brain-server-source.test.mjs the server source against a real server.
const BrainSource = (function () {
  // The paths of a brain in its `.brain/` folder, relative to it: a copy of layout.mjs's pathsOf, which
  // skills/brain/scripts/layout-copies.test.mjs checks.
  const LAYOUT = {
    specs: '.local/specs', repoNotesRoot: 'notes/repos', repoNotes: (slug) => `notes/repos/${slug}`, sharedNotes: 'notes/shared', drafts: '.local/drafts',
    repos: 'repos', reposJson: '.local/repos.json', card: (slug) => `repos/${slug}.md`,
  };
  // the key a clone is kept under: its path, or its slug when the brain links no path
  const cloneKey = (r) => (r.path || 'slug:' + r.slug).toLowerCase();

  // kv: the page's store, get(key) and set(key, value), over IndexedDB; every: the poll's period in ms
  function folder({ kv, every = 2000 }) {
    let grants = null;
    const opened = new Map();
    const loadGrants = async () => { if (!grants) { try { grants = (await kv.get('clones')) || {}; } catch { grants = {}; } } return grants; };
    // times, when given, takes each file's last change (ms), which dates a spec for the Recent scope
    async function walk(dir, prefix, out, times) {
      for await (const [name, h] of dir.entries()) {
        if (h.kind === 'directory') await walk(h, prefix + name + '/', out, times);
        else if (name.endsWith('.md')) { const file = await h.getFile(); out.set(prefix + name, await file.text()); times?.set(prefix + name, file.lastModified); }
      }
    }
    // a layout path may hold several segments, which the browser opens one folder at a time
    const sub = async (dir, ...paths) => { for (const n of paths.flatMap((x) => x.split('/'))) dir = await dir.getDirectoryHandle(n); return dir; };
    const text = async (dir, name) => (await (await dir.getFileHandle(name)).getFile()).text();
    // The folder holding a brain's BRAIN.md: the `.brain/` folder inside the folder picked, or the folder picked itself.
    const rootOf = async (b) => {
      try { const dir = await sub(b.handle, '.brain'); await dir.getFileHandle('BRAIN.md'); return dir; } catch {}
      return b.handle;
    };
    const fileAt = async (b, path, create) => {
      const parts = path.split('/'); let d = await rootOf(b);
      for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p, { create });
      return d.getFileHandle(parts.at(-1), { create });
    };

    // A brain's specs with times, the notes of its repositories and shared ones, its drafts, every repository's card and
    // repos.json, keyed relative to the brain: the files the server source reads. The folder source has no history, so it
    // gives no timeline.
    async function readFiles(dir) {
      const files = new Map(), times = new Map();
      const under = async (path, withTimes) => { try { await walk(await sub(dir, path), path + '/', files, withTimes ? times : undefined); } catch {} };
      await under(LAYOUT.specs, true);
      await under(LAYOUT.repoNotesRoot);
      await under(LAYOUT.sharedNotes);
      await under(LAYOUT.drafts);
      try {
        for await (const [name, h] of (await sub(dir, LAYOUT.repos)).entries()) {
          if (h.kind === 'file' && name.endsWith('.md')) files.set(`${LAYOUT.repos}/${name}`, await (await h.getFile()).text());
        }
      } catch {}
      try { const parts = LAYOUT.reposJson.split('/'); files.set(LAYOUT.reposJson, await text(await sub(dir, ...parts.slice(0, -1)), parts.at(-1))); } catch {}
      return { files, times };
    }

    return {
      kind: 'folder',
      // the brains the user added on this machine: [{ id, name, handle }]
      async brains() { try { return (await kv.get('brains')) || []; } catch { return []; } },

      // One brain's files and its status: 'ok', 'denied' (read permission not granted) or 'missing' (no BRAIN.md at its
      // root or in its .brain/). A brain's files are its specs, the notes of its repositories and shared ones, its drafts, cards and
      // repos.json, keyed relative to the folder holding BRAIN.md. Files and times are Maps by path, and times holds the
      // specs' files only.
      async files(b) {
        const files = new Map(), times = new Map();
        try {
          if ((await b.handle.queryPermission({ mode: 'read' })) !== 'granted') return { status: 'denied', files, times };
          const dir = await rootOf(b);
          await dir.getFileHandle('BRAIN.md');
          return { status: 'ok', ...(await readFiles(dir)) };
        } catch { return { status: 'missing', files: new Map(), times: new Map() }; }
      },

      // One file's text as it is on disk now, or null when it is missing.
      async read(b, path) {
        try { return await (await (await fileAt(b, path, false)).getFile()).text(); } catch { return null; }
      },

      // Writes one file, creating its folders. The first write asks the browser for write access to the brain's folder
      // (it must follow a click).
      async write(b, path, text) {
        if ((await b.handle.queryPermission({ mode: 'readwrite' })) !== 'granted' && (await b.handle.requestPermission({ mode: 'readwrite' })) !== 'granted') throw new Error('the browser was not allowed to write to this folder');
        const w = await (await fileAt(b, path, true)).createWritable(); await w.write(text); await w.close();
      },

      // Reads the file from disk, not from the page's last read, so the change keeps what a build wrote since: change
      // gets its text (undefined when the file is missing) and returns the text to write.
      async edit(b, path, change) {
        const old = await this.read(b, path);
        await this.write(b, path, change(old ?? undefined));
      },

      // Calls back every `every` ms, the page's poll: the folder has no way to say what changed. Returns a stop.
      subscribe(onChange) {
        const t = setInterval(onChange, every);
        return () => clearInterval(t);
      },

      // Keeps a clone's folder the user granted, by its repository's path in repos.json (by its slug when it has none),
      // so every spec, and every brain that links the same clone, reads it with no second grant.
      async grant(repo, handle) {
        (await loadGrants())[cloneKey(repo)] = handle;
        try { await kv.set('clones', grants); } catch {}
      },

      // A granted clone's repo object, as GitRead.open gives it: { state: 'ok', repo }, or { state: 'ungranted' } for a
      // clone never granted and { state: 'denied' } when the browser dropped its read permission. The same repo comes
      // back while the grant is the same. GitRead.open throws when the folder is no clone.
      async open(repo) {
        const key = cloneKey(repo), h = (await loadGrants())[key];
        if (!h) return { state: 'ungranted' };
        if ((await h.queryPermission({ mode: 'read' }).catch(() => 'denied')) !== 'granted') return { state: 'denied' };
        if (opened.get(key)?.handle !== h) opened.set(key, { handle: h, repo: await GitRead.open(h) });
        return { state: 'ok', repo: opened.get(key).repo };
      },

      // After a browser restart: asks again for each granted clone of these repositories that lost its permission.
      async reconnect(repos) {
        const g = await loadGrants();
        for (const r of repos) {
          const h = g[cloneKey(r)];
          if (h) { try { if ((await h.queryPermission({ mode: 'read' })) !== 'granted') await h.requestPermission({ mode: 'read' }); } catch {} }
        }
      },
    };
  }

  // The server source: the brain server the page was loaded from, over fetch and server-sent events.
  // base: the server's origin ('' for the page's own); token: this start's write token, sent as X-Brain-Token.
  function server({ base = '', token, fetch, EventSource }) {
    const api = (path) => `${base}/api/brains${path}`;
    const brainApi = (b, path) => api(`/${encodeURIComponent(b.id)}${path}`);
    const opened = new Map();
    // Each brain's history, as the server's history route gives it, by brain id: read with the brain's files, and again on each
    // change event. A read that fails leaves the last one (none before the first).
    const histories = new Map();
    const historyOf = async (id) => {
      try {
        const res = await fetch(api(`/${encodeURIComponent(id)}/history`));
        if (res.ok) histories.set(id, await res.json());
      } catch {}
      return histories.get(id);
    };
    const writeHeaders = { 'x-brain-token': token, 'content-type': 'application/json' };
    // Throws the server's reason for a refused call, or what the status says.
    const fail = async (res) => { throw new Error((await res.json().catch(() => ({}))).error || `the server answered ${res.status}`); };

    // A clone's repo object over the git routes, the calls GitRead.open gives. The server reads git on every call, so reload
    // has nothing to drop. A git route's 404 says the brain no longer links the clone: the repo is forgotten, so the next
    // open answers 'unlinked', and the call throws an error marked `unlinked`.
    function repoOf(b, slug) {
      const route = (part) => brainApi(b, `/repos/${encodeURIComponent(slug)}/${part}`);
      const check = async (res) => {
        if (res.status === 404) { opened.delete(b.id + '|' + slug); throw Object.assign(new Error(`no clone of ${slug} is linked`), { unlinked: true }); }
        if (!res.ok) await fail(res);
        return res.json();
      };
      const get = async (part) => check(await fetch(route(part)));
      return {
        refs: () => get('refs'),
        async commit(sha) {
          const res = await fetch(route(`commit?sha=${encodeURIComponent(sha)}`));
          if (res.status === 404) return null;
          if (!res.ok) await fail(res);
          return res.json();
        },
        async walk(tips, { max, since, keep } = {}) {
          return check(await fetch(route('walk'), { method: 'POST', headers: writeHeaders, body: JSON.stringify({ tips, max, since, keep: keep ? [...keep] : undefined }) }));
        },
        async mergeBase(x, y) { return (await get(`merge-base?a=${encodeURIComponent(x)}&b=${encodeURIComponent(y)}`)).sha; },
        async remoteUrl() { return (await get('remote-url')).url; },
        reload() {},
      };
    }

    return {
      kind: 'server',
      // the brains the server lists: [{ id, name, path, status }]
      async brains() { return (await fetch(api(''))).json(); },

      // Adds the brain at a typed absolute path; gives its entry, which a path already listed gives again. Throws the
      // server's reason when it refuses the path.
      async add(path) {
        const res = await fetch(api(''), { method: 'POST', headers: writeHeaders, body: JSON.stringify({ path }) });
        if (!res.ok) await fail(res);
        return res.json();
      },

      // Has the server open the machine's folder dialog and add the brain picked: gives its entry, or null when the user
      // cancels. Throws an error marked `notABrain` when the folder holds no brain, and one marked `unavailable` when the
      // machine has no dialog, so the caller asks for a typed path instead.
      async pick() {
        const res = await fetch(api('/pick'), { method: 'POST', headers: writeHeaders });
        if (res.status === 501) throw Object.assign(new Error('no folder dialog'), { unavailable: true });
        if (res.status === 422) throw Object.assign(new Error('no brain in that folder'), { notABrain: true });
        if (!res.ok) await fail(res);
        return res.json();
      },

      // One file's text as it is on disk now, or null when it is missing.
      async read(b, path) {
        const res = await fetch(brainApi(b, `/file?path=${encodeURIComponent(path)}`));
        return res.ok ? res.text() : null;
      },

      // Writes one file, creating its folders: the token is the permission, so nothing prompts.
      async write(b, path, text) {
        const res = await fetch(brainApi(b, `/file?path=${encodeURIComponent(path)}`), { method: 'PUT', headers: { 'x-brain-token': token }, body: text });
        if (!res.ok) throw new Error(`the server did not write the file: it answered ${res.status}`);
      },

      // Reads the file from the server, which reads the disk, not from the page's last read, so the change keeps what a
      // build wrote since: change gets its text (undefined when the file is missing) and returns the text to write.
      async edit(b, path, change) {
        const old = await this.read(b, path);
        await this.write(b, path, change(old ?? undefined));
      },

      // Calls back with each `change` event the server sends, { brain, changed, times }: `changed` maps each changed path to
      // its new text, or to null when the file is gone. The server watches the folders, so nothing polls. Returns a stop.
      subscribe(onChange) {
        const events = new EventSource(`${base}/api/events`);
        // the history is read again before the callback, so the page's re-read of the brain finds it
        events.addEventListener('change', async (e) => { const event = JSON.parse(e.data); await historyOf(event.brain); onChange(event); });
        return () => events.close();
      },

      // Takes the brain off the server's list; its folder stays as it is.
      async remove(b) {
        const res = await fetch(brainApi(b, ''), { method: 'DELETE', headers: { 'x-brain-token': token } });
        if (!res.ok) throw new Error(`the server answered ${res.status}`);
      },

      // A linked clone's repo object, as GitRead.open gives it: { state: 'ok', repo }, or { state: 'unlinked' } when the brain's
      // repos.json names no folder for the repository. No grant is asked or kept: the server reads the clone. The same repo
      // comes back while the clone stays linked. Throws the server's reason when the linked folder is no clone.
      async open(repo, b) {
        const key = b.id + '|' + repo.slug;
        if (opened.has(key)) return { state: 'ok', repo: opened.get(key) };
        const res = await fetch(brainApi(b, `/repos/${encodeURIComponent(repo.slug)}/refs`));
        if (res.status === 404) return { state: 'unlinked' };
        if (!res.ok) await fail(res);
        opened.set(key, repoOf(b, repo.slug));
        return { state: 'ok', repo: opened.get(key) };
      },

      // One brain's files and its status, as the folder source gives them: 'ok' or 'missing' (no BRAIN.md at its root, or
      // not listed). A server brain has no 'denied': the server reads the folder. It adds the brain's `timeline`, the server's
      // history route.
      async files(b) {
        const [res, list, timeline] = await Promise.all([fetch(brainApi(b, '/files')), this.brains(), histories.get(b.id) ?? historyOf(b.id)]);
        const listed = list.find((x) => x.id === b.id);
        if (!res.ok || listed?.status !== 'ok') return { status: 'missing', files: new Map(), times: new Map() };
        const { files, times } = await res.json();
        return { status: 'ok', files: new Map(Object.entries(files)), times: new Map(Object.entries(times)), timeline };
      },
    };
  }

  // The source the page uses, picked once when it loads: the server over http:, the folder access over file:.
  function forPage({ protocol, kv, token, fetch, EventSource }) {
    return protocol === 'http:' ? server({ token, fetch, EventSource }) : folder({ kv });
  }

  return { folder, server, forPage, cloneKey, LAYOUT };
})();
</script>

<script>
// ============================================================ THE PAGE
// Lists the brains added on this machine, reads one through its source (the brain server, or the browser's folder access
// when the page is opened from a file), turns its files into App's data with toData, and re-reads it on a change (the
// server's change events) or every few seconds (the folder source's poll) while it is open.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// The route lives in the hash: #/ is the brain list, #/b/<brain>[/<screen>...] one brain.
const route = () => (/^#\/b\/([^/]+)/.exec(location.hash) || [])[1] || null;
const goBrain = (id) => { location.hash = id ? '#/b/' + id : '#/'; };

// Each entry of brains is a brain the user added: { id, name, handle, status, files, data }.
const state = { brains: [], brain: null, notice: '' };

// ---------- folder access ----------

// A browser that blocks storage may never answer: after two seconds the call gives up, and the page works on, only
// without remembering its brain list.
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    setTimeout(() => reject(new Error('IndexedDB did not answer')), 2000);
    const open = indexedDB.open('alper-brain-page', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      // a store call that throws (a value the store cannot clone) rejects, rather than leaving the promise hanging
      try {
        const tx = open.result.transaction('kv', mode);
        const req = fn(tx.objectStore('kv'));
        tx.oncomplete = () => resolve(req.result);
        tx.onerror = () => reject(tx.error);
      } catch (e) { reject(e); }
    };
  });
}

// Every file:// page shares one origin, so a fixed key gives each copy of this page, at any plugin version, the same brain list.
const saveBrains = async () => {
  if (viaServer) return; // the server keeps the list
  try { await idb('readwrite', (s) => s.put(state.brains.map(({ id, name, handle }) => ({ id, name, handle })), 'brains')); } catch {}
};

// The page reads and writes its brains through one source, picked once by how it was loaded: the server source over
// http: (the page the brain server serves, which carries the write token in its head), the folder source over file:.
const source = BrainSource.forPage({
  protocol: location.protocol,
  kv: { get: (k) => idb('readonly', (s) => s.get(k)), set: (k, v) => idb('readwrite', (s) => s.put(v, k)) },
  token: document.querySelector('meta[name="brain-token"]')?.content,
  fetch: (...a) => fetch(...a),
  EventSource,
});
const viaServer = source.kind === 'server';

// Re-reads one brain and sets its status: 'ok', 'denied' (read permission not granted) or 'missing' (no BRAIN.md at its
// root). Its files are the source's. Returns whether its status or files changed.
async function readBrain(b) {
  const before = b.status;
  const { status, files, times, ...read } = await source.files(b);
  b.status = status;
  if (b.status !== 'ok') return b.status !== before;
  // the history, which a commit changes with no file changing, counts as much as a file
  const history = JSON.stringify(read.timeline ?? null);
  if (b.files && b.history === history && b.files.size === files.size && [...files].every(([k, v]) => b.files.get(k) === v)) return b.status !== before;
  b.files = files;
  b.history = history;
  b.data = toData(b.name, files, times, read);
  return true;
}

// ---------- parsing: a brain's files into App's data ----------

const heading = (t) => (/^#\s+(.+)$/m.exec(t) || [])[1]?.trim() ?? null;
const field = (t, name) => (new RegExp(`^\\*\\*${name}:\\*\\*\\s*(.+)$`, 'mi').exec(t) || [])[1]?.trim() ?? null;
const section = (t, name) => (new RegExp(`^##\\s+${name}\\s*$([\\s\\S]*?)(?=^##\\s|(?![\\s\\S]))`, 'm').exec(t) || [])[1]?.trim() ?? '';
const numOf = (s) => (/^(\d{3})/.exec(s) || [])[1] ?? null;
const shaOf = (s) => { const v = (s || '').replace(/`/g, ''); return /^[0-9a-f]{7,40}/i.test(v) ? v.slice(0, 7) : null; };
function front(t) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(t), fm = {};
  if (m) for (const l of m[1].split(/\r?\n/)) { const kv = /^([\w-]+):\s*(.*)$/.exec(l); if (kv) fm[kv[1]] = kv[2].trim().replace(/^["']|["']$/g, ''); }
  return { fm, body: m ? t.slice(m[0].length) : t };
}

// /build's closing steps after a milestone's last ticket, from milestone.md's Phase line; a Squash commit ends them.
// step 7 writes decide when the arbiter decides the escalations, and ask when the user does, stopping the track.
// scripts/check-phases.mjs checks every phase of build's Phase table is a key here.
const PHASE_LABEL = { check: 'Checking', failed: 'Check failed', waits: 'Waiting on its expand', review: 'In review', decide: 'Deciding escalations', ask: 'Waiting on your answers', fix: 'Fixing review', squash: 'Squashing' };
// How many of a review.md's findings are flagged escalate with no Answer line yet; a finding runs from its ID
// (ST1, SP2, CN3) to the next.
const awaitingOf = (md) => md.split(/^(?=\s*(?:[-*]\s+|#{1,4}\s+)?(?:\*\*)?(?:ST|SP|CN)\d+\b)/m).slice(1)
  .filter((f) => /\bescalate\b/i.test(f) && !/\*\*Answer:\*\*/.test(f)).length;
const ticketsStatus = (ts) => (!ts.length ? 'draft' : ts.every((t) => t.status === 'done') ? 'done' : ts.some((t) => t.status === 'blocked') ? 'blocked'
  : ts.some((t) => t.status === 'doing' || t.status === 'done') ? 'active' : 'ready');
const WIKI = /\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g;

// Where a path sits, as notes.mjs's placeOf reads it: the repository its folder names (null in the shared notes' folder) and
// whether the file is a card. It never tells a note's kind: the note's `explored` line does.
function placeOf(path) {
  const p = path.split('/'), L = BrainSource.LAYOUT, dir = p.slice(0, -1).join('/');
  if (p.length === 4 && dir === L.repoNotes(p[2])) return { slug: p[2], card: false };
  if (dir === L.sharedNotes) return { slug: null, card: false };
  if (path === L.card(p[1]?.slice(0, -3))) return { slug: p[1].slice(0, -3), card: true };
  return null;
}

// A source's read of a brain gives its files keyed relative to the folder holding BRAIN.md and, from the server, the brain's
// history as `timeline`.
function toData(name, files, times = new Map(), { timeline: history } = {}) {
  const read = (p) => files.get(p), L = BrainSource.LAYOUT;
  const SPECS = L.specs + '/', DRAFTS = L.drafts + '/';
  const paths = [...files.keys()];
  // repositories: one per card
  let links = {};
  try { links = JSON.parse(read(L.reposJson) || '{}'); } catch {}
  const repos = paths.filter((p) => placeOf(p)?.card).sort().map((p) => {
    const slug = placeOf(p).slug, { fm, body } = front(read(p));
    return { slug, remote: fm.remote, explored: fm.explored || null, summary: body.trim(), linked: !!links[slug], path: links[slug] || null };
  });
  // notes: a draft is read as the note it would land as, at its target; one that changes a committed note marks it
  const noteOf = (file, draft) => {
    const { fm, body } = front(read(file));
    const path = draft ? fm.target : file;
    const at = path ? placeOf(path) : null;
    if (!at || at.card) return null;
    const id = path.split('/').at(-1).replace(/\.md$/, ''), kind = fm.explored ? 'explored' : 'authored';
    const repos = at.slug && fm.explored ? [at.slug] : (fm.repos || '').replace(/^\[|\]$/g, '').split(',').map((s) => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
    return {
      id, path, type: fm.type || 'other', layer: fm.layer || null, description: fm.description || '', body: body.trim(),
      // shared: an authored note bearing on several repositories
      repos, shared: kind === 'authored' && repos.length > 1, kind, explored: fm.explored || null,
      links: [...new Set([...body.matchAll(WIKI)].map((x) => x[1].trim()))].filter((l) => l !== id),
      superseded: fm.status === 'superseded', supersededBy: fm.supersededBy || null,
      draft: draft ? fm.action || 'record' : null, supersedes: fm.supersedes || null,
    };
  };
  const notes = new Map();
  for (const p of paths.filter((p) => placeOf(p)?.card === false)) { const n = noteOf(p, false); if (n && !notes.has(n.id)) notes.set(n.id, n); }
  for (const p of paths.filter((p) => p.startsWith(DRAFTS))) {
    const d = noteOf(p, true); if (!d) continue;
    const own = notes.get(d.id);
    if (own) { own.pending = d.draft; own.pendingBody = d.body; own.pendingDescription = d.description; }
    else if (d.draft !== 'delete') notes.set(d.id, d);
    if (d.draft === 'supersede' && notes.get(d.supersedes)) notes.get(d.supersedes).pending = 'supersede';
  }
  const ghosts = [...new Set([...notes.values()].flatMap((n) => n.links).filter((l) => !notes.has(l)))];
  // the timeline: the server's history
  let timeline = { commits: [] };
  const shaped = (t) => ({ commits: t.commits.map((c) => ({ ...c, changes: Array.isArray(c.changes) ? c.changes : [] })) });
  if (history?.commits?.length) timeline = shaped(history);

  // specs: <specs>/<spec>/spec.md, and its milestones in one track per repository (<slug>/NNN-*/), or, ticketed before
  // tracks, a milestone folder straight in the spec's folder with a Repo line each (the flat layout)
  const byDir = new Map();
  for (const p of paths.filter((p) => p.startsWith(SPECS))) {
    const parts = p.slice(SPECS.length).split('/');
    if (!numOf(parts[0])) continue;
    if (!byDir.has(parts[0])) byDir.set(parts[0], []);
    byDir.get(parts[0]).push(parts);
  }
  const list = (v) => (v || '').split(/[,;]/).map((s) => s.replace(/[`\s]/g, '')).filter(Boolean);
  const specs = [...byDir.keys()].sort().map((dir) => {
    const t = read(`${SPECS}${dir}/spec.md`) || '';
    const landed = (field(t, 'Landed') || '').replace(/`/g, '');
    const s = {
      id: dir, num: numOf(dir), title: (heading(t) || dir).replace(/^Spec:\s*/i, ''), path: `${SPECS}${dir}/spec.md`, body: t,
      repos: list(field(t, 'Repos')), key: field(t, 'Key'), base: field(t, 'Base'),

      deps: list(field(t, 'Depends on')).filter(numOf), landed: /[0-9a-f]{7,40}/i.test(landed) ? landed : null, abandoned: field(t, 'Abandoned'),
      // touched: the newest change to any file in its folder (0 when the page could not tell)
      touched: Math.max(0, ...[...times].filter(([p]) => p.startsWith(`${SPECS}${dir}/`)).map(([, ms]) => ms)),
      landings: field(t, 'Landings'), summary: section(t, 'Problem Statement').split(/\n\s*\n/)[0], milestones: [],
    };
    const ms = new Map();
    for (const parts of byDir.get(dir)) {
      const flat = parts.length === 3 && numOf(parts[1]), tracked = parts.length === 4 && !numOf(parts[1]) && numOf(parts[2]);
      if (!flat && !tracked) continue;
      const mdir = flat ? parts[1] : parts[2], file = parts.at(-1), key = flat ? mdir : `${parts[1]}/${mdir}`;
      if (!ms.has(key)) ms.set(key, { track: flat ? null : parts[1], mdir, base: `${SPECS}${dir}/${key}`, tickets: [] });
      if (numOf(file)) ms.get(key).tickets.push(file);
    }
    for (const mm of [...ms.values()].sort((a, b) => (a.track || '').localeCompare(b.track || '') || a.mdir.localeCompare(b.mdir))) {
      const mt = read(`${mm.base}/milestone.md`) || '', review = read(`${mm.base}/review.md`) ?? null;
      const track = mm.track || (field(mt, 'Repo') || '').replace(/`/g, '').trim() || 'unassigned';
      const after = field(mt, 'Lands after') || '', builds = field(mt, 'Builds after') || '';
      const msIds = (v) => (/^none/i.test(v) ? [] : (v.match(/[\w.-]+\/\d+/g) || []).map((d) => d.replace(/\/(\d+)$/, (_, n) => '/' + n.padStart(3, '0'))));
      const m = {
        id: `${track}/${numOf(mm.mdir)}`, track, num: numOf(mm.mdir), title: (heading(mt) || mm.mdir).replace(/^Milestone\s+\d+:\s*/i, ''),
        path: `${mm.base}/milestone.md`, body: mt, review, reviewPath: review != null ? `${mm.base}/review.md` : null, awaiting: review ? awaitingOf(review) : 0,
        delivers: field(mt, 'Delivers'), phase: (field(mt, 'Phase') || '').replace(/`/g, '').toLowerCase() || null,
        squash: shaOf(field(mt, 'Squash')), landed: shaOf(field(mt, 'Landed')),
        buildsAfter: msIds(builds), landsAfter: msIds(after), tickets: [],
      };
      for (const tf of mm.tickets.sort()) {
        const tt = read(`${mm.base}/${tf}`), deps = field(tt, 'Depends on') || '';
        m.tickets.push({
          id: `${track}/${numOf(tf)}`, num: numOf(tf), title: (heading(tt) || tf).replace(/^Ticket\s+\d+:\s*/i, ''), path: `${mm.base}/${tf}`, body: tt,
          status: (field(tt, 'Status') || 'todo').toLowerCase().replace(/`/g, ''), commit: shaOf(field(tt, 'Commit')),
          deps: /^none/i.test(deps) ? [] : (deps.match(/(?:[\w.-]+\/)?\d+/g) || []).map((d) => (d.includes('/') ? d.replace(/\/(\d+)$/, (_, n) => '/' + n.padStart(3, '0')) : `${track}/${d.padStart(3, '0')}`)),
        });
      }
      s.milestones.push(m);
    }
    // tracks wait on each other only at milestones: a ticket's Depends on another track's ticket, from before Builds
    // after, is read as its milestone's Builds after that ticket's milestone, as build moves it
    const ownerOf = new Map(s.milestones.flatMap((m) => m.tickets.map((t) => [t.id, m])));
    for (const m of s.milestones) for (const t of m.tickets) t.deps = t.deps.filter((d) => {
      const o = ownerOf.get(d);
      if (!o || o.track === m.track) return true;
      if (!m.buildsAfter.includes(o.id)) m.buildsAfter.push(o.id);
      return false;
    });
    if (!s.repos.length) s.repos = [...new Set(s.milestones.map((m) => m.track).filter((x) => x !== 'unassigned'))];
    return s;
  });
  // statuses: a closing milestone (all tickets done, a Phase, no Squash yet) is active, or waits on the user when its
  // check failed or it is at ask with escalations unanswered (decide is the arbiter's: it needs no one); its stage is
  // its Phase, and build while its tickets run. A squashed one not yet on its base is landing. A spec takes the most
  // urgent of its milestones.
  for (const s of specs) {
    for (const m of s.milestones) {
      const closing = !m.squash && PHASE_LABEL[m.phase] && m.tickets.length && m.tickets.every((t) => t.status === 'done');
      const waits = m.phase === 'failed' || (m.phase === 'ask' && m.awaiting > 0);
      m.status = m.landed ? 'landed' : closing ? (waits ? 'attention' : 'active') : ticketsStatus(m.tickets);
      if (m.status === 'done' && m.squash && !m.landed) m.status = 'landing';
      m.phaseLabel = closing ? (m.phase === 'ask' && !m.awaiting ? 'Answered' : PHASE_LABEL[m.phase]) : null;
      m.stage = closing ? m.phase : m.status === 'active' ? 'build' : null;
    }
    s.status = ticketsStatus(s.milestones.flatMap((m) => m.tickets));
    if (s.milestones.some((m) => m.status === 'attention')) s.status = 'attention';
    else if (s.status === 'done' && s.milestones.some((m) => m.phaseLabel)) s.status = 'active';
    else if (s.status === 'done' && !s.landed && s.milestones.some((m) => m.squash && !m.landed)) s.status = 'landing';
    if (s.status === 'done' && s.landed) s.status = 'landed';
  }
  // a dependency that is missing or has not landed holds a spec back; an Abandoned line retires it whatever its tickets say
  for (const s of specs) {
    s.waiting = s.deps.filter((d) => !specs.find((x) => x.id === d)?.landed);
    if (s.waiting.length && (s.status === 'draft' || s.status === 'ready')) s.status = 'waiting';
    if (s.abandoned) s.status = 'abandoned';
  }
  // the frontier, what the next /build starts (build's Tracks): each track's first open milestone with no ticket
  // started, once every milestone its Builds after names is squashed, in a spec not held by its own dependencies.
  // A spec with nothing started yet is in the frontier when any of its milestones is.
  for (const s of specs) {
    if (s.waiting.length || ['draft', 'abandoned', 'landed'].includes(s.status)) continue;
    for (const track of new Set(s.milestones.map((m) => m.track))) {
      const m = s.milestones.find((x) => x.track === track && !x.squash);
      if (!m || m.status !== 'ready') continue;
      if (m.buildsAfter.every((id) => { const o = s.milestones.find((x) => x.id === id); return !o || o.squash; })) m.status = 'frontier';
    }
    if (s.status === 'ready' && s.milestones.some((m) => m.status === 'frontier')) s.status = 'frontier';
  }
  return { name, repos, notes: [...notes.values()], ghosts, timeline, specs };
}

// ---------- the brain list ----------

// a brain card's label and the colour of its top edge, by the brain's state
const TONE = { attention: ['Needs you', 'var(--s-attention)'], active: ['In progress', 'var(--s-active)'], ready: ['Ready to build', 'var(--s-ready)'], quiet: ['', 'var(--line-2)'] };
const STATUS_VAR = { done: '--s-done', doing: '--s-active', blocked: '--s-blocked', todo: '--s-todo' };
const GONE = {
  denied: { label: 'Needs permission', text: 'The browser needs your permission to read this folder again.' },
  missing: { label: 'Missing', text: 'Its <code>BRAIN.md</code> is gone: the folder was moved, renamed or deleted.' },
};
const plural = (n, w, ws = w + 's') => `${n} ${n === 1 ? w : ws}`;
const inFlight = (s) => !s.landed && !s.abandoned;
// A brain takes its most urgent spec's state: the user's turn (a spec waiting on answers or blocked), then work running,
// then a spec ready to build. Brains sort in that order, then by name.
const brainState = (b) => {
  if (b.status !== 'ok') return null;
  const has = (...ks) => b.data.specs.some((s) => ks.includes(s.status));
  return has('attention', 'blocked') ? 'attention' : has('active', 'landing') ? 'active' : has('ready', 'frontier') ? 'ready' : 'quiet';
};
const ORDER = ['attention', 'active', 'ready', 'quiet'];

function brainCard(b) {
  const remove = `<button data-remove="${b.id}" title="Remove from this page" class="faint -mr-1 shrink-0 px-1.5 hover:text-white">✕</button>`;
  if (b.status !== 'ok') {
    const g = GONE[b.status];
    return `<article class="flex flex-col border border-dashed p-5" style="border-color:var(--line-2);border-radius:var(--radius)">
      <div class="flex items-center gap-2"><h2 class="muted min-w-0 flex-1 truncate text-[18px]">${esc(b.name)}</h2><span class="chip" style="background:var(--panel-2)">${g.label}</span>${remove}</div>
      <p class="muted mt-2 text-[12.5px]">${g.text}</p>
      ${b.status === 'denied' ? `<button data-reconnect="${b.id}" class="btn mt-4 self-start text-[12px]">Reconnect</button>` : ''}
    </article>`;
  }
  const d = b.data, st = brainState(b), [label, tone] = TONE[st];
  const flying = d.specs.filter(inFlight), ts = flying.flatMap((s) => s.milestones.flatMap((m) => m.tickets)), done = ts.filter((t) => t.status === 'done').length;
  const needs = d.specs.filter((s) => s.status === 'attention' || s.status === 'blocked');
  const drafts = d.notes.filter((n) => n.draft || n.pending).length;
  const cells = ts.slice(0, 120).map((t) => `<span class="cell" style="width:8px;height:8px;background:var(${STATUS_VAR[t.status] || '--s-todo'})"></span>`).join('');
  return `<article data-brain="${b.id}" tabindex="0" class="panel clickable flex cursor-pointer flex-col p-5 outline-none focus-visible:ring-1 focus-visible:ring-white/40" style="box-shadow:inset 0 2px 0 ${tone}, 0 8px 18px -8px rgba(0,0,0,.6)">
      <div class="flex items-center gap-2"><h2 class="min-w-0 flex-1 truncate text-[18px]">${esc(b.name)}</h2>
        ${label ? `<span class="chip" style="background:color-mix(in srgb, ${tone} 16%, transparent);color:color-mix(in srgb, ${tone} 80%, white)">${label}</span>` : ''}${remove}</div>
      <div class="muted mt-2 text-[12px]">${plural(flying.length, 'spec')} in flight · ${plural(d.notes.length, 'note')} · ${plural(d.repos.length, 'repository', 'repositories')}${drafts ? ` · ${drafts} not shared` : ''}</div>
      ${ts.length ? `<div class="mt-3 flex flex-wrap gap-[2px]">${cells}${ts.length > 120 ? `<span class="mono faint ml-1 text-[10px]">+${ts.length - 120}</span>` : ''}</div>` : ''}
      <div class="muted mt-3 flex items-center gap-2 text-[11.5px]"><div class="h-1 flex-1 overflow-hidden" style="background:var(--s-todo)"><div class="h-full" style="width:${ts.length ? (done / ts.length) * 100 : 0}%;background:var(--s-done)"></div></div><span class="mono">${done}/${plural(ts.length, 'ticket')}</span></div>
      ${needs.length ? `<ul class="mt-3 space-y-1 border-t pt-3 text-[12.5px] hairline">${needs.map((s) => `<li class="flex items-center gap-2"><span class="mono faint text-[11px]">${esc(s.num)}</span><span class="min-w-0 flex-1 truncate">${esc(s.title)}</span><span class="text-[11.5px]" style="color:color-mix(in srgb, var(--s-attention) 70%, white)">${s.status === 'blocked' ? 'Blocked' : 'Needs you'}</span></li>`).join('')}</ul>` : ''}
    </article>`;
}

function showHome(msg) {
  $('view').classList.add('hidden');
  $('home').classList.remove('hidden');
  $('reload').classList.toggle('hidden', !state.brains.length);
  const brains = [...state.brains].sort((a, b) => ORDER.indexOf(brainState(a)) - ORDER.indexOf(brainState(b)) || a.name.localeCompare(b.name));
  $('homeMain').innerHTML = `<div class="mx-auto max-w-[1500px]">
      <div class="eyebrow">Second brain</div>
      <h1 class="mb-6 mt-1 text-[28px]">Brains</h1>
      ${msg ? `<div class="panel mb-6 px-4 py-3 text-[12.5px]">${msg}</div>` : ''}
      ${state.notice ? `<div class="mb-6 flex items-start gap-3 border px-4 py-3 text-[12.5px]" style="border-color:color-mix(in srgb, var(--s-active) 40%, transparent);background:color-mix(in srgb, var(--s-active) 8%, transparent)"><p class="flex-1">${state.notice}</p><button data-dismiss title="Dismiss" class="shrink-0 hover:opacity-70">✕</button></div>` : ''}
      ${brains.length ? `<div class="grid gap-4" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${brains.map(brainCard).join('')}</div>`
        : `<div class="muted border border-dashed py-16 text-center text-[13px]" style="border-color:var(--line-2);border-radius:var(--radius)">No brains yet. Click <b>Add brain</b> and pick a brain's folder, the one holding <code class="mono">BRAIN.md</code>. Nothing leaves your machine.</div>`}
    </div>`;
  const m = $('homeMain');
  const dismiss = m.querySelector('[data-dismiss]');
  if (dismiss) dismiss.onclick = () => { state.notice = ''; showHome(); };
  m.querySelectorAll('[data-brain]').forEach((el) => {
    el.onclick = () => goBrain(el.dataset.brain);
    el.onkeydown = (e) => e.key === 'Enter' && e.target === el && goBrain(el.dataset.brain);
  });
  m.querySelectorAll('[data-remove]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); removeBrain(el.dataset.remove); }));
  m.querySelectorAll('[data-reconnect]').forEach((el) => (el.onclick = () => reconnect(state.brains.find((b) => b.id === el.dataset.reconnect))));
}

// ---------- one brain ----------

// Draws the open brain; App keeps the screen, selection and filters when the same brain loads again.
function showBrain() {
  const b = state.brain;
  $('home').classList.add('hidden');
  if (b.status !== 'ok') {
    $('view').classList.add('hidden');
    $('home').classList.remove('hidden');
    $('homeMain').innerHTML = `<div class="mx-auto max-w-md space-y-4 py-24 text-center"><h1 class="text-[22px]">${esc(b.name)}</h1>
      <p class="muted text-[13px]">${GONE[b.status].text}</p>
      <div class="flex justify-center gap-2">${b.status === 'denied' ? '<button id="reconnect" class="btn text-[12px]">Reconnect</button>' : ''}<button id="back" class="btn text-[12px]">All brains</button></div></div>`;
    if ($('reconnect')) $('reconnect').onclick = () => reconnect(b);
    $('back').onclick = () => goBrain(null);
    return;
  }
  $('view').classList.remove('hidden');
  App.load(b.id, b.data, ioFor(b));
}

// Writing: an edit goes through the source, which reads the file from disk, not from the page's last read, so it keeps
// what a build wrote since; then the page re-reads.
function ioFor(b) {
  return {
    async edit(path, change) {
      await source.edit(b, path, change);
      await refresh();
    },
  };
}

// ---------- clones: each repository's own git, for a spec's Branches panel ----------

// A clone the user grants is kept by the source, so every spec, and every brain that links the same clone, reads it with
// no second grant; the server source needs no grant, and opens each clone the open brain links. watch() names the
// repositories the open spec touches; tick(), on the page's poll, a brain change or the page regaining focus, re-reads each
// one's refs, rebuilds its branches and graph only when a ref moved, and then fires clones-change, on which the spec's page
// redraws its panel.
const Clones = (function () {
  let watched = [], watchKey = '', busy = false;
  const views = new Map();
  const keyOf = BrainSource.cloneKey;
  // a remote as host/owner/repo, the same written as SSH or HTTPS, with or without .git
  const norm = (u) => (u || '').trim().toLowerCase().replace(/\/+$/, '').replace(/\.git$/, '').replace(/^[a-z+]+:\/\//, '').replace(/^[^@/]+@/, '').replace(':', '/');
  const hasRemote = (r) => r.remote && !/^local/i.test(r.remote);
  const NOTE = {
    'no-git': "That folder holds no .git: pick the clone's root folder.",
    worktree: 'That folder is a git worktree, whose .git points elsewhere: pick the main clone.',
    reftable: 'That clone keeps its refs in a reftable, which this page cannot read.',
  };
  const fire = () => window.dispatchEvent(new Event('clones-change'));
  const viewOf = (r) => { const k = keyOf(r); if (!views.has(k)) views.set(k, { state: 'loading' }); return views.get(k); };

  // A spec's branches are sdd/<spec>/spec and sdd/<spec>/M<NNN> (build's Branches). Simple shows them, the base and
  // every other branch that moved since the spec forked from the base (running: work alive beside the spec), from the
  // fork on. Explore shows every branch that moved in the last w.days days, and their commits in that window. A commit
  // is the spec's when a spec branch reaches it and the base does not.
  async function build(repo, refs, w) {
    const prefix = `sdd/${w.spec}/`, all = [];
    for (const b of refs.branches.slice(0, 400)) { const c = await repo.commit(b.sha); all.push({ ...b, time: c ? c.time : 0, subject: c ? c.subject : '', author: c ? c.author : '' }); }
    const local = new Map(all.filter((b) => !b.remote).map((b) => [b.name, b]));
    const shortOf = (b) => (b.remote ? b.name.replace(/^[^/]+\//, '') : b.name);
    // a remote-tracking branch at its local branch's commit shows as that local branch, marked pushed
    const branches = all.filter((b) => {
      if (!b.remote) return true;
      const l = local.get(shortOf(b));
      if (l && l.sha === b.sha) { l.pushed = true; return false; }
      return true;
    });
    const base = w.base || ['main', 'master', 'develop'].find((n) => local.has(n)) || refs.head.branch;
    for (const b of branches) {
      const short = shortOf(b);
      b.spec = short.startsWith(prefix) ? short.slice(prefix.length) : null;
      b.base = short === base && (!b.remote || !local.has(base));
      b.head = !b.remote && b.name === refs.head.branch;
    }
    branches.sort((a, b) => !!b.spec - !!a.spec || b.base - a.base || b.time - a.time);
    const specB = branches.filter((b) => b.spec), baseB = branches.find((b) => b.base);
    let since = 0, keep = null, fork = null, max = 150;
    if (w.mode === 'explore') {
      since = Date.now() - w.days * 864e5; max = 250;
      for (const b of branches) b.shown = b.time >= since || !!b.spec || b.base || b.head;
    } else {
      // the oldest fork among the spec's branches: where the spec's work began
      for (const b of baseB ? specB : []) {
        const sha = await repo.mergeBase(b.sha, baseB.sha), c = sha && (await repo.commit(sha));
        if (c && (!fork || c.time < fork.time)) fork = c;
      }
      if (fork) { since = fork.time; keep = new Set([fork.sha]); } else max = specB.length ? 40 : 20;
      for (const b of branches) {
        b.running = !!fork && !b.spec && !b.base && b.time >= since && b.sha !== fork.sha;
        b.shown = !!b.spec || b.base || b.head || b.running;
      }
    }
    const listed = branches.filter((b) => b.shown);
    const { commits, more } = await repo.walk([...new Set(listed.map((b) => b.sha).concat(refs.head.sha || []))], { max, since, keep });
    const bySha = new Map(commits.map((c) => [c.sha, c]));
    const reach = (starts) => { const seen = new Set(), st = [...starts]; while (st.length) { const x = st.pop(); if (seen.has(x) || !bySha.has(x)) continue; seen.add(x); st.push(...bySha.get(x).parents); } return seen; };
    const onBase = reach(branches.filter((b) => b.base).map((b) => b.sha));
    const ofSpec = new Set([...reach(branches.filter((b) => b.spec).map((b) => b.sha))].filter((x) => !onBase.has(x)));
    const labels = new Map();
    for (const b of branches) if (bySha.has(b.sha)) labels.set(b.sha, [...(labels.get(b.sha) || []), b]);
    return { branches, listed, head: refs.head, base, fork, since, rows: GitRead.layout(commits), more, ofSpec, labels, running: listed.filter((b) => b.running).length };
  }

  // Returns whether what the panel shows for w changed.
  async function read(w) {
    const v = viewOf(w.repo), before = v.stamp;
    try {
      const opened = await source.open(w.repo, state.brain);
      if (opened.state !== 'ok') v.state = opened.state;
      else {
        if (v.repo !== opened.repo) Object.assign(v, { repo: opened.repo, sig: null });
        const refs = await v.repo.refs(), want = `${w.spec}|${w.base || ''}|${w.mode}|${w.days}`;
        if (refs.sig !== v.sig || want !== v.want || v.state !== 'ok') {
          v.repo.reload();
          Object.assign(v, await build(v.repo, refs, w), { state: 'ok', sig: refs.sig, want, err: null });
        }
      }
    } catch (e) { Object.assign(v, e.unlinked ? { state: 'unlinked', err: null, repo: null, sig: null } : { state: 'error', err: NOTE[e.message] || String(e.message || e), repo: null }); }
    v.stamp = [v.state, v.sig, v.want, v.err, v.note].join('|');
    return v.stamp !== before;
  }

  async function tick() {
    if (busy || !watched.length || !/\/specs\/[^/]+/.test(location.hash) || document.hidden) return;
    busy = true;
    try { let changed = false; for (const w of watched) changed = (await read(w)) || changed; if (changed) fire(); } finally { busy = false; }
  }

  return {
    // list: [{ repo (a D.repos entry), spec (its folder), base (its branch from the spec's Base line, or null),
    // mode ('simple' or 'explore'), days (explore's window) }]
    watch(list) {
      const key = JSON.stringify(list.map((w) => [keyOf(w.repo), w.spec, w.base, w.mode, w.days]));
      if (key === watchKey) return;
      watchKey = key; watched = list; tick();
    },
    view: (repo) => viewOf(repo),
    tick,
    // Asks for a clone's folder and keeps it when its origin names the card's remote (for a local-only repository,
    // when the folder's name is the slug or its repos.json path's last segment).
    async grant(repo) {
      let h;
      try { h = await window.showDirectoryPicker({ id: 'clone', mode: 'read' }); } catch { return; }
      const v = viewOf(repo);
      let g;
      try { g = await GitRead.open(h); } catch (e) { v.note = NOTE[e.message] || String(e.message || e); return fire(); }
      const url = await g.remoteUrl(), tail = (repo.path || '').split('/').pop().toLowerCase();
      const ok = hasRemote(repo) ? norm(url) === norm(repo.remote) : [repo.slug.toLowerCase(), tail].includes(h.name.toLowerCase());
      if (!ok) {
        v.note = hasRemote(repo) ? `${h.name}'s origin is ${url || 'not set'}, not ${repo.remote}: pick the clone of ${repo.slug}.` : `Pick the folder named ${tail || repo.slug}.`;
        return fire();
      }
      await source.grant(repo, h); v.note = null; v.sig = null;
      fire(); await tick();
    },
    // after a browser restart: asks again for each granted clone of these repositories that lost its permission
    async reconnect(repos) {
      await source.reconnect(repos);
      fire(); await tick();
    },
  };
})();

// ---------- reading, adding, removing ----------

// Re-reads what is on screen, the open brain or every listed one, and redraws only when a file changed.
async function refresh() {
  if (state.brain) { if (await readBrain(state.brain)) showBrain(); return; }
  if ((await Promise.all(state.brains.map(readBrain))).some(Boolean)) showHome();
}
// The folder source calls back on every tick, so a hidden page skips it. The server source calls back on a change event
// { brain, changed, times }, so the open brain re-reads at once, even when a re-read is running: the next one follows it.
let reading = false, again = false;
source.subscribe(async (event) => {
  if (!state.brain || (event ? event.brain !== state.brain.id : document.hidden)) return;
  if (reading) { if (event) again = true; return; }
  reading = true;
  try {
    do { again = false; await refresh(); await Clones.tick(); } while (again);
  } finally { reading = false; }
});

// A brain shows as its folder's name; a clashing name takes the first free number suffix.
function uniqueName(name) {
  const taken = new Set(state.brains.map((b) => b.name));
  let n = 1, out = name;
  while (taken.has(out)) out = `${name} ${++n}`;
  return out;
}

// Over the server, Add brain has the server open the machine's folder dialog, since the browser's picker never tells the
// path; the button waits while the dialog is open. A machine with no dialog falls back to a typed path.
async function addBrainByPicking() {
  const button = $('open'), label = button.textContent;
  button.disabled = true;
  button.textContent = 'Choose a folder…';
  let entry;
  try { entry = await source.pick(); } catch (e) {
    if (e.unavailable) return addBrainByPath();
    state.notice = e.notABrain
      ? `No <code>BRAIN.md</code> or <code>.brain/BRAIN.md</code> in that folder. Pick the brain's folder, the one holding <code>BRAIN.md</code> or a <code>.brain/</code> folder; <code>/brain setup</code> creates one.`
      : `Could not add a brain: ${esc(e.message)}`;
    return state.brain ? goBrain(null) : showHome();
  } finally {
    button.disabled = false;
    button.textContent = label;
  }
  if (entry) await showAdded(entry);
}

// Over the server with no folder dialog, Add brain takes the brain folder's path, typed, and the server lists it.
async function addBrainByPath() {
  const path = (window.prompt('The absolute path of the brain folder, the one holding BRAIN.md') || '').trim();
  if (!path) return;
  let entry;
  try { entry = await source.add(path); } catch (e) {
    state.notice = `Could not add <b>${esc(path)}</b>: ${esc(e.message)}`;
    return state.brain ? goBrain(null) : showHome();
  }
  await showAdded(entry);
}

// Lists the brain the server just added, unless it already is, and opens it.
async function showAdded(entry) {
  state.notice = '';
  let b = state.brains.find((x) => x.id === entry.id);
  if (!b) { b = entry; state.brains.push(b); }
  await readBrain(b);
  goBrain(b.id);
}

async function addBrain() {
  if (viaServer) return addBrainByPicking();
  let handle;
  try { handle = await window.showDirectoryPicker({ id: 'brain', mode: 'read' }); } catch { return; }
  for (const b of state.brains) if (await b.handle.isSameEntry(handle).catch(() => false)) return goBrain(b.id);
  // a brain's folder holds BRAIN.md, or holds a .brain/ folder that does
  const holdsBrain = async () => {
    try { await handle.getFileHandle('BRAIN.md'); return true; } catch {}
    try { await (await handle.getDirectoryHandle('.brain')).getFileHandle('BRAIN.md'); return true; } catch { return false; }
  };
  if (!(await holdsBrain())) {
    state.notice = `No <code>BRAIN.md</code> or <code>.brain/BRAIN.md</code> in <b>${esc(handle.name)}</b>. Pick the brain's folder, the one holding <code>BRAIN.md</code> or a <code>.brain/</code> folder; <code>/brain setup</code> creates one.`;
    return state.brain ? goBrain(null) : showHome();
  }
  state.notice = '';
  const b = { id: Math.random().toString(36).slice(2, 8), name: uniqueName(handle.name), handle };
  state.brains.push(b);
  await saveBrains();
  await readBrain(b);
  goBrain(b.id);
}

async function removeBrain(id) {
  if (viaServer) { try { await source.remove({ id }); } catch { return; } }
  state.brains = state.brains.filter((b) => b.id !== id);
  await saveBrains();
  showHome();
}

async function reconnect(b) {
  try { await b.handle.requestPermission({ mode: 'read' }); } catch {}
  await readBrain(b);
  if (b.status === 'ok') await Clones.reconnect(b.data.repos);
  if (state.brain) showBrain(); else showHome();
}

async function applyRoute() {
  const b = state.brains.find((x) => x.id === route()) || null;
  if (b && b === state.brain && b.status === 'ok' && !$('view').classList.contains('hidden')) return App.render();
  state.brain = b;
  if (!b) return showHome();
  await readBrain(b);
  showBrain();
}

async function restore() {
  if (!viaServer && !window.showDirectoryPicker) {
    $('open').classList.add('hidden');
    return showHome('This page needs Chrome or Edge: it reads your brains through their folder access.');
  }
  state.brains = await source.brains();
  await Promise.all(state.brains.map(readBrain));
  applyRoute();
}

$('open').onclick = addBrain;
$('reload').onclick = () => refresh().then(Clones.tick);
window.addEventListener('hashchange', applyRoute);
// The folder source has no change events, so the page re-reads when it regains focus. The server pushes the brain's changes,
// but not a clone's: a clone's refs move with no brain file changing, so the page re-reads those on focus.
window.addEventListener('focus', () => (viaServer ? Clones.tick() : refresh().then(Clones.tick)));
restore();

</script>
</body>
</html>

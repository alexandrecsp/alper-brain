// The collapsed spec list: each spec as its number and status dot, its title in the tooltip.
function specRail(spec) {
  const on = 'bg-white shadow-sm ring-1 ring-zinc-200 dark:bg-zinc-900 dark:ring-zinc-800';
  const off = 'text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-900 dark:hover:text-zinc-100';
  return `<div class="flex flex-col items-center gap-1 px-2 py-3">
    ${sideToggle()}
    <button data-home title="Overview" class="grid h-9 w-9 place-items-center rounded-md ${!spec ? on : off}">${OVERVIEW_ICON}</button>
    <div class="my-2 h-px w-6 bg-zinc-200 dark:bg-zinc-800"></div>
    ${[...state.specs].reverse().map((s) => {
      const st = STATUS[s.status];
      return `<button data-go="${esc(s.id)}" title="${esc(s.num)} · ${esc(s.title)} · ${st.label} · ${pctOf(s.tickets)}%" class="relative grid h-9 w-9 shrink-0 place-items-center rounded-md font-mono text-xs ${s === spec ? `${on} font-semibold` : off}">
        ${esc(s.num)}<span class="absolute right-1 top-1 h-1.5 w-1.5 rounded-full bg-gradient-to-r ${st.accent}"></span>
      </button>`;
    }).join('')}
  </div>`;
}

// The first todo ticket whose dependencies are all done: what /build picks up next.
const nextTicket = (spec) => spec.tickets.find((t) => t.status === 'todo'
  && t.deps.every((d) => (spec.tickets.find((x) => x.num === d)?.status ?? 'done') === 'done'));

function specPanel(spec) {
  const st = STATUS[spec.status], ts = spec.tickets, pct = pctOf(ts);
  const doing = ts.filter((t) => isDoing(t.status));
  const blocked = ts.filter((t) => t.status === 'blocked');
  const msDone = spec.milestones.filter((m) => milestoneStatus(m) === 'done').length;
  const live = [...doing, ...blocked];
  const closing = spec.milestones.filter(isClosing);
  const next = nextTicket(spec);
  const caps = (t) => `<p class="mb-2 text-[11px] font-medium uppercase tracking-widest text-zinc-400">${t}</p>`;
  const of = (n, total) => `${n}<span class="text-xs font-normal text-zinc-400">/${total}</span>`;
  const stat = (label, value, tone = '') => `<div class="rounded-lg border border-zinc-200 dark:border-zinc-800 px-3 py-2"><dt class="text-[11px] text-zinc-500">${label}</dt><dd class="text-lg font-semibold tabular-nums tracking-tight ${tone}">${value}</dd></div>`;
  return `<div class="h-1 bg-gradient-to-r ${st.accent}"></div>
  <div class="space-y-7 p-5">
    <div>
      <div class="flex flex-wrap items-center gap-2 text-xs">
        <span class="font-mono uppercase tracking-widest text-zinc-500">Spec ${esc(spec.num)}</span>
        ${spec.key ? `<span class="rounded bg-zinc-100 dark:bg-zinc-800 px-1.5 py-0.5 font-mono text-zinc-600 dark:text-zinc-300">${esc(spec.key)}</span>` : ''}
        ${spec.repos.map(repoChip).join('')}
        <span class="rounded-full px-2 py-0.5 font-medium ${st.tone}">${st.label}</span>
      </div>
      <button data-open-spec class="mt-2 text-left text-xl font-semibold leading-snug tracking-tight decoration-zinc-300 underline-offset-4 hover:underline dark:decoration-zinc-600" title="Read the spec">${esc(spec.title)}</button>
      ${spec.summary ? `<p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400 line-clamp-4">${esc(spec.summary)}</p>` : ''}
    </div>
    <div class="flex items-center gap-4">
      ${ring(pct, 76, 7, `<span class="text-center leading-tight"><span class="block text-base font-semibold tabular-nums">${pct}%</span><span class="text-[8px] uppercase tracking-widest text-zinc-500">done</span></span>`)}
      <dl class="grid flex-1 grid-cols-2 gap-2">
        ${stat('Tickets', of(doneOf(ts), ts.length))}
        ${stat('Milestones', of(msDone, spec.milestones.length))}
        ${stat('Doing', doing.length, doing.length ? 'text-amber-600 dark:text-amber-400' : '')}
        ${stat('Blocked', blocked.length, blocked.length ? 'text-red-600 dark:text-red-400' : '')}
      </dl>
    </div>
    ${spec.deps.length ? `<div>${caps('Depends on')}<div class="-mx-2 space-y-0.5">${spec.deps.map((d) => `
      <button ${d.spec ? `data-go="${esc(d.id)}"` : 'disabled'} class="flex w-full min-w-0 items-center gap-2 rounded-md px-2 py-1.5 text-left text-sm enabled:hover:bg-zinc-100 dark:enabled:hover:bg-zinc-900">
        <span class="font-mono text-xs text-zinc-400">${esc(numOf(d.id))}</span>
        <span class="min-w-0 flex-1 truncate">${esc(d.spec ? d.spec.title : unslug(d.id))}</span>
        ${d.spec?.landed ? `<span class="text-xs text-emerald-600 dark:text-emerald-400" title="Landed as ${esc(d.spec.landed)}">Landed</span>`
          : `<span class="text-xs text-violet-600 dark:text-violet-400">${d.spec?.abandoned ? 'Abandoned' : d.spec ? 'Not landed' : 'Missing'}</span>`}
      </button>`).join('')}</div></div>` : ''}
    ${live.length || closing.length ? `<div>${caps('Now building')}<div class="-mx-2 space-y-0.5">${closing.map((m) => closingRow(m)).join('')}${live.map((t) => ticketChip(t)).join('')}</div></div>` : ''}
    ${next && !live.length && !closing.length ? `<div>${caps('Up next')}
      <button data-ticket-ref="${esc(spec.id)}|${esc(next.num)}" class="flex w-full items-start gap-2.5 rounded-lg border border-dashed border-zinc-300 dark:border-zinc-700 px-3 py-2.5 text-left hover:border-zinc-400 dark:hover:border-zinc-500">
        ${statusIcon(next.status, 'h-4 w-4 mt-0.5')}
        <span class="min-w-0"><span class="block text-sm font-medium leading-snug">${esc(next.title)}</span><span class="text-xs text-zinc-500"><span class="font-mono">#${esc(next.num)}</span> · M${esc(next.milestone.num)} ${esc(next.milestone.title)}</span></span>
      </button></div>` : ''}
    ${spec.milestones.length ? `<div>${caps('Milestones')}<div class="-mx-2 space-y-0.5">${spec.milestones.map((m) => `
      <button data-milestone="${esc(m.id)}" class="group block w-full rounded-md px-2 py-1.5 text-left hover:bg-zinc-100 dark:hover:bg-zinc-900">
        <div class="flex items-center gap-2 text-xs">
          <span class="font-mono text-zinc-400">${esc(mName(m))}</span>
          <span class="min-w-0 flex-1 truncate text-zinc-700 group-hover:underline dark:text-zinc-200">${esc(m.title)}</span>
          ${m.repo && spec.repos.length > 1 ? repoChip(m.repo) : ''}
          ${isClosing(m) ? milestonePill(m) : `<span class="tabular-nums text-zinc-500">${doneOf(m.tickets)}/${m.tickets.length}</span>`}
        </div>
        <div class="mt-1.5">${fill(m, 'h-1')}</div>
      </button>`).join('')}</div></div>` : ''}
    <button data-open-spec class="w-full rounded-md border border-zinc-200 dark:border-zinc-800 py-1.5 text-sm hover:bg-zinc-50 dark:hover:bg-zinc-900">Read the spec</button>
  </div>`;
}

// ---------- drawer ----------

// A drawer tab names a spec, one of its milestones or one of its tickets, so it still resolves after a re-parse.
const specRef = (spec) => ({ kind: 'spec', spec: spec.id });
const milestoneRef = (spec, m) => ({ kind: 'milestone', spec: spec.id, id: m.id });
const ticketRef = (spec, n) => ({ kind: 'ticket', spec: spec.id, id: n });
// A review belongs to a milestone, or to the spec when it reviewed the whole spec.
const reviewRef = (spec, m) => ({ kind: 'review', spec: spec.id, id: m?.id });
// A milestone deciding its escalations opens on its review.
const openMilestone = (spec, m) => openDoc([milestoneRef(spec, m), reviewRef(spec, m), specRef(spec)], m.phase === 'decide' && m.review ? 1 : 0);

function resolve(ref) {
  if (ref.kind === 'note') return resolveNote(ref);
  const spec = state.specs.find((s) => s.id === ref.spec);
  if (!spec) return null;
  const badge = (tone, label) => `<span class="rounded-full px-2 py-0.5 text-xs font-medium ${tone}">${label}</span>`;
  const count = (ts) => `<span class="inline-flex items-center gap-1.5 text-xs text-zinc-500">${ring(pctOf(ts), 14, 2.5)}${doneOf(ts)}/${plural(ts.length, 'ticket')} done</span>`;
  const sep = '<span class="text-zinc-300 dark:text-zinc-700">·</span>';
  if (ref.kind === 'spec') {
    const st = STATUS[spec.status];
    return {
      label: 'Spec', path: spec.path, accent: 'bg-gradient-to-r ' + st.accent, title: spec.title,
      kicker: `<span class="font-mono">Spec ${esc(spec.num)}</span>`,
      badges: badge(st.tone, st.label) + (spec.key ? `<span class="rounded bg-zinc-100 dark:bg-zinc-800 px-1.5 py-0.5 font-mono text-xs text-zinc-600 dark:text-zinc-300">${esc(spec.key)}</span>` : '') + spec.repos.map(repoChip).join('') + count(spec.tickets),
    };
  }
  if (ref.kind === 'milestone') {
    const m = spec.milestones.find((m) => m.id === ref.id);
    if (!m) return null;
    const st = milestoneStatus(m);
    return {
      label: 'Milestone', path: m.path, accent: 'bg-gradient-to-r ' + STATUS[st].accent, title: m.title,
      kicker: `<span class="font-mono">Milestone ${esc(mName(m))}</span>${sep}<span class="truncate">${esc(spec.title)}</span>`,
      badges: milestonePill(m) + (m.repo ? repoChip(m.repo) : '') + count(m.tickets)
        + (m.squash ? `<span class="rounded-md border border-zinc-200 dark:border-zinc-700 px-1.5 font-mono text-xs text-zinc-500" title="Squash">${esc(m.squash)}</span>` : '')
        + (m.landed ? `<span class="text-xs text-emerald-600 dark:text-emerald-400" title="Landed as ${esc(m.landed)}">Landed</span>` : ''),
    };
  }
  if (ref.kind === 'review') {
    const m = ref.id && spec.milestones.find((m) => m.id === ref.id);
    if (ref.id && !m) return null;
    return {
      label: 'Review', path: m ? m.review : spec.review, accent: 'bg-gradient-to-r ' + STATUS[m ? milestoneStatus(m) : spec.status].accent,
      title: `Review of ${m ? m.title : spec.title}`,
      kicker: m ? `<span class="font-mono">Milestone ${esc(mName(m))}</span>${sep}<span class="truncate">${esc(spec.title)}</span>` : `<span class="font-mono">Spec ${esc(spec.num)}</span>`,
      badges: m ? milestonePill(m) : '',
    };
  }
  const t = spec.tickets.find((t) => t.num === ref.id);
  if (!t) return null;
  return {
    label: `Ticket #${t.num}`, path: t.path, accent: columnAccent(t.status), title: t.title,
    kicker: `${statusIcon(t.status, 'h-3.5 w-3.5')}<span class="font-mono">Ticket #${esc(t.num)}</span>${sep}<span class="truncate">M${esc(t.milestone.num)} · ${esc(t.milestone.title)}</span>`,
    badges: pill(t.status) + depChips(t) + commitChip(t),
  };
}

// Splits a file into the fields the drawer shows as a details box (front matter and the leading
// `**Field:** value` lines) and the markdown body below them. The title is dropped: the header shows it.
const HEADER_FIELDS = /^(status|milestone|key|feature|title)$/i;
function splitDoc(text) {
  let body = text.replace(/^﻿/, '');
  const meta = [];
  const fm = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(body);
  if (fm) {
    body = body.slice(fm[0].length);
    for (const l of fm[1].split(/\r?\n/)) {
      const m = /^([\w-]+):\s*(.*)$/.exec(l);
      if (m) meta.push([m[1], m[2].replace(/^(["'])(.*)\1$/, '$2') || '—']);
    }
  }
  const lines = body.replace(/^\s*#\s+.+(\r?\n|$)/, '').split(/\r?\n/);
  let i = 0;
  for (; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const m = /^\*\*([^*]+?):\*\*\s*(.*)$/.exec(lines[i]);
    if (!m) break;
    meta.push([m[1], m[2]]);
  }
  return { meta: meta.filter(([k, v]) => !HEADER_FIELDS.test(k) && !/^none\.?$/i.test(v)), body: lines.slice(i).join('\n') };
}

// Markdown task-list checkboxes render disabled, which browsers grey out; these draw them as icons instead.
const tasks = (html) => html.replace(/<input (checked="" )?disabled="" type="checkbox">/g, (_, on) => on
  ? '<span class="task checked"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l2.2 2.2 4.8-5.2"/></svg></span>'
  : '<span class="task"></span>');

function openTicket(spec, n, active = 0) {
  const t = spec.tickets.find((t) => t.num === n);
  openDoc([ticketRef(spec, n), milestoneRef(spec, t.milestone), reviewRef(spec, t.milestone), specRef(spec)], active);
}

function openDoc(refs, active = 0) {
  refs = refs.filter((r) => { const x = resolve(r); return x && (x.path || x.html); });
  if (!refs.length) return;
  state.doc = { refs, active: Math.min(active, refs.length - 1) };
  const d = $('drawer');
  clearTimeout(d.closing);
  d.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('open')));
  renderDoc();
}

// Moves the drawer to the previous or next ticket of the spec, keeping the tab that was open.
function stepTicket(delta) {
  const ref = state.doc?.refs[0];
  if (ref?.kind !== 'ticket') return;
  const spec = state.specs.find((s) => s.id === ref.spec);
  const ts = spec?.tickets || [];
  const t = ts[ts.findIndex((t) => t.num === ref.id) + delta];
  if (t) openTicket(spec, t.num, state.doc.active);
}

function renderDoc(keepScroll) {
  const { refs, active } = state.doc;
  const tabs = refs.map(resolve);
  const cur = tabs[active];

  $('tabs').innerHTML = tabs.map((tab, i) => `<button data-tab="${i}" class="-mb-px border-b-2 pb-2.5 transition ${i === active
    ? 'border-emerald-500 font-medium text-zinc-900 dark:text-zinc-100'
    : 'border-transparent text-zinc-500 hover:border-zinc-300 hover:text-zinc-900 dark:hover:border-zinc-700 dark:hover:text-zinc-100'}">${esc(tab?.label ?? 'Missing')}</button>`).join('');
  $('tabs').querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { state.doc.active = +b.dataset.tab; renderDoc(); }));

  const ticket = refs[0].kind === 'ticket';
  $('docNav').classList.toggle('hidden', !ticket);
  $('docNav').classList.toggle('flex', ticket);
  if (ticket) {
    const ts = state.specs.find((s) => s.id === refs[0].spec)?.tickets || [];
    const i = ts.findIndex((t) => t.num === refs[0].id);
    $('prev').disabled = i <= 0;
    $('next').disabled = i < 0 || i >= ts.length - 1;
  }

  $('docAccent').className = 'h-1 shrink-0 ' + (cur?.accent || 'bg-zinc-300 dark:bg-zinc-700');
  $('docHead').innerHTML = cur ? `
    <div class="flex min-w-0 items-center gap-2 text-xs text-zinc-500">${cur.kicker}</div>
    <h2 class="mt-1.5 text-xl font-semibold leading-snug tracking-tight">${esc(cur.title)}</h2>
    <div class="mt-3 flex flex-wrap items-center gap-2">${cur.badges}</div>`
    : '<h2 class="text-xl font-semibold tracking-tight">Not found</h2>';
  $('docPath').textContent = !cur ? '' : cur.shown ?? '.sdd/specs/' + cur.path;
  $('copyPath').classList.toggle('hidden', !$('docPath').textContent);

  const text = cur && !cur.html ? state.files.get(cur.path) : null;
  let html = cur?.html || '<p>This file no longer exists.</p>';
  if (text != null) {
    const { meta, body } = splitDoc(text);
    html = (meta.length ? `
      <dl class="not-prose mb-7 grid grid-cols-[max-content,1fr] gap-x-6 gap-y-2 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50/70 dark:bg-zinc-900/50 px-4 py-3 text-sm">
        ${meta.map(([k, v]) => `<dt class="text-zinc-500">${esc(k)}</dt><dd class="min-w-0 break-words text-zinc-800 dark:text-zinc-200 [&_code]:rounded [&_code]:bg-zinc-200/60 [&_code]:px-1 [&_code]:text-xs dark:[&_code]:bg-zinc-800">${marked.parseInline(v)}</dd>`).join('')}
      </dl>` : '') + tasks(marked.parse(body));
  }
  if (keepScroll && $('doc').dataset.html === html) return;
  const top = $('docScroll').scrollTop;
  $('doc').innerHTML = html;
  $('doc').dataset.html = html;
  drawDiagrams(html);
  $('docScroll').scrollTop = keepScroll ? top : 0;
  marks();
}

// ---------- diagrams ----------

// Mermaid loads on the first diagram, so documents without one never fetch it. Drawn diagrams are cached
// by theme and source, so a live reload redraws them without a flash.
let mermaidLib, mermaidQueue = Promise.resolve(), diagramSeq = 0;
const darkMode = matchMedia('(prefers-color-scheme: dark)');
const drawn = new Map();
const diagramKey = (src) => (darkMode.matches ? 'dark' : 'neutral') + '\n' + src;

// Mermaid renders one diagram at a time, so draws queue up.
function drawDiagram(src) {
  const key = diagramKey(src);
  const run = mermaidQueue.then(async () => {
    if (drawn.has(key)) return drawn.get(key);
    mermaidLib ??= import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs').then((m) => m.default);
    const mermaid = await mermaidLib.catch((e) => { mermaidLib = null; throw new Error('Mermaid could not load: ' + e.message); });
    mermaid.initialize({ startOnLoad: false, theme: darkMode.matches ? 'dark' : 'neutral', securityLevel: 'strict', suppressErrorRendering: true, themeVariables: { fontFamily: 'inherit' } });
    await mermaid.parse(src);
    const id = 'mmd' + ++diagramSeq;
    try {
      const { svg } = await mermaid.render(id, src);
      drawn.set(key, svg);
      return svg;
    } finally {
      document.getElementById('d' + id)?.remove();
    }
  });
  mermaidQueue = run.catch(() => {});
  return run;
}

const figure = (svg) => `<figure class="not-prose group relative my-6 overflow-x-auto rounded-xl border border-zinc-200 bg-zinc-50/60 p-4 dark:border-zinc-800 dark:bg-zinc-900/40">
  <button data-zoom class="absolute right-2 top-2 grid h-7 w-7 place-items-center rounded-md text-zinc-500 opacity-0 transition hover:bg-zinc-200/70 hover:text-zinc-900 focus:opacity-100 group-hover:opacity-100 dark:hover:bg-zinc-800 dark:hover:text-zinc-100" title="Expand" aria-label="Expand diagram"><svg class="h-4 w-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9"/></svg></button>
  <div class="flex justify-center">${svg}</div>
</figure>`;

function placeDiagram(pre, svg) {
  pre.insertAdjacentHTML('afterend', figure(svg));
  const fig = pre.nextElementSibling;
  fig.querySelector('[data-zoom]').onclick = () => zoomDiagram(fig.querySelector('div > svg'));
  pre.remove();
}

// Swaps each mermaid code block of the open document for its diagram. Cached diagrams go in at once;
// the rest pulse until drawn. A block that fails stays as code, with the error under it.
async function drawDiagrams(html) {
  const pres = [...$('doc').querySelectorAll('pre > code.language-mermaid')].map((c) => c.parentElement);
  const pending = [];
  for (const pre of pres) {
    const svg = drawn.get(diagramKey(pre.textContent));
    if (svg) placeDiagram(pre, svg);
    else { pre.classList.add('drawing'); pending.push(pre); }
  }
  for (const pre of pending) {
    let svg, error;
    try { svg = await drawDiagram(pre.textContent); } catch (e) { error = String(e?.message || e); }
    if ($('doc').dataset.html !== html || !pre.isConnected) return;
    pre.classList.remove('drawing');
    if (svg) placeDiagram(pre, svg);
    else pre.insertAdjacentHTML('afterend', `<p class="not-prose -mt-4 mb-6 whitespace-pre-wrap text-xs text-red-600 dark:text-red-400">This diagram could not be drawn: <span class="font-mono">${esc(error)}</span></p>`);
  }
}

function zoomDiagram(svg) {
  $('zoom').innerHTML = svg.outerHTML;
  $('zoom').classList.remove('hidden');
}
const closeZoom = () => $('zoom').classList.add('hidden');
const zoomed = () => !$('zoom').classList.contains('hidden');

// Switching the OS theme redraws the open document's diagrams in the new theme.
darkMode.addEventListener('change', () => {
  if (!state.doc) return;
  $('doc').dataset.html = '';
  renderDoc(true);
});

function closeDoc() {
  closeZoom();
  if (!state.doc) return;
  state.doc = null;
  const d = $('drawer');
  d.classList.remove('open');
  d.closing = setTimeout(() => d.classList.add('hidden'), 280);
  marks();
}

// ---------- notes ----------

// A note's type is drawn as its shape and its muted colour (the --t-* tokens). Six hues cannot all stay apart
// for colour-blind readers on a scatter of nodes, so the shape is what tells two similar hues apart.
// A topic's hexagon, drawn like d3's own symbols: centred on the origin, its area the size given.
const symbolHexagon = { draw(ctx, size) {
  const r = Math.sqrt(size / (1.5 * Math.sqrt(3)));
  for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i - Math.PI / 2; ctx[i ? 'lineTo' : 'moveTo'](r * Math.cos(a), r * Math.sin(a)); }
  ctx.closePath();
} };
const SHAPES = { feature: d3.symbolWye, concept: d3.symbolCircle, decision: d3.symbolSquare, gotcha: d3.symbolTriangle, contract: d3.symbolDiamond, 'how-to': d3.symbolStar, topic: symbolHexagon, other: d3.symbolCross };
const glyph = (type, size = 150) => d3.symbol().type(SHAPES[type] || SHAPES.other).size(size)();
const tint = (type) => `var(--t-${SHAPES[type] ? type : 'other'})`;
const icon = (type) => `<svg class="h-3.5 w-3.5" viewBox="-8 -8 16 16" style="color: ${tint(type)}"><path d="${glyph(type, 70)}" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>`;

// [[name]], [[name#heading]] and [[name|alias]], as Obsidian writes them.
const WIKI = /\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]*))?\]\]/g;

// The Notes section's own filters: graph or list, one repository or all, the types hidden, and the search.
const nv = {
  view: store.get('noteView') || 'graph',
  // The list's order: 'recent' puts drafts first, then the notes changed last; 'name' groups them by repository.
  sort: store.get('noteSort') === 'name' ? 'name' : 'recent',
  repo: store.get('noteRepo') || 'all',
  hidden: (() => { try { return new Set(JSON.parse(store.get('noteHidden') || '[]')); } catch { return new Set(); } })(),
  query: '',
  // The time slider: the index of the timeline commit the graph stands at, or null for now.
  at: null,
};

// timeline.json, by the brain's FORMAT.md **Timeline**; null when the brain has none or it does not parse.
function parseTimeline(text) {
  if (!text) return null;
  try {
    const t = JSON.parse(text);
    if (!Array.isArray(t.commits)) return null;
    const commits = t.commits.map((c) => ({ ...c, changes: Array.isArray(c.changes) ? c.changes : [] }));
    // Each note's last change and first record, by name, for the notes list.
    const last = new Map(), first = new Map();
    for (const c of commits) for (const x of c.changes) {
      last.set(x.note, { date: c.date, author: c.author, action: x.action, sha: c.sha });
      if (!first.has(x.note)) first.set(x.note, c.date);
    }
    return { commits, last, first };
  } catch { return null; }
}

// The names of the notes alive after commit i of the timeline, or null for now. A note no commit holds yet,
// such as a draft, shows only at now.
function aliveAt(i) {
  const commits = state.timeline?.commits;
  if (i === null || i === undefined || !commits) return null;
  const alive = new Set();
  for (const c of commits.slice(0, i + 1)) for (const x of c.changes) {
    if (x.action === 'deleted') alive.delete(x.note);
    else {
      // A move can also join a deleted note and a new one git found alike: the old name goes.
      if (x.from) alive.delete(x.from.split('/').at(-1).replace(/\.md$/, ''));
      alive.add(x.note);
    }
  }
  return alive;
}

function timeSlider() {
  const commits = state.timeline?.commits || [];
  $('noteTime').classList.toggle('hidden', !commits.length);
  $('noteTime').classList.toggle('inline-flex', !!commits.length);
  if (!commits.length) { nv.at = null; return; }
  if (nv.at !== null && nv.at >= commits.length) nv.at = null;
  const input = $('noteAt');
  input.max = commits.length;
  input.value = nv.at === null ? commits.length : nv.at;
  $('noteAtLabel').textContent = nv.at === null ? 'now' : commits[nv.at].date.slice(0, 10);
}

function parseNote(file, text) {
  // A draft is read as the note it would land as, at its target.
  const draft = file.startsWith('.sdd/drafts/');
  const head = draft ? (/^---\r?\n([\s\S]*?)\r?\n---/.exec(text) || [])[1] || '' : '';
  const target = draft ? (/^target:\s*(.+)$/m.exec(head) || [])[1]?.trim().replace(/^["']|["']$/g, '') : null;
  if (draft && !target) return null;
  const path = draft ? target : file;
  const parts = path.split('/');
  if (parts[0] === 'repos' && parts.length < 3) return null;
  // A repository's card is its hub in the graph, not a note.
  if (parts[0] === 'repos' && parts.length === 3 && parts[2] === 'REPO.md') return null;
  const m = /^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(text);
  const fm = {};
  if (m) for (const line of m[1].split(/\r?\n/)) {
    const kv = /^([\w-]+):\s*(.*)$/.exec(line);
    if (kv) fm[kv[1]] = kv[2].trim().replace(/^["']|["']$/g, '');
  }
  const body = m ? text.slice(m[0].length) : text;
  const id = parts.at(-1).replace(/\.md$/, '');
  const repos = parts[0] === 'repos' ? [parts[1]]
    : (fm.repos || '').replace(/^\[|\]$/g, '').split(',').map((r) => r.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
  const links = [...new Set([...body.matchAll(WIKI)].map((x) => x[1].trim()))].filter((l) => l !== id);
  return {
    id, path: file, description: fm.description || '', type: SHAPES[fm.type] && fm.type !== 'other' ? fm.type : 'other', repos, shared: parts[0] === 'shared', body, links,
    draft: draft ? fm.action || 'record' : null, supersedes: fm.supersedes || null,
    superseded: fm.status === 'superseded', supersededBy: fm.supersededBy || null,
  };
}

// Notes resolve by file name, as Obsidian resolves [[links]]: the first file wins a name used twice, and the rest are reported.
// A draft adds a node only when it adds a note; one that updates or deletes a note marks that note instead.
function parseNotes(files, dirs) {
  const notes = new Map(), dupes = [], drafts = [];
  for (const [path, text] of files) {
    const n = parseNote(path, text);
    if (!n) continue;
    if (n.draft) drafts.push(n);
    else if (notes.has(n.id)) dupes.push(path);
    else notes.set(n.id, n);
  }
  for (const d of drafts) {
    const own = notes.get(d.id);
    if (own) own.pending = d.draft;
    else if (d.draft !== 'delete') notes.set(d.id, d);
    const old = d.draft === 'supersede' && notes.get(d.supersedes);
    if (old && old !== d) old.pending = 'supersede';
  }
  const repos = new Set(dirs);
  const ghosts = new Set(), backlinks = new Map();
  for (const n of notes.values()) {
    n.repos.forEach((r) => repos.add(r));
    for (const l of n.links) {
      if (!notes.has(l)) ghosts.add(l);
      if (!backlinks.has(l)) backlinks.set(l, []);
      backlinks.get(l).push(n.id);
    }
  }
  return { notes, repos: [...repos].sort(), ghosts, backlinks, dupes };
}

// The notes the filters keep: their types not hidden, and with a repository picked, its notes and their neighbours one link away.
function shownNotes() {
  const { notes } = state.notes;
  let keep = [...notes.values()].filter((n) => !nv.hidden.has(n.type));
  // With the time slider moved back, only the notes alive after that commit.
  const alive = aliveAt(nv.at);
  if (alive) keep = keep.filter((n) => alive.has(n.id));
  if (nv.repo !== 'all') {
    const own = new Set(keep.filter((n) => n.repos.includes(nv.repo)).map((n) => n.id));
    const near = new Set(own);
    for (const n of keep) {
      if (own.has(n.id)) n.links.forEach((l) => near.add(l));
      else if (n.links.some((l) => own.has(l))) near.add(n.id);
    }
    keep = keep.filter((n) => near.has(n.id));
  }
  return keep;
}

function graphData() {
  const { notes, repos } = state.notes;
  const keep = shownNotes();
  const ids = new Set(keep.map((n) => n.id));
  const count = new Map();
  keep.forEach((n) => n.repos.forEach((r) => count.set(r, (count.get(r) || 0) + 1)));
  const hubs = nv.repo === 'all' ? repos : repos.filter((r) => r === nv.repo || count.has(r));
  const nodes = hubs.map((r) => ({ id: 'r:' + r, kind: 'repo', label: r, count: count.get(r) || 0 }));
  const edges = [], ghosts = new Set();
  for (const n of keep) {
    nodes.push({ id: 'n:' + n.id, kind: 'note', note: n });
    n.repos.forEach((r) => edges.push({ source: 'n:' + n.id, target: 'r:' + r, kind: 'member' }));
    for (const l of n.links) {
      if (ids.has(l)) edges.push({ source: 'n:' + n.id, target: 'n:' + l, kind: n.type === 'topic' ? 'link topic' : 'link' });
      else if (!notes.has(l)) { ghosts.add(l); edges.push({ source: 'n:' + n.id, target: 'g:' + l, kind: 'link' }); }
    }
  }
  ghosts.forEach((g) => nodes.push({ id: 'g:' + g, kind: 'ghost', label: g }));
  return { nodes, edges };
}

const hubR = (d) => 9 + Math.sqrt(d.count) * 2.5;
const isTopic = (d) => d.kind === 'note' && d.note.type === 'topic';
const noteClass = (d) => 'nnode ' + d.kind + (d.kind !== 'note' ? '' : (isTopic(d) ? ' topic' : '') + (d.note.draft ? ' draft' : '') + (d.note.superseded ? ' superseded' : ''));
// Node positions survive a redraw, so a live reload or a filter change never reshuffles the graph.
const gPos = new Map();
let gSvg, gRoot, gZoom, gSim, gNodes, gLinks;

function drawGraph() {
  const host = $('noteCanvas');
  if (!gSvg) {
    const { width, height } = host.getBoundingClientRect();
    gSvg = d3.select(host).append('svg').attr('class', 'h-full w-full');
    gRoot = gSvg.append('g');
    gZoom = d3.zoom().scaleExtent([0.15, 4]).on('zoom', (e) => gRoot.attr('transform', e.transform));
    gSvg.call(gZoom).on('dblclick.zoom', null).call(gZoom.transform, d3.zoomIdentity.translate(width / 2, height / 2));
    gSvg.on('click', (e) => { if (e.target === gSvg.node()) closeDoc(); });
  }
  if (gSim) {
    gSim.stop();
    gSim.nodes().forEach((d) => gPos.set(d.id, { x: d.x, y: d.y }));
  }

  const { nodes, edges } = graphData();
  let fresh = 0;
  for (const d of nodes) {
    const p = gPos.get(d.id);
    if (p) Object.assign(d, p);
    else fresh++;
  }
  const adj = new Map(nodes.map((d) => [d.id, new Set([d.id])]));
  for (const e of edges) { adj.get(e.source)?.add(e.target); adj.get(e.target)?.add(e.source); }

  gRoot.selectAll('*').remove();
  gLinks = gRoot.append('g').selectAll('line').data(edges).join('line').attr('class', (e) => 'link ' + e.kind);
  gNodes = gRoot.append('g').selectAll('g').data(nodes).join('g').attr('class', noteClass);
  gNodes.append('circle').attr('r', (d) => (d.kind === 'repo' ? hubR(d) + 6 : 14)).attr('fill', 'transparent');
  gNodes.filter((d) => d.kind === 'repo').append('circle').attr('class', 'glyph').attr('r', hubR);
  gNodes.filter((d) => d.kind !== 'repo').append('path').attr('class', 'glyph').attr('d', (d) => glyph(d.kind === 'ghost' ? 'concept' : d.note.type, isTopic(d) ? 520 : 150))
    .style('--c', (d) => (d.kind === 'note' ? tint(d.note.type) : null));
  gNodes.append('text')
    .attr('class', (d) => (d.kind === 'repo' ? '' : 'note-label'))
    .attr('text-anchor', 'middle')
    .attr('dy', (d) => (d.kind === 'repo' ? hubR(d) + 16 : isTopic(d) ? 28 : 20))
    .text((d) => (d.kind === 'note' ? d.note.id : d.label));

  gNodes
    .on('mouseenter', (ev, d) => {
      const near = adj.get(d.id);
      gRoot.classed('dim', true);
      gNodes.classed('hot', (n) => near.has(n.id));
      d3.select(ev.currentTarget).classed('hover', true);
      gLinks.classed('hot', (e) => e.source.id === d.id || e.target.id === d.id);
      showTip(ev, d);
    })
    .on('mousemove', moveTip)
    .on('mouseleave', () => {
      gRoot.classed('dim', false);
      gNodes.classed('hot', false).classed('hover', false);
      gLinks.classed('hot', false);
      $('noteTip').classList.add('hidden');
    })
    .on('click', (ev, d) => {
      ev.stopPropagation();
      if (d.kind === 'repo') setNoteRepo(nv.repo === d.label ? 'all' : d.label);
      else openNote(d.kind === 'note' ? d.note.id : d.label);
    });
  // Nodes cannot be dragged: a drag reheats the whole simulation on every move, and a large graph stutters under it.

  gSim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(edges).id((d) => d.id).distance((e) => (e.kind === 'member' ? 70 : e.kind === 'link topic' ? 60 : 100)).strength((e) => (e.kind === 'member' ? 0.5 : 0.2)))
    .force('charge', d3.forceManyBody().strength((d) => (d.kind === 'repo' ? -500 : isTopic(d) ? -300 : -140)))
    .force('collide', d3.forceCollide((d) => (d.kind === 'repo' ? hubR(d) + 14 : isTopic(d) ? 26 : 18)))
    .force('x', d3.forceX().strength(0.03))
    .force('y', d3.forceY().strength(0.03))
    .alpha(fresh ? 1 : 0.15)
    .on('tick', () => {
      gLinks.attr('x1', (e) => e.source.x).attr('y1', (e) => e.source.y).attr('x2', (e) => e.target.x).attr('y2', (e) => e.target.y);
      gNodes.attr('transform', (d) => `translate(${d.x},${d.y})`);
    });
  marks();
}

const matches = (d) => {
  const q = nv.query.trim().toLowerCase();
  if (!q) return false;
  const text = d.kind === 'note' ? `${d.note.id} ${d.note.description}` : d.label;
  return text.toLowerCase().includes(q);
};
const nodeName = (d) => (d.kind === 'note' ? d.note.id : d.kind === 'ghost' ? d.label : null);
const openNoteName = () => (state.doc?.refs[0]?.kind === 'note' ? state.doc.refs[0].id : null);

// Rings the search matches and the open note.
function marks() {
  if (!gNodes || !$('notes')) return;
  const open = openNoteName();
  gNodes.classed('match', matches).classed('selected', (d) => open !== null && nodeName(d) === open);
}

const openNote = (name) => openDoc([{ kind: 'note', id: name }]);

// Opens a note, or a link not written yet, and centres the graph on it.
function focusNote(name) {
  openNote(name);
  const d = gSim?.nodes().find((n) => nodeName(n) === name);
  if (d && nv.view === 'graph' && $('notes')) gSvg.transition().duration(500).call(gZoom.translateTo, d.x, d.y);
}

function showTip(ev, d) {
  const tip = $('noteTip');
  if (d.kind === 'repo') tip.innerHTML = `<div class="font-semibold">${esc(d.label)}</div><div class="mt-0.5 text-zinc-500">${plural(d.count, 'note')}. Click to show only this repository.</div>`;
  else if (d.kind === 'ghost') tip.innerHTML = `<div class="font-mono">${esc(d.label)}</div><div class="mt-0.5 text-zinc-500">Not written yet.</div>`;
  else tip.innerHTML = `<div class="flex items-center gap-1.5 font-mono">${icon(d.note.type)}${esc(d.note.id)}</div><div class="mt-1 text-zinc-600 dark:text-zinc-300">${esc(d.note.description)}</div>${noteState(d.note) ? `<div class="mt-1 text-zinc-500">${noteState(d.note)}</div>` : ''}`;
  tip.classList.remove('hidden');
  moveTip(ev);
}

function moveTip(ev) {
  const tip = $('noteTip');
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8) + 'px';
}

// A note's status in the list: a draft and its action, a draft waiting to change it, or superseded.
function statusChip(n) {
  const chip = (text, cls) => `<span class="whitespace-nowrap rounded border px-1.5 py-0.5 font-mono text-[11px] ${cls}">${text}</span>`;
  const dashed = 'border-dashed border-zinc-400 dark:border-zinc-600 text-zinc-600 dark:text-zinc-300';
  if (n.draft) return chip(`draft · ${esc(n.draft)}`, dashed);
  if (n.pending) return chip(`${esc(n.pending)} drafted`, dashed);
  if (n.superseded) return chip('superseded', 'border-zinc-200 dark:border-zinc-700 text-zinc-500');
  return '';
}
const lastOf = (n) => (n.draft ? null : state.timeline?.last.get(n.id) || null);
function changedCell(n) {
  if (n.draft) return '<span class="text-zinc-500">this machine</span>';
  const l = lastOf(n);
  if (!l) return `<span class="text-zinc-400" title="${state.timeline ? 'Not in timeline.json yet' : 'No timeline.json yet: /brain sync writes it'}">—</span>`;
  const since = state.timeline.first.get(n.id);
  return `<span title="${esc(`${ACTION_LABEL[l.action] || l.action} by ${l.author} in ${l.sha}` + (since ? ` · first recorded ${shortDate(since)}` : ''))}">${esc(shortDate(l.date))}</span><span class="block text-[11px] text-zinc-500">${esc(l.author)}</span>`;
}
const draftRank = (n) => (n.draft ? 0 : n.pending ? 1 : 2);

function noteList() {
  const byName = (a, b) => a.repos.join().localeCompare(b.repos.join()) || a.id.localeCompare(b.id);
  const rows = shownNotes().sort(nv.sort === 'name' ? byName
    : (a, b) => draftRank(a) - draftRank(b) || (lastOf(b)?.date || '').localeCompare(lastOf(a)?.date || '') || byName(a, b));
  const q = nv.query.trim().toLowerCase();
  const hit = (n) => q && `${n.id} ${n.description}`.toLowerCase().includes(q);
  $('noteList').innerHTML = !rows.length ? `<p class="py-16 text-center text-sm text-zinc-500">No notes match these filters.</p>` : `
    <table class="mx-auto w-full max-w-6xl text-sm">
      <thead class="text-left font-mono text-xs uppercase tracking-widest text-zinc-500">
        <tr><th class="py-2 pr-4">Note</th><th class="py-2 pr-4">Type</th><th class="py-2 pr-4">Repositories</th><th class="py-2 pr-4">Description</th><th class="py-2 pr-4">Status</th><th class="py-2 pr-4">Changed</th><th class="py-2">Links</th></tr>
      </thead>
      <tbody>${rows.map((n) => `
        <tr data-note="${esc(n.id)}" class="cursor-pointer border-t border-zinc-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-900/60 ${hit(n) ? 'bg-emerald-50 dark:bg-emerald-950/30' : ''}">
          <td class="py-2 pr-4 font-mono">${esc(n.id)}</td>
          <td class="py-2 pr-4"><span class="inline-flex items-center gap-1.5">${icon(n.type)}${esc(n.type)}</span></td>
          <td class="py-2 pr-4">${n.repos.map(repoChip).join(' ')}</td>
          <td class="py-2 pr-4 text-zinc-600 dark:text-zinc-300">${esc(n.description)}</td>
          <td class="py-2 pr-4">${statusChip(n)}</td>
          <td class="py-2 pr-4 whitespace-nowrap text-xs tabular-nums">${changedCell(n)}</td>
          <td class="py-2 tabular-nums text-zinc-500">${n.links.length}</td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

const linkList = (label, names) => !names.length ? '' : `
  <div class="not-prose mt-8 border-t border-zinc-200 dark:border-zinc-800 pt-4">
    <div class="mb-2 font-mono text-xs uppercase tracking-widest text-zinc-500">${label}</div>
    <div class="flex flex-wrap gap-1.5">${names.map((l) => `<button data-note="${esc(l)}" class="rounded-md border border-zinc-200 dark:border-zinc-700 px-2 py-0.5 font-mono text-xs hover:border-emerald-500 ${state.notes.notes.has(l) ? '' : 'border-dashed text-zinc-500'}">${esc(l)}</button>`).join('')}</div>
  </div>`;

// A note opens in the drawer, its [[links]] clickable, followed by the notes it links to and those linking to it.
function resolveNote(ref) {
  const b = state.notes;
  if (!b) return null;
  const n = b.notes.get(ref.id);
  const from = b.backlinks.get(ref.id) || [];
  if (!n) {
    if (!b.ghosts.has(ref.id)) return null;
    return {
      label: 'Note', path: null, shown: '', accent: 'bg-zinc-300 dark:bg-zinc-700', title: ref.id,
      kicker: '<span class="font-mono uppercase tracking-widest">Not written yet</span>', badges: '',
      html: `<p>Notes link to <code>[[${esc(ref.id)}]]</code>, but no file in the brain is named <code>${esc(ref.id)}.md</code>. It marks a note worth writing.</p>${linkList('Linked from', from)}`,
    };
  }
  const body = n.body.replace(WIKI, (_, t, alias) => {
    const target = t.trim();
    return `<a href="#" data-note="${esc(target)}" class="wikilink${b.notes.has(target) ? '' : ' ghost'}">${esc((alias || t).trim())}</a>`;
  });
  return {
    label: 'Note', path: n.path, shown: n.path, accent: 'bg-gradient-to-r from-emerald-400 to-sky-500', title: n.id,
    kicker: `<span class="inline-flex items-center gap-1.5">${icon(n.type)}${esc(n.type)}</span>${n.shared ? '<span class="text-zinc-300 dark:text-zinc-700">·</span><span>shared</span>' : ''}${n.draft ? '<span class="text-zinc-300 dark:text-zinc-700">·</span><span>draft</span>' : n.superseded ? '<span class="text-zinc-300 dark:text-zinc-700">·</span><span>superseded</span>' : ''}`,
    badges: n.repos.map(repoChip).join('') + (n.description ? `<p class="w-full text-sm text-zinc-600 dark:text-zinc-300">${esc(n.description)}</p>` : '') + (noteState(n) ? `<p class="w-full text-xs text-zinc-500">${noteState(n)}</p>` : ''),
    html: tasks(marked.parse(body)) + linkList('Links to', n.links) + linkList('Linked from', from),
  };
}

// What a note waits on or became: a draft only this machine holds, a pending change, or a superseded decision.
const DRAFT_ACTION = { record: 'New draft', update: 'Draft update', supersede: 'Draft decision', delete: 'Draft deletion' };
function noteState(n) {
  if (n.draft) return `${DRAFT_ACTION[n.draft] || 'Draft'}${n.draft === 'supersede' && n.supersedes ? ', superseding ' + esc(n.supersedes) : ''}: only this machine holds it, until <code>/brain sync</code>.`;
  if (n.superseded) return `Superseded${n.supersededBy ? ' by ' + esc(n.supersededBy) : ''}.`;
  if (n.pending) return `A draft ${n.pending === 'delete' ? 'deletes' : n.pending === 'supersede' ? 'supersedes' : 'updates'} it at the next <code>/brain sync</code>.`;
  return '';
}

function setNoteRepo(r) {
  nv.repo = r;
  store.set('noteRepo', r);
  renderNotes();
}

function noteBar() {
  const b = state.notes;
  if (nv.repo !== 'all' && !b.repos.includes(nv.repo)) nv.repo = 'all';
  $('noteRepo').innerHTML = `<option value="all">All repositories</option>` + b.repos.map((r) => `<option value="${esc(r)}" ${r === nv.repo ? 'selected' : ''}>${esc(r)}</option>`).join('');
  const counts = {};
  for (const n of b.notes.values()) counts[n.type] = (counts[n.type] || 0) + 1;
  const types = Object.keys(SHAPES).filter((t) => t !== 'other' || counts.other);
  $('noteTypes').innerHTML = types.map((t) => {
    const off = nv.hidden.has(t);
    return `<button data-type="${t}" aria-pressed="${!off}" title="${off ? 'Show' : 'Hide'} ${t} notes" class="inline-flex items-center gap-1.5 rounded-md border border-zinc-200 dark:border-zinc-800 px-2 py-1 text-xs ${off ? 'opacity-40 line-through' : ''}">${icon(t)}${t}<span class="tabular-nums text-zinc-500">${counts[t] || 0}</span></button>`;
  }).join('');
  const links = [...b.notes.values()].reduce((n, x) => n + x.links.length, 0);
  const drafts = [...b.notes.values()].filter((n) => n.draft || n.pending).length;
  $('noteStats').textContent = `${plural(b.notes.size, 'note')} · ${plural(b.repos.length, 'repo')} · ${plural(links, 'link')} · ${b.ghosts.size} unwritten` + (drafts ? ` · ${plural(drafts, 'draft')}` : '');
  timeSlider();
  $('noteWarn').classList.toggle('hidden', !b.dupes.length);
  $('noteWarn').innerHTML = !b.dupes.length ? '' : `Each name must be unique across the brain, so <code>[[links]]</code> resolve to only the first file named so. Rename: ${b.dupes.map((x) => `<code class="font-mono">${esc(x)}</code>`).join(', ')}`;

// The Timeline section shows how the brain's knowledge grew: one bar per week of changes to the notes, from the
// committed timeline.json, then each commit's changes, newest first. Clicking a week narrows the list to it.
const tv = { repo: store.get('tlRepo') || 'all', kind: store.get('tlKind') || 'all', week: null };
const ACTION_LABEL = { recorded: 'Recorded', updated: 'Updated', superseded: 'Superseded', deleted: 'Deleted', moved: 'Moved' };
const ACTION_ORDER = ['recorded', 'updated', 'superseded', 'moved', 'deleted'];
const DAY = 864e5;

// The Monday a date's week starts on, as YYYY-MM-DD in UTC.
function weekOf(iso) {
  const d = new Date(iso);
  d.setUTCHours(0, 0, 0, 0);
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d.toISOString().slice(0, 10);
}
const shortDate = (iso) => new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });
const longDate = (iso) => new Date(iso).toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });

// The commits whose changes the filters keep, each with only those changes.
function tlCommits() {
  return (state.timeline?.commits || []).map((c) => ({
    ...c,
    shown: c.changes.filter((x) => (tv.repo === 'all' || (x.repos || []).includes(tv.repo)) && (tv.kind === 'all' || x.kind === tv.kind)),
  })).filter((c) => c.shown.length);
}

// Every week from the first commit's to the last's, empty weeks included, so the bars keep time's spacing.
function tlWeeks(commits) {
  if (!commits.length) return [];
  const by = new Map();
  for (const c of commits) {
    const w = weekOf(c.date);
    if (!by.has(w)) by.set(w, []);
    by.get(w).push(c);
  }
  const out = [];
  // A rebase can leave author dates out of history order, so the range runs from the earliest date to the latest.
  const times = commits.map((c) => Date.parse(weekOf(c.date)));
  for (let t = Math.min(...times), end = Math.max(...times); t <= end; t += 7 * DAY) {
    const w = new Date(t).toISOString().slice(0, 10);
    const cs = by.get(w) || [];
    const actions = {};
    cs.forEach((c) => c.shown.forEach((x) => (actions[x.action] = (actions[x.action] || 0) + 1)));
    out.push({ week: w, commits: cs, count: cs.reduce((n, c) => n + c.shown.length, 0), actions });
  }
  return out;
}

const weekTip = (d) => `<div class="font-semibold">Week of ${esc(shortDate(d.week))}</div>`
  + `<div class="mt-0.5 text-zinc-600 dark:text-zinc-300">${plural(d.count, 'change')} in ${plural(d.commits.length, 'commit')}</div>`
  + (d.count ? `<div class="mt-0.5 text-zinc-500">${ACTION_ORDER.filter((a) => d.actions[a]).map((a) => `${d.actions[a]} ${ACTION_LABEL[a].toLowerCase()}`).join(' · ')}</div>` : '');

// A bar whose top corners round and whose foot sits square on the baseline.
function barPath(x, y, w, h) {
  const r = Math.min(4, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function drawTimelineChart(weeks) {
  const host = $('tlChart');
  if (!host) return;
  host.innerHTML = '';
  host.classList.toggle('picking', !!tv.week);
  if (!weeks.length) return;
  const { width } = host.getBoundingClientRect();
  const height = 180, m = { top: 10, right: 8, bottom: 22, left: 32 };
  const x = d3.scaleBand().domain(weeks.map((d) => d.week)).range([m.left, width - m.right]).paddingInner(weeks.length > 1 ? 0.2 : 0).paddingOuter(0.1);
  const y = d3.scaleLinear().domain([0, d3.max(weeks, (d) => d.count) || 1]).nice().range([height - m.bottom, m.top]);
  const svg = d3.select(host).append('svg').attr('width', width).attr('height', height).attr('role', 'img')
    .attr('aria-label', `Changes to the notes per week, ${weeks.length} weeks`);
  svg.append('g').attr('class', 'grid').attr('transform', `translate(${m.left},0)`)
    .call(d3.axisLeft(y).ticks(4).tickSize(-(width - m.left - m.right)).tickFormat(''));
  svg.append('g').attr('class', 'axis').attr('transform', `translate(${m.left},0)`)
    .call(d3.axisLeft(y).ticks(4, 'd').tickSize(0).tickPadding(6)).call((g) => g.select('.domain').remove());
  const every = Math.max(1, Math.ceil(weeks.length / Math.max(1, Math.floor(width / 70))));
  svg.append('g').attr('class', 'axis').attr('transform', `translate(0,${height - m.bottom})`)
    .call(d3.axisBottom(x).tickValues(weeks.filter((_, i) => i % every === 0).map((d) => d.week)).tickFormat(shortDate).tickSizeOuter(0));
  const bw = Math.min(x.bandwidth(), 28);
  const col = svg.append('g').selectAll('g').data(weeks).join('g')
    .attr('class', (d) => 'col' + (d.week === tv.week ? ' picked' : ''));
  col.filter((d) => d.count).append('path').attr('class', 'bar')
    .attr('d', (d) => barPath(x(d.week) + (x.bandwidth() - bw) / 2, y(d.count), bw, y(0) - y(d.count)));
  col.append('rect').attr('class', 'hit').attr('x', (d) => x(d.week)).attr('width', x.bandwidth()).attr('y', m.top).attr('height', height - m.top - m.bottom)
    .on('mouseenter', (ev, d) => { $('noteTip').innerHTML = weekTip(d); $('noteTip').classList.remove('hidden'); moveTip(ev); })
    .on('mousemove', moveTip)
    .on('mouseleave', () => $('noteTip').classList.add('hidden'))
    .on('click', (ev, d) => {
      if (!d.count) return;
      tv.week = tv.week === d.week ? null : d.week;
      renderTimeline();
    });
}

function tlList(commits) {

// The drafts this machine holds, as changes not yet committed: new notes, and the notes a draft changes.
function tlDrafts() {
  const rows = [...(state.notes?.notes.values() || [])].filter((n) => (n.draft || n.pending) && (tv.repo === 'all' || n.repos.includes(tv.repo)) && tv.kind !== 'explored');
  if (!rows.length) return '';

        <div class="mt-2 flex flex-wrap gap-1.5">${rows.map(chip).join('')}</div>

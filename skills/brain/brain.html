<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23222'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h10' stroke='%23e8e8e8' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] } } } };
</script>
<style>
  /* The look: neutral greys, sharp edges, light headers. Colour encodes status alone (and a repository's dot). */
  :root {
    --bg: #141414; --rail: #181818; --panel: #1c1c1c; --panel-2: #222222; --hover: #2a2a2a; --line: #2d2d2d; --line-2: #3a3a3a;
    --text: #e8e8e8; --muted: #9b9b9b; --faint: #6a6a6a; --accent: #bdbdbd; --accent-2: #d9d9d9; --accent-soft: rgba(255,255,255,.07);
    --s-done: #34d399; --s-landed: #10b981; --s-landing: #2dd4bf; --s-active: #fbbf24; --s-attention: #f87171; --s-blocked: #ef4444;
    --s-frontier: #818cf8; --s-waiting: #a78bfa; --s-ready: #38bdf8; --s-draft: #4b5060; --s-todo: #2a2e39; --s-abandoned: #3f3f46;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); }
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 400; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); }
  .panel-2 { background: var(--panel-2); border: 1px solid var(--line); }
  .hairline { border-color: var(--line); }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .cell { width: 11px; height: 11px; display: inline-block; flex: none; }
  .cell-lg { width: 14px; height: 14px; }
  .navitem { display: flex; align-items: center; gap: 10px; padding: 7px 10px; color: var(--muted); cursor: pointer; }
  .navitem:hover { background: var(--hover); color: var(--text); }
  .navitem.on { background: var(--accent-soft); color: var(--text); box-shadow: inset 2px 0 0 var(--text); }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); padding: 5px 10px; color: var(--text); background: var(--panel-2); }
  .btn:hover { background: var(--hover); }
  .btn-accent { background: var(--accent-2); border-color: transparent; color: #141414; font-weight: 500; }
  .btn-accent:hover { background: #fff; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); }
  .seg button { padding: 3px 10px; color: var(--muted); }
  .seg button.on { background: var(--hover); color: var(--text); }
  .clickable { cursor: pointer; transition: border-color .12s, background .12s; }
  .clickable:hover { border-color: var(--line-2); background: var(--panel-2); }
  .row { display: flex; width: 100%; align-items: center; gap: 8px; padding: 5px 6px; text-align: left; font-size: 12.5px; cursor: pointer; }
  .row:hover { background: var(--hover); }
  @keyframes pulse2 { 50% { opacity: .45 } } .pulse { animation: pulse2 1.6s infinite; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #2f2f2f; } ::-webkit-scrollbar-track { background: transparent; }
  .prose-brain { color: #c8c8c8; line-height: 1.6; overflow-wrap: anywhere; }
  .prose-brain h1 { font-size: 17px; font-weight: 300; margin: 6px 0 8px; color: var(--text); } .prose-brain h2 { font-size: 14.5px; font-weight: 400; margin: 18px 0 6px; color: var(--text); }
  .prose-brain h3 { font-size: 13px; font-weight: 600; margin: 14px 0 4px; color: var(--text); }
  .prose-brain p, .prose-brain li { margin: 6px 0; } .prose-brain ul { list-style: disc; padding-left: 18px; } .prose-brain ol { list-style: decimal; padding-left: 18px; }
  .prose-brain code { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; background: var(--panel-2); padding: 1px 5px; }
  .prose-brain pre { background: var(--panel-2); border: 1px solid var(--line); padding: 10px; overflow-x: auto; margin: 10px 0; } .prose-brain pre code { background: none; padding: 0; }
  .prose-brain strong { color: var(--text); } .prose-brain a { color: var(--text); border-bottom: 1px dotted var(--muted); }
  .prose-brain table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; } .prose-brain th, .prose-brain td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
  .prose-brain blockquote { border-left: 2px solid var(--line-2); padding-left: 10px; color: var(--muted); }
  .wiki { color: var(--text); border-bottom: 1px dotted var(--muted); cursor: pointer; } .wiki.ghost { color: var(--muted); border-bottom-style: dashed; }
  /* sharp edges everywhere; only the small status dots stay round (SVG shapes are drawn square where they matter) */
  body *, body *::before, body *::after { border-radius: 0 !important; }
  body .rounded-full.h-1\.5, body .rounded-full.h-2 { border-radius: 999px !important; }
  /* light headers: page titles, panel titles, the inspector's title and the KPI figures */
  body [class*="text-[17px]"], body [class*="text-[18px]"], body [class*="text-[20px]"], body [class*="text-[22px]"], body [class*="text-[26px]"], body [class*="text-[28px]"], body .ph { font-weight: 300 !important; letter-spacing: -.01em; }
</style>
</head>
<body>

<!-- The brain list: every brain added on this machine, as a card. -->
<div id="home" class="hidden min-h-full">
  <header class="flex h-14 items-center gap-3 border-b px-5 hairline" style="background:var(--rail)">
    <span class="grid h-8 w-8 place-items-center text-sm font-semibold" style="background:var(--hover)">B</span><span class="font-medium">Brain</span>
    <div class="ml-auto flex items-center gap-2"><button id="reload" class="btn hidden text-[12px]">Reload</button><button id="open" class="btn btn-accent text-[12px]">Add brain</button></div>
  </header>
  <main id="homeMain" class="px-6 py-8"></main>
</div>

<!-- One brain: a rail of screens and repositories, a top bar, the screen, and the details panel over it. -->
<div id="view" class="hidden h-full">
  <div class="flex h-full">
    <aside class="flex w-60 shrink-0 flex-col border-r hairline" style="background:var(--rail)">
      <button data-home title="All brains" class="flex h-14 items-center gap-2.5 border-b px-4 text-left hairline hover:bg-white/5">
        <span class="grid h-8 w-8 shrink-0 place-items-center text-sm font-semibold" style="background:var(--hover)">B</span>
        <span class="min-w-0"><span id="brain-name" class="block truncate font-medium"></span><span class="faint block text-[11px]">← all brains</span></span>
      </button>
      <nav id="nav" class="flex-1 overflow-y-auto px-3 py-3"></nav>
    </aside>
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-14 shrink-0 items-center gap-3 border-b px-5 hairline">
        <div id="crumb" class="flex min-w-0 items-center gap-2 text-[13px]"></div>
        <div class="ml-auto flex items-center gap-2">
          <label class="flex w-72 items-center gap-2 border px-2.5 py-1.5 hairline" style="background:var(--panel)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="faint"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Search specs, milestones, notes…" class="w-full bg-transparent text-[13px] outline-none placeholder:text-zinc-600">
            <span class="mono faint border px-1 text-[10px] hairline">⌘K</span>
          </label>
          <span title="Watching this brain for changes" class="chip" style="background:rgba(52,211,153,.12);color:#6ee7b7"><span class="h-1.5 w-1.5 rounded-full pulse" style="background:#34d399"></span>Live</span>
        </div>
      </header>
      <div class="relative flex min-h-0 flex-1">
        <main id="screen" class="min-w-0 flex-1 overflow-auto"></main>
        <aside id="insp-wrap" class="absolute right-0 top-0 z-30 hidden h-full border-l hairline" style="width:420px;background:var(--rail);box-shadow:-24px 0 48px rgba(0,0,0,.45)">
          <div id="insp-handle" title="Drag to resize · double-click to expand" class="absolute -left-1 top-0 z-20 h-full w-2 cursor-col-resize hover:bg-white/10"></div>
          <div id="insp" class="h-full overflow-y-auto"></div>
        </aside>
        <div id="toast" class="pointer-events-none absolute bottom-4 left-1/2 z-40 hidden -translate-x-1/2 px-3 py-1.5 text-[12px]" style="background:var(--accent-2);color:#141414"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================ THE BRAIN VIEW
// One brain, as screens: Overview (KPIs, the ticket heatmap, the specs in dependency waves, what needs you, recent
// activity, a card per repository), a spec's page (its milestones as a pipeline, one lane per repository), Board (a
// kanban of specs or milestones), Notes graph (notes clustered per repository) and Activity (the brain's commits). A
// rail picks the screen and filters by repository; the details panel opens over the screen with the selected item.
// The route is #/b/<brain>/<screen>[/<arg>]. App.load(id, D) draws a brain's data (toData's shape); loading the same
// brain again, as a live reload does, keeps the screen, selection and filters.
const App = (function () {
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const STATUS = {
    attention: { label: 'Needs you', v: '--s-attention' }, blocked: { label: 'Blocked', v: '--s-blocked' }, active: { label: 'In progress', v: '--s-active' },
    landing: { label: 'Ready to land', v: '--s-landing' }, frontier: { label: 'Frontier', v: '--s-frontier' }, waiting: { label: 'Waiting', v: '--s-waiting' },
    ready: { label: 'Ready to build', v: '--s-ready' }, draft: { label: 'Needs tickets', v: '--s-draft' }, done: { label: 'Done', v: '--s-done' },
    landed: { label: 'Landed', v: '--s-landed' }, abandoned: { label: 'Abandoned', v: '--s-abandoned' },
  };
  const ORDER = ['attention', 'blocked', 'active', 'landing', 'frontier', 'waiting', 'ready', 'draft', 'done', 'landed', 'abandoned'];
  const TICKET = { todo: { label: 'To do', v: '--s-todo' }, doing: { label: 'Doing', v: '--s-active' }, blocked: { label: 'Blocked', v: '--s-blocked' }, done: { label: 'Done', v: '--s-done' } };
  // the step of /build a started milestone stands at (toData's stage: build while its tickets run, else its Phase)
  const STAGE_ICON = { build: '🔨', review: '🔍', decide: '⚖️', ask: '✋', fix: '🔧', check: '🧪', waits: '⏳', failed: '❌', squash: '📦' };
  const ACTION = { recorded: '--s-done', updated: '--s-ready', superseded: '--s-active', deleted: '--s-blocked', moved: '--s-waiting' };
  const color = (k) => `var(${(STATUS[k] || TICKET[k] || STATUS.draft).v})`;
  const repoColor = (slug) => { let h = 0; for (const ch of slug) h = (h * 31 + ch.charCodeAt(0)) % 360; return `hsl(${h} 65% 62%)`; };

  // ---------- shared UI pieces, so every screen speaks one visual language ----------
  const ui = {
    esc, color,
    pill: (k, text) => `<span class="chip" style="background:color-mix(in srgb, ${color(k)} 16%, transparent);color:color-mix(in srgb, ${color(k)} 80%, white)"><span class="h-1.5 w-1.5 rounded-full" style="background:${color(k)}"></span>${esc(text ?? (STATUS[k] || TICKET[k] || STATUS.draft).label)}</span>`,
    // a ticket square: todo is a dim tile, doing pulses
    cell: (t, big) => `<span class="cell ${big ? 'cell-lg' : ''} ${t.status === 'doing' ? 'pulse' : ''}" title="${esc(t.id + ' · ' + t.title + ' · ' + t.status)}" style="background:${color(t.status)}"></span>`,
    kpi: (label, value, sub, k) => `<div class="panel px-4 py-3"><div class="eyebrow flex items-center gap-1.5">${k ? `<span class="h-1.5 w-1.5 rounded-full" style="background:${color(k)}"></span>` : ''}${esc(label)}</div><div class="mt-1.5 flex items-baseline gap-2"><span class="text-[26px] tracking-tight" ${k ? `style="color:color-mix(in srgb, ${color(k)} 70%, white)"` : ''}>${value}</span><span class="muted text-[12px]">${sub || ''}</span></div></div>`,
    panelHead: (title, sub, right) => `<div class="flex items-center gap-2 px-4 pt-3.5"><div class="ph text-[14.5px]">${esc(title)}</div>${sub ? `<div class="muted text-[12px]">${sub}</div>` : ''}<div class="ml-auto">${right || ''}</div></div>`,
    // a thin stacked bar of ticket statuses
    bar: (tickets, h = 4) => { const n = tickets.length || 1, c = (s) => tickets.filter((t) => t.status === s).length; return `<div class="flex w-full overflow-hidden" style="height:${h}px;background:var(--s-todo)">${['done', 'doing', 'blocked'].map((s) => `<span style="width:${(c(s) / n) * 100}%;background:${color(s)}"></span>`).join('')}</div>`; },
    // the scope toggle, for a page header; the shell's click handler reads data-scope
    scopeSeg: () => `<div class="seg text-[12px]" title="To-do: specs with work left · In flight: every spec not landed or abandoned · All">${[['todo', 'To-do'], ['flight', 'In flight'], ['all', 'All']].map(([k, l]) => `<button data-scope="${k}" class="${S.scope === k ? 'on' : ''}">${l}</button>`).join('')}</div>`,
    repoDot: (slug) => `<span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background:${repoColor(slug)}"></span>`,
  };

  const screens = {};
  const NAV = [['overview', 'Overview', 'M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 13h7v8H3z'], ['board', 'Board', 'M4 4h5v16H4zM10 4h5v10h-5zM16 4h4v13h-4z'], ['notes', 'Notes graph', 'M4 4h4v4H4zM16 5h4v4h-4zM10 16h4v4h-4zM8 6h8M6 8l5 8M18 9l-5 7'], ['activity', 'Activity', 'M3 12h4l3-8 4 16 3-8h4']];
  // scope: 'todo' hides what is landed, abandoned or only waiting to land; 'flight' every spec not landed or abandoned
  const S = { D: null, brain: null, sel: null, repo: null, q: '', scope: 'flight', showDraft: false };
  const $ = (id) => document.getElementById(id);
  const route = () => {
    const parts = location.hash.replace(/^#\/b\/[^/]+\/?/, '').split('/').filter(Boolean);
    const screen = screens[parts[0]] ? parts[0] : 'overview';
    return { screen, arg: screen === parts[0] && parts.length > 1 ? decodeURIComponent(parts.slice(1).join('/')) : null };
  };
  const go = (path) => { location.hash = `#/b/${S.brain}/${path}`; };
  const inScope = (s) => S.scope === 'all' || (S.scope === 'flight' ? !s.landed && !s.abandoned : !s.landed && !s.abandoned && s.status !== 'landing');
  const matches = (s) => (!S.repo || s.repos.includes(S.repo) || s.milestones.some((m) => m.track === S.repo)) && (!S.q || (s.num + ' ' + s.title).toLowerCase().includes(S.q));
  const toast = (t) => { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), 4000); };

  function ctx() {
    const D = S.D, r = route();
    return {
      D, ui, STATUS, ORDER, TICKET, STAGE_ICON, route: r, sel: S.sel, repo: S.repo, q: S.q, scope: S.scope,
      specs: D.specs.filter((s) => inScope(s) && matches(s)), inScope, repoColor,
      select: (kind, id) => { S.sel = kind ? { kind, id } : null; renderInspector(); window.dispatchEvent(new Event('app-select')); },
      go, specOf: (id) => D.specs.find((s) => s.id === id),
    };
  }

  function renderNav() {
    const D = S.D, r = route();
    const repos = D.repos.map((x) => x.slug).map((slug) => [slug, D.specs.filter((s) => inScope(s) && (s.repos.includes(slug) || s.milestones.some((m) => m.track === slug))).length]);
    const needs = D.specs.filter((s) => inScope(s) && (s.status === 'attention' || s.status === 'blocked')).length;
    $('nav').innerHTML = `
      <div class="eyebrow px-2 pb-2">Workspace</div>
      ${NAV.filter(([k]) => screens[k]).map(([k, label, d]) => `<div class="navitem ${r.screen === k || (k === 'overview' && r.screen === 'specs') ? 'on' : ''}" data-go="${k}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="${d}"/></svg>${label}${k === 'overview' && needs ? `<span class="ml-auto grid h-5 min-w-5 place-items-center px-1.5 text-[10px] font-semibold" style="background:rgba(248,113,113,.15);color:#fca5a5">${needs}</span>` : ''}</div>`).join('')}
      <div class="eyebrow mt-5 flex items-center px-2 pb-2">Repositories <span class="ml-auto normal-case tracking-normal">${D.repos.length}</span></div>
      ${repos.map(([slug, n]) => `<div class="navitem ${S.repo === slug ? 'on' : ''}" data-repo="${esc(slug)}" style="padding:5px 10px">${ui.repoDot(slug)}<span class="truncate">${esc(slug)}</span><span class="faint ml-auto text-[11px]">${n || ''}</span></div>`).join('')}`;
  }

  function renderTop() {
    const r = route(), name = r.screen === 'specs' ? 'Overview' : (NAV.find(([k]) => k === r.screen) || [, r.screen])[1];
    const spec = r.screen === 'specs' && r.arg && S.D.specs.find((s) => s.id === r.arg);
    $('crumb').innerHTML = `<span class="muted">${esc(S.D.name)}</span><span class="faint">/</span><span class="${spec ? 'muted cursor-pointer hover:text-white' : 'font-medium'}" ${spec ? 'data-go="overview"' : ''}>${esc(name)}</span>${spec ? `<span class="faint">/</span><span class="mono faint">${spec.num}</span><span class="truncate font-medium">${esc(spec.title)}</span>` : ''}${S.repo ? `<span class="chip ml-2" style="background:var(--panel-2)">${ui.repoDot(S.repo)}${esc(S.repo)}<button data-repo="${esc(S.repo)}" title="Clear the repository filter" class="faint hover:text-white">✕</button></span>` : ''}`;
  }

  // ============================================================ the details panel
  // A properties table above the document, then what it links to: a spec's milestones, a milestone's tickets and
  // neighbours, a note's links, backlinks and history. Every row selects what it names.
  const notesById = () => new Map(S.D.notes.map((n) => [n.id, n]));
  const day = (iso) => new Date(iso).toLocaleDateString('en', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  const sec = (title, inner, n) => `<section class="border-t px-5 py-3.5 hairline"><div class="eyebrow mb-2">${title}${n != null ? ` <span class="faint">${n}</span>` : ''}</div>${inner}</section>`;
  const none = (t = 'None.') => `<div class="faint py-1 text-[12.5px]">${t}</div>`;
  const prop = (k, v) => `<div class="muted py-1.5">${k}</div><div class="min-w-0 py-1.5">${v}</div>`;
  const tag = (t) => `<span class="chip" style="background:var(--panel-2)">${t}</span>`;
  const repoTag = (r) => tag(ui.repoDot(r) + esc(r));
  const row = (sel, left, label, right = '') => `<div class="row" data-sel="${esc(sel)}">${left}<span class="min-w-0 flex-1 truncate">${esc(label)}</span>${right}</div>`;
  const noteRow = (id, nb) => { const n = nb.get(id); return row(`note|${id}`, n ? `<span class="inline-block h-2 w-2 shrink-0" style="background:${n.repos[0] ? repoColor(n.repos[0]) : '#9b9b9b'}"></span>` : '<span class="inline-block h-2 w-2 shrink-0 border border-dashed" style="border-color:#9b9b9b"></span>', id, n ? (n.draft || n.pending ? tag('draft') : `<span class="faint text-[11px]">${esc(n.type)}</span>`) : '<span class="faint text-[11px]">not written</span>'); };
  const wiki = (t, nb) => t.replace(/\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g, (_, n) => `<span class="wiki${nb.has(n.trim()) ? '' : ' ghost'}" data-sel="note|${esc(n.trim())}">${esc(n.trim())}</span>`);
  const md = (t, nb) => `<div class="prose-brain">${marked.parse(wiki((t || '').replace(/^---[\s\S]*?---\s*/, '').replace(/^\s*# .*\n+/, ''), nb))}</div>`;
  const msOf = (sp, id) => sp.milestones.find((m) => m.id === id);
  const msRow = (sp, m) => row(`milestone|${sp.id}|${m.id}`, ui.repoDot(m.track) + `<span class="mono faint text-[11px]">${esc(m.id)}</span>`, m.title, ui.pill(m.status, m.phaseLabel || undefined));
  const tkRow = (sp, t) => row(`ticket|${sp.id}|${t.id}`, ui.cell(t) + `<span class="mono faint text-[11px]">${t.num}</span>`, t.title, ui.pill(t.status));
  const specRow = (sp) => row(`spec|${sp.id}`, `<span class="mono faint text-[11px]">${sp.num}</span>`, sp.title, ui.pill(sp.status));
  const head = (kicker, title, sub) => `<div class="px-5 pb-1 pt-4">${kicker}<div class="mt-1 text-[18px] leading-snug">${esc(title)}</div>${sub ? `<p class="muted mt-2 text-[12.5px] leading-relaxed">${esc(sub)}</p>` : ''}</div>`;
  const props = (inner) => `<div class="grid grid-cols-[110px_minmax(0,1fr)] items-center px-5 pb-3 pt-2 text-[12.5px]">${inner}</div>`;

  function inspSpec(sp) {
    const D = S.D, tk = sp.milestones.flatMap((m) => m.tickets), done = tk.filter((t) => t.status === 'done').length;
    const after = D.specs.filter((x) => x.deps.includes(sp.id));
    return head(`<div class="eyebrow">Spec ${sp.num}${sp.key && sp.key !== 'None' ? ' · ' + esc(sp.key) : ''}</div>`, sp.title, sp.abandoned ? 'Abandoned: ' + sp.abandoned : sp.summary)
      + props(prop('Status', ui.pill(sp.status)) + prop('Repos', `<div class="flex flex-wrap gap-1">${sp.repos.map(repoTag).join('') || '<span class="faint">—</span>'}</div>`)
        + prop('Progress', tk.length ? `<div class="flex items-center gap-2"><div class="w-40">${ui.bar(tk, 6)}</div><span class="mono muted text-[11px]">${done}/${tk.length}</span></div>` : '<span class="faint">no tickets yet</span>')
        + (sp.landed ? prop('Landed', `<span class="mono">${esc(sp.landed)}</span>`) : '') + (sp.base ? prop('Base', `<span class="mono text-[11.5px]">${esc(sp.base)}</span>`) : ''))
      + `<div class="px-5 pb-3"><button class="btn text-[12px]" data-go="specs/${esc(sp.id)}">Open its milestone pipeline →</button></div>`
      + sec('Depends on', sp.deps.map((d) => { const o = D.specs.find((x) => x.id === d); return o ? row(`spec|${o.id}`, `<span class="mono faint text-[11px]">${o.num}</span>`, o.title, ui.pill(o.landed ? 'landed' : o.status) + (o.landed ? '' : ' ' + tag('not landed'))) : row('', '', d + ' (missing)'); }).join('') || none(), sp.deps.length)
      + sec('Needed by', after.map(specRow).join('') || none(), after.length)
      + sec('Milestones', sp.milestones.map((m) => msRow(sp, m) + (m.buildsAfter.length ? `<div class="faint pb-1 pl-7 text-[11px]">builds after ${m.buildsAfter.map(esc).join(', ')}</div>` : '')).join('') || none('No milestones yet.'), sp.milestones.length)
      + sec('Document', md(sp.body, notesById()));
  }
  function inspMilestone(sp, m) {
    const unblocks = sp.milestones.filter((x) => x.buildsAfter.includes(m.id) || x.landsAfter.includes(m.id));
    return head(`<div class="eyebrow cursor-pointer hover:text-white" data-sel="spec|${esc(sp.id)}">${sp.num} · ${esc(sp.title)} ›</div>`, m.title, m.delivers)
      + props(prop('Status', ui.pill(m.status, m.phaseLabel || undefined)) + prop('Repository', repoTag(m.track))
        + prop('Stage', m.stage ? `${STAGE_ICON[m.stage] || ''} ${esc(m.phaseLabel || m.stage)}` : '<span class="faint">—</span>')
        + prop('Tickets', `<div class="flex flex-wrap gap-1">${m.tickets.map((t) => ui.cell(t, true)).join('') || '<span class="faint">none yet</span>'}</div>`)
        + (m.squash ? prop('Squash', `<span class="mono">${esc(m.squash)}</span>`) : '') + (m.landed ? prop('Landed', `<span class="mono">${esc(m.landed)}</span>`) : ''))
      + sec('Builds after', m.buildsAfter.map((id) => { const o = msOf(sp, id); return o ? msRow(sp, o) : row('', '', id); }).join('') || none('Nothing, it can start at once.'), m.buildsAfter.length)
      + (m.landsAfter.length ? sec('Lands after', m.landsAfter.map((id) => { const o = msOf(sp, id); return o ? msRow(sp, o) : row('', '', id); }).join(''), m.landsAfter.length) : '')
      + sec('Unblocks', unblocks.map((x) => msRow(sp, x)).join('') || none(), unblocks.length)
      + sec('Tickets', m.tickets.map((t) => tkRow(sp, t)).join('') || none('No tickets yet.'), m.tickets.length)
      + sec('Document', md(m.body, notesById()))
      + (m.review ? `<details class="border-t px-5 py-3.5 hairline" ${m.awaiting ? 'open' : ''}><summary class="eyebrow cursor-pointer">Review${m.awaiting ? ` · ${m.awaiting} awaiting you` : ''}</summary><div class="mt-2">${md(m.review, notesById())}</div></details>` : '');
  }
  function inspTicket(sp, m, t) {
    const blocks = m.tickets.filter((x) => x.deps.includes(t.id));
    return head(`<div class="eyebrow cursor-pointer hover:text-white" data-sel="milestone|${esc(sp.id + '|' + m.id)}">${sp.num} · ${esc(m.id)} · ${esc(m.title)} ›</div>`, t.title)
      + props(prop('Status', ui.pill(t.status)) + prop('Repository', repoTag(m.track)) + prop('Commit', t.commit ? `<span class="mono">${esc(t.commit)}</span>` : '<span class="faint">—</span>'))
      + sec('Depends on', t.deps.map((d) => { const o = m.tickets.find((x) => x.id === d); return o ? tkRow(sp, o) : row('', '', d); }).join('') || none(), t.deps.length)
      + sec('Blocks', blocks.map((x) => tkRow(sp, x)).join('') || none(), blocks.length)
      + sec('Document', md(t.body, notesById()));
  }
  function inspNote(id) {
    const D = S.D, nb = notesById(), n = nb.get(id), back = D.notes.filter((x) => x.links.includes(id)).map((x) => x.id);
    if (!n) return head('<div class="eyebrow">Not written yet</div>', id, 'Other notes link to this name, but no note exists for it.')
      + `<div class="px-5 pb-3"><button class="btn text-[12px]" data-toast="Ask Claude to remember ${esc(id)}: it drafts the note, and /brain sync shares it">Draft this note</button></div>`
      + sec('Linked from', back.map((x) => noteRow(x, nb)).join('') || none(), back.length);
    const showD = n.pendingBody != null && S.showDraft;
    const hist = D.timeline.commits.flatMap((c) => c.changes.filter((ch) => ch.note === id).map((ch) => ({ c, ch }))).sort((a, b) => (a.c.date < b.c.date ? 1 : -1));
    const flags = [n.kind === 'explored' ? tag('explored') : '', n.shared ? tag('shared') : '', n.superseded ? tag('superseded') : '', n.draft ? tag('draft: ' + esc(n.draft)) : '', n.pending ? tag('pending ' + esc(n.pending)) : ''].join('');
    return head(`<div class="eyebrow">${n.kind === 'explored' ? 'Explored note' : 'Note'} · ${esc(n.type)}</div>`, n.id, showD && n.pendingDescription ? n.pendingDescription : n.description)
      + props(prop('Repos', `<div class="flex flex-wrap gap-1">${n.repos.map(repoTag).join('') || '<span class="faint">—</span>'}</div>`) + prop('Layer', esc(n.layer || '—')) + prop('Path', `<span class="mono faint text-[11px]">${esc(n.path)}</span>`) + (flags ? prop('Flags', `<div class="flex flex-wrap gap-1">${flags}</div>`) : ''))
      + (n.pendingBody != null ? `<div class="mx-5 mb-3 flex items-center gap-2 border px-3 py-2 text-[12px] hairline" style="background:var(--panel-2)"><span class="flex-1">A draft on this machine changes this note.</span><button data-draftbody class="btn py-0.5 text-[11.5px]">${showD ? 'Show committed' : 'Show draft'}</button></div>` : '')
      + (n.supersededBy ? `<div class="px-5 pb-2 text-[12px]">Superseded by <span class="wiki" data-sel="note|${esc(n.supersededBy)}">${esc(n.supersededBy)}</span></div>` : '')
      + (n.supersedes ? `<div class="px-5 pb-2 text-[12px]">This draft supersedes <span class="wiki" data-sel="note|${esc(n.supersedes)}">${esc(n.supersedes)}</span></div>` : '')
      + sec('Document', md(showD ? n.pendingBody : n.body, nb))
      + sec('Links to', n.links.map((x) => noteRow(x, nb)).join('') || none(), n.links.length)
      + sec('Linked from', back.map((x) => noteRow(x, nb)).join('') || none('Nothing links here.'), back.length)
      + sec('History', hist.map(({ c, ch }) => `<div class="row" data-go="activity"><span class="inline-block h-2 w-2 shrink-0" style="background:var(${ACTION[ch.action] || '--s-draft'})"></span><span class="faint w-16 shrink-0 text-[11px]">${esc(ch.action)}</span><span class="min-w-0 flex-1 truncate">${esc(c.title)}</span><span class="faint shrink-0 text-[11px]">${day(c.date)} · ${esc(c.author)}</span></div>`).join('') || none('Not committed yet.'), hist.length);
  }
  function inspRepo(slug) {
    const D = S.D, r = D.repos.find((x) => x.slug === slug), nb = notesById();
    const ns = D.notes.filter((n) => n.repos.includes(slug)), ss = D.specs.filter((sp) => sp.repos.includes(slug) || sp.milestones.some((m) => m.track === slug));
    return head('<div class="eyebrow">Repository</div>', slug, r ? r.remote : '')
      + props(prop('Linked', r ? (r.linked ? 'yes, on this machine' : 'no') : '—') + prop('Explored', r && r.explored ? `<span class="mono">${esc(r.explored)}</span>` : 'not yet'))
      + (r && r.summary ? sec('Card', md(r.summary, nb)) : '')
      + sec('Specs', ss.map(specRow).join('') || none(), ss.length)
      + sec('Notes', ns.map((n) => noteRow(n.id, nb)).join('') || none(), ns.length);
  }

  let lastSel = '';
  function renderInspector() {
    const el = $('insp'), s = S.sel, wrap = $('insp-wrap');
    if (!s) { wrap.classList.add('hidden'); lastSel = ''; return; }
    const D = S.D; let h = '';
    if (s.kind === 'spec') { const sp = D.specs.find((x) => x.id === s.id); if (sp) h = inspSpec(sp); }
    else if (s.kind === 'milestone' || s.kind === 'ticket') {
      const [sid, id] = s.id.split('|'), sp = D.specs.find((x) => x.id === sid);
      const m = sp && (s.kind === 'milestone' ? msOf(sp, id) : sp.milestones.find((x) => x.tickets.some((t) => t.id === id)));
      if (m) h = s.kind === 'milestone' ? inspMilestone(sp, m) : inspTicket(sp, m, m.tickets.find((t) => t.id === id));
    } else if (s.kind === 'note' || s.kind === 'ghost') h = inspNote(s.id);
    else if (s.kind === 'repo') h = inspRepo(s.id);
    // a selection this data no longer holds (after a live reload) closes the panel
    if (!h) { S.sel = null; wrap.classList.add('hidden'); return; }
    wrap.classList.remove('hidden');
    el.innerHTML = `<div class="sticky top-0 z-10 flex items-center gap-2 border-b px-5 py-2.5 hairline" style="background:var(--rail)"><span class="eyebrow">Details</span><button data-expand title="${expanded ? 'Back to the side (E)' : 'Expand to read (E)'}" class="btn ml-auto px-2 py-0.5">${expanded ? '⤡' : '⤢'}</button><button data-close title="Close (Esc)" class="btn px-2 py-0.5">✕</button></div>${h}<div class="h-8"></div>`;
    const key = JSON.stringify(s); if (key !== lastSel) el.scrollTop = 0; lastSel = key;
    drawMermaid(el);
  }

  // Mermaid loads on the first diagram; drawn diagrams are cached by source, so a live reload never redraws one. A block
  // that fails to parse stays as code with the error under it, as write-spec's DIAGRAMS.md promises.
  let mermaidLib = null, mermaidSeq = 0; const mermaidDrawn = new Map();
  async function drawMermaid(root) {
    const codes = [...root.querySelectorAll('pre > code.language-mermaid')];
    if (!codes.length) return;
    mermaidLib ??= import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs').then((m) => m.default);
    const fail = (code, msg) => { const pre = code.parentElement; if (pre.isConnected && !pre.nextElementSibling?.dataset.diagramError) pre.insertAdjacentHTML('afterend', `<p data-diagram-error="1" class="-mt-1 mb-3 text-[11.5px]" style="color:#f87171">This diagram did not parse: ${esc(msg)}</p>`); };
    let mermaid;
    try { mermaid = await mermaidLib; } catch (e) { mermaidLib = null; codes.forEach((c) => fail(c, 'Mermaid could not load: ' + e.message)); return; }
    mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict', suppressErrorRendering: true });
    for (const code of codes) {
      const src = code.textContent;
      if (!mermaidDrawn.has(src)) {
        try { await mermaid.parse(src); mermaidDrawn.set(src, (await mermaid.render('bv-mmd' + ++mermaidSeq, src)).svg); }
        catch (e) { fail(code, String(e.message || e).split('\n')[0]); continue; }
      }
      const pre = code.parentElement; if (!pre.isConnected) continue;
      const box = document.createElement('div'); box.className = 'my-3 overflow-x-auto border p-3 hairline'; box.innerHTML = mermaidDrawn.get(src);
      pre.replaceWith(box);
    }
  }

  // ---------- details width: drag its left edge, or expand it to read (button, double-click on the edge, or E) ----------
  const WKEY = 'brain-page:inspector-width';
  let inspW = 420, expanded = false;
  try { const w = +localStorage.getItem(WKEY); if (w) inspW = w; } catch {}
  const clampW = (w) => Math.max(320, Math.min(Math.round(window.innerWidth * 0.7), w));
  const setW = (w, anim) => {
    const wrap = $('insp-wrap');
    wrap.style.transition = anim ? 'width .2s ease' : '';
    wrap.style.width = clampW(w) + 'px';
    const b = document.querySelector('[data-expand]'); if (b) { b.textContent = expanded ? '⤡' : '⤢'; b.title = expanded ? 'Back to the side (E)' : 'Expand to read (E)'; }
  };
  const toggleExpand = () => { expanded = !expanded; setW(expanded ? Math.max(inspW, window.innerWidth * 0.55) : inspW, true); };
  setW(inspW);
  $('insp-handle').ondblclick = toggleExpand;
  $('insp-handle').onpointerdown = (e) => {
    e.preventDefault(); e.target.setPointerCapture(e.pointerId);
    const right = $('insp-wrap').getBoundingClientRect().right;
    document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
    const move = (ev) => { expanded = false; inspW = clampW(right - ev.clientX); setW(inspW); };
    const up = () => {
      e.target.removeEventListener('pointermove', move); e.target.removeEventListener('pointerup', up);
      document.body.style.cursor = ''; document.body.style.userSelect = '';
      try { localStorage.setItem(WKEY, String(inspW)); } catch {}
    };
    e.target.addEventListener('pointermove', move); e.target.addEventListener('pointerup', up);
  };

  function render() {
    if (!S.D) return;
    $('brain-name').textContent = S.D.name;
    if ($('q').value.trim().toLowerCase() !== S.q) $('q').value = S.q;
    renderNav(); renderTop(); renderInspector();
    const r = route(), el = $('screen');
    // a screen may restyle the scroller (the graph fills it); each render starts from the default
    el.removeAttribute('style');
    if (screens[r.screen]) screens[r.screen].render(el, ctx());
  }

  // one click handler for the data attributes every screen uses
  document.addEventListener('click', (e) => {
    if (!S.D || $('view').classList.contains('hidden')) return;
    if (e.target.closest('[data-expand]')) return toggleExpand();
    const t = e.target.closest('[data-go],[data-repo],[data-scope],[data-sel],[data-close],[data-draftbody],[data-toast],[data-home]'); if (!t) return;
    if (t.dataset.go) go(t.dataset.go);
    else if (t.dataset.repo != null) { S.repo = S.repo === t.dataset.repo ? null : t.dataset.repo; render(); }
    else if (t.dataset.scope) { S.scope = t.dataset.scope; render(); }
    else if (t.dataset.sel) { const [k, ...rest] = t.dataset.sel.split('|'); if (!k) return; S.sel = { kind: k, id: rest.join('|') }; S.showDraft = false; render(); }
    else if (t.hasAttribute('data-close')) { S.sel = null; render(); }
    else if (t.hasAttribute('data-draftbody')) { S.showDraft = !S.showDraft; renderInspector(); }
    else if (t.dataset.toast) toast(t.dataset.toast);
    else if (t.hasAttribute('data-home')) location.hash = '#/';
  });
  document.addEventListener('keydown', (e) => {
    if (!S.D || $('view').classList.contains('hidden')) return;
    const a = document.activeElement, typing = a && (a.matches('input, textarea, select') || a.isContentEditable);
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); return; }
    if (typing) return;
    if (e.key === 'Escape' && S.sel) { S.sel = null; render(); }
    if ((e.key === 'e' || e.key === 'E') && !e.ctrlKey && !e.metaKey && !e.altKey && S.sel) toggleExpand();
  });
  $('q').addEventListener('input', (e) => { S.q = e.target.value.trim().toLowerCase(); render(); });
  window.addEventListener('app-select', () => render());

  return {
    register: (k, v) => { screens[k] = v; },
    // a new brain starts clean; the same brain again (a live reload) keeps the screen, selection and filters
    load: (brain, D) => { if (S.brain !== brain) Object.assign(S, { brain, sel: null, repo: null, q: '', showDraft: false }); S.D = D; render(); },
    render, state: S,
  };
})();
</script>

<script>
// ============================================================ THE SCREENS
// Each registers on App with a render(el, ctx) that redraws the main area from ctx (see App's ctx()).
// Overview, the landing dashboard after Altimeter's infra overview: KPI tiles, a "Delivery health" ticket heatmap grouped by
// spec with a counts block, a "Needs you" insights panel and a recent-activity feed on the right, and one pool card per repository below.
App.register('overview', {
  render(el, ctx) {
    const { D, ui, STAGE_ICON } = ctx, { esc, color } = ui;
    const specs = ctx.specs;
    const ms = specs.flatMap((s) => s.milestones.map((m) => ({ s, m })));
    const tks = (s) => s.milestones.flatMap((m) => m.tickets);
    const allT = specs.flatMap(tks);
    const cnt = (ts) => { const c = { todo: 0, doing: 0, blocked: 0, done: 0 }; ts.forEach((t) => { c[t.status] = (c[t.status] || 0) + 1; }); return c; };
    const c = cnt(allT);
    const nMs = (st) => ms.filter((x) => x.m.status === st).length;
    const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
    const ago = (iso) => { const m = Math.max(0, (Date.now() - new Date(iso)) / 6e4); return m < 60 ? Math.round(m) + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : m < 43200 ? Math.round(m / 1440) + 'd' : new Date(iso).toLocaleDateString('en', { month: 'short', day: 'numeric' }); };
    const tile = (st, size, t, attrs = '') => `<span ${attrs} class="${t === 'doing' ? 'pulse' : ''}" title="${esc(st)}" style="display:inline-block;flex:none;width:${size}px;height:${size}px;border-radius:${size > 10 ? 3 : 2}px;background:${color(t)}"></span>`;
    const hollow = (k, size) => `<span style="display:inline-block;flex:none;width:${size}px;height:${size}px;border-radius:3px;border:1.5px dashed ${color(k)}"></span>`;
    const chev = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="faint shrink-0"><path d="m9 6 6 6-6 6"/></svg>';
    const iconBox = (k, inner) => `<span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-[14px]" style="background:color-mix(in srgb, ${color(k)} 14%, transparent);border:1px solid color-mix(in srgb, ${color(k)} 30%, transparent)">${inner}</span>`;

    // ---------- header ----------
    const head = `<div class="flex flex-wrap items-end gap-3">
      <div><h1 class="text-[22px] font-semibold tracking-tight">Delivery overview</h1>
      <div class="muted mt-0.5 text-[12.5px]">${plural(specs.length, 'spec')} across ${plural(D.repos.length, 'repository').replace('repositorys', 'repositories')} · updated now</div></div>
      <div class="ml-auto flex items-center gap-2">${ui.scopeSeg()}</div>
    </div>`;

    // ---------- KPIs ----------
    const inFlight = specs.filter((s) => ['active', 'attention', 'blocked', 'landing', 'frontier'].includes(s.status)).length;
    const needsN = nMs('attention') + nMs('blocked');
    const kpis = `<div class="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6">
      ${ui.kpi('In flight', inFlight, `of ${specs.length} specs`, 'active')}
      ${ui.kpi('Frontier', nMs('frontier'), 'startable now', 'frontier')}
      ${ui.kpi('In progress', nMs('active'), 'milestones building', 'active')}
      ${ui.kpi('Needs you', needsN, 'attention + blocked', 'attention')}
      ${ui.kpi('Ready to land', nMs('landing'), 'squashed', 'landing')}
      ${ui.kpi('Landed', nMs('landed'), `of ${ms.length} milestones`, 'landed')}
    </div>`;

    // ---------- Delivery health ----------
    const group = (s) => {
      const ts = tks(s), n = ts.length;
      return `<div class="clickable rounded-lg border p-1.5 hairline" data-go="specs/${esc(s.id)}" title="${esc(s.num + ' · ' + s.title + ' · ' + s.status)}" style="max-width:${Math.max(48, Math.min(n || 1, 10) * 15 + 12)}px">
        <div class="mono mb-1 flex items-center gap-1 text-[9.5px] leading-none faint"><span class="h-[5px] w-[5px] rounded-full" style="background:${color(s.status)}"></span>${esc(s.num)}</div>
        <div class="flex flex-wrap gap-[3px]">${n ? ts.map((t) => tile(t.id + ' · ' + t.title + ' · ' + t.status, 12, t.status)).join('') : hollow(s.status, 12)}</div></div>`;
    };
    const legend = ['done', 'doing', 'blocked', 'todo'].map((k) => `<span class="inline-flex items-center gap-1.5 text-[11.5px] muted">${tile('', 9, k)}${ctx.TICKET[k].label} <b class="mono font-medium" style="color:var(--text)">${c[k] || 0}</b></span>`).join('');
    const counts = [['Specs', specs.length], ['Milestones', ms.length], ['Tickets', allT.length], ['Repositories', D.repos.length], ['Notes', D.notes.length]];
    const health = `<section class="panel">
      ${ui.panelHead('Delivery health', `<span class="faint">${allT.length} tickets monitored</span>`, '<span class="chip mono" style="background:rgba(52,211,153,.12);color:#6ee7b7;font-size:10px">LIVE</span>')}
      <div class="grid gap-0 p-4 pt-3 md:grid-cols-[minmax(0,1fr)_190px]">
        <div class="md:pr-5">
          <div class="flex max-h-[300px] flex-wrap gap-1.5 overflow-y-auto pr-1">${specs.map(group).join('') || '<span class="faint">No specs match</span>'}</div>
          <div class="mt-3 flex flex-wrap gap-x-4 gap-y-1">${legend}</div>
        </div>
        <div class="mt-4 border-t pt-3 hairline md:mt-0 md:border-l md:border-t-0 md:pl-5 md:pt-0">
          <div class="eyebrow mb-2">Resources</div>
          <div class="space-y-1.5">${counts.map(([l, v]) => `<div class="flex items-baseline justify-between text-[12.5px]"><span class="muted">${l}</span><span class="mono font-medium">${v}</span></div>`).join('')}</div>
        </div>
      </div></section>`;

    // ---------- Needs you ----------
    const needs = [];
    ms.filter((x) => x.m.status === 'attention' || x.m.status === 'blocked').forEach(({ s, m }) => {
      const bt = m.tickets.filter((t) => t.status === 'blocked').length;
      const reason = m.phase === 'failed' ? 'Check failed, needs a fix decision' : m.phase === 'ask' ? `${plural(m.awaiting, 'escalation')} waiting for your answer` : bt ? `${plural(bt, 'ticket')} blocked` : m.phaseLabel || 'Needs a decision';

              <span class="flex items-center gap-1" title="${esc(tracksOf(s).join(', '))}">${tracksOf(s).slice(0, 6).map(ui.repoDot).join('')}<span class="faint mono ml-1 text-[10.5px]">${tracksOf(s).length}</span></span>

      };

        <div class="flex items-end gap-3"><div><div class="ph text-[16px]">Specs</div><div class="muted mt-0.5 text-[12px]">${specs.length} spec${specs.length === 1 ? '' : 's'}, in dependency waves · open one for its milestone pipeline</div></div>

      el.querySelectorAll('[data-sort]').forEach((b) => { b.onclick = (e) => { e.stopPropagation(); sort = { k: b.dataset.sort, dir: sort.k === b.dataset.sort ? -sort.dir : 1 }; App.render(); }; });

  window.SpecsSection = screen;
})();

// Notes graph screen (#/notes), after the Notion clustered map: one rectangle per repository ('shared' for shared notes),
// a hub square per cluster, notes as squares sized by link degree, ghosts as dashed squares, faint cross-cluster links.
(function () {
  const ACCENT = '#cfcfcf', GREY = '#9b9b9b', GHOST = '#a8a8a8';
  const F = { hulls: true, cross: true, ghosts: true, labels: true, by: 'repo' };
  let built = null, root, svg, zg, zoom, sim, cur;
  let nodes = [], links = [], clusters = [], nbr = new Map(), typeCol = null, typeCount = new Map(), crossCount = 0;
  let hullSel, linkSel, nodeSel, labSel, hover = null, zk = 1;
  const line = d3.line().curve(d3.curveLinearClosed);
  // sharp edges, like the rest of the page: every node is a square centred on its point, of half-side h
  const sq = (g, h) => g.append('rect').attr('x', -h).attr('y', -h).attr('width', 2 * h).attr('height', 2 * h);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cc = (slug) => (slug === 'shared' ? GREY : cur.repoColor(slug));
  const fillOf = (d) => (d.kind === 'ghost' ? GHOST : d.kind === 'hub' || F.by === 'repo' ? cc(d.cluster) : typeCol(d.n.type));

  const CSS = `
    .np-root { position:absolute; inset:0; overflow:hidden; background-color:#141414; background-image:radial-gradient(#222222 1px, transparent 1px); background-size:26px 26px; }
    .np-root svg { display:block; width:100%; height:100%; cursor:grab; } .np-root svg:active { cursor:grabbing; }
    .np-bar { position:absolute; top:14px; left:14px; right:14px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; pointer-events:none; }
    .np-bar > * { pointer-events:auto; }
    .np-tgls { display:flex; align-items:center; gap:14px; padding:7px 14px; }
    .np-tgl { display:inline-flex; align-items:center; gap:7px; color:var(--muted); font-size:12px; }
    .np-tgl.on { color:var(--text); }
    .np-sw { width:24px; height:14px; border-radius:99px; background:var(--line-2); position:relative; transition:background .12s; }
    .np-sw i { position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:#8a8a8a; transition:transform .12s; }
    .np-tgl.on .np-sw { background:var(--accent-2); } .np-tgl.on .np-sw i { transform:translateX(10px); background:#141414; }
    .np-legend { position:absolute; left:14px; bottom:14px; width:230px; max-height:46%; display:flex; flex-direction:column; padding:10px 6px 8px 12px; }
    .np-legend .rows { overflow-y:auto; padding-right:6px; margin-top:6px; }

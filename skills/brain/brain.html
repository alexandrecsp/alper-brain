<!-- The brain list: every brain added on this machine, as a card. -->
<div id="home" class="hidden min-h-screen">
  <header class="sticky top-0 z-20 border-b border-zinc-200 bg-white/90 backdrop-blur dark:border-zinc-800 dark:bg-zinc-950/90">

      </div>
      <div class="ml-auto flex items-center gap-2 text-sm">
        <button id="reload" class="hidden rounded-md border border-zinc-200 px-3 py-1 hover:bg-zinc-100 dark:border-zinc-800 dark:hover:bg-zinc-900">Reload</button>

<!-- One brain, drawn by BrainView. -->
<div id="view" class="hidden h-screen"></div>

<script>
// ============================================================ THE BRAIN VIEW
// One brain, two views: Brain, its notes as a graph laid out by their links (the timeline is a mode of that graph), and
// Specs, every spec as a pipeline of stages, the specs in a band of their own above a band per repository. A left rail filters, the canvas draws, a right
// inspector reads the selected document. mount() draws a brain's data (toData's shape) and returns a handle whose
// snapshot() carries selection, filters, zoom and node positions into the next mount, so a live reload never jumps.
const BrainView = (function () {
  // Mermaid loads on the first diagram; drawn diagrams are cached by theme and source, across mounts, so a live reload
  // never redraws one (and never reuses a render id).
  let mermaidLib = null, mermaidSeq = 0; const mermaidDrawn = new Map();
  const d3 = window.d3, marked = window.marked;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- vocabulary ----------
  const STATUS = {
    attention: { label: 'Needs attention', tone: 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300', c: ['#fecaca', '#ef4444', '#7f1d1d', '#7f1d1d', '#f87171', '#fecaca'] },
    blocked: { label: 'Blocked', tone: 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300', c: ['#fecaca', '#ef4444', '#7f1d1d', '#7f1d1d', '#f87171', '#fecaca'] },
    active: { label: 'In progress', tone: 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300', c: ['#fde68a', '#f59e0b', '#78350f', '#78350f', '#fbbf24', '#fde68a'] },
    landing: { label: 'Ready to land', tone: 'bg-teal-100 text-teal-800 dark:bg-teal-950 dark:text-teal-300', c: ['#99f6e4', '#14b8a6', '#134e4a', '#134e4a', '#2dd4bf', '#99f6e4'] },
    waiting: { label: 'Waiting', tone: 'bg-violet-100 text-violet-800 dark:bg-violet-950 dark:text-violet-300', c: ['#ddd6fe', '#8b5cf6', '#4c1d95', '#4c1d95', '#a78bfa', '#ddd6fe'] },
    frontier: { label: 'Frontier', tone: 'bg-indigo-100 text-indigo-800 dark:bg-indigo-950 dark:text-indigo-300', c: ['#c7d2fe', '#6366f1', '#312e81', '#312e81', '#818cf8', '#c7d2fe'] },
    ready: { label: 'Ready to build', tone: 'bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300', c: ['#bae6fd', '#0ea5e9', '#0c4a6e', '#0c4a6e', '#38bdf8', '#bae6fd'] },
    draft: { label: 'Needs tickets', tone: 'bg-zinc-100 text-zinc-700 dark:bg-zinc-800 dark:text-zinc-300', c: ['#e4e4e7', '#a1a1aa', '#3f3f46', '#27272a', '#71717a', '#d4d4d8'] },
    done: { label: 'Done', tone: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300', c: ['#a7f3d0', '#10b981', '#064e3b', '#064e3b', '#34d399', '#a7f3d0'] },
    landed: { label: 'Landed', tone: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300', c: ['#6ee7b7', '#059669', '#064e3b', '#065f46', '#10b981', '#d1fae5'] },
    abandoned: { label: 'Abandoned', tone: 'bg-zinc-100 text-zinc-500 dark:bg-zinc-800 dark:text-zinc-400', c: ['#f4f4f5', '#d4d4d8', '#a1a1aa', '#18181b', '#52525b', '#71717a'] },
  };
  const ORDER = ['attention', 'blocked', 'active', 'landing', 'frontier', 'waiting', 'ready', 'draft', 'done', 'landed', 'abandoned'];
  const TICKET_STATUS = { todo: 'draft', doing: 'active', blocked: 'blocked', done: 'done' };
  const TYPES = ['feature', 'concept', 'decision', 'how-to', 'contract', 'other'];
  const LAYERS = ['business', 'application', 'other'];
  const COLS = [
    { label: 'Needs tickets', of: ['draft'] }, { label: 'Ready · Waiting', of: ['ready', 'waiting'] }, { label: 'Frontier', of: ['frontier'] },
    { label: 'Blocked · Attention', of: ['blocked', 'attention'] }, { label: 'In progress', of: ['active'] }, { label: 'Ready to land', of: ['landing', 'done'] }, { label: 'Landed', of: ['landed'] }, { label: 'Abandoned', of: ['abandoned'] },
  ];
  const COL = (st) => COLS.findIndex((c) => c.of.includes(st));
  // the step of /build a started milestone stands at (toData's stage: build while its tickets run, else its Phase)
  const STAGE_ICON = { build: '🔨', review: '🔍', decide: '⚖️', ask: '✋', fix: '🔧', check: '🧪', waits: '⏳', failed: '❌', squash: '📦' };
  const ACT = { recorded: 'bg-emerald-500', updated: 'bg-sky-500', superseded: 'bg-amber-500', deleted: 'bg-red-500', moved: 'bg-violet-500' };
  const DACT = { record: 'recorded', update: 'updated', supersede: 'superseded', delete: 'deleted' };
  const FUCHSIA = '#d946ef';

  const css = `
.pd-root{--pd-bg:#fff;--pd-lab:#71717a;--pd-e1:#a1a1aa;--pd-e2:#52525b;--pd-ex:#6366f1;--pd-ea:#a855f7;--pd-es:#d946ef;--pd-ring:#6366f1;--pd-bl:#9ca3af;--pd-neutral:#9ca3af;--pd-ghost:#a1a1aa;
--g0:#3b82f6;--g1:#f97316;--g2:#10b981;--g3:#eab308;--g4:#06b6d4;--g5:#ef4444;--gs:#94a3b8;
--t-feature:#3b82f6;--t-concept:#14b8a6;--t-decision:#8b5cf6;--t-how-to:#f97316;--t-contract:#eab308;--t-other:#94a3b8;--l-business:#0ea5e9;--l-application:#d946ef;--l-other:#94a3b8}
@media (prefers-color-scheme:dark){.pd-root{--pd-bg:#09090b;--pd-lab:#a1a1aa;--pd-e1:#52525b;--pd-e2:#a1a1aa;--pd-ex:#818cf8;--pd-ea:#c084fc;--pd-es:#e879f9;--pd-ring:#818cf8;--pd-bl:#8b8b97;--pd-neutral:#71717a;--pd-ghost:#71717a;
--g0:#60a5fa;--g1:#fb923c;--g2:#34d399;--g3:#facc15;--g4:#22d3ee;--g5:#f87171;--gs:#94a3b8;
--t-feature:#60a5fa;--t-concept:#2dd4bf;--t-decision:#a78bfa;--t-how-to:#fb923c;--t-contract:#facc15;--t-other:#94a3b8;--l-business:#38bdf8;--l-application:#e879f9;--l-other:#94a3b8}}
.pd-root svg text{font-family:ui-sans-serif,system-ui,sans-serif}
.pd-lbl{paint-order:stroke;stroke:var(--pd-bg);stroke-width:3px;stroke-linejoin:round}
/* Spec links come in two families, and colour belongs to status alone (on the glyphs):
   structure, "belongs to" (spec > milestone > ticket): thin neutral grey, no arrow;
   dependency, "waits on" (spec Depends on, Builds after, Lands after, ticket Depends on): one light neutral, arrow
   from the prerequisite to the one waiting, thicker the higher the level, solid while it still blocks (Lands after
   dotted, since it holds only the landing), dashed and faded once the prerequisite is done. Only milestones link
   across repositories; a ticket links only to tickets of its own. */
.pd-root{--pd-struct:#d4d4d8;--pd-dep:#3f3f46}
@media (prefers-color-scheme:dark){.pd-root{--pd-struct:#52525b;--pd-dep:#d4d4d8}}
.pd-e{fill:none;stroke-width:1}
.pd-e-trunk,.pd-e-owns{stroke:var(--pd-struct);stroke-width:1}
.pd-e-sdep,.pd-e-builds,.pd-e-lands,.pd-e-tdep{stroke:var(--pd-dep)}
.pd-e-sdep{stroke-width:2.2}.pd-e-builds,.pd-e-lands{stroke-width:1.5}.pd-e-lands{stroke-dasharray:1 3}.pd-e-tdep{stroke-width:1}
.pd-e.pd-dep-done{stroke-dasharray:4 3;stroke-opacity:.45}
.pd-m-dep{fill:var(--pd-dep)}.pd-m-depdone{fill:var(--pd-dep);fill-opacity:.45}
.pd-eg .pd-hit{fill:none;stroke:transparent;stroke-width:10;pointer-events:stroke;cursor:help}
.pd-eg:hover .pd-e{stroke-opacity:1;stroke-width:2.6}
.pd-bl{fill:none;stroke:var(--pd-bl);stroke-width:.8}
.pd-bl-sup{stroke:var(--pd-dep);stroke-dasharray:4 3;stroke-width:1.2}
.pd-wiki{color:#4f46e5;text-decoration:none;border-bottom:1px dotted currentColor}
.pd-ghostlink{color:#a1a1aa;border-bottom-style:dashed}
@media (prefers-color-scheme:dark){.pd-wiki{color:#a5b4fc}}
@keyframes pd-pulse{50%{opacity:.45}}.pd-doing{animation:pd-pulse 1.6s infinite}
@keyframes pd-actp{0%{stroke-opacity:1;stroke-width:3.5}100%{stroke-opacity:.25;stroke-width:1}}.pd-act-pulse{animation:pd-actp 1s ease-in-out infinite alternate}
` + Object.entries(STATUS).map(([k, v]) => `.pd-s-${k}{--f:${v.c[0]};--s:${v.c[1]};--x:${v.c[2]}}@media (prefers-color-scheme:dark){.pd-s-${k}{--f:${v.c[3]};--s:${v.c[4]};--x:${v.c[5]}}}`).join('');

  const monday = (iso) => { const d = new Date(iso); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };
  const day = (iso) => new Date(iso).toLocaleDateString('en', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
  const hue = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
  const avatar = (a) => `<span class="grid h-4 w-4 shrink-0 place-items-center rounded-full text-[9px] font-semibold text-white" style="background:hsl(${hue(a)} 50% 45%)">${esc(a[0] || '?')}</span>`;
  const pill = (st, text) => `<span class="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-medium ${STATUS[st].tone}">${esc(text ?? STATUS[st].label)}</span>`;
  const clamp01 = (x) => Math.max(0, Math.min(1, x));

  function mount(root, D, opts = {}) {
    if (!document.getElementById('bv-style')) { const st = document.createElement('style'); st.id = 'bv-style'; st.textContent = css; document.head.appendChild(st); }
    const ac = new AbortController(), on = (t, ev, fn) => t.addEventListener(ev, fn, { signal: ac.signal });
    const saved = opts.saved || {};

    // ---------- derived data ----------
    const notesById = new Map(D.notes.map((n) => [n.id, n]));
    const ghostSet = new Set(D.ghosts);
    const back = new Map();
    D.notes.forEach((n) => n.links.forEach((l) => { if (!back.has(l)) back.set(l, []); back.get(l).push(n.id); }));
    const commits = D.timeline.commits.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    const cidx = new Map(commits.map((c, i) => [c.sha, i]));
    const hist = new Map();
    commits.forEach((c) => c.changes.forEach((ch) => { if (!hist.has(ch.note)) hist.set(ch.note, []); hist.get(ch.note).push({ c, ch }); }));
    const weekOf = (c) => monday(c.date);
    const weekKeys = [];
    if (commits.length) {
      let d = new Date(monday(commits[0].date) + 'T00:00:00Z'); const end = monday(commits[commits.length - 1].date);
      while (d.toISOString().slice(0, 10) <= end) { weekKeys.push(d.toISOString().slice(0, 10)); d = new Date(d.getTime() + 7 * 864e5); }
    }
    const authors = [...new Set(commits.map((c) => c.author))];
    const drafts = D.notes.filter((n) => n.draft || n.pending);
    const draftAct = (n) => n.draft || n.pending;
    const existsAt = (n, up) => {
      if (up == null) return true;
      if (n.draft) return false;
      const h = hist.get(n.id); if (!h) return true;
      let ex = false;
      for (const { c, ch } of h) { if (cidx.get(c.sha) > up) break; ex = ch.action !== 'deleted'; }
      return ex;
    };

    // ---------- state ----------
    const S = { view: 'brain', mode: 'graph', sel: null, showDraft: false };
    const B = { colour: 'type', group: null, show: null, author: null, q: '' };
    const T = { week: null, sha: null, drafts: false };
    // scope: 'flight' shows only specs in flight (no Landed and no Abandoned line, by FORMAT.md), 'all' shows every spec,
    // 'todo' shows the specs in flight without what is finished, and only the repositories left with work
    const P = { repo: null, status: null, q: '', scope: 'flight' };
    const inScope = (s) => P.scope === 'all' || (!s.landed && !s.abandoned);
    Object.assign(S, saved.S); Object.assign(B, saved.B); Object.assign(T, saved.T); Object.assign(P, saved.P);

    // Groups: a note's cluster is always its repository ('shared' for notes spanning several); the colour follows the chosen axis.
    const clOf = (n) => (n.shared || n.repos.length !== 1 ? 'shared' : n.repos[0]);
    const axisOf = (type, layer) => (B.colour === 'layer' ? (LAYERS.includes(layer) ? layer : 'other') : TYPES.includes(type) ? type : 'other');
    const groupOf = (n) => (B.colour === 'repo' ? clOf(n) : axisOf(n.type, n.layer));
    const chGroup = (ch) => (B.colour === 'repo' ? ((ch.path || '').startsWith('shared/') || (ch.repos || []).length !== 1 ? 'shared' : ch.repos[0]) : axisOf(ch.type, ch.layer));
    const laneNames = D.repos.map((r) => r.slug);
    D.specs.forEach((s) => s.milestones.forEach((m) => { if (!laneNames.includes(m.track)) laneNames.push(m.track); }));
    const laneColor = (l) => (l === 'shared' ? 'var(--gs)' : `var(--g${Math.max(0, laneNames.indexOf(l)) % 6})`);
    const groupColor = (k) => (B.colour === 'repo' ? laneColor(k) : B.colour === 'layer' ? `var(--l-${LAYERS.includes(k) ? k : 'other'})` : `var(--t-${TYPES.includes(k) ? k : 'other'})`);

    root.innerHTML = `
<div class="pd-root flex h-full w-full flex-col bg-white text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100">
  <header id="pd-hdr" class="flex h-11 shrink-0 items-center gap-3 border-b border-zinc-200 px-3 dark:border-zinc-800"></header>
  <div class="flex min-h-0 flex-1">
    <aside class="flex w-64 shrink-0 flex-col border-r border-zinc-200 bg-zinc-50/60 dark:border-zinc-800 dark:bg-zinc-900/40">
      <div class="p-2"><input id="pd-q" type="search" placeholder="Find…" class="w-full rounded-md border border-zinc-200 bg-white px-2 py-1 text-[13px] outline-none focus:border-indigo-400 dark:border-zinc-700 dark:bg-zinc-900"></div>
      <nav id="pd-rail" class="min-h-0 flex-1 overflow-y-auto px-2 pb-4"></nav>
    </aside>
    <main class="flex min-w-0 flex-1 flex-col">
      <div class="relative min-h-0 flex-1">
        <div id="pd-brain" class="absolute inset-0"></div>
        <div id="pd-specs" class="absolute inset-0 hidden"></div>
        <div id="pd-crumb" class="pointer-events-none absolute bottom-3 left-3 flex items-center gap-2 text-xs text-zinc-500"></div>
        <div class="absolute right-3 top-3 flex flex-col overflow-hidden rounded-md border border-zinc-200 bg-white/90 text-sm shadow-sm dark:border-zinc-700 dark:bg-zinc-900/90">
          <button data-act="zoom" data-v="in" class="px-2 py-0.5 hover:bg-zinc-100 dark:hover:bg-zinc-800" title="Zoom in">+</button>
          <button data-act="zoom" data-v="out" class="border-t border-zinc-200 px-2 py-0.5 hover:bg-zinc-100 dark:border-zinc-700 dark:hover:bg-zinc-800" title="Zoom out">−</button>
          <button data-act="zoom" data-v="fit" class="border-t border-zinc-200 px-2 py-0.5 text-[11px] hover:bg-zinc-100 dark:border-zinc-700 dark:hover:bg-zinc-800" title="Fit everything">Fit</button>
        </div>
        <div id="pd-toast" class="pointer-events-none absolute right-14 top-3 hidden rounded-md bg-zinc-900 px-2 py-1 text-xs text-white dark:bg-zinc-100 dark:text-zinc-900"></div>
      </div>
      <div id="pd-dock" class="hidden shrink-0 border-t border-zinc-200 bg-zinc-50/60 dark:border-zinc-800 dark:bg-zinc-900/40"></div>
      <footer id="pd-foot" class="flex h-[60px] shrink-0 items-center overflow-hidden justify-between gap-6 border-t border-zinc-200 px-3 text-[11px] text-zinc-500 dark:border-zinc-800"></footer>
    </main>
    <aside id="pd-insp-wrap" class="relative shrink-0 border-l border-zinc-200 dark:border-zinc-800" style="width:28rem">
      <div id="pd-insp-handle" title="Drag to resize · double-click to expand" class="absolute -left-1 top-0 z-10 h-full w-2 cursor-col-resize hover:bg-indigo-400/40"></div>
      <button id="pd-insp-expand" title="Expand to read (E)" class="absolute right-2 top-2 z-10 grid h-7 w-7 place-items-center rounded-md border border-zinc-200 bg-white/90 text-sm text-zinc-500 shadow-sm hover:text-zinc-900 dark:border-zinc-700 dark:bg-zinc-900/90 dark:hover:text-zinc-100">⤢</button>
      <div id="pd-insp" class="h-full overflow-y-auto"></div>
    </aside>
  </div>
</div>`;
    const $ = (s) => root.querySelector(s);
    const hdr = $('#pd-hdr'), rail = $('#pd-rail'), insp = $('#pd-insp'), dock = $('#pd-dock'), foot = $('#pd-foot'), crumb = $('#pd-crumb'), qIn = $('#pd-q');

    // ---------- inspector width: drag the left edge, or expand it to read (button, double-click on the edge, or E) ----------
    const inspWrap = $('#pd-insp-wrap'), KEY = 'brain-page:inspector-width';
    const maxW = () => Math.round(root.getBoundingClientRect().width * 0.7);
    const clampW = (w) => Math.max(320, Math.min(maxW(), w));
    let inspW = 448, expanded = !!saved.expanded;
    try { const s = +localStorage.getItem(KEY); if (s) inspW = s; } catch {}
    const setW = (w, anim) => {
      inspWrap.style.transition = anim ? 'width .2s ease' : '';
      inspWrap.style.width = clampW(w) + 'px';
      $('#pd-insp-expand').textContent = expanded ? '⤡' : '⤢';
      $('#pd-insp-expand').title = expanded ? 'Back to the side (E)' : 'Expand to read (E)';
    };
    const toggleExpand = () => { expanded = !expanded; setW(expanded ? Math.max(inspW, root.getBoundingClientRect().width * 0.55) : inspW, true); };
    setW(expanded ? Math.max(inspW, root.getBoundingClientRect().width * 0.55) : inspW);
    $('#pd-insp-expand').onclick = toggleExpand;
    $('#pd-insp-handle').ondblclick = toggleExpand;
    $('#pd-insp-handle').onpointerdown = (e) => {
      e.preventDefault(); e.target.setPointerCapture(e.pointerId);
      const right = inspWrap.getBoundingClientRect().right;
      document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
      const move = (ev) => { expanded = false; inspW = clampW(right - ev.clientX); setW(inspW); };

    const keptPos = saved.pos || null;

    }

    // Time selection helpers (the timeline is a mode of the graph).

    const chOk = (ch) => !B.group || chGroup(ch) === B.group;
    const commitChanges = (c) => (cOk(c) ? c.changes.filter(chOk) : []);
    const timeOn = () => S.view === 'brain' && S.mode === 'time';
    const weekLast = (w) => { let last = null; commits.forEach((c, i) => { if (weekOf(c) === w) last = i; }); return last; };
    const upto = () => (T.sha ? cidx.get(T.sha) : T.week ? weekLast(T.week) : null);
    // What the picked commit, week, drafts or author changed: each note with its last action there, or null when nothing is picked.
    const changedActs = () => {

    // ============================================================ SPECS PIPELINE (C's kanban in B's shell)

        const info = { s, nodes: [], lane, lanes: [...new Set([...s.repos, ...s.milestones.map((m) => m.track)])].filter((l) => laneNames.includes(l)), m: new Map(), t: new Map() };
        sInfo.set(s.id, info);

        s.milestones.forEach((m, mi) => {
          const mn = mk(info, 'milestone', `m:${s.id}|${m.id}`, m.track, `${m.num} ${m.title}`, m.status, m, mi); info.m.set(m.id, mn); mn.builds = []; mn.after = []; mn.before = [];
          for (const t of m.tickets) { const tn = mk(info, 'ticket', `t:${s.id}|${t.id}`, m.track, `${t.num} ${t.title}`, TICKET_STATUS[t.status] || 'draft', t, mi); tn.m = mn; info.t.set(t.id, tn); E(mn, tn, 'owns'); }

    })();
    const stageOfStatus = (stt) => Math.max(0, COLS.findIndex((c) => c.of.includes(stt)));

    const stageOf = (n) => (n.kind === 'ticket' ? ({ todo: COL(n.m.status === 'frontier' ? 'frontier' : 'ready'), doing: COL('active'), blocked: COL('blocked') }[n.obj.status]

        + sec('Depends on', into.map(tkLine).join('') || none(), into.length) + sec('Blocks', out.map(tkLine).join('') || none(), out.length)

    }
    let lastKey = '';
    function renderInspector() {
      let h = '';

    const toast = (t) => { const el = $('#pd-toast'); el.textContent = t; el.classList.remove('hidden'); setTimeout(() => el.classList.add('hidden'), 4000); };

<script>
// ============================================================ THE PAGE
// Lists the brains added on this machine, reads one through the browser's folder access, turns its files into
// BrainView's data with toData, and re-reads it every few seconds while it is open.
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// The route lives in the hash: #/ is the brain list, #/b/<brain> one brain.
const route = () => (/^#\/b\/([^/]+)/.exec(location.hash) || [])[1] || null;
const goBrain = (id) => { location.hash = id ? '#/b/' + id : '#/'; };

// Each entry of brains is a brain the user added: { id, name, handle, status, files, data }.
const state = { brains: [], brain: null, notice: '', view: null };

// ---------- folder access ----------

// A browser that blocks storage may never answer: after two seconds the call gives up, and the page works on, only
// without remembering its brain list.
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    setTimeout(() => reject(new Error('IndexedDB did not answer')), 2000);
    const open = indexedDB.open('alper-brain-page', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      // a store call that throws (a value the store cannot clone) rejects, rather than leaving the promise hanging
      try {
        const tx = open.result.transaction('kv', mode);
        const req = fn(tx.objectStore('kv'));
        tx.oncomplete = () => resolve(req.result);
        tx.onerror = () => reject(tx.error);
      } catch (e) { reject(e); }
    };
  });
}

// Every file:// page shares one origin, so a fixed key gives each copy of this page, at any plugin version, the same brain list.
const saveBrains = async () => {
  try { await idb('readwrite', (s) => s.put(state.brains.map(({ id, name, handle }) => ({ id, name, handle })), 'brains')); } catch {}
};

async function walk(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'directory') await walk(h, prefix + name + '/', out);
    else if (name.endsWith('.md')) out.set(prefix + name, await (await h.getFile()).text());
  }
}
const sub = async (dir, ...names) => { for (const n of names) dir = await dir.getDirectoryHandle(n); return dir; };
const text = async (dir, name) => (await (await dir.getFileHandle(name)).getFile()).text();

// Re-reads one brain and sets its status: 'ok', 'denied' (read permission not granted) or 'missing' (no BRAIN.md at its
// root). Its files are the specs under .sdd/specs, the notes and cards under repos/ and shared/, this machine's drafts
// under .sdd/drafts, and timeline.json and .sdd/links.json. Returns whether its status or files changed.
async function readBrain(b) {
  const before = b.status;
  const files = new Map();
  try {
    if ((await b.handle.queryPermission({ mode: 'read' })) !== 'granted') b.status = 'denied';
    else {
      await b.handle.getFileHandle('BRAIN.md');
      try { await walk(await sub(b.handle, '.sdd', 'specs'), '.sdd/specs/', files); } catch {}
      for (const top of ['repos', 'shared']) { try { await walk(await sub(b.handle, top), top + '/', files); } catch {} }
      try { await walk(await sub(b.handle, '.sdd', 'drafts'), '.sdd/drafts/', files); } catch {}
      try { files.set('timeline.json', await text(b.handle, 'timeline.json')); } catch {}
      try { files.set('.sdd/links.json', await text(await sub(b.handle, '.sdd'), 'links.json')); } catch {}
      b.status = 'ok';
    }
  } catch { b.status = 'missing'; }
  if (b.status !== 'ok') return b.status !== before;
  if (b.files && b.files.size === files.size && [...files].every(([k, v]) => b.files.get(k) === v)) return b.status !== before;
  b.files = files;
  b.data = toData(b.name, files);
  return true;
}

// ---------- parsing: a brain's files into BrainView's data ----------

const heading = (t) => (/^#\s+(.+)$/m.exec(t) || [])[1]?.trim() ?? null;
const field = (t, name) => (new RegExp(`^\\*\\*${name}:\\*\\*\\s*(.+)$`, 'mi').exec(t) || [])[1]?.trim() ?? null;
const section = (t, name) => (new RegExp(`^##\\s+${name}\\s*$([\\s\\S]*?)(?=^##\\s|(?![\\s\\S]))`, 'm').exec(t) || [])[1]?.trim() ?? '';
const numOf = (s) => (/^(\d{3})/.exec(s) || [])[1] ?? null;
const shaOf = (s) => { const v = (s || '').replace(/`/g, ''); return /^[0-9a-f]{7,40}/i.test(v) ? v.slice(0, 7) : null; };
function front(t) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(t), fm = {};
  if (m) for (const l of m[1].split(/\r?\n/)) { const kv = /^([\w-]+):\s*(.*)$/.exec(l); if (kv) fm[kv[1]] = kv[2].trim().replace(/^["']|["']$/g, ''); }
  return { fm, body: m ? t.slice(m[0].length) : t };
}

// /build's closing steps after a milestone's last ticket, from milestone.md's Phase line; a Squash commit ends them.
// step 7 writes decide when the arbiter decides the escalations, and ask when the user does, stopping the track.
// scripts/check-phases.mjs checks every phase of build's Phase table is a key here.
const PHASE_LABEL = { check: 'Checking', failed: 'Check failed', waits: 'Waiting on its expand', review: 'In review', decide: 'Deciding escalations', ask: 'Waiting on your answers', fix: 'Fixing review', squash: 'Squashing' };
// How many of a review.md's findings are flagged escalate with no Answer line yet; a finding runs from its ID
// (ST1, SP2, CN3) to the next. The same rule as hooks/sdd.ts's awaitingOf.
const awaitingOf = (md) => md.split(/^(?=\s*(?:[-*]\s+|#{1,4}\s+)?(?:\*\*)?(?:ST|SP|CN)\d+\b)/m).slice(1)
  .filter((f) => /\bescalate\b/i.test(f) && !/\*\*Answer:\*\*/.test(f)).length;
const ticketsStatus = (ts) => (!ts.length ? 'draft' : ts.every((t) => t.status === 'done') ? 'done' : ts.some((t) => t.status === 'blocked') ? 'blocked'
  : ts.some((t) => t.status === 'doing' || t.status === 'done') ? 'active' : 'ready');
const WIKI = /\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g;

function toData(name, files) {
  const read = (p) => files.get(p);
  const paths = [...files.keys()];
  // repositories: one per card
  let links = {};
  try { links = JSON.parse(read('.sdd/links.json') || '{}'); } catch {}
  const repos = paths.filter((p) => /^repos\/[^/]+\/REPO\.md$/.test(p)).sort().map((p) => {
    const slug = p.split('/')[1], { fm, body } = front(read(p));
    return { slug, remote: fm.remote, explored: fm.explored || null, summary: body.trim(), linked: !!links[slug] };
  });
  // notes: a draft is read as the note it would land as, at its target; one that changes a committed note marks it
  const noteOf = (file, draft) => {
    const { fm, body } = front(read(file));
    const path = draft ? fm.target : file;
    if (!path || /\/REPO\.md$/.test(path)) return null;
    const parts = path.split('/');
    if (parts[0] === 'repos' && parts.length < 3) return null;
    const id = parts.at(-1).replace(/\.md$/, '');
    return {
      id, path, type: fm.type || 'other', layer: fm.layer || null, description: fm.description || '', body: body.trim(),
      repos: parts[0] === 'repos' ? [parts[1]] : (fm.repos || '').replace(/^\[|\]$/g, '').split(',').map((s) => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean),
      shared: parts[0] === 'shared', kind: parts.includes('explored') ? 'explored' : 'authored', explored: fm.explored || null,
      links: [...new Set([...body.matchAll(WIKI)].map((x) => x[1].trim()))].filter((l) => l !== id),
      superseded: fm.status === 'superseded', supersededBy: fm.supersededBy || null,
      draft: draft ? fm.action || 'record' : null, supersedes: fm.supersedes || null,
    };
  };
  const notes = new Map();
  for (const p of paths.filter((p) => /^(repos|shared)\/.*\.md$/.test(p))) { const n = noteOf(p, false); if (n && !notes.has(n.id)) notes.set(n.id, n); }
  for (const p of paths.filter((p) => p.startsWith('.sdd/drafts/'))) {
    const d = noteOf(p, true); if (!d) continue;
    const own = notes.get(d.id);
    if (own) { own.pending = d.draft; own.pendingBody = d.body; own.pendingDescription = d.description; }
    else if (d.draft !== 'delete') notes.set(d.id, d);
    if (d.draft === 'supersede' && notes.get(d.supersedes)) notes.get(d.supersedes).pending = 'supersede';
  }
  const ghosts = [...new Set([...notes.values()].flatMap((n) => n.links).filter((l) => !notes.has(l)))];
  let timeline = { commits: [] };
  try { const t = JSON.parse(read('timeline.json') || '{}'); if (Array.isArray(t.commits)) timeline = { commits: t.commits.map((c) => ({ ...c, changes: Array.isArray(c.changes) ? c.changes : [] })) }; } catch {}

  // specs: .sdd/specs/<spec>/spec.md, and its milestones in one track per repository (milestones/<slug>/NNN-*/), or,
  // ticketed before tracks, straight under milestones/ with a Repo line each (the flat layout)
  const byDir = new Map();
  for (const p of paths.filter((p) => p.startsWith('.sdd/specs/'))) {
    const parts = p.slice('.sdd/specs/'.length).split('/');
    if (!numOf(parts[0])) continue;
    if (!byDir.has(parts[0])) byDir.set(parts[0], []);
    byDir.get(parts[0]).push(parts);
  }
  const list = (v) => (v || '').split(/[,;]/).map((s) => s.replace(/[`\s]/g, '')).filter(Boolean);
  const specs = [...byDir.keys()].sort().map((dir) => {
    const t = read(`.sdd/specs/${dir}/spec.md`) || '';
    const landed = (field(t, 'Landed') || '').replace(/`/g, '');
    const s = {
      id: dir, num: numOf(dir), title: (heading(t) || dir).replace(/^Spec:\s*/i, ''), path: `.sdd/specs/${dir}/spec.md`, body: t,
      repos: list(field(t, 'Repos')), key: field(t, 'Key'), base: field(t, 'Base'),
      deps: list(field(t, 'Depends on')).filter(numOf), landed: /[0-9a-f]{7,40}/i.test(landed) ? landed : null, abandoned: field(t, 'Abandoned'),
      landings: field(t, 'Landings'), summary: section(t, 'Problem Statement').split(/\n\s*\n/)[0], milestones: [],
    };
    const ms = new Map();
    for (const parts of byDir.get(dir)) {
      if (parts[1] !== 'milestones') continue;
      const flat = parts.length === 4 && numOf(parts[2]), tracked = parts.length === 5 && !numOf(parts[2]) && numOf(parts[3]);
      if (!flat && !tracked) continue;
      const mdir = flat ? parts[2] : parts[3], file = parts.at(-1), key = flat ? mdir : `${parts[2]}/${mdir}`;
      if (!ms.has(key)) ms.set(key, { track: flat ? null : parts[2], mdir, base: `.sdd/specs/${dir}/milestones/${key}`, tickets: [] });
      if (numOf(file)) ms.get(key).tickets.push(file);
    }
    for (const mm of [...ms.values()].sort((a, b) => (a.track || '').localeCompare(b.track || '') || a.mdir.localeCompare(b.mdir))) {
      const mt = read(`${mm.base}/milestone.md`) || '', review = read(`${mm.base}/review.md`) ?? null;
      const track = mm.track || (field(mt, 'Repo') || '').replace(/`/g, '').trim() || 'unassigned';
      const after = field(mt, 'Lands after') || '', builds = field(mt, 'Builds after') || '';
      const msIds = (v) => (/^none/i.test(v) ? [] : (v.match(/[\w.-]+\/\d+/g) || []).map((d) => d.replace(/\/(\d+)$/, (_, n) => '/' + n.padStart(3, '0'))));
      const m = {
        id: `${track}/${numOf(mm.mdir)}`, track, num: numOf(mm.mdir), title: (heading(mt) || mm.mdir).replace(/^Milestone\s+\d+:\s*/i, ''),
        path: `${mm.base}/milestone.md`, body: mt, review, reviewPath: review != null ? `${mm.base}/review.md` : null, awaiting: review ? awaitingOf(review) : 0,
        delivers: field(mt, 'Delivers'), phase: (field(mt, 'Phase') || '').replace(/`/g, '').toLowerCase() || null,
        squash: shaOf(field(mt, 'Squash')), landed: shaOf(field(mt, 'Landed')),
        buildsAfter: msIds(builds), landsAfter: msIds(after), tickets: [],
      };
      for (const tf of mm.tickets.sort()) {
        const tt = read(`${mm.base}/${tf}`), deps = field(tt, 'Depends on') || '';
        m.tickets.push({
          id: `${track}/${numOf(tf)}`, num: numOf(tf), title: (heading(tt) || tf).replace(/^Ticket\s+\d+:\s*/i, ''), path: `${mm.base}/${tf}`, body: tt,
          status: (field(tt, 'Status') || 'todo').toLowerCase().replace(/`/g, ''), commit: shaOf(field(tt, 'Commit')),
          deps: /^none/i.test(deps) ? [] : (deps.match(/(?:[\w.-]+\/)?\d+/g) || []).map((d) => (d.includes('/') ? d.replace(/\/(\d+)$/, (_, n) => '/' + n.padStart(3, '0')) : `${track}/${d.padStart(3, '0')}`)),
        });
      }
      s.milestones.push(m);
    }
    // tracks wait on each other only at milestones: a ticket's Depends on another track's ticket, from before Builds
    // after, is read as its milestone's Builds after that ticket's milestone, as build moves it
    const ownerOf = new Map(s.milestones.flatMap((m) => m.tickets.map((t) => [t.id, m])));
    for (const m of s.milestones) for (const t of m.tickets) t.deps = t.deps.filter((d) => {
      const o = ownerOf.get(d);
      if (!o || o.track === m.track) return true;
      if (!m.buildsAfter.includes(o.id)) m.buildsAfter.push(o.id);
      return false;
    });
    if (!s.repos.length) s.repos = [...new Set(s.milestones.map((m) => m.track).filter((x) => x !== 'unassigned'))];
    return s;
  });
  // statuses: a closing milestone (all tickets done, a Phase, no Squash yet) is active, or waits on the user when its
  // check failed or it is at ask with escalations unanswered (decide is the arbiter's: it needs no one); its stage is
  // its Phase, and build while its tickets run. A squashed one not yet on its base is landing. A spec takes the most
  // urgent of its milestones.
  for (const s of specs) {
    for (const m of s.milestones) {
      const closing = !m.squash && PHASE_LABEL[m.phase] && m.tickets.length && m.tickets.every((t) => t.status === 'done');
      const waits = m.phase === 'failed' || (m.phase === 'ask' && m.awaiting > 0);
      m.status = m.landed ? 'landed' : closing ? (waits ? 'attention' : 'active') : ticketsStatus(m.tickets);
      if (m.status === 'done' && m.squash && !m.landed) m.status = 'landing';
      m.phaseLabel = closing ? (m.phase === 'ask' && !m.awaiting ? 'Answered' : PHASE_LABEL[m.phase]) : null;
      m.stage = closing ? m.phase : m.status === 'active' ? 'build' : null;
    }
    s.status = ticketsStatus(s.milestones.flatMap((m) => m.tickets));
    if (s.milestones.some((m) => m.status === 'attention')) s.status = 'attention';
    else if (s.status === 'done' && s.milestones.some((m) => m.phaseLabel)) s.status = 'active';
    else if (s.status === 'done' && !s.landed && s.milestones.some((m) => m.squash && !m.landed)) s.status = 'landing';
    if (s.status === 'done' && s.landed) s.status = 'landed';
  }
  // a dependency that is missing or has not landed holds a spec back; an Abandoned line retires it whatever its tickets say
  for (const s of specs) {
    s.waiting = s.deps.filter((d) => !specs.find((x) => x.id === d)?.landed);
    if (s.waiting.length && (s.status === 'draft' || s.status === 'ready')) s.status = 'waiting';
    if (s.abandoned) s.status = 'abandoned';
  }
  // the frontier, what the next /build starts (build's Tracks): each track's first open milestone with no ticket
  // started, once every milestone its Builds after names is squashed, in a spec not held by its own dependencies.
  // A spec with nothing started yet is in the frontier when any of its milestones is.
  for (const s of specs) {
    if (s.waiting.length || ['draft', 'abandoned', 'landed'].includes(s.status)) continue;
    for (const track of new Set(s.milestones.map((m) => m.track))) {
      const m = s.milestones.find((x) => x.track === track && !x.squash);
      if (!m || m.status !== 'ready') continue;
      if (m.buildsAfter.every((id) => { const o = s.milestones.find((x) => x.id === id); return !o || o.squash; })) m.status = 'frontier';
    }
    if (s.status === 'ready' && s.milestones.some((m) => m.status === 'frontier')) s.status = 'frontier';
  }
  return { name, repos, notes: [...notes.values()], ghosts, timeline, specs };
}

// ---------- the brain list ----------

const TONE = {
  attention: ['Needs you', 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300', 'from-red-500 to-rose-600'],
  active: ['In progress', 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300', 'from-amber-400 to-orange-500'],
  ready: ['Ready to build', 'bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300', 'from-sky-400 to-indigo-500'],
  quiet: ['', '', 'from-zinc-300 to-zinc-400 dark:from-zinc-700 dark:to-zinc-600'],
};
const GONE = {
  denied: { label: 'Needs permission', text: 'The browser needs your permission to read this folder again.' },
  missing: { label: 'Missing', text: 'Its <code>BRAIN.md</code> is gone: the folder was moved, renamed or deleted.' },
};
const plural = (n, w, ws = w + 's') => `${n} ${n === 1 ? w : ws}`;
const inFlight = (s) => !s.landed && !s.abandoned;
// A brain takes its most urgent spec's state: the user's turn (a spec waiting on answers or blocked), then work running,
// then a spec ready to build. Brains sort in that order, then by name.
const brainState = (b) => {
  if (b.status !== 'ok') return null;
  const has = (...ks) => b.data.specs.some((s) => ks.includes(s.status));
  return has('attention', 'blocked') ? 'attention' : has('active', 'landing') ? 'active' : has('ready', 'frontier') ? 'ready' : 'quiet';
};
const ORDER = ['attention', 'active', 'ready', 'quiet'];

function brainCard(b) {
  const remove = `<button data-remove="${b.id}" title="Remove from this page" class="-mr-1 shrink-0 rounded-md px-1.5 text-zinc-400 hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-zinc-800 dark:hover:text-zinc-100">✕</button>`;
  if (b.status !== 'ok') {
    const g = GONE[b.status];
    return `<article class="flex flex-col rounded-xl border border-dashed border-zinc-300 p-5 dark:border-zinc-700">
      <div class="flex items-center gap-2"><h2 class="min-w-0 flex-1 truncate text-lg font-semibold tracking-tight text-zinc-500">${esc(b.name)}</h2>
        <span class="shrink-0 rounded-full bg-zinc-100 px-2 py-0.5 text-xs font-medium text-zinc-600 dark:bg-zinc-800 dark:text-zinc-300">${g.label}</span>${remove}</div>
      <p class="mt-2 text-sm text-zinc-500">${g.text}</p>
      ${b.status === 'denied' ? `<button data-reconnect="${b.id}" class="mt-4 self-start rounded-md border border-zinc-300 px-3 py-1.5 text-sm hover:bg-zinc-100 dark:border-zinc-700 dark:hover:bg-zinc-900">Reconnect</button>` : ''}
    </article>`;
  }
  const d = b.data, st = brainState(b), [label, tone, accent] = TONE[st];
  const flying = d.specs.filter(inFlight), ts = flying.flatMap((s) => s.milestones.flatMap((m) => m.tickets)), done = ts.filter((t) => t.status === 'done').length;
  const needs = d.specs.filter((s) => s.status === 'attention' || s.status === 'blocked');
  const drafts = d.notes.filter((n) => n.draft || n.pending).length;
  return `<article data-brain="${b.id}" tabindex="0" class="group relative flex cursor-pointer flex-col overflow-hidden rounded-xl border border-zinc-200 bg-white p-5 outline-none transition hover:-translate-y-0.5 hover:border-zinc-300 hover:shadow-lg focus-visible:ring-2 focus-visible:ring-emerald-500 dark:border-zinc-800 dark:bg-zinc-900/40 dark:hover:border-zinc-700">
      <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r ${accent}"></div>
      <div class="flex items-center gap-2"><h2 class="min-w-0 flex-1 truncate text-lg font-semibold tracking-tight">${esc(b.name)}</h2>
        ${label ? `<span class="shrink-0 rounded-full px-2 py-0.5 text-xs font-medium ${tone}">${label}</span>` : ''}${remove}</div>
      <div class="mt-3 text-xs text-zinc-500">${plural(flying.length, 'spec')} in flight · ${plural(d.notes.length, 'note')} · ${plural(d.repos.length, 'repository', 'repositories')}${drafts ? ` · ${drafts} not shared` : ''}</div>
      <div class="mt-3 flex items-center gap-2 text-xs text-zinc-500"><div class="h-1.5 flex-1 overflow-hidden rounded-full bg-zinc-200 dark:bg-zinc-800"><div class="h-full bg-emerald-500" style="width:${ts.length ? (done / ts.length) * 100 : 0}%"></div></div>${done}/${plural(ts.length, 'ticket')}</div>
      ${needs.length ? `<ul class="mt-3 space-y-1 border-t border-zinc-100 pt-3 text-[13px] dark:border-zinc-800">${needs.map((s) => `<li class="flex items-center gap-2"><span class="font-mono text-[11px] text-zinc-500">${esc(s.num)}</span><span class="min-w-0 flex-1 truncate">${esc(s.title)}</span><span class="text-xs text-red-600 dark:text-red-400">${s.status === 'blocked' ? 'Blocked' : 'Needs you'}</span></li>`).join('')}</ul>` : ''}
    </article>`;
}

function showHome(msg) {
  if (state.view) { state.view.destroy(); state.view = null; }
  $('view').classList.add('hidden');
  $('home').classList.remove('hidden');
  $('reload').classList.toggle('hidden', !state.brains.length);
  const brains = [...state.brains].sort((a, b) => ORDER.indexOf(brainState(a)) - ORDER.indexOf(brainState(b)) || a.name.localeCompare(b.name));
  $('homeMain').innerHTML = `<div class="mx-auto max-w-6xl">
      <p class="font-mono text-xs uppercase tracking-widest text-zinc-500">Second brain</p>
      <h1 class="mb-6 mt-1 text-3xl font-semibold tracking-tight">Brains</h1>
      ${msg ? `<div class="mb-6 rounded-xl border border-zinc-200 px-4 py-3 text-sm dark:border-zinc-800">${msg}</div>` : ''}
      ${state.notice ? `<div class="mb-6 flex items-start gap-3 rounded-xl border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-200"><p class="flex-1">${state.notice}</p><button data-dismiss title="Dismiss" class="shrink-0 hover:opacity-70">✕</button></div>` : ''}
      ${brains.length ? `<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">${brains.map(brainCard).join('')}</div>`
        : `<div class="rounded-xl border border-dashed border-zinc-300 py-16 text-center text-sm text-zinc-500 dark:border-zinc-700">No brains yet. Click <b>Add brain</b> and pick a brain's folder, the one holding <code>BRAIN.md</code>. Nothing leaves your machine.</div>`}
    </div>`;
  const m = $('homeMain');
  const dismiss = m.querySelector('[data-dismiss]');
  if (dismiss) dismiss.onclick = () => { state.notice = ''; showHome(); };
  m.querySelectorAll('[data-brain]').forEach((el) => {
    el.onclick = () => goBrain(el.dataset.brain);
    el.onkeydown = (e) => e.key === 'Enter' && e.target === el && goBrain(el.dataset.brain);
  });
  m.querySelectorAll('[data-remove]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); removeBrain(el.dataset.remove); }));
  m.querySelectorAll('[data-reconnect]').forEach((el) => (el.onclick = () => reconnect(state.brains.find((b) => b.id === el.dataset.reconnect))));
}

// ---------- one brain ----------

// Draws the open brain, carrying the previous view's selection, filters, zoom and node positions into the new one.
function showBrain() {
  const b = state.brain;
  $('home').classList.add('hidden');
  $('view').classList.remove('hidden');
  if (b.status !== 'ok') {
    if (state.view) { state.view.destroy(); state.view = null; }
    $('view').innerHTML = `<div class="mx-auto max-w-md space-y-4 py-24 text-center"><h1 class="text-xl font-semibold tracking-tight">${esc(b.name)}</h1>
      <p class="text-sm text-zinc-500">${GONE[b.status].text}</p>
      <div class="flex justify-center gap-2">${b.status === 'denied' ? '<button id="reconnect" class="rounded-md border border-zinc-300 px-3 py-1.5 text-sm hover:bg-zinc-100 dark:border-zinc-700 dark:hover:bg-zinc-900">Reconnect</button>' : ''}
      <button id="back" class="rounded-md px-3 py-1.5 text-sm text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-900">All brains</button></div></div>`;
    if ($('reconnect')) $('reconnect').onclick = () => reconnect(b);
    $('back').onclick = () => goBrain(null);
    return;
  }
  const saved = state.view && state.view.brain === b.id ? state.view.snapshot() : null;
  if (state.view) state.view.destroy();
  $('view').innerHTML = '';
  state.view = BrainView.mount($('view'), b.data, { saved, onHome: () => goBrain(null) });
  state.view.brain = b.id;
}

// ---------- reading, adding, removing ----------

// Re-reads what is on screen, the open brain or every listed one, and redraws only when a file changed.
async function refresh() {
  if (state.brain) { if (await readBrain(state.brain)) showBrain(); return; }
  if ((await Promise.all(state.brains.map(readBrain))).some(Boolean)) showHome();
}
let polling = false;
setInterval(async () => {
  if (!state.brain || polling || document.hidden) return;
  polling = true;
  try { await refresh(); } finally { polling = false; }
}, 2000);

// A brain shows as its folder's name; a clashing name takes the first free number suffix.
function uniqueName(name) {
  const taken = new Set(state.brains.map((b) => b.name));
  let n = 1, out = name;
  while (taken.has(out)) out = `${name} ${++n}`;
  return out;
}

async function addBrain() {
  let handle;
  try { handle = await window.showDirectoryPicker({ id: 'brain', mode: 'read' }); } catch { return; }
  for (const b of state.brains) if (await b.handle.isSameEntry(handle).catch(() => false)) return goBrain(b.id);
  try { await handle.getFileHandle('BRAIN.md'); } catch {
    state.notice = `No <code>BRAIN.md</code> in <b>${esc(handle.name)}</b>. Pick the brain's folder, the one holding <code>BRAIN.md</code>; <code>/brain setup</code> creates one.`;
    return state.brain ? goBrain(null) : showHome();
  }
  state.notice = '';
  const b = { id: Math.random().toString(36).slice(2, 8), name: uniqueName(handle.name), handle };
  state.brains.push(b);
  await saveBrains();
  await readBrain(b);
  goBrain(b.id);
}

async function removeBrain(id) {
  state.brains = state.brains.filter((b) => b.id !== id);
  await saveBrains();
  showHome();
}

async function reconnect(b) {
  try { await b.handle.requestPermission({ mode: 'read' }); } catch {}
  await readBrain(b);
  if (state.brain) showBrain(); else showHome();
}

async function applyRoute() {
  const b = state.brains.find((x) => x.id === route()) || null;
  if (state.brain !== b && state.view) { state.view.destroy(); state.view = null; }
  state.brain = b;
  if (!b) return showHome();
  await readBrain(b);
  showBrain();
}

async function restore() {
  if (!window.showDirectoryPicker) {
    $('open').classList.add('hidden');
    return showHome('This page needs Chrome or Edge: it reads your brains through their folder access.');
  }
  try { state.brains = (await idb('readonly', (s) => s.get('brains'))) || []; } catch {}
  await Promise.all(state.brains.map(readBrain));
  applyRoute();
}

$('open').onclick = addBrain;
$('reload').onclick = refresh;
window.addEventListener('hashchange', applyRoute);
window.addEventListener('focus', refresh);
restore();
</script>
</body>
</html>

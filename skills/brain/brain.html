<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111113'/%3E%3Cpath d='M9.6 22.4A9 9 0 1 1 22.4 22.4' fill='none' stroke='%23FF7A1A' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23FFB27A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Bahnschrift', 'Segoe UI', 'Inter', 'ui-sans-serif', 'system-ui'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] } } } };
</script>
<script>
// ============================================================ THE THEME
// The page wears Agent Watcher's look, and its six themes: the same colours, faces and tracking as THEMES in
// hooks/draw.ts. A theme sets the CSS variables below; the viewer's pick is kept in localStorage.
const Theme = (function () {
  const BAHN = "Bahnschrift, 'DIN Alternate', 'Segoe UI', Inter, sans-serif";
  const T = {
    ember: { name: 'Ember', bg: '#09090A', panel: '#111113', hair: '#26262A', text: '#F2EDE6', muted: '#8C8780', faint: '#4A4744', accent: '#FF7A1A', accent2: '#FFB27A', head: BAHN, body: BAHN, num: BAHN, numWeight: 300, track: 1.6, radius: 10 },
    gold: { name: 'Gold', bg: '#09090A', panel: '#111113', hair: '#26262A', text: '#F2EDE3', muted: '#9C9483', faint: '#544E43', accent: '#C8A867', accent2: '#EFE7D6', cool: '#D8D0BF', head: BAHN, body: BAHN, num: BAHN, numWeight: 300, track: 1.6, radius: 10 },
    tide: { name: 'Tide', bg: '#02070A', panel: '#061014', hair: '#14252C', text: '#E4F1F0', muted: '#7F99A2', faint: '#36505A', accent: '#34D1A0', accent2: '#6CC4F5', cool: '#4D7FE3', head: BAHN, body: BAHN, num: BAHN, numWeight: 300, track: 1.6, radius: 10 },
    slate: { name: 'Slate', bg: '#1B1E24', panel: '#22262E', hair: '#333844', text: '#E9ECF1', muted: '#8A93A3', faint: '#4B5262', accent: '#F08A2C', accent2: '#F6B36E', head: "'Segoe UI Variable Display', 'Segoe UI', Inter, sans-serif", body: "'Segoe UI Variable Text', 'Segoe UI', Inter, sans-serif", num: "'Segoe UI Variable Display', 'Segoe UI', Inter, sans-serif", numWeight: 600, track: 1.2, radius: 8 },
    dusk: { name: 'Dusk', bg: '#0B1019', panel: '#111827', hair: '#232D40', text: '#F1EADF', muted: '#8E97A8', faint: '#3E4859', accent: '#E8A44A', accent2: '#F5CF94', head: "Georgia, Cambria, 'Times New Roman', serif", body: "'Segoe UI', Inter, sans-serif", num: 'Georgia, Cambria, serif', numWeight: 400, track: 2.2, radius: 12 },
    mono: { name: 'Mono', bg: '#050505', panel: '#0C0C0C', hair: '#1F1F1F', text: '#EDEDED', muted: '#7A7A7A', faint: '#3A3A3A', accent: '#FF6B00', accent2: '#FFA266', head: "'Cascadia Code', Consolas, 'JetBrains Mono', monospace", body: "'Cascadia Code', Consolas, 'JetBrains Mono', monospace", num: "'Cascadia Code', Consolas, 'JetBrains Mono', monospace", numWeight: 300, track: 1, radius: 4 },
  };
  const KEY = 'brain-page:theme';
  let id = 'ember';
  try { const s = localStorage.getItem(KEY); if (s && T[s]) id = s; } catch {}
  function apply(next) {
    if (T[next]) id = next;
    const t = T[id], set = (k, v) => document.documentElement.style.setProperty(k, v);
    const mix = (a, b, p) => `color-mix(in srgb, ${a} ${p}%, ${b})`;
    set('--bg', t.bg); set('--panel', t.panel); set('--rail', mix(t.bg, t.panel, 55));
    set('--panel-2', mix(t.panel, '#ffffff', 96)); set('--hover', mix(t.panel, '#ffffff', 92));
    set('--line', t.hair); set('--line-2', mix(t.hair, '#ffffff', 88));
    // the watcher's faint is for figures on a lit card; text on the page needs it a step brighter
    set('--text', t.text); set('--muted', t.muted); set('--faint', mix(t.faint, t.muted, 50));
    set('--accent', t.accent); set('--accent-2', t.accent2); set('--cool', t.cool || t.muted);
    set('--head', t.head); set('--body', t.body); set('--num', t.num); set('--num-w', String(t.numWeight));
    set('--track', t.track + 'px'); set('--radius', t.radius + 'px');
    document.querySelectorAll('[data-tpick]').forEach(paint);
  }
  // the picker: a dot per theme in its accent; the current one ringed
  function paint(el) {
    el.innerHTML = Object.entries(T).map(([k, t]) => `<button data-theme="${k}" title="${t.name}" aria-label="${t.name} theme" class="tdot${k === id ? ' on' : ''}" style="--c:${t.accent};--c2:${t.accent2}"></button>`).join('');
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-theme]'); if (!b) return;
    apply(b.dataset.theme);
    try { localStorage.setItem(KEY, id); } catch {}
    // the CSS follows by itself; an open brain redraws so its diagrams take the new colours
    if (typeof App !== 'undefined' && App.state.D && !document.getElementById('view').classList.contains('hidden')) App.render();
  });
  apply(id);
  document.addEventListener('DOMContentLoaded', () => document.querySelectorAll('[data-tpick]').forEach(paint));
  // the n-th colour of a set (repositories, note types): the accent first, then hues a golden angle apart at the
  // accent's own strength, so a set of any size stays apart and still reads as the theme's
  function color(n) {
    const t = T[id];
    if (!n) return t.accent;
    const v = parseInt(t.accent.slice(1), 16), [r, g, b] = [v >> 16, (v >> 8) & 255, v & 255].map((x) => x / 255);
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, d = max - min;
    const sat = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    const hue = !d ? 0 : max === r ? 60 * (((g - b) / d) % 6) : max === g ? 60 * ((b - r) / d + 2) : 60 * ((r - g) / d + 4);
    const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
    return `hsl(${Math.round((hue + n * 137.508 + 360) % 360)} ${Math.round(clamp(sat * 70, 35, 72))}% ${Math.round(clamp(l * 100 + 6, 58, 68))}%)`;
  }
  return { apply, get: () => id, color };
})();
</script>
<style>
  /* Agent Watcher's look: a near-black ground lit faintly by the accent, raised rounded cards with a sheen on top,
     tracked capitals for labels, light figures, and a glow only on what is live. Colour encodes status (and a
     repository's dot); the accent marks what is selected, live or the next step. Theme sets every token below. */
  :root {
    --bg: #09090A; --rail: #0D0D0E; --panel: #111113; --panel-2: #17171A; --hover: #1E1E21; --line: #26262A; --line-2: #36363B;
    --text: #F2EDE6; --muted: #8C8780; --faint: #6B6762; --accent: #FF7A1A; --accent-2: #FFB27A; --cool: #8C8780;
    --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
    --head: Bahnschrift, 'Segoe UI', Inter, sans-serif; --body: Bahnschrift, 'Segoe UI', Inter, sans-serif; --num: Bahnschrift, 'Segoe UI', Inter, sans-serif;
    --num-w: 300; --track: 1.6px; --radius: 10px;
    --s-done: #34d399; --s-landed: #10b981; --s-landing: #2dd4bf; --s-active: #fbbf24; --s-attention: #E5484D; --s-blocked: #ef4444;
    --s-frontier: #818cf8; --s-waiting: #a78bfa; --s-ready: #38bdf8;
    --s-draft: color-mix(in srgb, var(--muted) 50%, var(--bg)); --s-todo: var(--line-2); --s-abandoned: color-mix(in srgb, var(--faint) 60%, var(--bg));
  }
  html { height: 100%; background: var(--bg); }
  body { height: 100%; color: var(--text); font-family: var(--body); font-size: 13px; -webkit-font-smoothing: antialiased;
    background: radial-gradient(1100px 480px at 10% -12%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%) fixed, var(--bg); }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .num { font-family: var(--num) !important; font-weight: var(--num-w) !important; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  .eyebrow { font-family: var(--body); font-size: 10.5px; font-weight: 600; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); }
  /* a card: raised, lit faintly from the top */
  .panel { background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,0) 35%), var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 18px -8px rgba(0,0,0,.6); }
  .panel-2 { background: var(--panel-2); border: 1px solid var(--line); border-radius: calc(var(--radius) - 2px); }
  .hairline { border-color: var(--line); }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .cell { width: 11px; height: 11px; display: inline-block; flex: none; border-radius: 2px; }
  .cell-lg { width: 14px; height: 14px; border-radius: 3px; }
  .logo { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent-2); font-family: var(--head); font-weight: 300; font-size: 14px;
    background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--accent-2) 22%, transparent), transparent 70%); box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 30%, transparent); }
  .navitem { display: flex; align-items: center; gap: 10px; padding: 7px 10px; color: var(--muted); cursor: pointer; border-radius: 8px; }
  .navitem:hover { background: var(--hover); color: var(--text); }
  .navitem.on { background: var(--accent-soft); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
  .navitem.on svg { color: var(--accent); }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; font-size: 11px; font-weight: 500; white-space: nowrap; border-radius: 999px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); padding: 5px 11px; color: var(--text); background: var(--panel-2); border-radius: 8px; }
  .btn:hover { background: var(--hover); border-color: color-mix(in srgb, var(--accent) 35%, var(--line-2)); }
  .btn-accent { background: var(--accent); border-color: transparent; color: var(--bg); font-weight: 600; box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 30%, transparent); }
  .btn-accent:hover { background: var(--accent-2); border-color: transparent; }
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
  .seg button { padding: 3px 11px; color: var(--muted); border-radius: 999px; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--accent-soft); color: var(--accent-2); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  .clickable { cursor: pointer; transition: border-color .12s, background .12s; }
  .clickable:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--line-2)); background: var(--panel-2); }
  .row { display: flex; width: 100%; align-items: center; gap: 8px; padding: 5px 6px; text-align: left; font-size: 12.5px; cursor: pointer; border-radius: 6px; }
  .row:hover { background: var(--hover); }
  /* what is live: a pill outlined in the accent, its dot glowing and breathing */
  .live { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 11px 0 9px; border-radius: 12px; background: var(--panel); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent-2); font-family: var(--num); font-size: 12px; white-space: nowrap; }
  .live.sm { height: 20px; font-size: 10.5px; letter-spacing: var(--track); padding: 0 9px 0 7px; }
  .glow-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent), 0 0 2px var(--accent); animation: breathe 2s infinite; }
  .tdot { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, var(--c2), var(--c) 70%); opacity: .55; transition: opacity .12s, box-shadow .12s; }
  .tdot:hover { opacity: 1; }
  .tdot.on { opacity: 1; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--c), 0 0 10px var(--c); }
  @keyframes pulse2 { 50% { opacity: .45 } } .pulse { animation: pulse2 1.6s infinite; }
  @keyframes breathe { 50% { opacity: .35 } }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; } ::-webkit-scrollbar-track { background: transparent; }
  input:not([type=radio]):not([type=range]):not([type=checkbox]), textarea, select { border-radius: 8px; }
  input, textarea, select { accent-color: var(--accent); }
  input:focus, textarea:focus, select:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent) !important; }
  .prose-brain { color: color-mix(in srgb, var(--text) 82%, var(--muted)); line-height: 1.6; overflow-wrap: anywhere; }
  .prose-brain h1 { font-family: var(--head); font-size: 17px; font-weight: 300; margin: 6px 0 8px; color: var(--text); } .prose-brain h2 { font-family: var(--head); font-size: 14.5px; font-weight: 400; margin: 18px 0 6px; color: var(--text); }
  .prose-brain h3 { font-size: 13px; font-weight: 600; margin: 14px 0 4px; color: var(--text); }
  .prose-brain p, .prose-brain li { margin: 6px 0; } .prose-brain ul { list-style: disc; padding-left: 18px; } .prose-brain ol { list-style: decimal; padding-left: 18px; }
  .prose-brain li::marker { color: var(--accent); }
  .prose-brain code { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .prose-brain pre { background: var(--panel-2); border: 1px solid var(--line); padding: 10px; overflow-x: auto; margin: 10px 0; border-radius: 8px; } .prose-brain pre code { background: none; padding: 0; }
  .prose-brain strong { color: var(--text); } .prose-brain a { color: var(--accent-2); border-bottom: 1px dotted color-mix(in srgb, var(--accent) 60%, transparent); }
  .prose-brain table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; } .prose-brain th, .prose-brain td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
  .prose-brain th { font-size: 10.5px; font-weight: 600; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); }
  .prose-brain blockquote { border-left: 2px solid var(--accent); padding-left: 10px; color: var(--muted); }
  .wiki { color: var(--accent-2); border-bottom: 1px dotted color-mix(in srgb, var(--accent) 60%, transparent); cursor: pointer; } .wiki.ghost { color: var(--muted); border-bottom: 1px dashed var(--muted); }
  /* a card's title: tracked capitals after a small accent dot, as on the watcher's cards */
  .ph { display: flex; align-items: center; gap: 10px; font-family: var(--body); font-size: 10.5px !important; font-weight: 600; letter-spacing: var(--track); text-transform: uppercase; color: var(--muted); }
  .ph::before { content: ''; width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--accent); }
  /* light headers: page titles, the inspector's title and the KPI figures */
  body [class*="text-[17px]"], body [class*="text-[18px]"], body [class*="text-[20px]"], body [class*="text-[22px]"], body [class*="text-[26px]"], body [class*="text-[28px]"] { font-family: var(--head); font-weight: 300 !important; letter-spacing: -.01em; }
</style>
</head>
<body>

<!-- The brain list: every brain added on this machine, as a card. -->
<div id="home" class="hidden min-h-full">
  <header class="flex h-14 items-center gap-3 border-b px-5 hairline" style="background:var(--rail)">
    <span class="logo">B</span><span class="text-[17px]">Brain</span>
    <div class="ml-auto flex items-center gap-3"><div data-tpick class="mr-2 flex items-center gap-2" title="Theme"></div><button id="reload" class="btn hidden text-[12px]">Reload</button><button id="open" class="btn btn-accent text-[12px]">Add brain</button></div>
  </header>
  <main id="homeMain" class="px-6 py-8"></main>
</div>

<!-- One brain: a rail of screens and repositories, a top bar, the screen, and the details panel over it. -->
<div id="view" class="hidden h-full">
  <div class="flex h-full">
    <aside class="flex w-60 shrink-0 flex-col border-r hairline" style="background:var(--rail)">
      <button data-home title="All brains" class="flex h-14 items-center gap-2.5 border-b px-4 text-left hairline hover:bg-white/5">
        <span class="logo">B</span>
        <span class="min-w-0"><span id="brain-name" class="block truncate font-medium"></span><span class="faint block text-[11px]">← all brains</span></span>
      </button>
      <nav id="nav" class="flex-1 overflow-y-auto px-3 py-3"></nav>
      <div class="flex items-center gap-2 border-t px-5 py-3 hairline"><span class="eyebrow faint mr-auto">Theme</span><div data-tpick class="flex items-center gap-2"></div></div>
    </aside>
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-14 shrink-0 items-center gap-3 border-b px-5 hairline">
        <div id="crumb" class="flex min-w-0 items-center gap-2 text-[13px]"></div>
        <div class="ml-auto flex items-center gap-2">
          <label class="flex w-72 items-center gap-2 border px-3 py-1.5 hairline" style="background:var(--panel);border-radius:999px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="faint"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Search specs, milestones, notes…" class="w-full bg-transparent text-[13px] outline-none placeholder:text-zinc-600" style="border-radius:0">
            <span class="mono faint border px-1.5 text-[10px] hairline" style="border-radius:4px">⌘K</span>
          </label>
          <span title="Watching this brain for changes" class="live"><span class="glow-dot"></span>Live</span>
        </div>
      </header>
      <div class="relative flex min-h-0 flex-1">
        <main id="screen" class="min-w-0 flex-1 overflow-auto"></main>
        <aside id="insp-wrap" class="absolute right-0 top-0 z-30 hidden h-full border-l hairline" style="width:420px;background:var(--rail);box-shadow:-24px 0 48px rgba(0,0,0,.55), inset 1px 0 0 color-mix(in srgb, var(--accent) 18%, transparent)">
          <div id="insp-handle" title="Drag to resize · double-click to expand" class="absolute -left-1 top-0 z-20 h-full w-2 cursor-col-resize hover:bg-white/10"></div>
          <div id="insp" class="h-full overflow-y-auto"></div>
        </aside>
        <div id="toast" class="pointer-events-none absolute bottom-4 left-1/2 z-40 hidden -translate-x-1/2 px-3 py-1.5 text-[12px]" style="background:var(--accent);color:var(--bg);border-radius:999px;box-shadow:0 0 18px color-mix(in srgb, var(--accent) 35%, transparent)"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================ THE BRAIN VIEW
// One brain, as screens: Overview (KPIs, the ticket heatmap, the specs in dependency waves, what needs you, recent
// activity, a card per repository), a spec's page (its milestones as a pipeline, one lane per repository), Board (a
// kanban of specs or milestones), Notes graph (notes and links in a force layout) and Activity (the brain's commits). A
// rail picks the screen and filters by repository; the details panel opens over the screen with the selected item.
// The route is #/b/<brain>/<screen>[/<arg>]. App.load(id, D) draws a brain's data (toData's shape); loading the same
// brain again, as a live reload does, keeps the screen, selection and filters.
const App = (function () {
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const STATUS = {
    attention: { label: 'Needs you', v: '--s-attention' }, blocked: { label: 'Blocked', v: '--s-blocked' }, active: { label: 'In progress', v: '--s-active' },
    landing: { label: 'Ready to land', v: '--s-landing' }, frontier: { label: 'Frontier', v: '--s-frontier' }, waiting: { label: 'Waiting', v: '--s-waiting' },
    ready: { label: 'Ready to build', v: '--s-ready' }, draft: { label: 'Needs tickets', v: '--s-draft' }, done: { label: 'Done', v: '--s-done' },
    landed: { label: 'Landed', v: '--s-landed' }, abandoned: { label: 'Abandoned', v: '--s-abandoned' },
  };
  const ORDER = ['attention', 'blocked', 'active', 'landing', 'frontier', 'waiting', 'ready', 'draft', 'done', 'landed', 'abandoned'];
  const TICKET = { todo: { label: 'To do', v: '--s-todo' }, doing: { label: 'Doing', v: '--s-active' }, blocked: { label: 'Blocked', v: '--s-blocked' }, done: { label: 'Done', v: '--s-done' } };
  // the step of /build a started milestone stands at (toData's stage: build while its tickets run, else its Phase)
  const STAGE_ICON = { build: '🔨', review: '🔍', decide: '⚖️', ask: '✋', fix: '🔧', check: '🧪', waits: '⏳', failed: '❌', squash: '📦' };
  const ACTION = { recorded: '--s-done', updated: '--s-ready', superseded: '--s-active', deleted: '--s-blocked', moved: '--s-waiting' };
  const color = (k) => `var(${(STATUS[k] || TICKET[k] || STATUS.draft).v})`;
  // a repository's colour comes from the theme, by its place on the brain's list (a slug off the list, by its hash)
  const repoColor = (slug) => { const i = (S.D?.repos || []).findIndex((r) => r.slug === slug); if (i >= 0) return Theme.color(i); let h = 0; for (const ch of slug) h = (h * 31 + ch.charCodeAt(0)) % 97; return Theme.color(h); };

  // ---------- shared UI pieces, so every screen speaks one visual language ----------
  const ui = {
    esc, color,
    pill: (k, text) => `<span class="chip" style="background:color-mix(in srgb, ${color(k)} 16%, transparent);color:color-mix(in srgb, ${color(k)} 80%, white)"><span class="h-1.5 w-1.5 rounded-full" style="background:${color(k)}"></span>${esc(text ?? (STATUS[k] || TICKET[k] || STATUS.draft).label)}</span>`,
    // a ticket square: todo is a dim tile, doing pulses
    cell: (t, big) => `<span class="cell ${big ? 'cell-lg' : ''} ${t.status === 'doing' ? 'pulse' : ''}" title="${esc(t.id + ' · ' + t.title + ' · ' + t.status)}" style="background:${color(t.status)}"></span>`,
    kpi: (label, value, sub, k) => `<div class="panel px-4 py-3"><div class="eyebrow flex items-center gap-2">${k ? `<span class="h-1.5 w-1.5 rounded-full" style="background:${color(k)};box-shadow:0 0 6px ${color(k)}"></span>` : ''}${esc(label)}</div><div class="mt-1.5 flex items-baseline gap-2"><span class="num text-[28px] leading-tight" ${k ? `style="color:color-mix(in srgb, ${color(k)} 70%, white)"` : ''}>${value}</span><span class="muted text-[12px]">${sub || ''}</span></div></div>`,
    panelHead: (title, sub, right) => `<div class="flex items-center gap-2 px-4 pt-3.5"><div class="ph text-[14.5px]">${esc(title)}</div>${sub ? `<div class="muted text-[12px]">${sub}</div>` : ''}<div class="ml-auto">${right || ''}</div></div>`,
    // a thin stacked bar of ticket statuses
    bar: (tickets, h = 4) => { const n = tickets.length || 1, c = (s) => tickets.filter((t) => t.status === s).length; return `<div class="flex w-full overflow-hidden" style="height:${h}px;background:var(--s-todo)">${['done', 'doing', 'blocked'].map((s) => `<span style="width:${(c(s) / n) * 100}%;background:${color(s)}"></span>`).join('')}</div>`; },
    // the scope toggle, for a page header; the shell's click handler reads data-scope
    scopeSeg: () => `<div class="seg text-[12px]" title="To-do: specs with work left · In flight: every spec not landed or abandoned · Recent: specs changed in the last 7 days · All">${[['todo', 'To-do'], ['flight', 'In flight'], ['recent', 'Recent'], ['all', 'All']].map(([k, l]) => `<button data-scope="${k}" class="${S.scope === k ? 'on' : ''}">${l}</button>`).join('')}</div>`,
    repoDot: (slug) => `<span class="inline-block h-2 w-2 shrink-0 rounded-full" style="background:${repoColor(slug)}"></span>`,
    // the command that moves a spec on, to paste into Claude Code: tickets for a spec without them, else its next /build
    nextCmd: (sp) => (sp.landed || sp.abandoned || sp.status === 'waiting' ? null
      : !sp.milestones.length ? { cmd: `/write-tickets ${sp.num}`, label: 'Ticket it' }
      : { cmd: `/build ${sp.num}`, label: sp.status === 'landing' ? 'Land it' : sp.status === 'attention' || sp.status === 'blocked' ? 'Unblock it' : 'Build its next frontier' }),
    copyBtn: (cmd, label) => `<button class="btn text-[12px]" data-copy="${esc(cmd)}" title="Copy, then paste it into Claude Code">${label ? `<span class="muted">${esc(label)}</span>` : ''}<span class="mono">${esc(cmd)}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="faint"><path d="M8 8h12v12H8zM4 16V4h12"/></svg></button>`,
  };

  const screens = {};
  const NAV = [['overview', 'Overview', 'M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 13h7v8H3z'], ['board', 'Board', 'M4 4h5v16H4zM10 4h5v10h-5zM16 4h4v13h-4z'], ['notes', 'Notes graph', 'M4 4h4v4H4zM16 5h4v4h-4zM10 16h4v4h-4zM8 6h8M6 8l5 8M18 9l-5 7'], ['activity', 'Activity', 'M3 12h4l3-8 4 16 3-8h4']];
  // scope: 'todo' hides what is landed, abandoned or only waiting to land; 'flight' every spec not landed or abandoned;
  // 'recent' every spec whose files changed in the last 7 days
  const S = { D: null, brain: null, io: null, sel: null, repo: null, q: '', scope: 'flight', showDraft: false };
  const $ = (id) => document.getElementById(id);
  const route = () => {
    const parts = location.hash.replace(/^#\/b\/[^/]+\/?/, '').split('/').filter(Boolean);
    const screen = screens[parts[0]] ? parts[0] : 'overview';
    return { screen, arg: screen === parts[0] && parts.length > 1 ? decodeURIComponent(parts.slice(1).join('/')) : null };
  };
  const go = (path) => { location.hash = `#/b/${S.brain}/${path}`; };
  const RECENT_MS = 7 * 864e5;
  const inScope = (s) => S.scope === 'all' || (S.scope === 'recent' ? s.touched >= Date.now() - RECENT_MS : S.scope === 'flight' ? !s.landed && !s.abandoned : !s.landed && !s.abandoned && s.status !== 'landing');
  const matches = (s) => (!S.repo || s.repos.includes(S.repo) || s.milestones.some((m) => m.track === S.repo)) && (!S.q || (s.num + ' ' + s.title).toLowerCase().includes(S.q));
  const toast = (t) => { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), 4000); };

  function ctx() {
    const D = S.D, r = route();
    return {
      D, ui, STATUS, ORDER, TICKET, STAGE_ICON, route: r, sel: S.sel, repo: S.repo, q: S.q, scope: S.scope,
      specs: D.specs.filter((s) => inScope(s) && matches(s)), inScope, repoColor,
      select: (kind, id) => { S.sel = kind ? { kind, id } : null; renderInspector(); window.dispatchEvent(new Event('app-select')); },
      go, specOf: (id) => D.specs.find((s) => s.id === id),
    };
  }

  function renderNav() {
    const D = S.D, r = route();
    const repos = D.repos.map((x) => x.slug).map((slug) => [slug, D.specs.filter((s) => inScope(s) && (s.repos.includes(slug) || s.milestones.some((m) => m.track === slug))).length]);
    const needs = D.specs.filter((s) => inScope(s) && (s.status === 'attention' || s.status === 'blocked')).length;
    $('nav').innerHTML = `
      <div class="eyebrow px-2 pb-2">Workspace</div>
      ${NAV.filter(([k]) => screens[k]).map(([k, label, d]) => `<div class="navitem ${r.screen === k || (k === 'overview' && r.screen === 'specs') ? 'on' : ''}" data-go="${k}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="${d}"/></svg>${label}${k === 'overview' && needs ? `<span class="ml-auto grid h-5 min-w-5 place-items-center px-1.5 text-[10px] font-semibold" style="background:color-mix(in srgb, var(--s-attention) 16%, transparent);color:color-mix(in srgb, var(--s-attention) 70%, white)">${needs}</span>` : ''}</div>`).join('')}
      <div class="eyebrow mt-5 flex items-center px-2 pb-2">Repositories <span class="ml-auto normal-case tracking-normal">${D.repos.length}</span></div>
      ${repos.map(([slug, n]) => `<div class="navitem ${S.repo === slug ? 'on' : ''}" data-repo="${esc(slug)}" style="padding:5px 10px">${ui.repoDot(slug)}<span class="truncate">${esc(slug)}</span><span class="faint ml-auto text-[11px]">${n || ''}</span></div>`).join('')}`;
  }

  function renderTop() {
    const r = route(), name = r.screen === 'specs' ? 'Overview' : (NAV.find(([k]) => k === r.screen) || [, r.screen])[1];
    const spec = r.screen === 'specs' && r.arg && S.D.specs.find((s) => s.id === r.arg);
    $('crumb').innerHTML = `<span class="muted">${esc(S.D.name)}</span><span class="faint">/</span><span class="${spec ? 'muted cursor-pointer hover:text-white' : 'font-medium'}" ${spec ? 'data-go="overview"' : ''}>${esc(name)}</span>${spec ? `<span class="faint">/</span><span class="mono faint">${spec.num}</span><span class="truncate font-medium">${esc(spec.title)}</span>` : ''}${S.repo ? `<span class="chip ml-2" style="background:var(--panel-2)">${ui.repoDot(S.repo)}${esc(S.repo)}<button data-repo="${esc(S.repo)}" title="Clear the repository filter" class="faint hover:text-white">✕</button></span>` : ''}`;
  }

  // ============================================================ the details panel
  // A properties table above the document, then what it links to: a spec's milestones, a milestone's tickets and
  // neighbours, a note's links, backlinks and history. Every row selects what it names.
  const notesById = () => new Map(S.D.notes.map((n) => [n.id, n]));
  const day = (iso) => new Date(iso).toLocaleDateString('en', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  const sec = (title, inner, n) => `<section class="border-t px-5 py-3.5 hairline"><div class="eyebrow mb-2">${title}${n != null ? ` <span class="faint">${n}</span>` : ''}</div>${inner}</section>`;
  const none = (t = 'None.') => `<div class="faint py-1 text-[12.5px]">${t}</div>`;
  const prop = (k, v) => `<div class="muted py-1.5">${k}</div><div class="min-w-0 py-1.5">${v}</div>`;
  const tag = (t) => `<span class="chip" style="background:var(--panel-2)">${t}</span>`;
  const repoTag = (r) => tag(ui.repoDot(r) + esc(r));
  const row = (sel, left, label, right = '') => `<div class="row" data-sel="${esc(sel)}">${left}<span class="min-w-0 flex-1 truncate">${esc(label)}</span>${right}</div>`;
  const noteRow = (id, nb) => { const n = nb.get(id); return row(`note|${id}`, n ? `<span class="inline-block h-2 w-2 shrink-0" style="background:${n.repos[0] ? repoColor(n.repos[0]) : 'var(--muted)'}"></span>` : '<span class="inline-block h-2 w-2 shrink-0 border border-dashed" style="border-color:var(--muted)"></span>', id, n ? (n.draft || n.pending ? tag('draft') : `<span class="faint text-[11px]">${esc(n.type)}</span>`) : '<span class="faint text-[11px]">not written</span>'); };
  const wiki = (t, nb) => t.replace(/\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g, (_, n) => `<span class="wiki${nb.has(n.trim()) ? '' : ' ghost'}" data-sel="note|${esc(n.trim())}">${esc(n.trim())}</span>`);
  const md = (t, nb) => `<div class="prose-brain">${marked.parse(wiki((t || '').replace(/^---[\s\S]*?---\s*/, '').replace(/^\s*# .*\n+/, ''), nb))}</div>`;
  const msOf = (sp, id) => sp.milestones.find((m) => m.id === id);
  const msRow = (sp, m) => row(`milestone|${sp.id}|${m.id}`, ui.repoDot(m.track) + `<span class="mono faint text-[11px]">${esc(m.id)}</span>`, m.title, ui.pill(m.status, m.phaseLabel || undefined));
  const tkRow = (sp, t) => row(`ticket|${sp.id}|${t.id}`, ui.cell(t) + `<span class="mono faint text-[11px]">${t.num}</span>`, t.title, ui.pill(t.status));
  const specRow = (sp) => row(`spec|${sp.id}`, `<span class="mono faint text-[11px]">${sp.num}</span>`, sp.title, ui.pill(sp.status));
  const head = (kicker, title, sub) => `<div class="px-5 pb-1 pt-4">${kicker}<div class="mt-1 text-[18px] leading-snug">${esc(title)}</div>${sub ? `<p class="muted mt-2 text-[12.5px] leading-relaxed">${esc(sub)}</p>` : ''}</div>`;
  const props = (inner) => `<div class="grid grid-cols-[110px_minmax(0,1fr)] items-center px-5 pb-3 pt-2 text-[12.5px]">${inner}</div>`;

  // ============================================================ actions
  // The page writes only what the plugin's files already define: an escalated finding's Answer line (build's step 7),
  // a draft note in .local/drafts/ and a spec's Abandoned line (under its Key line, by
  // write-spec's IN-FLIGHT.md). Each write re-reads the file from disk first, so it keeps what a running build wrote
  // since the page last read it. Everything else is a command to copy into Claude Code.
  const FINDING_LINE = /^\s*(?:[-*]\s+|#{1,4}\s+)?(?:\*\*)?(?:ST|SP|CN)\d+\b/;
  // a review's findings, each running from its ID (ST1, SP2, CN3) to the next, the same split as toData's awaitingOf
  const findings = (md) => (md || '').split(/^(?=\s*(?:[-*]\s+|#{1,4}\s+)?(?:\*\*)?(?:ST|SP|CN)\d+\b)/m).slice(1)
    .filter((f) => /(?:ST|SP|CN)\d+/.test(f)).map((f) => ({ id: /(?:ST|SP|CN)\d+/.exec(f)[0], text: f.trim(), open: /\bescalate\b/i.test(f) && !/\*\*Answer:\*\*/.test(f) }));
  // writes `**Answer:** <line>` at the end of finding `id`: indented under a bullet, else as its own paragraph
  function withAnswer(md, id, line) {
    const lines = md.split('\n'), start = lines.findIndex((l) => new RegExp(`^\\s*(?:[-*]\\s+|#{1,4}\\s+)?(?:\\*\\*)?${id}\\b`).test(l));
    if (start < 0) throw new Error(`${id} is no longer in review.md`);
    let end = start + 1;
    while (end < lines.length && !FINDING_LINE.test(lines[end]) && !/^#{1,4}\s/.test(lines[end])) end++;
    while (end > start + 1 && !lines[end - 1].trim()) end--;
    lines.splice(end, 0, ...(/^\s*[-*]\s/.test(lines[start]) ? [`  **Answer:** ${line}`] : ['', `**Answer:** ${line}`]));
    return lines.join('\n');
  }
  const withAbandoned = (md, why) => {
    const line = `**Abandoned:** ${why}`, key = /^\*\*Key:\*\*.*$/m.exec(md);
    if (key) return md.slice(0, key.index + key[0].length) + '\n\n' + line + md.slice(key.index + key[0].length);
    const h = /^# .*$/m.exec(md); return h ? md.slice(0, h.index + h[0].length) + '\n\n' + line + md.slice(h.index + h[0].length) : line + '\n\n' + md;
  };
  // A draft names the note's home as its target, by layout.mjs's noteHome rule: its repository's notes for a repos line of
  // one slug, else the shared notes.
  const draftNote = ({ name, type, layer, description, repos, body }) =>
    `---\nname: ${name}\ndescription: ${description}\ntype: ${type}\nlayer: ${layer}\nrepos: [${repos.join(', ')}]\ntarget: ${repos.length === 1 ? BrainSource.LAYOUT.repoNotes(repos[0]) : BrainSource.LAYOUT.sharedNotes}/${name}.md\naction: record\n---\n\n${body.trim()}\n`;
  async function save(path, change, done) {
    try { await S.io.edit(path, change); toast(done); } catch (e) { toast('Not saved: ' + (e.message || e)); }
  }
  const field = (cls, inner) => `<label class="block"><span class="eyebrow mb-1 block">${cls}</span>${inner}</label>`;
  const INPUT = 'w-full border px-2 py-1.5 text-[12.5px] outline-none hairline focus:border-white/40';
  const inputStyle = 'style="background:var(--panel)"';

  // a milestone's escalated findings with no answer yet, as a form: fix as proposed, fix another way, or skip, and why
  function answerForm(sp, m) {
    const open = findings(m.review).filter((f) => f.open);
    if (!open.length) return m.phase === 'ask' ? sec('Waiting on you', `<p class="muted mb-2 text-[12.5px]">Every escalation has its answer. The next build picks them up.</p>${ui.copyBtn(`/build ${sp.num}`, 'Resume')}`) : '';
    return sec('Waiting on you', `<p class="muted mb-3 text-[12.5px]">${open.length} escalated finding${open.length === 1 ? '' : 's'} need your answer before ${m.phase === 'ask' ? 'this track builds on' : 'the arbiter decides them'}.</p>
      ${open.map((f) => `<div data-finding="${esc(f.id)}" class="panel-2 mb-2 p-3">
        <div class="prose-brain text-[12.5px]">${marked.parse(f.text)}</div>
        <div class="mt-2 flex flex-wrap gap-3 text-[12px]">${[['proposed', 'Fix as proposed'], ['other', 'Fix another way'], ['skip', 'Skip it']].map(([v, l], i) => `<label class="flex cursor-pointer items-center gap-1.5"><input type="radio" name="ans-${esc(m.id + f.id)}" value="${v}" ${i ? '' : 'checked'}>${l}</label>`).join('')}</div>
        <input data-how placeholder="How to fix it instead (for Fix another way)" class="${INPUT} mt-2" ${inputStyle}>
        <input data-why placeholder="Why (required)" class="${INPUT} mt-2" ${inputStyle}></div>`).join('')}
      <div class="mt-3 flex items-center gap-2"><button class="btn btn-accent text-[12px]" data-answer-save="${esc(sp.id + '|' + m.id)}">Save the answers</button><span class="faint text-[11.5px]">writes them into review.md</span></div>`, open.length);
  }
  function abandonForm(sp) {
    if (sp.landed || sp.abandoned) return '';
    return `<details class="px-5 pb-3"><summary class="faint cursor-pointer text-[12px] hover:text-white">Abandon this spec…</summary>
      <div class="mt-2 space-y-2"><p class="muted text-[12px]">It stops counting as in flight, and /build refuses it. Say why: the line keeps the reason.</p>
      <input data-abandon-why placeholder="The reason it will never be built" class="${INPUT}" ${inputStyle}>
      <button class="btn text-[12px]" style="border-color:color-mix(in srgb, var(--s-blocked) 50%, transparent);color:color-mix(in srgb, var(--s-attention) 70%, white)" data-abandon-save="${esc(sp.id)}">Abandon ${esc(sp.num)}</button></div></details>`;
  }
  function draftForm(id) {
    const repos = S.D.repos.map((r) => r.slug), opt = (v, l = v) => `<option value="${esc(v)}">${esc(l)}</option>`, sel = (attr, opts) => `<select ${attr} class="${INPUT}" ${inputStyle}>${opts}</select>`;
    const backRepo = S.D.notes.find((x) => x.links.includes(id))?.repos[0];
    return sec('Draft it here', `<div class="space-y-2.5" data-draft="${esc(id)}">
      <div class="grid grid-cols-2 gap-2">${field('Type', sel('data-type', ['concept', 'decision', 'how-to', 'contract'].map((t) => opt(t)).join('')))}${field('Layer', sel('data-layer', opt('application') + opt('business')))}</div>
      ${field('Repos', `<input data-repos value="${esc(backRepo || '')}" placeholder="${esc(repos.slice(0, 2).join(', ') || 'billing-api, web-app')}" class="${INPUT}" ${inputStyle}>`)}
      ${field('Description', `<input data-description placeholder="One line that stands alone" class="${INPUT}" ${inputStyle}>`)}
      ${field('Body', `<textarea data-body rows="6" placeholder="The fact first. A decision or how-to adds **Why:** and **How to apply:** lines." class="${INPUT}" ${inputStyle}></textarea>`)}
      <div class="flex flex-wrap items-center gap-2"><button class="btn btn-accent text-[12px]" data-draft-save="${esc(id)}">Save the draft</button><span class="faint text-[11.5px]">into ${BrainSource.LAYOUT.drafts}/ · /brain sync shares it</span></div>
      <div class="faint pt-1 text-[11.5px]">Or let Claude write it: ${ui.copyBtn(`/brain remember ${id}`)}</div></div>`);
  }
  // reads a form's values and writes the file; a missing value stops it with a toast
  async function act(t) {
    if (t.dataset.answerSave) {
      const [sid, mid] = t.dataset.answerSave.split('|'), sp = S.D.specs.find((x) => x.id === sid), m = sp && msOf(sp, mid);
      const answers = [];
      for (const box of document.querySelectorAll('#insp [data-finding]')) {
        const v = box.querySelector('input[type=radio]:checked').value, how = box.querySelector('[data-how]').value.trim(), why = box.querySelector('[data-why]').value.trim();
        if (!why) return toast(`${box.dataset.finding} needs a reason`);
        if (v === 'other' && !how) return toast(`${box.dataset.finding}: say how to fix it instead`);
        answers.push([box.dataset.finding, `${v === 'proposed' ? 'fix it as proposed' : v === 'skip' ? 'skip it' : 'fix it another way: ' + how} — ${why}`]);
      }
      return save(m.reviewPath, (md) => answers.reduce((acc, [id, line]) => withAnswer(acc, id, line), md), `Saved ${answers.length} answer${answers.length === 1 ? '' : 's'}: run /build ${sp.num} to go on`);
    }
    if (t.dataset.abandonSave) {
      const sp = S.D.specs.find((x) => x.id === t.dataset.abandonSave), why = document.querySelector('#insp [data-abandon-why]').value.trim();
      if (!why) return toast('Say why it will never be built');
      return save(sp.path, (md) => (/^\*\*Abandoned:\*\*/m.test(md) ? md : withAbandoned(md, why)), `Abandoned ${sp.num}`);
    }
    if (t.dataset.draftSave) {
      const f = document.querySelector('#insp [data-draft]'), v = (k) => f.querySelector(`[data-${k}]`).value.trim();
      const d = { name: t.dataset.draftSave, type: v('type'), layer: v('layer'), description: v('description'), body: v('body'), repos: v('repos').split(',').map((x) => x.trim()).filter(Boolean) };
      if (!d.description || !d.body) return toast('A draft needs its description and body');
      if (!d.repos.length) return toast('A draft names the repos it bears on');
      const unknown = d.repos.find((r) => !S.D.repos.some((x) => x.slug === r));
      if (unknown) return toast(`${unknown} is not a registered repository`);
      if (d.type === 'contract' && d.repos.length < 2) return toast('A contract names at least two repos: its producer and a consumer');
      return save(`${BrainSource.LAYOUT.drafts}/${d.name}.md`, (old) => { if (old != null) throw new Error('a draft of that name already exists'); return draftNote(d); }, `Drafted ${d.name}: /brain sync shares it`);
    }
  }

  function inspSpec(sp) {
    const D = S.D, tk = sp.milestones.flatMap((m) => m.tickets), done = tk.filter((t) => t.status === 'done').length;
    const after = D.specs.filter((x) => x.deps.includes(sp.id));
    return head(`<div class="eyebrow">Spec ${sp.num}${sp.key && sp.key !== 'None' ? ' · ' + esc(sp.key) : ''}</div>`, sp.title, sp.abandoned ? 'Abandoned: ' + sp.abandoned : sp.summary)
      + props(prop('Status', ui.pill(sp.status)) + prop('Repos', `<div class="flex flex-wrap gap-1">${sp.repos.map(repoTag).join('') || '<span class="faint">—</span>'}</div>`)
        + prop('Progress', tk.length ? `<div class="flex items-center gap-2"><div class="w-40">${ui.bar(tk, 6)}</div><span class="mono muted text-[11px]">${done}/${tk.length}</span></div>` : '<span class="faint">no tickets yet</span>')
        + (sp.landed ? prop('Landed', `<span class="mono">${esc(sp.landed)}</span>`) : '') + (sp.base ? prop('Base', `<span class="mono text-[11.5px]">${esc(sp.base)}</span>`) : ''))
      + `<div class="flex flex-wrap gap-2 px-5 pb-3"><button class="btn text-[12px]" data-go="specs/${esc(sp.id)}">Open its milestone pipeline →</button>${(() => { const n = ui.nextCmd(sp); return n ? ui.copyBtn(n.cmd, n.label) : ''; })()}</div>`
      + abandonForm(sp)
      + sec('Depends on', sp.deps.map((d) => { const o = D.specs.find((x) => x.id === d); return o ? row(`spec|${o.id}`, `<span class="mono faint text-[11px]">${o.num}</span>`, o.title, ui.pill(o.landed ? 'landed' : o.status) + (o.landed ? '' : ' ' + tag('not landed'))) : row('', '', d + ' (missing)'); }).join('') || none(), sp.deps.length)
      + sec('Needed by', after.map(specRow).join('') || none(), after.length)
      + sec('Milestones', sp.milestones.map((m) => msRow(sp, m) + (m.buildsAfter.length ? `<div class="faint pb-1 pl-7 text-[11px]">builds after ${m.buildsAfter.map(esc).join(', ')}</div>` : '')).join('') || none('No milestones yet.'), sp.milestones.length)
      + sec('Document', md(sp.body, notesById()));
  }
  function inspMilestone(sp, m) {
    const unblocks = sp.milestones.filter((x) => x.buildsAfter.includes(m.id) || x.landsAfter.includes(m.id));
    return head(`<div class="eyebrow cursor-pointer hover:text-white" data-sel="spec|${esc(sp.id)}">${sp.num} · ${esc(sp.title)} ›</div>`, m.title, m.delivers)
      + props(prop('Status', ui.pill(m.status, m.phaseLabel || undefined)) + prop('Repository', repoTag(m.track))
        + prop('Stage', m.stage ? `${STAGE_ICON[m.stage] || ''} ${esc(m.phaseLabel || m.stage)}` : '<span class="faint">—</span>')
        + prop('Tickets', `<div class="flex flex-wrap gap-1">${m.tickets.map((t) => ui.cell(t, true)).join('') || '<span class="faint">none yet</span>'}</div>`)
        + (m.squash ? prop('Squash', `<span class="mono">${esc(m.squash)}</span>`) : '') + (m.landed ? prop('Landed', `<span class="mono">${esc(m.landed)}</span>`) : ''))
      + answerForm(sp, m)
      + sec('Builds after', m.buildsAfter.map((id) => { const o = msOf(sp, id); return o ? msRow(sp, o) : row('', '', id); }).join('') || none('Nothing, it can start at once.'), m.buildsAfter.length)
      + (m.landsAfter.length ? sec('Lands after', m.landsAfter.map((id) => { const o = msOf(sp, id); return o ? msRow(sp, o) : row('', '', id); }).join(''), m.landsAfter.length) : '')
      + sec('Unblocks', unblocks.map((x) => msRow(sp, x)).join('') || none(), unblocks.length)
      + sec('Tickets', m.tickets.map((t) => tkRow(sp, t)).join('') || none('No tickets yet.'), m.tickets.length)
      + sec('Document', md(m.body, notesById()))
      + (m.review ? `<details class="border-t px-5 py-3.5 hairline" ${m.awaiting ? 'open' : ''}><summary class="eyebrow cursor-pointer">Review${m.awaiting ? ` · ${m.awaiting} awaiting you` : ''}</summary><div class="mt-2">${md(m.review, notesById())}</div></details>` : '');
  }
  function inspTicket(sp, m, t) {
    const blocks = m.tickets.filter((x) => x.deps.includes(t.id));
    return head(`<div class="eyebrow cursor-pointer hover:text-white" data-sel="milestone|${esc(sp.id + '|' + m.id)}">${sp.num} · ${esc(m.id)} · ${esc(m.title)} ›</div>`, t.title)
      + props(prop('Status', ui.pill(t.status)) + prop('Repository', repoTag(m.track)) + prop('Commit', t.commit ? `<span class="mono">${esc(t.commit)}</span>` : '<span class="faint">—</span>'))
      + sec('Depends on', t.deps.map((d) => { const o = m.tickets.find((x) => x.id === d); return o ? tkRow(sp, o) : row('', '', d); }).join('') || none(), t.deps.length)
      + sec('Blocks', blocks.map((x) => tkRow(sp, x)).join('') || none(), blocks.length)
      + sec('Document', md(t.body, notesById()));
  }
  function inspNote(id) {
    const D = S.D, nb = notesById(), n = nb.get(id), back = D.notes.filter((x) => x.links.includes(id)).map((x) => x.id);
    if (!n) return head('<div class="eyebrow">Not written yet</div>', id, 'Other notes link to this name, but no note exists for it.')
      + draftForm(id)
      + sec('Linked from', back.map((x) => noteRow(x, nb)).join('') || none(), back.length);
    const showD = n.pendingBody != null && S.showDraft;
    const hist = D.timeline.commits.flatMap((c) => c.changes.filter((ch) => ch.note === id).map((ch) => ({ c, ch }))).sort((a, b) => (a.c.date < b.c.date ? 1 : -1));
    const flags = [n.kind === 'explored' ? tag('explored') : '', n.shared ? tag('shared') : '', n.superseded ? tag('superseded') : '', n.draft ? tag('draft: ' + esc(n.draft)) : '', n.pending ? tag('pending ' + esc(n.pending)) : ''].join('');
    return head(`<div class="eyebrow">${n.kind === 'explored' ? 'Explored note' : 'Note'} · ${esc(n.type)}</div>`, n.id, showD && n.pendingDescription ? n.pendingDescription : n.description)
      + props(prop('Repos', `<div class="flex flex-wrap gap-1">${n.repos.map(repoTag).join('') || '<span class="faint">—</span>'}</div>`) + prop('Layer', esc(n.layer || '—')) + prop('Path', `<span class="mono faint text-[11px]">${esc(n.path)}</span>`) + (flags ? prop('Flags', `<div class="flex flex-wrap gap-1">${flags}</div>`) : ''))
      + (n.pendingBody != null ? `<div class="mx-5 mb-3 flex items-center gap-2 border px-3 py-2 text-[12px] hairline" style="background:var(--panel-2)"><span class="flex-1">A draft on this machine changes this note.</span><button data-draftbody class="btn py-0.5 text-[11.5px]">${showD ? 'Show committed' : 'Show draft'}</button></div>` : '')
      + (n.supersededBy ? `<div class="px-5 pb-2 text-[12px]">Superseded by <span class="wiki" data-sel="note|${esc(n.supersededBy)}">${esc(n.supersededBy)}</span></div>` : '')
      + (n.supersedes ? `<div class="px-5 pb-2 text-[12px]">This draft supersedes <span class="wiki" data-sel="note|${esc(n.supersedes)}">${esc(n.supersedes)}</span></div>` : '')
      + sec('Document', md(showD ? n.pendingBody : n.body, nb))
      + sec('Links to', n.links.map((x) => noteRow(x, nb)).join('') || none(), n.links.length)
      + sec('Linked from', back.map((x) => noteRow(x, nb)).join('') || none('Nothing links here.'), back.length)
      + sec('History', hist.map(({ c, ch }) => `<div class="row" data-go="activity"><span class="inline-block h-2 w-2 shrink-0" style="background:var(${ACTION[ch.action] || '--s-draft'})"></span><span class="faint w-16 shrink-0 text-[11px]">${esc(ch.action)}</span><span class="min-w-0 flex-1 truncate">${esc(c.title)}</span><span class="faint shrink-0 text-[11px]">${day(c.date)} · ${esc(c.author)}</span></div>`).join('') || none('Not committed yet.'), hist.length);
  }
  function inspRepo(slug) {
    const D = S.D, r = D.repos.find((x) => x.slug === slug), nb = notesById();
    const ns = D.notes.filter((n) => n.repos.includes(slug)), ss = D.specs.filter((sp) => sp.repos.includes(slug) || sp.milestones.some((m) => m.track === slug));
    return head('<div class="eyebrow">Repository</div>', slug, r ? r.remote : '')
      + props(prop('Linked', r ? (r.linked ? 'yes, on this machine' : 'no') : '—') + prop('Explored', r && r.explored ? `<span class="mono">${esc(r.explored)}</span>` : 'not yet'))
      + (r && r.summary ? sec('Card', md(r.summary, nb)) : '')
      + sec('Specs', ss.map(specRow).join('') || none(), ss.length)
      + sec('Notes', ns.map((n) => noteRow(n.id, nb)).join('') || none(), ns.length);
  }

  let lastSel = '', lastHtml = '';
  function renderInspector() {
    const el = $('insp'), s = S.sel, wrap = $('insp-wrap');
    if (!s) { wrap.classList.add('hidden'); lastSel = ''; return; }
    const D = S.D; let h = '';
    if (s.kind === 'spec') { const sp = D.specs.find((x) => x.id === s.id); if (sp) h = inspSpec(sp); }
    else if (s.kind === 'milestone' || s.kind === 'ticket') {
      const [sid, id] = s.id.split('|'), sp = D.specs.find((x) => x.id === sid);
      const m = sp && (s.kind === 'milestone' ? msOf(sp, id) : sp.milestones.find((x) => x.tickets.some((t) => t.id === id)));
      if (m) h = s.kind === 'milestone' ? inspMilestone(sp, m) : inspTicket(sp, m, m.tickets.find((t) => t.id === id));
    } else if (s.kind === 'note' || s.kind === 'ghost') h = inspNote(s.id);
    else if (s.kind === 'repo') h = inspRepo(s.id);
    // a selection this data no longer holds (after a live reload) closes the panel
    if (!h) { S.sel = null; wrap.classList.add('hidden'); return; }
    wrap.classList.remove('hidden');
    const html = `<div class="sticky top-0 z-10 flex items-center gap-2 border-b px-5 py-2.5 hairline" style="background:var(--rail)"><span class="eyebrow">Details</span><button data-expand title="${expanded ? 'Back to the side (E)' : 'Expand to read (E)'}" class="btn ml-auto px-2 py-0.5">${expanded ? '⤡' : '⤢'}</button><button data-close title="Close (Esc)" class="btn px-2 py-0.5">✕</button></div>${h}<div class="h-8"></div>`;
    if (html === lastHtml && el.innerHTML) return;
    lastHtml = html; el.innerHTML = html;
    const key = JSON.stringify(s); if (key !== lastSel) el.scrollTop = 0; lastSel = key;
    drawMermaid(el);
  }

  // Mermaid loads on the first diagram; drawn diagrams are cached by source, so a live reload never redraws one. A block
  // that fails to parse stays as code with the error under it, as write-spec's DIAGRAMS.md promises.
  let mermaidLib = null, mermaidSeq = 0; const mermaidDrawn = new Map();
  async function drawMermaid(root) {
    const codes = [...root.querySelectorAll('pre > code.language-mermaid')];
    if (!codes.length) return;
    mermaidLib ??= import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs').then((m) => m.default);
    const fail = (code, msg) => { const pre = code.parentElement; if (pre.isConnected && !pre.nextElementSibling?.dataset.diagramError) pre.insertAdjacentHTML('afterend', `<p data-diagram-error="1" class="-mt-1 mb-3 text-[11.5px]" style="color:var(--s-attention)">This diagram did not parse: ${esc(msg)}</p>`); };
    let mermaid;
    try { mermaid = await mermaidLib; } catch (e) { mermaidLib = null; codes.forEach((c) => fail(c, 'Mermaid could not load: ' + e.message)); return; }
    // Mermaid takes plain colours, so it reads the theme's own hex tokens; a drawing is kept per theme
    const tok = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
    mermaid.initialize({ startOnLoad: false, theme: 'base', securityLevel: 'strict', suppressErrorRendering: true, themeVariables: {
      darkMode: true, background: tok('--bg'), primaryColor: tok('--panel'), secondaryColor: tok('--panel'), tertiaryColor: tok('--bg'),
      primaryBorderColor: tok('--accent'), primaryTextColor: tok('--text'), secondaryTextColor: tok('--text'), tertiaryTextColor: tok('--text'),
      lineColor: tok('--muted'), textColor: tok('--text'), fontFamily: tok('--body') } });
    for (const code of codes) {
      const src = code.textContent, key = Theme.get() + '\n' + src;
      if (!mermaidDrawn.has(key)) {
        try { await mermaid.parse(src); mermaidDrawn.set(key, (await mermaid.render('bv-mmd' + ++mermaidSeq, src)).svg); }
        catch (e) { fail(code, String(e.message || e).split('\n')[0]); continue; }
      }
      const pre = code.parentElement; if (!pre.isConnected) continue;
      const box = document.createElement('div'); box.className = 'panel-2 my-3 overflow-x-auto p-3'; box.innerHTML = mermaidDrawn.get(key);
      pre.replaceWith(box);
    }
  }

  // ---------- details width: drag its left edge, or expand it to read (button, double-click on the edge, or E) ----------
  const WKEY = 'brain-page:inspector-width';
  let inspW = 420, expanded = false;
  try { const w = +localStorage.getItem(WKEY); if (w) inspW = w; } catch {}
  const clampW = (w) => Math.max(320, Math.min(Math.round(window.innerWidth * 0.7), w));
  const setW = (w, anim) => {
    const wrap = $('insp-wrap');
    wrap.style.transition = anim ? 'width .2s ease' : '';
    wrap.style.width = clampW(w) + 'px';
    const b = document.querySelector('[data-expand]'); if (b) { b.textContent = expanded ? '⤡' : '⤢'; b.title = expanded ? 'Back to the side (E)' : 'Expand to read (E)'; }
  };
  const toggleExpand = () => { expanded = !expanded; setW(expanded ? Math.max(inspW, window.innerWidth * 0.55) : inspW, true); };
  setW(inspW);
  $('insp-handle').ondblclick = toggleExpand;
  $('insp-handle').onpointerdown = (e) => {
    e.preventDefault(); e.target.setPointerCapture(e.pointerId);
    const right = $('insp-wrap').getBoundingClientRect().right;
    document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
    const move = (ev) => { expanded = false; inspW = clampW(right - ev.clientX); setW(inspW); };
    const up = () => {
      e.target.removeEventListener('pointermove', move); e.target.removeEventListener('pointerup', up);
      document.body.style.cursor = ''; document.body.style.userSelect = '';
      try { localStorage.setItem(WKEY, String(inspW)); } catch {}
    };
    e.target.addEventListener('pointermove', move); e.target.addEventListener('pointerup', up);
  };

  // the route last drawn: arriving on a spec's page opens it with the details closed, until something is clicked
  let drawn = null;
  function render() {
    if (!S.D) return;
    const at = location.hash;
    if (at !== drawn) { if (route().screen === 'specs' && route().arg) S.sel = null; drawn = at; }
    $('brain-name').textContent = S.D.name;
    if ($('q').value.trim().toLowerCase() !== S.q) $('q').value = S.q;
    renderNav(); renderTop(); renderInspector();
    const r = route(), el = $('screen');
    // a screen may restyle the scroller (the graph fills it); each render starts from the default
    el.removeAttribute('style');
    if (screens[r.screen]) screens[r.screen].render(el, ctx());
  }

  function copy(cmd) {
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = cmd; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); };
    if (navigator.clipboard) navigator.clipboard.writeText(cmd).catch(fallback); else fallback();
    toast(`Copied ${cmd}: paste it into Claude Code`);
  }

  // one click handler for the data attributes every screen uses
  document.addEventListener('click', (e) => {
    if (!S.D || $('view').classList.contains('hidden')) return;
    if (e.target.closest('[data-expand]')) return toggleExpand();
    const c = e.target.closest('[data-copy]');
    if (c) return copy(c.dataset.copy);
    const w = e.target.closest('[data-answer-save],[data-abandon-save],[data-draft-save]');
    if (w) return act(w);
    const t = e.target.closest('[data-go],[data-repo],[data-scope],[data-sel],[data-close],[data-draftbody],[data-toast],[data-home]'); if (!t) return;
    if (t.dataset.go) go(t.dataset.go);
    else if (t.dataset.repo != null) { S.repo = S.repo === t.dataset.repo ? null : t.dataset.repo; render(); }
    else if (t.dataset.scope) { S.scope = t.dataset.scope; render(); }
    else if (t.dataset.sel) { const [k, ...rest] = t.dataset.sel.split('|'); if (!k) return; S.sel = { kind: k, id: rest.join('|') }; S.showDraft = false; render(); }
    else if (t.hasAttribute('data-close')) { S.sel = null; render(); }
    else if (t.hasAttribute('data-draftbody')) { S.showDraft = !S.showDraft; renderInspector(); }
    else if (t.dataset.toast) toast(t.dataset.toast);
    else if (t.hasAttribute('data-home')) location.hash = '#/';
  });
  document.addEventListener('keydown', (e) => {
    if (!S.D || $('view').classList.contains('hidden')) return;
    const a = document.activeElement, typing = a && (a.matches('input, textarea, select') || a.isContentEditable);
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('q').focus(); return; }
    if (typing) return;
    if (e.key === 'Escape' && S.sel) { S.sel = null; render(); }
    if ((e.key === 'e' || e.key === 'E') && !e.ctrlKey && !e.metaKey && !e.altKey && S.sel) toggleExpand();
  });
  $('q').addEventListener('input', (e) => { S.q = e.target.value.trim().toLowerCase(); render(); });
  window.addEventListener('app-select', () => render());

  return {
    register: (k, v) => { screens[k] = v; },
    // a new brain starts clean; the same brain again (a live reload) keeps the screen, selection and filters
    // io: { edit(path, change) } for the open brain, by the page; change gets the file's text (undefined when absent)
    load: (brain, D, io) => { if (S.brain !== brain) Object.assign(S, { brain, sel: null, repo: null, q: '', showDraft: false }); S.D = D; S.io = io; render(); },
    render, state: S,
  };
})();
</script>

<script>
// ============================================================ THE SCREENS
// Each registers on App with a render(el, ctx) that redraws the main area from ctx (see App's ctx()).
// Overview, the landing dashboard after Altimeter's infra overview: KPI tiles, a "Delivery health" ticket heatmap grouped by
// spec with a counts block, a "Needs you" insights panel and a recent-activity feed on the right, and one pool card per repository below.
App.register('overview', {
  render(el, ctx) {
    const { D, ui, STAGE_ICON } = ctx, { esc, color } = ui;
    const specs = ctx.specs;
    const ms = specs.flatMap((s) => s.milestones.map((m) => ({ s, m })));
    const tks = (s) => s.milestones.flatMap((m) => m.tickets);
    const allT = specs.flatMap(tks);
    const cnt = (ts) => { const c = { todo: 0, doing: 0, blocked: 0, done: 0 }; ts.forEach((t) => { c[t.status] = (c[t.status] || 0) + 1; }); return c; };
    const c = cnt(allT);
    const nMs = (st) => ms.filter((x) => x.m.status === st).length;
    const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
    const ago = (iso) => { const m = Math.max(0, (Date.now() - new Date(iso)) / 6e4); return m < 60 ? Math.round(m) + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : m < 43200 ? Math.round(m / 1440) + 'd' : new Date(iso).toLocaleDateString('en', { month: 'short', day: 'numeric' }); };
    const tile = (st, size, t, attrs = '') => `<span ${attrs} class="${t === 'doing' ? 'pulse' : ''}" title="${esc(st)}" style="display:inline-block;flex:none;width:${size}px;height:${size}px;border-radius:${size > 10 ? 3 : 2}px;background:${color(t)}"></span>`;
    const hollow = (k, size) => `<span style="display:inline-block;flex:none;width:${size}px;height:${size}px;border-radius:3px;border:1.5px dashed ${color(k)}"></span>`;
    const chev = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="faint shrink-0"><path d="m9 6 6 6-6 6"/></svg>';
    const iconBox = (k, inner) => `<span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg text-[14px]" style="background:color-mix(in srgb, ${color(k)} 14%, transparent);border:1px solid color-mix(in srgb, ${color(k)} 30%, transparent)">${inner}</span>`;

    // ---------- header ----------
    const head = `<div class="flex flex-wrap items-end gap-3">
      <div><h1 class="text-[22px] font-semibold tracking-tight">Delivery overview</h1>
      <div class="muted mt-0.5 text-[12.5px]">${plural(specs.length, 'spec')} across ${plural(D.repos.length, 'repository').replace('repositorys', 'repositories')} · updated now</div></div>
      <div class="ml-auto flex items-center gap-2">${ui.scopeSeg()}</div>
    </div>`;

    // ---------- KPIs ----------
    const inFlight = specs.filter((s) => ['active', 'attention', 'blocked', 'landing', 'frontier'].includes(s.status)).length;
    const needsN = nMs('attention') + nMs('blocked');
    const kpis = `<div class="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-6">
      ${ui.kpi('In flight', inFlight, `of ${specs.length} specs`, 'active')}
      ${ui.kpi('Frontier', nMs('frontier'), 'startable now', 'frontier')}
      ${ui.kpi('In progress', nMs('active'), 'milestones building', 'active')}
      ${ui.kpi('Needs you', needsN, 'attention + blocked', 'attention')}
      ${ui.kpi('Ready to land', nMs('landing'), 'squashed', 'landing')}
      ${ui.kpi('Landed', nMs('landed'), `of ${ms.length} milestones`, 'landed')}
    </div>`;

    // ---------- Delivery health ----------
    const group = (s) => {
      const ts = tks(s), n = ts.length;
      return `<div class="clickable rounded-lg border p-1.5 hairline" data-go="specs/${esc(s.id)}" title="${esc(s.num + ' · ' + s.title + ' · ' + s.status)}" style="max-width:${Math.max(48, Math.min(n || 1, 10) * 15 + 12)}px">
        <div class="mono mb-1 flex items-center gap-1 text-[9.5px] leading-none faint"><span class="h-[5px] w-[5px] rounded-full" style="background:${color(s.status)}"></span>${esc(s.num)}</div>
        <div class="flex flex-wrap gap-[3px]">${n ? ts.map((t) => tile(t.id + ' · ' + t.title + ' · ' + t.status, 12, t.status)).join('') : hollow(s.status, 12)}</div></div>`;
    };
    const legend = ['done', 'doing', 'blocked', 'todo'].map((k) => `<span class="inline-flex items-center gap-1.5 text-[11.5px] muted">${tile('', 9, k)}${ctx.TICKET[k].label} <b class="mono font-medium" style="color:var(--text)">${c[k] || 0}</b></span>`).join('');
    const counts = [['Specs', specs.length], ['Milestones', ms.length], ['Tickets', allT.length], ['Repositories', D.repos.length], ['Notes', D.notes.length]];
    // Agent Watcher's gauge: a ticked 270° ring filled to the share of tickets done, the figure in its middle
    const ring = (frac, of) => {
      const W = 170, cx = 85, cy = 78, R = 56, A0 = 135, SW = 270, f = (n) => Math.round(n * 10) / 10;
      const pt = (r, deg) => [cx + r * Math.cos((deg * Math.PI) / 180), cy + r * Math.sin((deg * Math.PI) / 180)];
      const arc = (a, b) => { const [x1, y1] = pt(R, a), [x2, y2] = pt(R, b); return `M${f(x1)},${f(y1)} A${R},${R} 0 ${b - a > 180 ? 1 : 0} 1 ${f(x2)},${f(y2)}`; };
      const ticks = Array.from({ length: 37 }, (_, i) => { const d = A0 + (SW * i) / 36, long = i % 6 === 0, [x1, y1] = pt(R + 8, d), [x2, y2] = pt(R + (long ? 14 : 11), d);
        return `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" style="stroke:var(${long ? '--muted' : '--faint'})" stroke-width="${long ? 1.2 : 0.8}"/>`; }).join('');
      const end = A0 + Math.min(1, frac) * SW, [ex, ey] = pt(R, end);
      return `<svg viewBox="0 0 ${W} 150" width="100%" style="max-width:${W}px;display:block;margin:0 auto">
        <defs><linearGradient id="ov-ring" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent-2)"/></linearGradient>
        <radialGradient id="ov-orb" cx="50%" cy="45%" r="60%"><stop offset="0" style="stop-color:var(--accent-2);stop-opacity:.22"/><stop offset=".7" style="stop-color:var(--accent);stop-opacity:.06"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></radialGradient>
        <filter id="ov-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        ${ticks}<circle cx="${cx}" cy="${cy}" r="${R - 12}" fill="url(#ov-orb)"/><circle cx="${cx}" cy="${cy}" r="${R - 12}" fill="none" style="stroke:var(--accent)" stroke-opacity=".18"/>
        <path d="${arc(A0, A0 + SW)}" fill="none" style="stroke:var(--line)" stroke-width="7" stroke-linecap="round"/>
        ${frac > 0.002 ? `<path d="${arc(A0, end)}" fill="none" stroke="url(#ov-ring)" stroke-width="7" stroke-linecap="round" filter="url(#ov-glow)"/><circle cx="${f(ex)}" cy="${f(ey)}" r="5" style="fill:var(--panel);stroke:var(--accent-2)" stroke-width="2" filter="url(#ov-glow)"/>` : ''}
        <text x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="28" style="fill:var(--text);font-family:var(--num);font-weight:var(--num-w)">${Math.round(frac * 100)}%</text>
        <text x="${cx}" y="${cy + 22}" text-anchor="middle" font-size="9.5" font-weight="600" style="fill:var(--muted);font-family:var(--body);letter-spacing:var(--track)">DONE</text>
        <text x="${cx}" y="${cy + R * 0.95 + 4}" text-anchor="middle" font-size="12" style="fill:var(--accent-2);font-family:var(--num)">${of}</text></svg>`;
    };
    const health = `<section class="panel">
      ${ui.panelHead('Delivery health', `<span class="faint">${allT.length} tickets monitored</span>`, '<span class="live sm"><span class="glow-dot" style="width:6px;height:6px"></span>LIVE</span>')}
      <div class="grid gap-0 p-4 pt-3 md:grid-cols-[minmax(0,1fr)_190px]">
        <div class="md:pr-5">
          <div class="flex max-h-[300px] flex-wrap gap-1.5 overflow-y-auto pr-1">${specs.map(group).join('') || '<span class="faint">No specs match</span>'}</div>
          <div class="mt-3 flex flex-wrap gap-x-4 gap-y-1">${legend}</div>
        </div>
        <div class="mt-4 border-t pt-3 hairline md:mt-0 md:border-l md:border-t-0 md:pl-5 md:pt-0">
          ${ring(allT.length ? c.done / allT.length : 0, `${c.done} / ${allT.length}`)}
          <div class="eyebrow mb-2 mt-2">Resources</div>
          <div class="space-y-1.5">${counts.map(([l, v]) => `<div class="flex items-baseline justify-between text-[12.5px]"><span class="muted">${l}</span><span class="num text-[14px]">${v}</span></div>`).join('')}</div>
        </div>
      </div></section>`;

    // ---------- Needs you ----------
    const needs = [];
    ms.filter((x) => x.m.status === 'attention' || x.m.status === 'blocked').forEach(({ s, m }) => {
      const bt = m.tickets.filter((t) => t.status === 'blocked').length;
      const reason = m.phase === 'failed' ? 'Check failed, needs a fix decision' : m.phase === 'ask' ? `${plural(m.awaiting, 'escalation')} waiting for your answer` : bt ? `${plural(bt, 'ticket')} blocked` : m.phaseLabel || 'Needs a decision';
      needs.push({ k: m.status, icon: m.phase === 'failed' ? STAGE_ICON.failed : m.phase === 'ask' ? STAGE_ICON.ask : '⚠️', title: `${s.num} · ${m.title}`, reason, track: m.track, go: `specs/${s.id}` });
    });
    specs.filter((s) => s.waiting.length && s.status === 'waiting').forEach((s) => needs.push({ k: 'waiting', icon: STAGE_ICON.waits, title: `${s.num} · ${s.title}`, reason: `Waits on ${s.waiting.map((w) => (ctx.specOf(w) || { num: w }).num).join(', ')} to land`, go: `specs/${s.id}` }));
    const row = (n) => `<div class="clickable flex items-center gap-3 border-t px-4 py-2.5 hairline" style="border-radius:0" data-go="${esc(n.go)}">${iconBox(n.k, n.icon)}
      <div class="min-w-0 flex-1"><div class="truncate text-[12.5px] font-medium">${esc(n.title)}</div><div class="muted flex items-center gap-1.5 truncate text-[11.5px]">${n.track ? ui.repoDot(n.track) : ''}<span class="truncate">${esc(n.reason)}</span></div></div>${chev}</div>`;
    const needsPanel = `<section class="panel overflow-hidden">
      ${ui.panelHead('Needs you', '', `<span class="chip" style="background:color-mix(in srgb, ${color(needs.length ? 'attention' : 'done')} 16%, transparent);color:color-mix(in srgb, ${color(needs.length ? 'attention' : 'done')} 80%, white)">${needs.length}</span>`)}
      <div class="mt-3">${needs.slice(0, 7).map(row).join('') || '<div class="faint border-t px-4 py-6 text-center text-[12.5px] hairline">Nothing is waiting on you</div>'}</div>
      ${needs.length > 7 ? `<div class="clickable border-t px-4 py-2 text-center text-[12px] hairline" style="border-radius:0;color:var(--accent)" data-go="board">View all ${needs.length} on the board</div>` : ''}
    </section>`;

    // ---------- Recent activity ----------
    const commits = [...D.timeline.commits].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 8);
    const ACT = { recorded: ['done', '＋'], updated: ['frontier', '✎'], superseded: ['waiting', '⇄'], deleted: ['abandoned', '✕'] };
    const feed = commits.map((cm) => {
      const ch = cm.changes[0] || {}, [k, g] = ACT[ch.action] || ['draft', '•'];
      return `<div class="${ch.note ? 'clickable' : ''} flex items-center gap-3 px-4 py-2" style="border-radius:0" ${ch.note ? `data-sel="note|${esc(ch.note)}"` : ''}>${iconBox(k, `<span class="mono text-[12px]" style="color:${color(k)}">${g}</span>`)}
        <div class="min-w-0 flex-1"><div class="truncate text-[12.5px]">${esc(cm.title)}</div><div class="faint truncate text-[11px]">${esc(cm.author || '')}${ch.type ? ' · ' + esc(ch.type) : ''}${ch.repos && ch.repos.length ? ' · ' + esc(ch.repos.join(', ')) : ''}</div></div>
        <span class="faint mono shrink-0 text-[11px]">${ago(cm.date)}</span></div>`;
    }).join('');
    const activity = `<section class="panel overflow-hidden pb-1">
      ${ui.panelHead('Recent activity', '', '<span class="cursor-pointer text-[12px]" style="color:var(--accent)" data-go="activity">View all</span>')}
      <div class="mt-2">${feed || '<div class="faint px-4 py-6 text-center text-[12.5px]">No commits yet</div>'}</div></section>`;

    // ---------- Repositories ----------
    const CAP = 72;
    const pool = (r) => {
      const rm = ms.filter((x) => x.m.track === r.slug), ts = rm.flatMap((x) => x.m.tickets), rc = cnt(ts), n = ts.length;
      const hot = rm.filter((x) => x.m.status === 'attention' || x.m.status === 'blocked').length, pct = (v) => (n ? Math.round((v / n) * 100) : 0);
      const bar = (label, v, k) => `<div class="flex items-center gap-2 text-[10.5px]"><span class="mono faint w-7 shrink-0 uppercase">${label}</span><div class="h-[4px] flex-1 overflow-hidden rounded-full" style="background:var(--s-todo)"><div class="h-full rounded-full" style="width:${pct(v)}%;background:${color(k)}"></div></div><span class="mono muted w-8 shrink-0 text-right">${pct(v)}%</span></div>`;
      return `<div class="panel-2 clickable p-3" data-repo="${esc(r.slug)}" style="${ctx.repo === r.slug ? 'border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)' : ''}">
        <div class="flex items-center gap-2">${ui.repoDot(r.slug)}<span class="truncate text-[12.5px] font-medium">${esc(r.slug)}</span>${hot ? `<span class="chip mono" style="padding:0 6px;font-size:10px;background:color-mix(in srgb, var(--s-attention) 16%, transparent);color:color-mix(in srgb, var(--s-attention) 70%, white)">${hot}</span>` : ''}<span class="mono faint ml-auto shrink-0 text-[10.5px]">${n} tickets</span></div>
        <div class="mt-2.5 flex min-h-[26px] flex-wrap content-start gap-[2px]">${n ? ts.slice(0, CAP).map((t) => tile(t.id + ' · ' + t.title + ' · ' + t.status, 9, t.status)).join('') + (n > CAP ? `<span class="mono faint ml-1 text-[10px]">+${n - CAP}</span>` : '') : '<span class="faint text-[11px]">no tickets here</span>'}</div>
        <div class="mt-2.5 space-y-1.5">${bar('done', rc.done, 'done')}${bar('wip', rc.doing, 'active')}</div></div>`;
    };
    const repos = `<section class="panel">
      ${ui.panelHead('Repositories', `<span class="faint">${D.repos.length} · each cell is a ticket</span>`, ctx.repo ? `<span class="chip cursor-pointer" data-repo="${esc(ctx.repo)}" style="background:var(--panel-2)">${esc(ctx.repo)} ✕</span>` : '')}
      <div class="grid gap-3 p-4 pt-3" style="grid-template-columns:repeat(auto-fill,minmax(215px,1fr))">${D.repos.map(pool).join('')}</div></section>`;

    el.innerHTML = `<div class="mx-auto max-w-[1500px] space-y-4 p-5">${head}${kpis}
      <div class="grid items-start gap-4 lg:grid-cols-[minmax(0,1fr)_340px]">
        <div class="min-w-0 space-y-4">${health}${window.SpecsSection ? window.SpecsSection.render(el, { ...ctx, asSection: true }) : ''}${repos}</div>
        <div class="min-w-0 space-y-4">${needsPanel}${activity}</div>
      </div></div>`;
    if (window.SpecsSection) window.SpecsSection.bind(el);
  },
});

// Specs screen of the redesign. Overview = KPI tiles, ticket heatmap, spec cards in dependency waves (or a table);
// a spec's page = header + the milestone pipeline (one lane per repository, nodes in columns by Builds-after depth, SVG
// connectors) + a milestone card grid with the tickets listed.
(function () {
  let view = 'cards', sort = { k: 'num', dir: 1 }, lastKey = null;

  // ---------- the Branches panel: each repository the spec touches, read live from its clone by Clones ----------
  // The open spec and its ctx, so clones-change redraws the panel alone, keeping each graph's scroll.
  let shown = null;
  const ROW = 22, LANE = 14;
  const agoMs = (ms) => { const m = Math.max(0, (Date.now() - ms) / 6e4); return !ms ? '' : m < 1 ? 'now' : m < 60 ? Math.round(m) + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : m < 43200 ? Math.round(m / 1440) + 'd' : new Date(ms).toLocaleDateString('en', { month: 'short', day: 'numeric' }); };
  const reposOf = (s, D) => [...new Set([...s.repos, ...s.milestones.map((m) => m.track)])].map((slug) => D.repos.find((r) => r.slug === slug)).filter(Boolean);
  const baseOf = (s, slug) => ((s.base || '').replace(/`/g, '').split(/[,;]/).map((x) => x.trim()).find((x) => x.startsWith(slug + '@')) || '').slice(slug.length + 1) || null;

  // a branch's chips: its milestone (selects it), the spec's branch, base, checked out, running beside the spec
  const branchTags = (b, s, slug, ui) => {
    const { esc } = ui, t = [];
    if (b.spec) {
      const m = /^M(\d+)$/.exec(b.spec) && s.milestones.find((x) => x.id === `${slug}/${b.spec.slice(1).padStart(3, '0')}`);
      t.push(m ? `<span data-sel="milestone|${esc(s.id + '|' + m.id)}" class="cursor-pointer" title="${esc(m.title)}">${ui.pill(m.status, b.spec)}</span>` : `<span class="chip" style="background:var(--accent-soft);color:var(--accent)">${esc(b.spec === 'spec' ? 'spec branch' : b.spec)}</span>`);
    }
    if (b.base) t.push('<span class="chip" style="background:var(--panel-2)">base</span>');
    if (b.head) t.push('<span class="chip" style="background:var(--accent);color:var(--bg)">checked out</span>');
    if (b.running) t.push('<span class="chip" style="background:color-mix(in srgb, var(--s-active) 16%, transparent);color:color-mix(in srgb, var(--s-active) 80%, white)" title="moved since the spec forked from its base">running</span>');
    if (b.remote) t.push('<span class="faint text-[10.5px]">remote</span>');
    else if (b.pushed) t.push('<span class="faint text-[10.5px]" title="origin is at this commit too">pushed</span>');
    return t.join('');
  };

  // the graph: lanes and dots in one SVG behind rows of commits; the spec's commits wear the accent
  function graph(v, ui) {
    const { esc } = ui, rows = v.rows, width = Math.max(1, ...rows.map((r) => Math.max(r.out.length, r.col + 1))) * LANE + 10;
    const x = (j) => 9 + j * LANE, y = (i) => i * ROW + ROW / 2, lane = (j) => Theme.color(j + 1);
    const seg = (j1, i, j2, c) => `<path d="M${x(j1)} ${y(i)}C${x(j1)} ${y(i) + ROW / 2} ${x(j2)} ${y(i) + ROW / 2} ${x(j2)} ${y(i + 1)}" stroke="${c}" stroke-width="1.6" fill="none" stroke-opacity=".8"/>`;
    let lines = '', dots = '';
    rows.forEach((r, i) => {
      const next = rows[i + 1], to = (j) => (next && r.out[j] === next.c.sha ? next.col : j);
      if (next) {
        r.out.forEach((sha, j) => { if (sha != null && r.inL[j] === sha && j !== r.col) lines += seg(j, i, to(j), lane(j)); });
        r.parentCols.forEach((k) => { lines += seg(r.col, i, to(k), lane(k)); });
      }
      if (r.cut) lines += `<path d="M${x(r.col)} ${y(i)}V${y(i) + ROW * 0.6}" stroke="${lane(r.col)}" stroke-width="1.4" stroke-dasharray="2 3" stroke-opacity=".6"/>`;
      const own = v.ofSpec.has(r.c.sha), isHead = r.c.sha === v.head.sha;
      dots += own ? `<circle cx="${x(r.col)}" cy="${y(i)}" r="4.5" fill="var(--accent)" style="filter:drop-shadow(0 0 4px var(--accent))"/>`
        : `<circle cx="${x(r.col)}" cy="${y(i)}" r="3.5" fill="var(--panel)" stroke="${lane(r.col)}" stroke-width="1.8"/>`;
      if (isHead) dots += `<circle cx="${x(r.col)}" cy="${y(i)}" r="7.5" fill="none" stroke="var(--text)" stroke-width="1.2" stroke-opacity=".7"/>`;
    });
    const label = (b) => `<span class="chip mono shrink-0" style="padding:0 6px;font-size:10.5px;${b.spec ? 'background:var(--accent-soft);color:var(--accent)' : 'background:var(--panel-2);color:var(--muted)'}${b.head ? ';box-shadow:inset 0 0 0 1px var(--text)' : ''}">${esc(b.name)}</span>`;
    const row = (r) => {
      const ls = v.labels.get(r.c.sha) || [], own = v.ofSpec.has(r.c.sha);
      return `<div class="flex items-center gap-2 pr-3 text-[12px]" title="${esc(r.c.sha)}" style="height:${ROW}px;padding-left:${width + 6}px;${own ? 'background:color-mix(in srgb, var(--accent) 7%, transparent)' : ''}">
        ${ls.slice(0, 3).map(label).join('')}${ls.length > 3 ? `<span class="faint text-[10.5px]">+${ls.length - 3}</span>` : ''}
        <span class="min-w-0 flex-1 truncate ${own ? '' : 'muted'}">${esc(r.c.subject)}</span>
        <span class="faint shrink-0 truncate text-[11px]" style="max-width:110px">${esc(r.c.author)}</span>
        <span class="mono faint w-9 shrink-0 text-right text-[10.5px]">${agoMs(r.c.time)}</span>
        <span class="mono faint shrink-0 text-[10.5px]">${r.c.sha.slice(0, 7)}</span></div>`;
    };
    return `<div style="position:relative;min-width:${width + 420}px">
      <svg width="${width}" height="${rows.length * ROW}" style="position:absolute;left:0;top:0;overflow:visible">${lines}${dots}</svg>
      ${rows.map(row).join('')}</div>${v.more ? '<div class="faint px-3 py-2 text-[11px]">Older commits not shown.</div>' : ''}`;
  }

  function repoBlock(repo, s, ui) {
    const { esc } = ui, v = Clones.view(repo), slug = repo.slug;
